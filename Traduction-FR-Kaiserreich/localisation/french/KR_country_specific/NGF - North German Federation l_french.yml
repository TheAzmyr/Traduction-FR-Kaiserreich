### Characters
 NGF_minna_fasshauer:9 "Minna Faßhauer"
 NGF_minna_fasshauer_leader_desc:9 "§YNaissance :§! §L10 octobre 1875, à Bleckendorf, province de Saxe, Royaume de Prusse, Empire allemand§!\n§YCarrière :§! §LNée Minna Nikolai dans une modeste famille d'ouvriers, elle perdit son père alors qu'elle n'avait que trois ans et fut contrainte de travailler à temps partiel dès son plus jeune âge - une expérience formatrice qui lui permit de comprendre les "causes de la misère généralisée" et de se battre pour l'égalité des femmes. Elle apprit également à lire et à écrire toute seule à l'âge adulte. C'est ainsi qu'elle découvrit des publications socialistes et qu'elle rencontra son mari, Johannes Georg Faßhauer. Malgré ses origines modestes, elle joua un rôle majeur dans la lutte locale pour permettre aux femmes de participer à la vie politique - une lutte qu'elle étendit à l'échelle nationale après avoir rejoint le SPD en 1903.\n\nLe parti se scinda pendant la Grande Guerre, et elle se désillusionna face à la politique de "Burgfrieden" (paix civile) du SPD et des syndicats, s'alignant plutôt sur la rhétorique socialiste et anti-guerre de Rosa Luxemburg et Karl Liebknecht. Elle rejoignit la Ligue Spartacus de Brunswick en 1916 et participa à des grèves en 1917.\n\nAprès la guerre, elle adhéra au Parti socialiste d'Allemagne (SP) et prit une part active à ses activités locales, notamment à Braunschweig. Elle aurait été membre du groupe des "Combattants rouges" (GRK) dirigé par Karl Schröder, une composante majeure de l'aile gauche actionniste du SP. Souvent la cible de la surveillance et du harcèlement des autorités, elle a néanmoins persévéré et a contribué à la réorganisation de la gauche après la guerre. En conséquence, elle a été choisie pour diriger le gouvernement provisoire mis en place par les puissances socialistes occupant la région.§!"

 NGF_gustav_noske:9 "Gustav Noske"
 NGF_gustav_noske_leader_desc:9 "§YNaissance :§! §L9 juillet 1868, à Brandenburg an der Havel, province de Brandebourg, Royaume de Prusse, Confédération de l'Allemagne du Nord§!\n§YCarrière :§! §LFils d'un tisserand originaire de la Pologne russe, Gustav Noske fut, dans sa jeunesse, vannier et connut les conditions de vie difficiles en Saxe, en Hesse, aux Pays-Bas et dans d'autres villes où il travailla comme compagnon. Ces expériences le poussèrent à devenir journaliste et, à 17 ans, il contribua à la création d'une association locale de vanniers qui fusionna rapidement avec le Syndicat allemand des menuisiers. Il participa à la direction d'une grève dans l'usine où il travaillait, puis adhéra au SPD quelques années plus tard, en 1884. Il devint également rédacteur en chef du "Journal de Brandenbourg" puis de la "Tribune populaire de Königsberg".\n\nSon travail lui valut un certain succès, et il fut élu au Reichstag en 1906, à l’âge de 37 ans, pour représenter la circonscription de Chemnitz. Spécialiste des affaires coloniales et militaires (malgré son manque d’expérience militaire), il suscita des tensions en raison de son soutien tacite aux politiques coloniales et de défense allemandes. Cela a peut-être contribué à sa carrière, cependant, lorsque sa réplique aux attaques du ministre de la Guerre Karl von Einem contre le SPD lui valut une certaine notoriété (ainsi que la condamnation de la gauche). Siégeant à la droite du SPD, son influence au sein du parti déclina progressivement et il continua à se heurter à ses pairs. La fin de la dernière guerre a sorti Noske, très âgé, de son exil de facto, le plaçant à la tête d'un gouvernement de l’Allemagne du Nord.§!"

 NGF_heinrich_langwost:9 "Heinrich Langwost"
 NGF_heinrich_langwost_leader_desc:9 "§YNaissance :§! §L15 avril 1874, à Pattensen, province de Hanovre, Royaume de Prusse, Empire allemand§!\n§YCarrière :§! §LFils d’un charron, Langwost reçut une éducation dispensée par des précepteurs privés et devint rédacteur en chef d’un journal ainsi qu’employé d’une entreprise de lavage et de peignage de la laine à Hanovre. En 1903, il devint une figure de proue du Parti allemand-hanovrien (DHP), plus connu sous le nom de Guelfes. Considéré comme plus démocratique que ses pairs, il se présenta pour la première fois aux élections du Reichstag en 1912, mais fut battu. Il servit également pendant la Grande Guerre.\n\nAprès la fin de la guerre, il fut élu au Reichstag en 1919 en tant qu’indépendant. Il fut exclu du DHP en 1925, mais réintégré par la suite. Plus tard, il siégea également au conseil municipal de Hanovre. En dehors de la politique, ses contributions à la littérature comprenaient "Sous une bannière jaune et blanche" et de nombreux textes abordant des thèmes liés aux Guelfes et à la culture germanique. Langwost fonda et dirigea l’Ordre de la Grande Allemagne "Henri le Lion", qui prônait l’autodétermination de la Basse-Saxe sur une base démocratique et progressiste. Faute d'alternatives viables, les autorités d'occupation sont parvenues à le convaincre de prendre la tête du nouveau gouvernement dans le nord de l'Allemagne.§!"

 NGF_ernst_august_von_braunschweig:9 "Ernst August von Braunschweig"
 NGF_ernst_august_von_braunschweig_leader_desc:9 "§YNaissance :§! §L17 novembre 1887, à Penzing, Vienne, Archiduché d'Autriche-sous-l'Enns, Autriche-Hongrie§!\n§YCarrière :§! §LCadet de l’ancien prince héritier de Hanovre, Ernst August, le jeune Ernst August s’est retrouvé confronté à une situation dynastique complexe. Son arrière-grand-père, le roi Ernst August, avait hérité du Royaume de Hanovre car la loi salique empêchait la reine Victoria du Royaume-Uni d'en prendre possession, mais son grand-père, George V, fut destitué après la Guerre austro-prussienne, lorsque la Prusse annexa le royaume. Son père, alors prince héritier, refusa de renoncer au trône et, par conséquent, lorsque le duc régnant de Brunswick mourut, le chancelier Otto von Bismarck réussit à l'empêcher d'accéder au trône. Le Brunswick fut gouverné par une succession de régents pendant les décennies qui suivirent.\n\nEn 1912, le frère aîné d'Ernst August trouva la mort dans un accident de voiture et, alors qu'il représentait sa famille auprès de l'empereur Wilhelm II, il fit la connaissance de la princesse Victoria Louise et tomba amoureux d'elle. Ils se marièrent en 1913 lors d'une somptueuse cérémonie à laquelle assistèrent de nombreux souverains européens, dernier grand rassemblement avant le déclenchement de la Grande Guerre. Son père renonça également officiellement à ses prétentions sur le duché de Brunswick en sa faveur, lui permettant ainsi d'accéder au duché.\n\nPendant la Grande Guerre, il servit en tant que commandant de cavalerie. Par la suite, il resta largement à l'écart de la politique, bien qu'on dise qu'il fréquentait en privé des personnalités conservatrices et parfois réactionnaires. Ancien prince britannique, lui et son épouse s'efforcèrent de rétablir les liens entre l’Allemagne et le Royaume-Uni, mais ces efforts n'aboutirent guère avant la Révolution britannique.§!"

