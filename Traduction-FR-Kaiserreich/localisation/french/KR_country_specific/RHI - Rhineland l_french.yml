 germany_puppet_events.7.t:0 "[RHI.GetName] Propose une Zone de Libre-Échange"
 germany_puppet_events.7.d:0 "Le gouvernement de [RHI.GetNameDef] nous a tendu la main, proposant une zone de libre-échange et de coopération économique entre les trois nations aux vues similaires situées au sud de la mer du Nord. Cette proposition viendrait s'ajouter aux obligations militaires que nous avons déjà contractées les uns envers les autres dans le cadre de notre alliance, et apporterait des avantages à nos trois économies, si elle était adoptée."
 germany_puppet_events.7.a:0 "Bien sûr."
 germany_puppet_events.7.b:0 "Nous préférons ne pas le faire."

 germany_puppet_events.8.t:0 "[RHI.GetName] demande une renégociation"
 germany_puppet_events.8.d:0 "Le gouvernement de [RHI.GetNameDef] nous a contactés pour nous demander d'ajuster le niveau actuel des réparations appliquées à son État. Il affirme que ces paiements ont étouffé le développement de l'économie locale et ont laissé le pays impuissant face aux menaces étrangères. La renégociation lui permettrait également de développer ses forces d'autodéfense. Enfin, ils estiment qu'il est injuste de payer des réparations aussi élevées alors que c'est la Prusse qui est responsable des Weltkriegs..."
 germany_puppet_events.8.a:0 "Cela semble raisonnable."
 germany_puppet_events.8.b:0 "Nous ne sommes pas d'accord."
