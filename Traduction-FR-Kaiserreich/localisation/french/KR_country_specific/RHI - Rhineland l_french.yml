### Characters ###
 RHI_georg_kunz:9 "George Kunz"
 RHI_georg_kunz_leader_desc:9 "§YNaissance :§! §L1888, au Palatinat, Royaume de Bavière, Empire allemand§!\n§YCarrière :§! §LObscur chef syndical et séparatiste du Palatinat, Georg Kunz cofonda le Parti ouvrier rhénan avec Franz Josef Heinz à Speyer autour de mars 1930. Groupe socialiste marginal, il a gagné une certaine notoriété lors du Ruhrkampf, lorsque le renseignement allemand a exagéré sa menace pour discréditer le soulèvement plus global. Dans les faits, il comptait au mieux quelques milliers de membres - avec une activité très limitée même parmi ces membres. Néanmoins, lorsque les forces socialistes d'occupation ont cherché à séparer la Rhénanie en une république indépendante et que des groupes plus importants ont rejeté leur offre de diriger le nouvel État, Kunz a finalement été choisi pour le poste, même si certains le considèrent comme trop impopulaire et possiblement trop modéré dans sa politique.§!"

 RHI_josef_smeets:9 "Josef Smeets"
 RHI_josef_smeets_leader_desc:9 "§YNaissance :§! §L29 septembre 1893, à Aix-la-Chapelle, province du Rhin, Royaume de Prusse, Empire allemand§!\n§YCarrière :§! §LFranz Joseph Hubert Smeets était apprenti dentiste avant la Grande Guerre et, pendant le conflit, il servit comme aide-soignant pour la Croix-Rouge. Il adhéra au SPD à Cologne, mais rejoignit rapidement l'USPD, dont il devint le secrétaire local. Il devint rédacteur en chef du journal socialiste Der Ventilator, dont il fut le visage public, car ses bailleurs de fonds et ses auteurs souhaitaient rester anonymes.\n\nTombé en disgrâce au sein de l'USPD à la suite des récents désastres militaires, Smeets et ses amis ont quitté le parti pour former la Ligue rhénane, afin de réclamer à grands cris une République rhénane autonome qui servirait d'État aux travailleurs socialistes. La capitulation de l'Allemagne étant imminente, ils se sont rebaptisés Parti populaire républicain rhénan et ont commencé à publier Rheinische Republik, appelant à une "Rhénanie libre" qui serait un État-tampon pleinement indépendant entre l'Allemagne dominée par la Prusse et la France. Il a déclaré de manière provocante : "Nous protestons contre le fait que les revenus de la Rhénanie soient dilapidés à Berlin pour financer une vie de luxe. Nous ne sommes pas Prussiens et ne voulons pas l'être."\n\nCette attitude a suscité une vive condamnation de la part de la plupart des Allemands, mais a éveillé l'intérêt des autorités d'occupation, qui ont pris la décision lourde de créer un État rhénan distinct. En l'absence d'autres options vraiment légitimes, Smeets a été choisi pour diriger le nouveau gouvernement.§!"

 RHI_josef_friedrich_matthes:9 "Josef Friedrich Matthes"
 RHI_josef_friedrich_matthes_leader_desc:9 "§YNaissance :§! §L10 février 1886, à Wurtzbourg, Basse-Franconie, Royaume de Bavière, Empire allemand§!\n§YCarrière :§! §LFils d’une secrétaire de théâtre, Josef Friedrich Matthes a fréquenté le gymnase pendant deux ans sans toutefois obtenir son diplôme. Il a mené une carrière de rédacteur pour divers journaux libéraux locaux et a également passé un an à l’étranger, en Suisse, en France et en Belgique, où il a fondé une famille. Il a contribué à la création d’associations de jeunesse progressistes à Aschaffenburg et à Passau, s’opposant ainsi aux maires locaux - se vantant d’avoir contribué à forcer l'un d’entre eux (le maire d'Oberhausen, Otto Wippermann) à démissionner. Il s'est également exprimé en faveur d'une politique nationaliste en matière d'objectifs de guerre pendant la Grande Guerre.\n\nPersonnalité mineure de la région, il s'est forgé une certaine renommée - voire une certaine notoriété - grâce à ses écrits et à son journalisme d'investigation (notamment en dévoilant plusieurs scandales de corruption) ; il s'est engagé dans la politique libérale et au sein du SPD, mais n'a jamais vraiment trouvé sa place au sein de ces deux mouvements, en partie à cause de son caractère combatif. Lorsque les forces d'occupation étrangères sont arrivées, il a saisi l'occasion pour fonder une "Ligue pour l'indépendance rhénane". Les personnalités politiques les plus en vue de la Rhénanie ayant refusé de participer au projet séparatiste impulsé par les occupants étrangers, c'est finalement Matthes qui a été choisi pour occuper ce poste.§!"

 RHI_hans_adam_dorten:9 "Hans Adam Dorten"
 RHI_hans_adam_dorten_leader_desc:9 "§YNaissance :§! §L10 février 1880, à Bonn, province du Rhin, Royaume de Prusse, Empire allemand§!\n§YCarrière :§! §LFils d’un riche propriétaire d’une manufacture de porcelaine, Hans Adam Dorten fit des études de droit et obtint son diplôme en 1907 à l’université de Leipzig. Il travailla brièvement au parquet, puis au tribunal d’instance, avant d’être mobilisé en 1914 pour combattre pendant la Grande Guerre. Il servit au sein du 54e corps de "commandos" en tant que sous-officier et fut décoré de la Croix de fer.\n\nAprès la guerre, il épousa une femme fortunée et s'engagea en politique, avec une position strictement anti-socialiste et, au-delà, un programme politique assez vague. Il semble qu’il se soit alors intéressé à des politiques régionalistes, se montrant méfiant envers la Prusse "protestante". Dilettante politique, sa fortune et ses relations lui permirent d’entretenir des liens avec divers responsables politiques locaux, dont Konrad Adenauer, mais il resta principalement en marge, en tant qu'avocat et juriste de second plan.\n\nIl a connu un bref regain de notoriété en poursuivant des socialistes lors du "Ruhrkampf", mais il serait tombé dans l'oubli historique sans la défaite de l'Allemagne lors de la guerre. Dans un contexte d'instabilité et d'occupation, il a fondé "l'Union populaire rhénane" afin de lutter pour l'indépendance vis-à-vis de l'Allemagne. Malgré les hésitations de certaines autorités étrangères, son souhait a finalement été exaucé et il est devenu le nouveau dirigeant d'une Rhénanie libre.§!"

### National Spirits ###
 RHI_rhenish_reparations: "Réparations Rhénanes"
 RHI_rhenish_reparations_desc: "Dans le cadre de ses revendications d’après-guerre, le gouvernement [ROOT.overlord.GetAdjective] a réquisitionné la majorité de l’industrie rhénane afin d’accorder des réparations au camp victorieux. La plupart des hommes aptes au travail sont censés se trouver dans les usines, avec seulement un nombre symbolique d’hommes autorisés à s’occuper du maintien de l’ordre et à agir en tant que forces de défense locales."

