 BHU_tt_reconciling_monks:9 "Nous aurons l'opportunité de ramener les moines $social_conservative_coloured$ dans notre giron.\n\nNe pas s'occuper des dissidents restants assez vite aura des §rconséquences§! plus tard."
 BHU_tt_reconciling_factions:9 "Cet événement nous permettra de réparer les divisions sectaires au sein de la cour royale, unifiant les factions une fois encore !"
 BHU_tt_has_moderate_central_authority:9 "A une §YAutorité Centrale Modérée§!, §YForte§! ou §YAbsolue§!"
 BHU_tt_national_assembly:9 "L'Assemblée nationale est le point culminant du projet politique réformiste, et amène la démocratie dans notre royaume ! Il reste à voir si elle pourra surmonter la résistance croissante des conservateurs."
 BHU_tt_renovating_capital_time:9 "Après §Y200§! ou §Y250§! jours :"
 BHU_tt_renovating_capital_conservative_option:9 "Our local builders promise that renovations will be completed in §Y200§! days. However, they may run into delays!"
 BHU_tt_renovating_capital_conservative_failure:9 "Because of these delays, our local builders will not be able to complete renovations for another §Y200§! days."
