 BHU_tt_increase_sikkim_revolt_unity:9 "Cela va augmenter l'§YUnité§! des Rebelles du Sikkim, nous accordant un esprit national puissant dans le cas d'une guerre avec le Népal."
 BHU_tt_increase_sikkim_revolt_size:9 "Cela va augmenter la §YForce§! des Rebelles du Sikkim, nous accordant une unité plus grande d'§YIrréguliers Bhutia-Lepcha§! dans le cas d'une guerre avec le Népal."
