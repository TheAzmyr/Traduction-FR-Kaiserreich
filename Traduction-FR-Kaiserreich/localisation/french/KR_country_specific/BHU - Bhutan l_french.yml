### Decisions ###
 BHU_reforms_decision_category: "Réformer le Bhoutan"
 BHU_reforms_decision_category_desc:9 "Le Bhoutan est loin derrière la plupart des nations du monde, avec une armée composée de paysans à peine formés et équipés et une économie pré-industrielle qui tourne autour de l'agriculture de subsistance et des ateliers d'artisanat. Pour survivre dans le monde moderne, le Bhoutan devra réformer ses structures féodales en quelque chose de plus stable et de plus solide. Pour ce faire, le Bhoutan doit s'attaquer à trois domaines de réforme différents :\nLe premier est £legitimacy  §3l'Autorité Centrale§! ([?BHU_feudal_unity|Y0]). Cette valeur représente le degré de contrôle que le gouvernement central du Bhoutan est capable d'exercer sur les différents Penlops, ordres monastiques et villages isolés du royaume. Accroître l'autorité du gouvernement est essentiel pour obtenir les ressources nécessaires à la mise en œuvre des réformes de la nation.\nLe second est le £industry_texticon  §GDéveloppement Économique§! ([?BHU_econ_dev|Y0]). Cette valeur représente les investissements réalisés par le gouvernement dans les ateliers industriels du pays. Cependant, plus le gouvernement investit dans l'économie, plus ces investissements coûtent cher en poids politique quotidien. Dans une tentative désespérée d'augmenter les revenus, on peut aussi diminuer le montant des investissements dans l'économie, libérant ainsi des capitaux pour d'autres projets.\nLa troisième est £manpower_texticon  §Rl'Investissement Militaire§! ([?BHU_mil_invest|Y0]). Cette valeur représente les investissements réalisés par le gouvernement pour armer et entraîner l'armée centrale du pays. Cependant, plus le gouvernement investit dans l'armée, plus cette armée coûte cher en poids politique quotidien. Dans une tentative désespérée d'augmenter les revenus, on peut également réduire le montant des investissements dans l'armée, libérant ainsi des capitaux pour d'autres projets.\nChacune de ces valeurs peut être £increase_texticon  augmentée ou £decrease_texticon  diminuée par un certain nombre d'événements, de priorités et de décisions. Soyez sage avec vos investissements ! Un souverain intelligent sait qu'il faut centraliser l'État avant de commencer à dépenser sans compter, et investir dans l'armée avant de se lancer dans un conflit.\n\n"

 BHU_feudal_timer: "Contrôle Déclinant "
 BHU_feudal_timer_desc: "Le Bhoutan est divisé entre diverses factions et forces, chacune rivalisant pour atteindre ses propres objectifs et ambitions. Si l'on n'y prend garde, ces forces vont lentement déchirer le royaume."
 BHU_deal_with_royalist_governors:9 "S'occuper des Gouverneurs Royalistes"
 BHU_deal_with_royalist_governors_desc:9 "Certains gouverneurs féodaux restent farouchement fidèles à la mémoire de la monarchie Wangchuck, malgré les serments qu’ils ont prêtés en apparence au Zhabdrung. Quelques courtisans suspects, s’ils étaient correctement motivés, pourraient probablement nous fournir les informations nécessaires pour écarter ces vieux seigneurs qui suscitent tant d’inquiétudes."
 BHU_undercut_popular_wangchuck_support:9 "Saper le Soutien Populaire des Wangchuck"
 BHU_undercut_popular_wangchuck_support_desc:9 "Malgré leurs défauts considérables, les anciens rois Wangchuck restent dans la mémoire collective de nombreux petits villages et hameaux, qui se tournaient souvent vers le Druk Gyalpo pour obtenir de l’aide face à des seigneurs locaux particulièrement tyranniques. Éliminer les plus virulents parmi ceux qui perpétuent le souvenir de l’ancienne monarchie devrait suffire à faire passer le message aux autres."
 BHU_Increase_King_Authority: "Centraliser l'Autorité Royale"
 BHU_Increase_King_Authority_desc:9 "Le pouvoir de la dynastie Wangchuck repose sur sa légitimité, forgée par des générations de souverains autoritaires qui ont soumis la noblesse et les monastères à leur volonté. Nous devons préserver cet héritage et, de la même manière, soumettre la noblesse et les monastères de cette génération."
 BHU_Decrease_King_Authority: "Augmenter les Privilèges des Penlops"
 BHU_Decrease_King_Authority_desc:9 "Jusqu’à ce qu’Ugyen Wangchuck unifie (de manière assez violente) les Penlops et les Dzongpons, qui se disputaient sans cesse, le Bhoutan n’était guère plus qu’un regroupement informel de petits tyrans, qui se chamaillaient sans cesse pour des querelles insignifiantes. Il est peut-être temps de revenir à cette époque !"
 BHU_Increase_Mon_Authority: "Renforcer la Primauté Monastique"
 BHU_Increase_Mon_Authority_desc:9 "Depuis plus d'un siècle, les dirigeants laïques du Bhoutan bafouent les anciennes prérogatives des monastères en matière de gouvernance et de gestion de l'État. Rappelons-leur les décisions du Zhabdrung, par la force s'il le faut !"
 BHU_Decrease_Mon_Authority:9 "Promouvoir des Bureaucrates Laïques"
 BHU_Decrease_Mon_Authority_desc:9 "Franchement, diriger un pays est une tâche terriblement difficile et ennuyeuse. Parfois, on a l’impression de gaspiller des ressources en ignorant les cadres bureaucratiques de l’ancien régime, même si des rumeurs de dissidence et de complots circulent à voix basse. Qu’importe s’ils sont déloyaux, tant qu’ils se proposent de faire le travail !"
 BHU_Increase_Econ_Development:9 "Financer le Développement Régional"
 BHU_Increase_Econ_Development_desc:9 "Il est facile pour les fonds de l'État central d'être acheminés vers les villages situés aux alentours de la capitale. Là-bas, les responsables peuvent se rendre sur place pour inspecter leurs projets et s'assurer que l'argent a bien été dépensé. Le plus difficile est d'étendre ce principe de responsabilité aux provinces."
 BHU_Decrease_Econ_Development:0 "Ignorer la Corruption Locale"
 BHU_Decrease_Econ_Development_desc:9 "C'est une pure folie que de tenter de retracer le parcours de chaque pièce d'argent, d'autant plus qu'une commande passée auprès de [BHU.GetLeader], ainsi que les fonds qui l'accompagnent, passent par une douzaine d'intermédiaires avant d'être exécutée. Chacun de ces intermédiaires travaille dur et mérite une rémunération."
 BHU_Increase_Military_Investment:0 "Équiper les Unités Spécialisées"
 BHU_Increase_Military_Investment_desc:9 "Dans l'armée bhoutanaise, une unité spécialisée désigne un homme qui sait tirer au fusil. Un véritable spécialiste est un homme qui sait tirer à la mitrailleuse. Si jamais des Bhoutanais apprenaient à manier un mortier, certaines conventions de dénomination devraient peut-être être revues."
 BHU_Decrease_Military_Investment:9 "Renforcer les Chefs Népotiques"
 BHU_Decrease_Military_Investment_desc:9 "La notion de népotisme déroute les nobles commandants du Bhoutan. Pourquoi donner un nom à ce qui est dans l’ordre des choses ? Bien sûr, les descendants des grands hommes doivent se voir confier des postes de pouvoir !"

 BHU_army_decision_category:9 "Défendre l'Himalaya"
 BHU_army_decision_category_desc:9 "Le Bhoutan est la porte d'entrée de l'Himalaya, un rempart contre l'empiétement sans cesse croissant des Népalais et des Indiens. Cependant, notre armée est notoirement mal entraînée et mal équipée : ce sont des ouvriers agricoles démunis, armés d'un assortiment hétéroclite d'armes obsolètes et archaïques, dirigés par des officiers choisis pour leur sang noble plutôt que pour leur mérite. Des changements seront nécessaires si nous voulons défendre nos foyers contre la menace étrangère."
 BHU_organise_sikkim_buddhists:9 "Organiser les Bouddhistes du Sikkim"
 BHU_organise_sikkim_buddhists_desc:9 "Les Bhutias et les Lepchas sont unis par leur héritage spirituel commun. Les monastères des Chapeaux rouges, tels que Rumtek et Bhutia Busty, font office de centres communautaires de résistance face à la vague incessante d’agressions hindoues népalaises. En unifiant ces monastères au sein d’un mouvement politique unique en faveur de la libération bouddhiste, nous pourrons tirer parti de leurs ressources et de leur influence !"
 BHU_parade_sikkim_exiles:9 "Défilé des Exilés du Sikkim"
 BHU_parade_sikkim_exiles_desc:9 "Suite à l'occupation du Sikkim par le Népal, l'ouest du Bhoutan est devenu le refuge de nombreux anciens dirigeants, administrateurs et gardiens de ce petit royaume. Ces personnalités ont toujours apporté un soutien indéfectible à la libération du Sikkim et se sont engagées à prendre la tête de toute insurrection contre le Népal. Elles doivent avoir la possibilité de manifester publiquement leur patriotisme et leur attachement à la cause sikkimienne !"
 BHU_arm_bhutia_clans:9 "Armer les Clans Bhutias"
 BHU_arm_bhutia_clans_desc:9 "Farouchement indépendants et violemment repliés sur eux-mêmes, les clans bhutias constituent le cœur battant de la société sikkimaise. Les anciennes rivalités et hiérarchies ont toutefois été mises de côté par la domination népalaise, et aujourd’hui, chaque clan sait qu’il doit soit s’unir, soit se soumettre à ses oppresseurs. Il ne nous reste plus qu’à leur donner les moyens de résister !"
 BHU_marshal_tibetan_adventurers:9 "Commander les Aventuriers Tibétains"
 BHU_marshal_tibetan_adventurers_desc:9 "Les récents conflits sectaires entre les factions au Tibet ont valu à bon nombre de soldats d’être qualifiés de traîtres, de rebelles ou de bandits. Si la grande majorité de ces hommes se fondra tout simplement dans la campagne, certains, et ils sont nombreux, se rendent compte qu’il existe des opportunités pour les guerriers aguerris dans les régions frontalières de l’Himalaya."
 BHU_promote_zamadar_chencho:9 "Promouvoir Zamadar Chencho"
 BHU_promote_zamadar_chencho_desc:9 "Zamadar Chencho jouit de la confiance de la plupart des gens en tant qu'officier neutre et relativement apolitique. C'est pour cette raison, ainsi que pour sa diligence et son intelligence relative, qu'il constitue un candidat prometteur au poste d'intendant de notre armée en pleine expansion."
 BHU_outsiders_and_outcasts:9 "Recruter les Marginaux et les Exclus"
 BHU_outsiders_and_outcasts_desc:9 "Traditionnellement, ceux qui sont exclus de la vie du village en raison de fautes commises par le passé ne figurent pas sur les listes d'appel, car ces personnes ne sont ni respectées ni considérées comme dignes de confiance. Même si la promotion de ces hommes sera mal perçue, nous ne pouvons pas simplement ignorer cette source de main-d'œuvre sous prétexte qu'ils sont mal vus !"
 BHU_son_from_every_family:9 "Demander un Fils à Chaque Famille"
 BHU_son_from_every_family_desc:9 "En période de crise, les dirigeants du Bhoutan ont appelé chaque famille à former l'un de ses fils au métier de guerrier. Bien que cette mesure soit considérée comme assez extrême et que notre capacité à la faire respecter soit limitée, elle permettra de recruter de nouvelles recrues."

 BHU_economy_decision_category:0 "Développer le Bhoutan"
 BHU_economy_decision_category_desc:9 "Bhutan is a nation trapped in time, but that does not mean we should not strive to achieve a degree of economic self-sufficiency and modernity. The proposals some of our most idealistic councilors may seem entirely unfeasible now, but much can happen in a decade, given enough grit and determination.\n\nWe currently have £anq_credibility [?BHU_corvee_cadre_amount] §YCorvee Cadre(s)§!.\n\n£decision_icon_small §HDecisions§! to §HDevelop Bhutan§! require both resources and manpower to complete. Bhutan relies on corvee labour, meaning that each £decision_icon_small §HDecision§! requires a £anq_credibility §YCorvee Cadre§! to complete. £anq_credibility §YCorvee Cadres§! are replenished after completion of each economic £decision_icon_small §HDecision§!.\n\n"
 BHU_sword_to_plowshares:9 "Passer des Épées aux Socs"
 BHU_sword_to_plowshares_desc:9 "La notion de soldat citoyen va de soi au Bhoutan, où la plupart des soldats sont mobilisés depuis leurs fermes en période de conflit. Bien que la mise en place d'une armée permanente reste encore limitée, ces hommes peuvent contribuer au développement de notre nation lorsqu'ils ne sont pas occupés à la défendre."
 CP_30_manpower_500:9 "£command_power §H30§! £manpower_texticon  §H500§!"
 CP_30_manpower_500_blocked:9 "£command_power §R30§! £manpower_texticon  §R500§!"
 CP_30_manpower_500_tooltip:9 "Prendre cette décision coûtera $CP_30_manpower_500_blocked$"
 BHU_compel_labour:9 "Forcer plus de Travailleurs de Corvée"
 BHU_compel_labour_desc:9 "Les privilèges liés à la corvée revêtent une importance fondamentale pour le maintien de notre régime, puisqu’ils constituent la majeure partie de la main-d’œuvre dont nous pouvons tirer parti. En repoussant les limites de nos prérogatives de corvée au-delà de leur champ d’application traditionnel, nous pouvons exploiter de nouvelles sources de main-d’œuvre paysanne."
 BHU_open_the_marketplaces:9 "Ouvrir les Marchés"
 BHU_open_the_marketplaces_desc:9 "Il existe peu, voire aucun marché au Bhoutan. La plupart des transactions commerciales se font de manière informelle, de personne à personne, même si les centres des villages servent souvent de lieu de rencontre entre les parties au troc. L'ouverture de quelques marchés officiels dans les principaux centres urbains, assortie de certaines protections accordées aux commerçants par l'État, pourrait favoriser les échanges commerciaux."
 BHU_circulate_foreign_coinage:9 "Faire Circuler la Monnaie Étrangère"
 BHU_circulate_foreign_coinage_desc:9 "La monnaie nationale étant extrêmement rare, les commerçants et artisans les plus avisés ont recours aux pièces étrangères pour effectuer des transactions complexes en dehors du système traditionnel de troc. L'afflux de devises résultant de l'intensification des échanges avec le monde extérieur peut contribuer à favoriser la multiplication des transactions formelles."
 BHU_local_iron_development:9 "Développement du Fer Local"
 BHU_local_iron_development_desc:9 "La campagne du Bhoutan est parsemée de petites mines de fer locales, qui exploitent souvent des filons spécifiques de minerai de fer. Certains gisements de fer plus riches sont sous-exploités, et des efforts miniers résolus pourraient générer des retombées plus importantes, d'une portée nationale."
 BHU_dagana_sarpang_coal_mines:9 "Étendre les Mines de Charbon de Dagana et Sarpang"
 BHU_dagana_sarpang_coal_mines_desc:9 "Les ressources en charbon au Bhoutan sont relativement limitées, ce qui signifie qu'on ne peut pas compter sur le charbon pour alimenter la poursuite du développement économique. Il existe toutefois quelques gisements de charbon à Dagana et à Sarpang qui, s'ils étaient correctement exploités, pourraient permettre une utilisation plus généralisée de cette ressource."
 BHU_dholpani_bhurkhola_tungsten_mines:9 "Étendre les Mines de Tungstène de Dholpani et Bhurkhola"
 BHU_dholpani_bhurkhola_tungsten_mines_desc:9 "Parmi la multitude de minéraux que l'on trouve sur les versants montagneux du Bhoutan, le cuivre et le tungstène comptent parmi ceux qui présentent le plus d'intérêt pour une exploitation axée sur l'exportation. Les gisements de tungstène de Dholpani et de Bhurkhola sont suffisamment importants pour justifier un développement accru."
 BHU_lateral_road_start:9 "From Phuentsholing to Punakha"
 BHU_lateral_road_start_desc:9 "Starting in the Duar foothills, the first section of the Lateral Road will build on existent merchant paths which push from Assam into central Bhutan. Connecting Phuentscholing, and thus, India, to the major political centers of Punakha and Talo provide for a good starting point for the broader Lateral Road project."
 BHU_lateral_road_east:9 "Connect Paro to the Lateral Road"
 BHU_lateral_road_east_desc:9 "As the second largest center of population and economic development in Bhutan, Paro, lying to the west of Punakha, will be connected to the Lateral Road, replacing the piecemeal trails and pathways which have long linked it to central Bhutan."
 BHU_lateral_road_west:9 "Extend the Lateral Road to Jakar"
 BHU_lateral_road_west_desc:9 "Located in the eastern province of Bumthang, the small town of Jakar marks the end of the Lateral Road’s western push. While additional extensions may be attempted in the future, Jakar’s central location makes it a good endpoint for our current attempts to unite the nation."
 BHU_import_machine_tools:9 "Importer des Machines-Outils"
 BHU_import_machine_tools_desc:9 "Aucune usine ne peut fonctionner sans machines-outils modernes, issues de méthodes avancées de métallurgie et d'une fabrication de précision. Malheureusement, nous devrons importer ces machines si nous voulons un jour espérer fabriquer nos propres machines-outils."
 BHU_steal_blueprints:9 "Se Procurer des Plans Modernes"
 BHU_steal_blueprints_desc:9 "Plusieurs avancées en matière de techniques et de modèles industriels ont été découvertes à l'étranger, avancées qui dépassent les capacités de nos propres maîtres artisans. Pour étudier ces nouvelles avancées, nous devrons soit acheter, soit "nous procurer" d'une autre manière ces modèles modernes."
 BHU_build_water_mills:9 "Construire de Nouveaux Moulins"
 BHU_build_water_mills_desc:9 "La question de l'énergie est un véritable casse-tête pour le Bhoutan, car le pays dispose de peu de sources d'énergie locales, mis à part, bien sûr, ses cours d'eau abondants et puissants. La construction de nouveaux moulins à eau nous permettra d'exploiter cette énergie pour jeter les bases d'un nouveau développement économique."
 BHU_renovate_punakha:9 "Rénover la Capitale"
 BHU_renovate_punakha_desc:9 "Le dzong de Punakha est le cœur de notre royaume, mais après des décennies de négligence, le palais est aujourd’hui en piteux état. D’importants travaux de rénovation seront nécessaires pour lui redonner sa splendeur d’antan."

 BHU_smuggling_decision_category:9 "Opérations de Contrebande"
 BHU_china_smuggling_decision:9 "Utiliser les Liens avec les Seigneurs Chinois"
 BHU_china_smuggling_decision_desc:9 "La galerie des petits seigneurs de la guerre chinois regorge de personnages à la moralité douteuse. La contrebande d’armes constitue une source majeure de profits personnels pour ceux qui commandent des soldats, et les livraisons provenant des centres du pouvoir et des bienfaiteurs étrangers sont rapidement détournées vers une véritable armée de trafiquants d’armes et de marchands véreux qui n’attendent que cela. Ces hommes seraient ravis de nous fournir des armes... moyennant finance."
 BHU_china_smuggling_bribe:9 "Forger des Liens avec nos Contacts Chinois"
 BHU_china_smuggling_bribe_desc:9 "Même les professionnels les plus chevronnés ont leurs préférences, et ce n’est un secret pour personne que nos interlocuteurs chinois préféreraient vendre leurs marchandises sur les marchés animés de Hong Kong plutôt que sur les routes difficiles du Tibet et du Bhoutan. Peut-être pourrions-nous atténuer leur aversion pour notre pays natal avec les bons mots et les bons pots-de-vin."
 BHU_china_smuggling_strengthen:9 "Renforcer la Route de Contrebande du Nord"
 BHU_china_smuggling_strengthen_desc:9 "Nos contacts de contrebandiers en Chine doivent parcourir des centaines de miles pour atteindre nos frontières, souvent harcelés par des bandits et des seigneurs locaux. Nouer des liens avec ceux qui contrôlent la route qu’ils empruntent pourrait contribuer à alléger leurs difficultés."
 BHU_india_smuggling_decision:9 "Se Rapprocher des Fournisseurs Indiens"
 BHU_india_smuggling_decision_desc:9 "Le récent conflit qui a secoué le sous-continent indien a rapidement propulsé des personnalités mineures du monde bureaucratique et militaire au sommet du pouvoir et de la notoriété, parallèlement à un afflux massif de nouvelles armes et de matériel militaire. Certaines de ces personnalités ont su tirer parti de ces récents bouleversements pour mettre en place un nouveau commerce lucratif d'armements illicites."
 BHU_india_smuggling_bribe:9 "Forger des Liens avec nos Contacts Indiens"
 BHU_india_smuggling_bribe_desc:9 "Les passeurs sont, par nature, des gens méfiants, et ils nous considèrent généralement comme des ploucs arriérés dont on peut tirer profit, plutôt que comme des partenaires à part entière. Peut-être pourrions-nous changer cette perception avec les bons mots et les bons pots-de-vin."
 BHU_india_smuggling_strengthen:9 "Renforcer la Route de Contrebande du Sud"
 BHU_india_smuggling_strengthen_desc:9 "Même si nos opérations de contrebande en Inde ne sont ni reconnues ni tolérées par nos homologues du sud, quelques pots-de-vin bien placés et des relations à l'étranger pourraient nous aider à faciliter les choses."

 BHU_attack_tibet:9 "La Revanche des Chapeaux Rouges"
 BHU_attack_tibet_desc:9 "La secte des Chapeaux Jaunes, qui domine le royaume tibétain, est la plus jeune des quatre grandes écoles du bouddhisme tibétain. Malgré cela, ses adeptes regardent nos sectes locales des Chapeaux Rouges avec mépris et crainte. Nous leur ferons comprendre qu’ils ont tort, sur le champ de bataille."
 BHU_attack_nepal:9 "Affronter les Gorkhas"
 BHU_attack_nepal_desc:9 "Le Népal accueille depuis longtemps des exilés et des dissidents du Bhoutan, leur offrant ainsi une base pour semer le trouble dans notre royaume. La raison de ce soutien est claire : ils convoitent nos terres. Nous devons agir pour débarrasser ces terres de ce régime dangereux."
 BHU_sikkim_preparation_timer:9 "Se Préparer au Conflit au Sikkim"
 BHU_sikkim_preparation_timer_desc:9 "La situation au Sikkim se détériore assez rapidement, à mesure que les violences sectaires s'intensifient. Les peuples autochtones bhoutia et lepcha sont depuis bien trop longtemps soumis à un joug effroyable par les envahisseurs népalais ; ils aspirent à se libérer de la botte de l'oppresseur !"
 BHU_sikkim_war_timer:9 "La Lutte pour le Sikkim"
 BHU_sikkim_war_timer_desc:9 "Les combats au Sikkim sont très impopulaires auprès du régime népalais, et si nous parvenons à maintenir notre emprise sur la région suffisamment longtemps, celui-ci sera probablement contraint de s'asseoir à la table des négociations."
 BHU_Integrate_Nepal: "Intégrer le Sikkim"
 BHU_Integrate_Nepal_desc:9 "Si une grande partie du Sikkim est peuplée de Népalais, arrivés dans la région ces dernières années, les peuples autochtones bhoutia et lepcha sont nos frères, à nous, les Bhoutanais. En tant que libérateurs de ces nobles peuples après des années d’oppression népalaise, il nous sera facile d’intégrer cet ancien royaume dans notre cercle."

 BHU_country_namechange_decision: "Proclamer l'Empire du Dragon de Tonnerre"
 BHU_country_namechange_decision_desc: "En remportant victoire après victoire contre nos voisins, nous nous sommes imposés comme la puissance prééminente de l'Himalaya. En tirant parti de nos relations au sein de l'ossature administrative de l'ancien régime tibétain, nous forgerons un nouvel empire bouddhiste dans les montagnes, qui perpétuera l'héritage du grand Namgyal Ngawang !"

### Parties ###

 BHU_totalist_party: "DNC"
 BHU_totalist_party_long:9 "Congrès National Druk (Maximistes)\n§LClub de nobles exilés, de socialistes et d'agents indiens, le Congrès National Druk est un regroupement d'inadaptés. Fondé à Calcutta à la suite d'une répression contre les dirigeants radicaux du Gewog, le Congrès a fait très peu depuis sa création. Cependant, l'ascension de Subhas Chandra Bose a entraîné une augmentation des investissements indiens dans le DNC, avec l'intention d'utiliser cette collection de dissidents pour déstabiliser le Bhoutan. La faction Maximiste est intensément dévouée à Bose et donne la priorité à la destruction des éléments réactionnaires dans le pays et à la loyauté envers la République.§!\n"
 BHU_syndicalist_party: "DNC"
 BHU_syndicalist_party_long:9 "Congrès National Druk (Internationalistes)\n§LClub d'exilés nobles, de socialistes et d'agents indiens, le Congrès National Druk est un regroupement d'inadaptés. Fondé à Calcutta à la suite d'une répression contre les dirigeants radicaux du Gewog, le Congrès a fait très peu depuis sa création. Cependant, l'ascension de Subhas Chandra Bose a entraîné une augmentation des investissements indiens dans le DNC, avec l'intention d'utiliser cette collection de dissidents pour déstabiliser le Bhoutan. La faction Internationaliste est composée des membres qui se sont rendus en France et en Grande-Bretagne pour demander de l'aide. Ils sont les plus intéressés à connecter le Bhoutan avec le monde extérieur.§!\n"
 BHU_radical_socialist_party: "DNC"
 BHU_radical_socialist_party_long:9 "Congrès National Druk (Révolutionnaires)\n§LClub de nobles exilés, de socialistes et d'agents indiens, le Congrès National Druk est un regroupement d'inadaptés. Fondé à Calcutta à la suite d'une répression contre les chefs radicaux du Gewog, le Congrès a fait très peu depuis sa création. Cependant, l'ascension de Subhas Chandra Bose a entraîné une augmentation des investissements indiens dans le DNC, avec l'intention d'utiliser cette collection de dissidents pour déstabiliser le Bhoutan. La faction révolutionnaire est la plus forte au sein du parti, et prône la fin du servage et la création d'une nouvelle république socialiste dans l'Himalaya.§!\n"
 BHU_social_democrat_party: "BSC"
 BHU_social_democrat_party_long:9 "Congrès d'État du Bhoutan\n§LFondé par une poignée d'intellectuels Lhotshampas, le Congrès d'État du Bhoutan est un mouvement qui tente de créer un réveil politique Lhotshampa dans les régions du sud du Bhoutan. Leurs efforts n'ont pas été couronnés de succès, la minorité népalaise opprimée restant sceptique à l'égard de ces idéalistes politiques, et les autorités au pouvoir s'empressant de réprimer toute dissidence.§!\n"
 BHU_social_liberal_party: "Jai Gorkha"
 BHU_social_liberal_party_long:9 "Jai Gorkha\n§LFondé dans les États indiens limitrophes du sud du Bhoutan, Jai Gorkha est un mouvement politique clandestin qui vise à créer un nouvel État pour les Népalais, appelé Gorkhaland. Ce groupe a trouvé de nombreux membres de la communauté népalaise Lhotshampa du Bhoutan qui s'intéressent à ce projet de création d'un État, et il est devenu la principale voix de cette minorité opprimée.§!\n"
 BHU_market_liberal_party: "Radicaux"
 BHU_market_liberal_party_long:9 "Druk Gyalpo (Radicaux)\n§LLes Radicaux sont un petit groupe de fonctionnaires de la justice qui se sont engagés à apporter plus de réformes démocratiques au Bhoutan. Bien qu'ils partagent des objectifs avec la faction réformiste devant les tribunaux, ils estiment que les réformes proposées par ladite faction sont trop limitées et vont souvent à l'encontre de la position dominante de Sonam Topgye Dorji, au sein de cette faction. Comptant peu de soutien parmi les puissances régnantes au Bhoutan, il y a peu de chances qu'elles puissent agir comme autre chose qu'une opposition orale.§!\n"
 BHU_social_conservative_party:0 "Zhung Dratshang"
 BHU_social_conservative_party_long:9 "Zhung Dratshang (Loyalistes)\n§LLe Zhung Dratshang est un conseil de moines de tout le pays, unis dans le but de promouvoir les intérêts monastiques. Il est dirigé par les cinq maîtres érudits, les Lopens, chacun un expert dans un champ théologique différent, et par son chef le Je Khenpo. Ayant dirigé le pays à l'époque précédant la monarchie centrale, même au cours des années suivantes l'organe a servi à conseiller les dirigeants du Bhoutan, promouvant la stabilité et le bouddhisme traditionnel.§!\n"
 BHU_authoritarian_democrat_party:9 "Réformistes"
 BHU_authoritarian_democrat_party_long:9 "Druk Gyalpo (Réformistes)\n§LLes Réformistes sont un groupe de nobles et de fonctionnaires de la cour qui plaident pour une série de réformes destinées à moderniser le Royaume du Bhoutan. Bien que farouchement fidèles au pouvoir du roi, ils espèrent déléguer certains pouvoirs de l'aristocratie aux anciens des villages gewog, tout en conservant le pouvoir de la monarchie centrale. Leur base de pouvoir est centrée autour du ministre Gongzim du roi, Sonam Topgye Dorji. Grâce à son influence, ils sont devenus la deuxième faction la plus puissante du pays, le roi souscrivant lentement à cette approche plus réformatrice du pouvoir.§!\n"
 BHU_paternal_autocrat_party: "Traditionalistes"
 BHU_paternal_autocrat_party_long:9 "Druk Gyalpo (Traditionalistes)\n§LLes Traditionalistes sont un grand rassemblement  de Penlops, de petits nobles, de fonctionnaires et de chefs militaires fidèles au roi et dévoués au maintien du statu quo. Ils soutiennent le Druk Gyalpo régnant mais cherchent avant tout à étendre le pouvoir des Penlops aux dépens des autorités centrales. Les traditionalistes sont strictement opposés aux réformes proposées par Sonam Topgye Dorji et sa clique de fidèles de la cour, les considérant comme un affront direct au féodalisme du Bhoutan.§!\n"
 BHU_national_populist_party:9 "Dissidents Monastiques"
 BHU_national_populist_party_long:9 "Zhung Dratshang (Dissidents)\n§LLe Zhung Dratshang est un conseil de moines de tout le pays, unis dans le but de promouvoir les intérêts monastiques. Il est dirigé par les cinq maîtres érudits, les Lopens, chacun un expert dans un champ théologique différent, et par son chef le Je Khenpo. L'ascension récente du Zhabdrung Rinpoche Jigme Dorji a mené de nombreux moines du conseil parmi les plus jeunes à tourner le dos à la paix promise par le Druk Gyalpo au pouvoir. Ils cherchent plutôt à réaffirmer les prérogatives traditionnelles des moines et de leur Lama suprême.§!\n"

### Created Parties ###

 BHU_revolting_natpop_party:9 "Conspiration du Zhabrung"
 BHU_revolting_natpop_party_long:9 "Zhung Dratshang (Dissidents)\n§LRassemblés derrière l'étoile montante du jeune Zhabdrung Rinpoche, le Mouvement des Jeunes Moines est une collection de moines qui ont souffert sous le règne du Druk Gyalpo et de leurs laquais dans les hautes sphères du Zhung Dratshang. Ces moines plus radicaux ont été rejoints par des courtisans snobés et des parias politiques de tout le Bhoutan, formant une armée grandissante de mécontents, tous réclamant le renversement de la monarchie.§!\n"
 BHU_zhabdrungs_natpop_party:9 "Radicaux Monastiques"
 BHU_zhabdrungs_natpop_party_long:9 "Zhung Dratshang (Radicals)\n§LWhile the Zhabdrung Rinpoche has been the official leader of Bhutan for the last three hundred years, they have had no real power since the days of Bhutan's founder, Zhabdrung Ngawang Namgyal. The most recent incarnation of the ancient lama has spent years cultivating support among those who felt abandoned by the short-lived monarchy. Disappointed with the Zhabdrung’s acceptance and integration of the old religious elite, the most radical members of this vast and unwieldy coalition have banded together to force more extreme change, seeking to fully revolutionize Bhutanese society.§!\n"
 BHU_zhabdrungs_pataut_party:0 "Loyalistes du Zhabdrung"
 BHU_zhabdrungs_pataut_party_long:0 "Zhung Dratshang (Loyalistes)\n§LBien que le Zhabdrung Rinpoché soit le chef officiel du Bhoutan depuis trois cents ans, il n'a aucun pouvoir réel depuis l'époque du fondateur du Bhoutan, Zhabdrung Ngawang Namgyal. L'incarnation la plus récente de l'ancien lama a passé des années à cultiver le soutien de ceux qui se sentaient abandonnés par la monarchie éphémère. Ce faisant, il a créé une large coalition de moines conservateurs et de villageois pauvres, de courtisans snobés et de parias politiques. C'est à la tête de cette alliance peu maniable que Zhabdrung Jigme Dorji gouverne le Bhoutan, et il devra veiller à ce que le château de cartes qu'il a construit pendant vingt ans ne s'écroule pas sur lui.§!\n"
 BHU_zhabdrungs_authdems_party:9 "Vestiges Royalistes"
 BHU_zhabdrungs_authdems_party_long:9 "Druk Gyalpo (Vestiges)\n§LAvec la mort du roi Jigme et la fin de la monarchie du Dragon-Tonnerre, les derniers partisans du défunt souverain se sont ralliés aux anciens proches de l'ancien ministre du Gongzim, Sonam Topgye. Alors que Sonam Topgye et l'héritier "légitime" se cachent en exil, ces bureaucrates et petits seigneurs complotent en attendant le jour où ils pourront se soulever pour soutenir le jeune prince Wangchuck, ce qui fait d'eux une dangereuse cinquième colonne si on les ignore. En l'absence de toute figure fédératrice, cependant, cette résistance clandestine est désorganisée et apathique.§!\n"
 BHU_zhabdrungs_soccons_party:0 "Zhung Dratshang"
 BHU_zhabdrungs_soccons_party_long:9 "Zhung Dratshang (Vieille Garde)\n§LÀ la suite de la victoire du Zhabdrung Rinpoche, les maîtres Lopen et le Je Khenpo se sont retrouvés en marge de la vie politique. Suspectés par leurs confrères moines en raison de leur soutien de longue date à la monarchie, mais dotés d'un pouvoir de jure considérable au sein de la hiérarchie monastique traditionnelle, ces hommes âgés ont été largement ignorés et écartés d'un processus politique qui s'articule de plus en plus autour du cercle restreint du Zhabdrung.§!\n"
 BHU_zhabdrungs_marlibs_party:9 "Résistance Démocratique"
 BHU_zhabdrungs_marlibs_party_long:9 "Druk Gyalpo (Résistance)\n§LParmi les premiers partisans du Zhabdrung figuraient quelques idéalistes, convaincus que son accession au pouvoir donnerait naissance à un Bhoutan nouveau et plus démocratique. Lorsque la mort du roi Jigme et l'avènement du Zhabdrung Jigme Dorji n'ont pas entraîné de telles réformes, ces radicaux se sont retournés contre leur nouveau suzerain, cherchant plutôt à obtenir le retour du jeune prince Wangchuck. Ne disposant pratiquement d'aucun soutien et d'un capital politique limité, ces fonctionnaires ne constituent guère une menace pour le régime du Zhabdrung, mais si on ne s'en occupe pas, ils pourraient devenir une force qu'il faudra écraser.§!\n"
 BHU_remnant_natpop_party:9 "Dissidents Restants"
 BHU_remnant_natpop_party_long:9 "Zhung Dratshang (Dissidents)\n§LAvec la mort du Zhabdrung, les dissidents monastiques se sont retrouvés en grande partie à la dérive, incapables de trouver une nouvelle figure de ralliement. Bien que politiquement affaiblis, ces moines n'ont pas pour autant disparu. Ils continuent de s'insurger contre ce qu'ils perçoivent comme des affronts de la part de la monarchie et du Je Khenpo, militant pour le rétablissement de certains privilèges ancestraux dont jouissaient les monastères et pour la réaffirmation du Zhung Dratshang en tant que force politique majeure au sein du royaume.§!\n"

 BHU_nep_party_change_tooltip:9 "Les §ONationalistes Gorkhaland§! et le §SCongrès d'État du Bhoutan§! fusionneront avec les nationalistes népalais pour former un nouveau mouvement politique dangereux.\n"
 BHU_nepali_national_congress_party:9 "Congrès National Népalais"
 BHU_nepali_national_congress_party_long:9 "Congrès national népalais\n§LS'inspirant du mouvement nationaliste indien et s'appuyant sur les fondements du Nepal Praja Parishad, un parti intellectuel opposé aux Rana, le Congrès national népalais est rapidement devenu le porte-parole principal de la résistance à notre domination au Népal. Ses membres, bien qu'idéologiquement hétéroclites, sont unis par leur haine de la domination bhoutanaise et des excès persistants de l'aristocratie.§!\n"
 BHU_tib_party_change_tooltip:9 "Le §oCongrès§! §rnational§! §odu Bhoutan§! sera submergé par les vestiges de la gauche tibétaine, tandis que les §mradicaux§! de notre royaume rejoindront les dissidents étrangers dans un nouveau parti d'opposition.\n"
 BHU_sacred_union_party:0 "Parti de l'Union Sacrée"
 BHU_sacred_union_party_long:9 "Parti de l'Union sacrée\n§LLa folie du mouvement de l'Union sacrée a aliéné tout le monde au Tibet, à l'exception des moines et des paysans les plus radicaux. Malgré tout, l'essor fulgurant de l'État bhoutanais a ouvert un nouveau chapitre pour ce mouvement, qui s'est fait connaître comme l'un des principaux opposants aux excès de ce nouveau gouvernement colonial.§!\n"
 BHU_tibet_improvement_party:0 "Parti pour le Développement du Tibet"
 BHU_tibet_improvement_party_long:9 "Parti pour le Développement du Tibet\n§LInspiré par la pensée sociale et nationaliste chinoise, le Parti pour le Développement du Tibet entend faire entrer le nouvel empire de l'Himalaya dans le XXe siècle, à la force de la baïonnette s'il le faut. Guidés par les Trois Principes du Peuple, ces révolutionnaires sont exaspérés par cette énième dictature monarchique.§!\n"
 BHU_young_drukpa_party:9 "Parti Jeune Drukpa"
 BHU_young_drukpa_party_long:9 "Parti Jeune Drukpa\n§LPionniers d'un nouvel avenir marqué par un régime aristocratique éclairé dans l'Himalaya, les Jeunes Drupkas ont trouvé un soutien auprès de membres marginaux de la fonction publique bhoutanaise, d'aristocrates tibétains tournés vers l'avenir et de ceux que le nouveau statu quo bhoutanais laisse perplexes.§!\n"

