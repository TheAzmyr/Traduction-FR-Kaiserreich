 BHU_tt_ignore_sikkim:9 "Nous ne recevrons plus d'événements supplémentaires au sujet du mouvement de protestation au Sikkim."
 BHU_tt_sikkim_operation_logistics:9 "If we have also completed the focuses §YArms by Necessity§! and §YUse Every Advantage§!, we will begin examining an operation to liberate Sikkim from Nepal, §Rif they are not under another nation's protection§!."
 BHU_tt_sikkim_operation_necessity:9 "If we have also completed the focuses §YLessons in Logistics§! and §YUse Every Advantage§!, we will begin examining an operation to liberate Sikkim from Nepal, §Rif they are not under another nation's protection§!."
 BHU_tt_sikkim_operation_advantage:9 "If we have also completed the focuses §YLessons in Logistics§! and §YArms by Necessity§!, we will begin examining an operation to liberate Sikkim from Nepal, §Rif they are not under another nation's protection§!."
 BHU_tt_no_sikkim_protests:9 "N'a pas l'esprit national §YManifestations au Sikkim§!"
 BHU_tt_sikkim_prewar_decisions:9 "As tensions rise in Sikkim, we have the ability to strengthen and influence the growing rebellion there through the below £decision_icon_small §YDecision§!. We only have limited time before the situation escalates, as neighbour turns against neighbour in Gangtok."
 BHU_tt_sikkim_bhu_war_timer:9 "§YSi le Bhoutan conserve le contrôle du Sikkim ou du Darjeeling après la fin de ce timer, la pression interne au Népal les forcera à s'asseoir à la table des négociations !§!"
 BHU_tt_sikkim_bhu_war_timer_good_sik:9 "\n§GNous contrôlons actuellement le Sikkim, et forcerons le Népal à se retirer de cette province après la fin des combats.§!"
 BHU_tt_sikkim_bhu_war_timer_good_darj:9 "\n§GNous contrôlons actuellement le Darjeeling, et forcerons le Népal à se retirer du Sikkim et du Darjeeling à la fin des combats.§!"
 BHU_tt_sikkim_bhu_war_timer_bad:9 "\n§RNous ne contrôlons ni le Sikkim ni le Darjeeling, et le Népal sera encouragé à continuer son combat contre nous.§!"
 BHU_tt_sikkim_nep_war_timer:9 "§YSi nous ne parvenons pas à capturer et conserver le Sikkim et le Darjeeling lorsque ce timer s'achèvera, la pression interne sur notre gouvernement nous forcera à négocier avec les bhoutanais.§!"
 BHU_tt_sikkim_nep_war_timer_good:9 "\n§GNous contrôlons actuellement le Sikkim et le Darjeeling, et pouvons continuer pour vaincre et annexer le Bhoutan.§!"
 BHU_tt_sikkim_nep_war_timer_bad:9 "\n§RNous ne contrôlons pas le Sikkim et le Darjeeling, et serons forcés de nous asseoir à la table des négociations.§!"
 BHU_tt_reform_bhutan:9 "§CSi nous investissons complètement dans notre Armée et notre Économie, complétons toutes les Décisions de Développement, et avons un contrôle absolu sur la nation, nous ne perdrons plus d'autorité avec le temps et gagnerons de nouveaux bonus utiles !§!\n\n"
 BHU_tt_upgrading_mountain_hermit_initial:9 "Combine §YConstruire l'Autosuffisance§! en §YLe Royaume Ermite§!, améliorant les deux esprits !\nChangements effectifs :\n"
 BHU_tt_upgrading_hermit_kingdom_do_not_combine:9 "Despite our progress, we will remain flexible in our reform approach, allowing us to continue to reduce and increase our §YMilitary§! and §YEconomic Investments§! at will."
 BHU_tt_upgrading_hermit_kingdom_combine_spirits:9 "With this milestone, we can permanently commit to our current level of investment into our military and economy. This will combine our §YMilitary§! and §YEconomic Investments§! into §YThe Hermit Kingdom§! national spirit, locking them all at the highest amount. This will §Greduce§! the §YDaily Political Power Cost§! of these spirits, but will §Rpermanently prevent§! us from modifying them in the future."
 BHU_tt_longer_growing_pains:9 "Cela va §Raugmenter§! la durée de §YDifficultés de Croissance§! de 100 jours."
 BHU_tt_shorter_growing_pains:9 "Cela va §Gdiminuer§! la durée de §YDifficultés de Croissance§! de 100 jours."
 BHU_tt_attack_tibet_and_nepal_decisions:9 "§CNous pouvons utiliser notre nouvelle puissance pour défier le Népal et le Tibet pour le contrôle de l'Himalaya !§!"
 BHU_tt_druk_nep_no_autonomy:9 "Attempting to integrate our new Nepalese territories will lead to significant growth in our §OSocial Liberal§! and §SSocial Democrat§! popularity."
 BHU_tt_druk_nep_limited_autonomy:9 "Granting only limited autonomy to our new Nepalese territories will lead to slight growth in our §OSocial Liberal§! and §SSocial Democrat§! popularity."
 BHU_tt_druk_tib_no_autonomy:9 "Attempting to integrate our new Tibetan territories will lead to significant growth in our §oTotalist§!, §rRadical Socialist§!, and §mMarket Liberal§! popularity."
 BHU_tt_druk_tib_limited_autonomy:9 "Granting only limited autonomy to our new Tibetan territories will lead to slight growth in our §oTotalist§!, §rRadical Socialist§!, and §mMarket Liberal§! popularity."
 BHU_tt_raiding_duars:9 "§YWe will move forward to assert our might in the Duars.§!\nIf §YAssam§! has recently changed hands, or if its owner is engaged in war, we will have a significantly higher chance of success!"
 BHU_tt_raiding_tibet:9 "§YWe will move forward to assert our control over our Tibet enclaves.§!\nIf §YLhasa§! has recently changed hands, or if its owner is engaged in war, we will have a significantly higher chance of success!"
 BHU_tt_eu4_hunting_accident:0 "Perd §R10§! Prestige.\n"
 BHU_tt_military_priority:9 "§RWhile this national spirit is active, we will be unable to select any more economic focuses.§! We can remove this national spirit early by completing all of the following focuses: §YThe Next Generation of Leaders§!, §YEstablish Muster Rolls§!, §YMaintaining the Stockpiles§!, and §YEstablish Mountain Guides§!."
 BHU_tt_architects:9 "§CSi §YTshering Penjor§! dirige ou est conseiller, ou si §YTsham Go Seb§! est recruté comme conseiller, nous recevrons des récompenses plus grandes !§!"
 BHU_tt_architects_tp:9 "§GLe service de §YTshering Penjor§! dans notre gouvernement nous a conféré de meilleures récompenses !§!"
 BHU_tt_architects_tgs:9 "§GLe service de §YTsham Go Seb§! dans notre gouvernement nous a conféré de meilleures récompenses !§!"
 BHU_tt_lhotshampa_distrust:9 "§RUn tel acte contre un manifestant pacifique rendra un contrat avec les Lhotshampa impossible, si nous désirons en conclure un à l'avenir !§!"
 BHU_tt_radicals_forcing_hand:9 "§RLes Radicaux ayant un contrôle ferme sur notre régime, nous n'avons pas d'autre choix que de nous appuyer sur eux.§!"

