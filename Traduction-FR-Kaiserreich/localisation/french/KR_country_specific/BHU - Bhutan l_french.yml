 BHU_tt_preparation_focuses:9 "§CPrendre le temps de préparer notre assaut sur le Monastère de Cheri sera vital au succès de la Coalition royale, mais le Roi ne doit pas confondre prudence et lâcheté !§!"
 BHU_tt_preparation_events_50:9 "§YAttendre et compléter plus de priorités de préparation peut être nécessaire, mais notre peuple réclame des résultats !§!\n§RIl y a 50% de chance qu'un événement négatif se déclenche à cause de notre retard.§!"
