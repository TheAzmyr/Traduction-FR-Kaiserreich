 bhutan_tree: "Arbre de Priorités du Bhoutan"

### Country Names ###
 BHU: "Bhoutan"
 BHU_ADJ: "Bhoutanais"
 BHU_DEF: "le Bhoutan"

 BHU_DRUK_authoritarian_democrat: "Empire Druk"
 BHU_DRUK_authoritarian_democrat_DEF: "l'Empire Druk"
 BHU_DRUK_paternal_autocrat: "Empire Druk"
 BHU_DRUK_paternal_autocrat_DEF: "l'Empire Druk"
 BHU_DRUK_national_populist: "Empire Druk"
 BHU_DRUK_national_populist_DEF: "l'Empire Druk"

### Ideas ###

    ### Starting / Shared Ideas

 BHU_sikkim_protests:9 "Manifestations au Sikkim"
 BHU_sikkim_protests_desc:9 "La situation à Gangtok, la capitale du Sikkim, est pour le moins préoccupante. Dans cette ville divisée entre trois peuples, la haine grandissante entre les paysans lepchas et bhutias et nos compatriotes népalais risque bientôt de dégénérer en violences ouvertes."
 BHU_bloodied_by_bhutan:9 "Blessé par le Bhoutan"
 BHU_bloodied_by_bhutan_desc:9 "Notre récente défaite face aux rebelles du Sikkim et à leurs alliés bhoutanais a laissé notre gouvernement sous le choc et découragé. Il faudra sans doute un certain temps avant que nous ne reprenions nos opérations à l'étranger."
 BHU_spirit_of_the_lotus_throne:9 "Esprit du Trône du Lotus"
 BHU_spirit_of_the_lotus_throne_desc:9 "Le peuple fidèle du Sikkim s'est rallié à son vaillant Chogyal, malgré des années d'occupation, et s'est soulevé pour libérer sa patrie. Le Trône du Lotus sera reconquis, quelle que soit la difficulté de cette reconquête !"

 BHU_peace_in_our_time:9 "Paix Pour Notre Époque"
 BHU_peace_in_our_time_desc:9 "Depuis qu’Ugyen Wangchuck a unifié les penlops sous sa poigne de fer il y a plus de trois décennies, les terres autrefois déchirées par les querelles de ce royaume montagneux ont été ramenées à une paix somnolente. Il se passe si peu de choses à cette altitude dans l’Himalaya que la plupart des gens ont cessé de se préoccuper des questions militaires."
 BHU_monastic_control:0 "Contrôle Monastique"
 BHU_monastic_control_desc:0 "Une grande partie du Bhoutan est constituée de fiefs monastiques semi-indépendants, ce qui en fait l'une des forces les plus puissantes du royaume."
 BHU_monastic_whispers:9 "Murmures Parmi les Moines"
 BHU_monastic_whispers_desc:9 "Le Zhabdrung Thuktrul Jigme Dorji, réincarnation du fondateur de notre nation et chef spirituel du royaume, attire comme un aimant les dissidents, s'attirant le soutien des chefs religieux et laïques opposés à notre pouvoir. Depuis des années, nous le laissons s'attarder comme une plaie à ciel ouvert, mais même aujourd'hui, nous ne disposons ni des ressources ni du contrôle nécessaires pour faire face à cette conspiration grandissante."
 BHU_split_zhungdratshang:9 "Zhung Dratshang Divisé"
 BHU_split_zhungdratshang_desc:9 "Le départ de membres éminents du Zhung Dratshang vers le monastère de Cheri montre à quel point nous avons laissé les divisions au sein du clergé s'aggraver. L'ascension du Zhabdrung Jigme Dorji a donné aux moines opposés à Sonam Topgye Dorji et à ses réformes une figure autour de laquelle se rallier, leur permettant ainsi de former un bloc anti-royaliste informel."
 BHU_Yung_Monk_Revolt:9 "La Révolte des Jeunes Moines"
 BHU_Yung_Monk_Revolt_desc:9 "Les violences survenues à Tango et à Gangtey ont mis le pays en ébullition. Partout dans le royaume, la jeune génération de moines s'est soulevée contre la couronne, furieuse face aux tentatives de réformes monastiques menées de longue date par la royauté et à l'inaction obstinée de leurs aînés. S'armant comme des guerriers, ils ont clairement fait savoir leur intention d'obtenir des concessions pour les monastères sous la menace de l'épée."
 BHU_Zhabdrung_Revolt:9 "La Révolte de Zhabdrung"
 BHU_Zhabdrung_Revolt_desc: "Le Zhabdrung Thuktrul Jigme Dorji a commencé à s'opposer ouvertement au règne du roi Jigme, rassemblant des soutiens dans le but de restaurer le règne des réincarnations Zhabdrung."
 BHU_Zhabdrung_Aftermath: "Conséquences de la Révolte"
 BHU_Zhabdrung_Aftermath_desc:9 "La Bataille du Monastère de Cheri a laissé la nation sous le choc. Sans la présence d'une autorité centrale forte, le banditisme est endémique et les dirigeants locaux ne respectent pas leurs droits."
 BHU_Zhabdrung_Aftermath2:9 "Banditisme Persistant"
 BHU_Zhabdrung_Aftermath2_desc:9 "Les profondes cicatrices laissées par la bataille du monastère de Cheri continuent de peser sur le Bhoutan. Bien que la nation ait commencé à se stabiliser, la corruption et le banditisme sévissent toujours."
 BHU_repaired_irrigation:9 "Irrigation Réparée"
 BHU_repaired_irrigation_desc:9 "L'irrigation est le poumon de notre royaume, et la négliger témoigne de nos plus grandes défaillances. Avant toute autre chose, nous devrions réparer ces infrastructures délabrées, ne serait-ce que pour ne plus avoir à entendre chaque semaine des centaines de plaintes concernant leur mauvais état."
 BHU_tax_collectors:9 "Droits Fiscaux Réaffirmés"
 BHU_tax_collectors_desc:9 "Depuis des années, les villages placés sous le contrôle direct de la couronne se soustraient à notre autorité, considérant notre générosité comme une faiblesse et exploitant notre bienveillance jusqu’au bout. Cela suffit ! Une fois encore, le plus humble des paysans devra respecter le plus grand des rois."
 BHU_eyes_on_the_duars:9 "Les Yeux sur les Douars"
 BHU_eyes_on_the_duars_desc:9 "Les vastes étendues des Douars, ces plaines inondables verdoyantes qui s'étendent de Kalimpong à Udalguri, sont à la fois le théâtre de notre plus grande défaite et le lieu où pourrait se jouer notre perte. Si les Indiens devaient masser des forces à la frontière pour intervenir dans notre conflit civil, nous devons en être informés !"
 BHU_forcing_renovations:9 "Rénovation des Défenses"
 BHU_forcing_renovations_desc:9 "L'extension des ouvrages défensifs revêt une importance capitale, mais son coût est prohibitif. Face aux événements récents, cependant, l'équilibre entre ces deux facteurs, jusqu'alors à égalité, s'est temporairement rompu, ce qui nous fournit la justification nécessaire pour entreprendre les réparations et les rénovations qui auraient dû être effectuées il y a plusieurs décennies."
 BHU_neighbours_reassured:9 "Nos Voisins Apaisés"
 BHU_neighbours_reassured_desc:9 "Les rumeurs de troubles peuvent parfois être aussi dangereuses que les troubles eux-mêmes. Si nos voisins venaient à apprendre à quel point le royaume est en danger, cela aurait des conséquences désastreuses pour notre commerce et notre sécurité. Nous nous contenterons de les rassurer en leur disant que tout va bien – ça marche toujours !"
 BHU_regulars_drilled:9 "Entrainements Rigoureux"
 BHU_regulars_drilled_desc:9 "Une lame n'est jamais plus tranchante que celui qui la manie. Même si les lames jouent un rôle de moins en moins important dans la conduite de la guerre, ce principe reste vrai. Nos soldats doivent être bien entraînés pour survivre face aux ennemis qu'ils auront bientôt à affronter, tant à l'intérieur qu'à l'extérieur."
 BHU_village_defenders:9 "Groupes de Défense des Villages"
 BHU_village_defenders_desc:9 "Lorsque les troubles éclatent au Bhoutan, des centaines de personnes se tournent vers le banditisme pour survivre, contraignant ainsi des centaines d’autres à former des milices improvisées... pour survivre. La mise en place d’une organisation de ces groupes de miliciens disparates contribuera grandement à empêcher ces derniers de basculer dans le banditisme, alors que la justice populaire et la cupidité s’emparent du cœur des simples paysans."
 BHU_villages_drained:9 "Nos Villages Épuisés"
 BHU_villages_drained_desc:9 "Le recours à des besoins en main-d'œuvre exceptionnels a laissé de nombreux villages en sous-effectif. Même s'ils parviennent à survivre tant bien que mal, nous devons laisser ces hameaux se remettre sur pied avant de tenter à nouveau de les exploiter pour leur main-d'œuvre !"

 BHU_treaty_of_phuentscholing:0 "Traité de Phuentscholing"
 BHU_treaty_of_phuentscholing_desc:0 "Le traité de Phuentscholing constitue en grande partie une porte d'entrée vers le reste du monde pour le Bhoutan. Les concessions politiques accordées à l'Inde ont permis au Bhoutan de bénéficier d'une modeste aide financière et de pouvoir commercer via sa frontière sud."
 BHU_slackened_indian_trade:9 "Commerce Indien Ralenti"
 BHU_slackened_indian_trade_desc:9 "Avec la rupture des accords conclus entre Sonam Topgye Dorji et les Indiens, les échanges commerciaux entre le Bhoutan et le sous-continent ont ralenti. Rares sont ceux qui souhaitent braver les risques liés au commerce en l'absence de garanties."
 BHU_restored_indian_trade:9 "Commerce Indien Restauré"
 BHU_restored_indian_trade_desc:0 "Les concessions politiques accordées par l'Inde unifiée ont permis au Bhoutan de développer ses échanges commerciaux via sa frontière sud, ce qui l'a ouvert au reste du monde et a contribué à renforcer le gouvernement bhoutanais."
 BHU_newfound_belligerence:9 "Belligérance Nouvelle"
 BHU_newfound_belligerence_desc:9 "Depuis trop longtemps, les dirigeants du Bhoutan se sont contentés de voir nos frontières s'effriter peu à peu sous l'emprise étrangère, se cachant comme des enfants dans les montagnes. Cela suffit ! Nous allons montrer au monde entier notre force."
 BHU_military_funding_priority:9 "Priorité au Financement de l'Armée"
 BHU_military_funding_priority_desc:9 "L'armée est le pilier du régime de Tshering Penjor, et ses membres ont exigé un traitement de faveur alors que le roi se concentrait ces derniers temps sur les questions économiques. Tant qu'ils ne seront pas apaisés, le roi devra consacrer toute son attention aux affaires militaires."

    ### Reform Ideas

 BHU_hermit_kingdom: "Le Royaume Ermite"
 BHU_hermit_kingdom_desc: "Le Bhoutan est une capsule temporelle politique, avec une société rétrograde tout droit sortie de l'époque médiévale. Les serfs travaillent toute l'année pour récolter suffisamment de nourriture pour survivre, et peu d'industries existent en dehors des ateliers artisanaux des riches seigneurs et des petits commerces. Les forces armées du royaume reposent sur les bannières des penlops, qui rassemblent les bandes de guerriers de leurs domaines. Il existe un endroit dans l'Himalaya où le temps s'est arrêté, et où le Bhoutan a été laissé de côté par le monde entier."
 BHU_hermit_kingdom_reformed:9 "L'Ermite Civilisé"
 BHU_hermit_kingdom_reformed_desc:9 "Le Bhoutan a parcouru un long chemin en peu de temps, surprenant tout le monde par le rythme effréné auquel le pays s'est engagé sur la voie des réformes. Pourtant, sa société peine encore à accepter la rapidité radicale de ces changements, l'armée recourt encore parfois à l'arc et aux flèches, l'économie reste entièrement agraire et les changements observés dans la capitale ont du mal à se propager dans les campagnes. De tels revers sont prévisibles, aussi décourageants soient-ils. L'avenir s'annonce radieux pour le Bhoutan, et un jour, ce pays rejoindra véritablement les rangs de la modernité !"

 BHU_drukpa_renaissance: "Renaissance Drukpa"
 BHU_drukpa_renaissance_desc:9 "Une succession de victoires inimaginables nous a menés jusqu’ici, pour régner en maîtres incontestés de l’Himalaya !"
 BHU_outward_court:9 "Une Cour Tournée vers l'Extérieur"
 BHU_aristocratic_court:9 "Une Cour Aristocratique"
 BHU_monastic_court:9 "Une Cour Éclairée"
 BHU_balanced_court:9 "Une Cour Équilibrée"
 BHU_expand_to_the_territories:9 "Étendre les Territoires"
 BHU_focus_on_our_core_cadres:9 "Concentration sur les Cadres Principaux"
 BHU_keep_an_eye_to_the_future:9 "Garder un Oeil sur l'Avenir"
 BHU_drukpa_renaissance_jw_finisher:9 "Ascension du Dragon-Tonnerre"
 BHU_drukpa_renaissance_jw_finisher_desc:9 "Une succession de victoires inimaginables nous a menés jusqu’ici, pour régner en maîtres incontestés de l’Himalaya ! Le premier grand Wangchuck, le Souverain Noir Jigme Namgyal, a uni les tribus de l’Est et de l’Ouest, alors en conflit, pour forger un nouveau royaume unifié il y a près d’un siècle. Aujourd’hui, son petit-fils va unifier l’ensemble de l’Himalaya en son honneur. Quelle que soit la manière dont ce nouvel empire des nuages perdurera, il ne fait aucun doute que le clan Wangchuck, ainsi que son vaillant et humble roi Jigme, ont marqué l’histoire de leur empreinte."
 BHU_drukpa_renaissance_st_finisher:9 "Un Avenir Radieux pour l'Himalaya"
 BHU_drukpa_renaissance_st_finisher_desc:9 "Une succession de victoires inimaginables nous a menés jusqu’ici, pour régner en maîtres incontestés de l’Himalaya ! Nous mènerons la région vers un avenir radieux, en alliant tradition et modernité afin de créer une culture et un régime propres au toit du monde. Depuis des décennies, le clan Wangchuck a su trouver le juste milieu entre les écueils de l’inaction obstinée et ceux d’un radicalisme dangereux, traçant ainsi une voie équilibrée vers l’avenir. Aujourd’hui, nous étendons cette mission à l’ensemble de l’Himalaya, en faisant rayonner la gloire de la réforme depuis les villages misérables de l’Uttarakhand jusqu’aux grands temples de Lhassa !"
 BHU_drukpa_renaissance_tp_finisher:9 "Le Cadeau de la Magnanimité et de la Stabilité"
 BHU_drukpa_renaissance_tp_finisher_desc:9 "Une succession de victoires inimaginables nous a menés jusqu’ici, pour régner en maîtres incontestés de l’Himalaya ! La technologie moderne, l’idéologie moderne et les allégeances modernes ont détruit la tranquillité de l’ancien plateau himalayen, semant la mort et le conflit là où régnait autrefois la paix. La main de fer de Tshering Penjor a restauré ce qui avait été perdu, apportant la stabilité de l’unité jusqu’aux confins du Népal et du Tibet. Désormais, chaque paysan peut se tourner vers son Roi-Dragon pour trouver conseils et justice, et chaque révolutionnaire peut trembler devant la puissance de nos armées !"
 BHU_drukpa_renaissance_z_finisher:9 "Cultiver un Royaume Éclairé"
 BHU_drukpa_renaissance_z_finisher_desc:9 "Une succession de victoires inimaginables nous a menés jusqu’ici, pour régner en maîtres incontestés de l’Himalaya ! Les royaumes divisés des moines et des rajas ont empoisonné le cœur des hommes, les détournant de la vérité de l’illumination. En faisant table rase du passé, nous pouvons à nouveau aspirer à un royaume libéré des conflits mesquins, voué à la sagesse ancestrale autrefois perdue. À la tête de ce nouveau royaume se trouve son jeune père, l’infatigable Zhabdrung Jigme Dorji, qui ne reculera devant rien pour voir les rêves de Ngawang Namgyal se réaliser !"
 BHU_growing_pains: "Difficultés de Croissance"
 BHU_growing_pains_desc:9 "L'expansion rapide de notre royaume a mis notre administration à rude épreuve et l'a amenée au bord de l'effondrement sous le poids d'une agitation croissante. Tant que nous ne serons pas en mesure de nous développer suffisamment pour relever les défis liés à nos nouvelles conquêtes, l'intégration de ces nouveaux territoires restera une tâche ardue."

 BHU_integrating_foreign_armies:9 "Intégration des Guerriers Vaincus"
 BHU_xenophobic_fervor:9 "Ferveur Xénophobe"
 BHU_new_faces_new_ideas:9 "Nouveaux Visages, Nouvelles Idées"

 BHU_feudal_1: "Autorité Centrale Épouvantable"
 BHU_feudal_1_desc: "Notre nation est dirigée par une mosaïque de Penlops et de petits seigneurs sauvages, bien plus intéressés par la poursuite de leurs intérêts personnels que par ceux de l'État. La faiblesse du Roi a été exploitée par les monastères et les seigneurs féodaux qui se chamaillent et se battent pour les miettes de notre royaume. Sans la présence d'une autorité centrale, l'anarchie règne au Bhoutan."
 BHU_feudal_2: "Autorité Centrale Quasi-Insignifiante"
 BHU_feudal_2_desc: "Notre nation est dirigée par une mosaïque de Penlops autonomes et de petits seigneurs, bien plus intéressés par la promotion de leurs intérêts personnels que par ceux de l'État. La grande majorité de la nation est gérée par des monastères et des seigneurs féodaux qui n'ont aucun lien avec les caprices du gouvernement central et il est presque impossible d'agir sur la politique du gouvernement ou de gérer le royaume."
 BHU_feudal_3: "Autorité Centrale Faible"
 BHU_feudal_3_desc: "Notre nation est gouvernée par une mosaïque de Penlops autonomes et de petits seigneurs, bien plus intéressés par la promotion de leurs intérêts personnels que par ceux de l'État. La majorité de la nation est gérée par des monastères et des seigneurs féodaux, avec très peu de liens avec les impératifs du gouvernement central, et il est de plus en plus difficile d'agir sur la politique gouvernementale ou de gérer le royaume."
 BHU_feudal_4: "Autorité Centrale Précaire"
 BHU_feudal_4_desc: "Notre nation est gouvernée par une mosaïque de Penlops et de petits seigneurs, qui partagent leur temps entre la promotion de leurs intérêts personnels et ceux de l'État. Une grande partie de la nation est gérée par des monastères et des seigneurs féodaux et notre gouvernement est obligé de coopérer avec eux pour agir sur la politique gouvernementale et gérer le royaume."
 BHU_feudal_5: "Autorité Centrale Modérée"
 BHU_feudal_5_desc: "Notre nation est administrée par une mosaïque de fidèles Penlops et de petits seigneurs, qui contribuent à promouvoir les intérêts de l'État. Une grande partie de la nation est gérée par des monastères et des seigneurs féodaux, qui coopèrent diligemment avec l'autorité centrale pour agir sur la politique gouvernementale et gérer le royaume."
 BHU_feudal_6: "Autorité Centrale Forte"
 BHU_feudal_6_desc: "Notre nation est administrée par une mosaïque de fidèles Penlops et de petits seigneurs, qui contribuent à promouvoir les intérêts de l'État. Une grande partie de la nation est gérée par des monastères et des seigneurs féodaux, qui agissent avec zèle sur la politique gouvernementale et gèrent le royaume."
 BHU_feudal_7: "Autorité Centrale Absolue"
 BHU_feudal_7_desc: "Notre nation est administrée par une mosaïque de fidèles Penlops et de petits seigneurs, qui contribuent à promouvoir les intérêts de l'État. Une grande partie de la nation est gérée par des monastères et des seigneurs féodaux, qui agissent avec zèle sur la politique gouvernementale et gèrent le royaume."

 BHU_economy_extensive:9 "Investissements Économiques Étendus"
 BHU_economy_extensive_desc:9 "En investissant nos ressources dans l'industrie de notre pays, nous sommes mieux à même de rivaliser avec la puissance industrielle de nos voisins plus développés. Cependant, malgré nos investissements considérables, nous restons à la traîne par rapport à la puissance industrielle d'une nation moderne."
 BHU_economy_adequate:9 "Investissements Économiques Adéquats"
 BHU_economy_adequate_desc:9 "En consacrant une partie de nos ressources à l'industrie de notre pays, nous sommes mieux à même de rivaliser avec la puissance industrielle de nos voisins plus développés. Cependant, même avec ces investissements modérés, nous restons encore loin derrière la puissance industrielle d'une nation moderne."
 BHU_economy_moderate:9 "Investissements Économiques Modérés"
 BHU_economy_moderate_desc:9 "En consacrant une partie de nos ressources à l'industrie de notre pays, nous sommes mieux à même de rivaliser avec la puissance industrielle de nos voisins plus développés. Cependant, même avec ces investissements modérés, nous restons encore loin derrière la puissance industrielle d'une nation moderne."
 BHU_economy_meagre:9 "Investissements Économiques Modestes"
 BHU_economy_meagre_desc:9 "En consacrant une partie de nos ressources à l'industrie de notre pays, nous sommes mieux à même de rivaliser avec la puissance industrielle de nos voisins plus développés. Cependant, même avec nos maigres investissements, nous restons encore loin derrière la puissance industrielle d'une nation moderne."
 BHU_economy_minus_1:9 "Investissements Économiques Réduits"
 BHU_economy_minus_1_desc:9 "Nous avons réduit nos investissements dans le développement de l'industrie et du commerce, ce qui nous a permis de dégager des fonds pour d'autres projets."
 BHU_economy_minus_2:9 "Investissements Économiques Grandement Réduits"
 BHU_economy_minus_2_desc:9 "Nous avons réduit nos investissements dans le développement de l'industrie et du commerce, ce qui nous a permis de dégager des fonds pour d'autres projets."

 BHU_military_extensive:0 "Investissements Militaires Étendus"
 BHU_military_extensive_desc:9 "En consacrant nos ressources à l'armée de notre pays, nous sommes mieux à même de rivaliser avec la puissance militaire de nos voisins plus développés. Cependant, malgré nos investissements considérables, nous restons à la traîne par rapport à la puissance militaire d'une nation moderne."
 BHU_military_adequate:9 "Investissements Militaires Adéquats"
 BHU_military_adequate_desc:9 "En consacrant une partie de nos ressources à l'armée de notre pays, nous sommes mieux à même de rivaliser avec la puissance militaire de nos voisins plus développés. Cependant, malgré ces investissements modérés, nous restons encore loin derrière la puissance militaire d'une nation moderne."
 BHU_military_moderate:0 "Investissements Militaires Modérés"
 BHU_military_moderate_desc:9 "En consacrant une partie de nos ressources à l'armée de notre pays, nous sommes mieux à même de rivaliser avec la puissance militaire de nos voisins plus développés. Cependant, malgré ces investissements modérés, nous restons encore loin derrière la puissance militaire d'une nation moderne."
 BHU_military_meagre:0 "Investissements Militaires Modestes"
 BHU_military_meagre_desc:9 "En consacrant une partie de nos ressources à l'armée de notre pays, nous sommes mieux à même de rivaliser avec la puissance militaire de nos voisins plus développés. Cependant, même avec nos maigres investissements, nous restons encore loin derrière la puissance militaire d'une nation moderne."
 BHU_military_minus_1:0 "Investissements Militaires Réduits"
 BHU_military_minus_1_desc:9 "Nous avons réduit nos investissements dans le développement des forces armées, ce qui nous a permis de dégager des fonds pour d'autres projets."
 BHU_military_minus_2:0 "Investissements Militaires Grandement Réduits"
 BHU_military_minus_2_desc:9 "Nous avons réduit nos investissements dans le développement des forces armées, ce qui nous a permis de dégager des fonds pour d'autres projets."

    ### Economic Ideas

 BHU_building_self_sufficiency:9 "Construire l'Autosuffisance"
 BHU_building_self_sufficiency_desc:9 "Il est difficile de parvenir à une véritable autonomie à l'ère moderne, alors que des technologies nouvelles et en pleine expansion menacent notre mode de vie traditionnel. Nous devons rattraper notre retard par rapport à nos voisins en renforçant nos propres capacités en tant que nation."
 BHU_dreams_of_modernity:9 "Rêves de Modernité"
 BHU_dreams_of_modernity_desc:9 "L'ère moderne ne rattrapera pas le Bhoutan trop vite, même si cela inquiète bon nombre d'anciens. Mais dans l'esprit des jeunes générations, les rêves d'une nouvelle ère virevoltent. Que réserve l'avenir à notre petit royaume montagneux ?"
 BHU_new_building_tech:9 "Nouvelles Techniques de Construction"
 BHU_new_building_tech_desc:9 "Si les méthodes traditionnelles des anciens lamas ont fait leurs preuves et continuent d'inspirer nos meilleurs bâtisseurs, nous devons également nous tourner vers l'avenir et accepter les nouveaux concepts et les nouvelles idées qui affluent du monde extérieur."
 BHU_building_chukha_hydroelectric:9 "Construction du Barrage de Chukha"
 BHU_building_chukha_hydroelectric_desc:9 "Le projet hydroélectrique de Chukha est le fleuron de nos projets de développement économique ; il promet d'alimenter le Bhoutan en électricité et de propulser le pays vers un nouvel avenir électrique. À condition, bien sûr, que ce projet soit un jour mené à bien."
 BHU_importing_coins:9 "Importation de Monnaie"
 BHU_importing_coins_desc:9 "La première étape pour créer notre propre monnaie consiste à importer des pièces étrangères, afin de nous donner le poids nécessaire pour être compétitifs sur les marchés voisins. Bien que cela représente une dépense importante, cela s'avérera payant dès lors que nous serons en mesure de tenir notre place sur ces marchés."
 BHU_nascent_market_economy_1:9 "Économie de Marché Naissante"
 BHU_nascent_market_economy_1_desc:9 "La transition depuis l'économie traditionnelle du troc s'est faite lentement, seules quelques personnalités proches du gouvernement s'étant intéressées à des concepts tels que la monnaie. Malgré tout, on peut déjà entrevoir les prémices d'une nouvelle économie dans ces milieux."
 BHU_nascent_market_economy_2:9 "Économie de Marché Croissante"
 BHU_nascent_market_economy_2_desc:9 "Dans certaines grandes villes et sur certains marchés, les commerçants ont commencé à tenir des registres de leur patrimoine financier, en échangeant des billets attestant de prêts et de dettes. Ce sont les précurseurs d'une nouvelle économie capitaliste au Bhoutan !"
 BHU_nascent_market_economy_3:9 "Économie de Marché Émergente"
 BHU_nascent_market_economy_3_desc:9 "Un nouveau système d'échanges a vu le jour dans les bourgs endormis de notre royaume, transformant ainsi le paysage économique de celui-ci. Les marchands négocient des chiffres et des sommes complexes, tandis que des familles de banquiers aux débuts permettent aux individus et aux communautés entreprenants de poursuivre leurs objectifs d'une manière que l'on n'aurait jamais crue possible auparavant !"
 BHU_expanded_government_offices:9 "Bureaux Gouvernementaux Étendus"
 BHU_expanded_government_offices_desc:9 "Le nouveau Palais du Bonheur nous a permis d'accueillir plusieurs nouveaux services de la cour, ce qui nous a permis d'étendre l'administration sans pour autant perdre le contrôle royal sur les structures organisationnelles et administratives en pleine expansion."
 BHU_newarnomics:9 "Newar-nomique"
 BHU_newarnomics_desc:9 "Les familles de marchands newars sont réputées pour leur vaste réseau himalayen de caravansérails et de centres commerciaux, ainsi que pour leur soutien aux bouddhistes opprimés du Népal. Leur appui permettra de relancer notre reprise économique."
 BHU_passports:9 "Initiative Diplomatique"
 BHU_passports_desc:9 "Même si le "ministère des Affaires étrangères" n’est en réalité rien de plus qu’une poignée d’hommes entreprenants réunis dans une arrière-salle sombre de Punakha, il ne fait aucun doute qu’ils s’investissent avec zèle pour faire entrer le Bhoutan dans le monde diplomatique moderne. Leurs projets sont peut-être irréalisables sur le plan économique et parfois farfelus, mais ils font des efforts, et c’est ce qui compte !"
 BHU_dead_bandits:9 "Paix dans l'Arrière-Pays"
 BHU_dead_bandits_desc:9 "Il est rare que le massacre massif d’une cinquantaine d’hommes contribue à renforcer la paix relative d’une région. Cependant, lorsque ces hommes sont comme ceux-là, cela devient possible. En détruisant trois camps de bandits dans l’ouest du Bhoutan, nous avons apporté à des centaines de villageois un soulagement après des années d’abus."
 BHU_direct_rule_from_punakha:9 "Presser les Lhotshampa"
 BHU_direct_rule_from_punakha_desc:9 "Pendant des années, les Lhotshampa ont pu passer inaperçus en se soumettant aux maîtres Dorji, toujours absents. Mais sans Sonam Topgye Dorji et ses semblables pour dissimuler leur nombre et leur richesse, ils peuvent désormais être recensés et imposés comme il se doit. Leur sang, leur sueur et leurs larmes nourriront notre royaume nouvellement renaissant !"

    ### Military Ideas

 BHU_what_officers:9 "Pratiques Militaires Féodales"
 BHU_what_officers_desc:9 "La notion même d'officier militaire, au sens moderne du terme, est étrangère aux armées du Bhoutan. Au contraire, les forces armées sont réparties entre les seigneurs féodaux, pour la plupart sans formation, qui choisissent leurs subordonnés de confiance en fonction de leur loyauté plutôt que de leur talent."
 BHU_modernising_the_military:9 "Moderniser l'Armée"
 BHU_modernising_the_military_desc:9 "Même si nous avons obtenu certains résultats positifs en appliquant à nos forces armées de nouvelles théories occidentales en matière de hiérarchie et d'organisation, il nous reste encore un long chemin à parcourir."
 BHU_specialists_and_auxiliaries:9 "Spécialistes et Auxiliaires"
 BHU_specialists_and_auxiliaries_desc:9 "Aucune armée ne peut survivre en ne comptant que sur ses simples soldats. Si nous voulons avoir la moindre chance de survivre face à des forces étrangères, nous devrons équiper et former nos meilleurs guerriers aux techniques, tactiques et technologies les plus avancées !"
 BHU_cherish_our_rifles:9 "Chérir notre Équipement"
 BHU_cherish_our_rifles_desc:9 "Chaque mitrailleuse et chaque mortier constituent un trésor inestimable. En l'absence d'infrastructures de production locales adéquates, il est tout simplement impossible de remplacer ces armes de pointe. Nous devrons tout mettre en œuvre pour prendre grand soin de chaque canon dont nous disposons, afin de ne pas les perdre par imprudence."
 BHU_military_reforms_complete:9 "Nouveaux Régiments du Dragon"
 BHU_military_reforms_complete_desc:9 "Au cœur de nos forces armées se trouvent les régiments du Dragon, composés de soldats entraînés et disciplinés, capables de tenir tête à n’importe quelle force de combat moderne ! Bien qu’ils soient peu nombreux, ils sont une source d’inspiration pour tous les combattants du Bhoutan et constitueront le noyau autour duquel l’ensemble de nos forces armées pourra se développer et évoluer."
 BHU_village_musters:9 "Levées Villageoises"
 BHU_village_musters_desc:9 "Il est difficile de convaincre les jeunes hommes valides d’un village de laisser de côté leurs charrues et leurs houes pour prendre les armes : le fusil et l’arc. Pourtant, lorsque l’alternative est de mourir aux mains de l’ennemi, ne vaudrait-il pas mieux mourir au cœur d’une bataille acharnée plutôt que de se recroqueviller dans le calme des champs des vallées ?"
 BHU_the_raven_crown:0 "La Couronne du Corbeau"
 BHU_the_raven_crown_desc:9 "La Couronne du Corbeau est un symbole de la puissance et du prestige du Druk Gyalpo, et il est impératif qu'elle repose sur la tête de son propriétaire légitime."
 BHU_mountain_fortress:9 "Forteresse des Montagnes"
 BHU_mountain_fortress_desc:9 "Les plus grands guerriers du Bhoutan sont faits de terre et de pierre : d’imposants piliers de terre qui marquent son relief. Les montagnes gigantesques de l’Himalaya obligent ceux qui souhaitent s’attaquer à notre nation à choisir avec soin leurs points d’entrée, et nous donnent ainsi amplement le temps de nous préparer à leur arrivée. Nous utiliserons notre terrain pour écraser des ennemis bien plus puissants que nous ! Dans un col de montagne, chaque défenseur courageux peut se battre comme vingt hommes !"

    ### Political Ideas

 BHU_royal_resistance:0 "Résistance Royaliste"
 BHU_royal_resistance_desc:9 "Les vestiges du régime de Wangchuck, les gouverneurs déloyaux et les démocrates méprisés continuent de semer le trouble dans le royaume, sapant notre autorité et manquant de respect à notre nouveau régime. Si nous laissons ces forces s'enraciner, elles ne feront que s'ancrer davantage."
 BHU_rural_relief:9 "Efforts de Secours Ruraux"
 BHU_rural_relief_desc:9 "Nos efforts visant à alléger le fardeau qui pèse sur les campagnes ont déjà porté leurs fruits, puisque la paysannerie opprimée a commencé à consacrer son temps et sa richesse, autrefois presque exclusivement accaparés par les percepteurs d'impôts, à des activités régionales importantes."
 BHU_lifting_the_boot:9 "Lever la Botte"
 BHU_lifting_the_boot_desc:9 "Depuis des générations, les paysans du Bhoutan sont accablés par des impôts et des obligations toujours plus lourds, alors même que leurs exploitations ne cessent de rétrécir et que les opportunités se font de plus en plus rares. Grâce à nos nouvelles réformes fiscales, nous avons donné à ces pauvres âmes une chance de respirer."
 BHU_assembly_successful:9 "Fruits de l'Assemblée"
 BHU_assembly_successful_desc:9 "L'assemblée consultative proposée par Sonam Topgye s'est révélée être un succès avec la remise au roi d'une première série de recommandations. Bien que cet organe soit encore largement dépourvu de pouvoir, il a suscité une confiance renouvelée dans la réactivité du gouvernement royal et a donné une voix à des personnalités qui, sans cela, seraient restées dans l'ombre. Il faut espérer qu'il ne servira pas à enhardir les détracteurs, comme l'ont dénoncé de nombreux membres plus conservateurs de la cour."
 BHU_feudal_order:9 "Fédéralisme Retranché"
 BHU_feudal_order_desc:9 "Le Bhoutan repose sur un vaste ensemble de devoirs et de relations clairement définis, chaque sujet se voyant attribuer un rôle et une place spécifiques au sein du royaume, du serf le plus humble au roi lui-même. C'est ce système qui assure la cohésion de notre royaume, un ordre parfait qu'il convient à la fois de soutenir et de célébrer !"
 BHU_sweeping_monastic_privileges:9 "Privilèges Monastiques Étendus"
 BHU_sweeping_monastic_privileges_desc:9 "Même si les membres du conseil monastique prétendent n'être guidés que par de nobles notions de devoir et de loyauté, la vérité est qu'un pot-de-vin ou deux valent bien plus que de vieux serments ou des principes de devoir."
 BHU_traditionalist_shackles:9 "Chaînes Traditionalistes"
 BHU_traditionalist_shackles_desc:9 "Bien que Sonam Topgye soit l'homme le plus puissant du Bhoutan, son emprise sur l'appareil politique du royaume est limitée par le fait qu'il dépend de l'ancienne bureaucratie de la cour de l'ancien roi. Tant qu'il n'aura pas réussi à se constituer sa propre base de pouvoir, ses tentatives de réforme du pays se heurteront à une opposition à chaque étape."
 BHU_reasserting_stability:9 "Réaffirmer la Stabilité"
 BHU_reasserting_stability_desc:9 "Même si le Zhabdrung a été vaincu, la légitimité de la monarchie est loin d'être rétablie. Nous devrons refonder les coalitions qui ont porté le clan Wangchuck au pouvoir si nous voulons à nouveau régner sur le royaume."
 BHU_web_of_oaths:9 "La Toile des Serments"
 BHU_web_of_oaths_desc:9 "Notre royaume repose sur le réseau de relations interpersonnelles qui lie le suzerain et son fidèle vassal, unis par des couches successives de serments féodaux ancestraux. C'est ce réseau qui sous-tend la coalition autour du clan Wangchuck, et ce n'est que grâce à ces serments que nous survivrons."
 BHU_royal_outriders:9 "Cavaliers Royaux"
 BHU_royal_outriders_desc:9 "La cavalerie royale est ce qui se rapproche le plus, depuis des décennies, d’une armée permanente au Bhoutan : une force de chevaliers bien entraînés, dévoués à la couronne des Wangchuck. Même si la situation militaire évolue, ils peuvent encore jouer un rôle essentiel en tant qu’yeux et oreilles du roi !"
 BHU_reconciliation_campaign:9 "Campagne de Réconciliation"
 BHU_reconciliation_campaign_desc:9 "C'est notre arrogance qui a failli causer notre perte, et ce n'est que par l'humilité et l'empathie que nous pourrons recoller les morceaux du Bhoutan et espérer reconstruire la nation. Il faudra faire des concessions à nos adversaires, mais au final, une approche plus souple permettra de forger un royaume plus fort."
 BHU_retribution_campaign:9 "Campagne de Rétribution"
 BHU_retribution_campaign_desc:9 "La monarchie des Wangchuck n'a été menacée que parce que des hommes faibles l'ont permis. Depuis trop longtemps, nos dirigeants craignent de perturber le fragile équilibre du Bhoutan et ont ainsi laissé la dissidence s'envenimer. Nous leur montrerons que c'est au bout de l'épée que l'on trouve le mieux la paix !"
 BHU_reformist_project:9 "Le Projet Réformiste"
 BHU_reformist_project_desc:9 "Le mouvement de réforme au Bhoutan, mené par Gongzim Sonam Topgye Dorji, vise à mettre en place des réformes administratives et économiques limitées au sein du royaume afin de centraliser le pouvoir et de le soustraire à l'emprise de la noblesse la plus intransigeante, tout en accordant des concessions à une classe émergente d'élites paysannes."
 BHU_buddhist_edu:9 "La Sagesse du Dharma"
 BHU_buddhist_edu_desc:9 "Il est insensé de bafouer l'ordre cosmique de la justice, comme l'a si souvent fait l'ancien régime de Wangchuck. Ses dirigeants ne faisaient que prétendre adhérer aux enseignements du Bouddha et de ses disciples, tout en menant une vie totalement déconnectée de ses vérités. Nous ramènerons la voie de la justice au sein du gouvernement du Bhoutan !"
 BHU_monastic_primacy:0 "Primauté Monastique"
 BHU_monastic_primacy_desc:9 "Un vaste réseau de fiefs monastiques semi-indépendants constitue le véritable fondement du pouvoir au Bhoutan, une force qui a été ignorée pendant des siècles au profit de petits nobles et de courtisans intrigants et flagorneurs. Nous allons une fois de plus faire sortir les sages et les dévoués de l'ombre de l'oppression pour les ramener à la lumière !"
 BHU_monastic_tax_reforms:9 "Fin de la Récolte Fiscale"
 BHU_monastic_tax_reforms_desc:9 "La pratique de la récolte fiscale est une pratique barbare instaurée par les nobles seigneurs de guerre, soucieux de briser le moral des paysans sous le poids d’impôts et de taxes sans fin. Mettre fin à cette pratique, bien qu’impopulaire, est tout simplement la bonne chose à faire."

### Focuses ###
 bhu_rise_of_thunder_dragon:9 "Ascension du Dragon Tonnerre"
 bhu_rise_of_thunder_dragon_desc:9 "L'ordre sacré du royaume du Druk ne se contentera pas de perdurer, il s'épanouira ! Le trône de lotus reste inébranlable, le Dharma prospère, le royaume du Druk conserve son indépendance et l'ordre n'a pas été bouleversé. Le Dragon Tonnerre s'est réveillé et se dresse désormais comme le grand défenseur des montagnes ! Ceux qui souhaitaient autrefois assiéger nos foyers doivent désormais compter avec la puissance de notre royaume et la conviction de notre peuple !"
 bhu_lhasa_road:9 "Étendre les Routes de la Vallée de Chumbi"
 bhu_lhasa_road_desc:9 "Les principales artères commerciales reliant le Bhoutan au grand plateau tibétain partent de Paro et de Haa, traversent la vallée de Chumbi et mènent jusqu’à Lhassa. Compte tenu de nos nouveaux engagements en matière de gouvernance du Tibet, nous devons transformer ces sentiers accidentés en une véritable route."
 bhu_sponsor_monastic_exchange:9 "Financer les Échanges Monastiques"
 bhu_sponsor_monastic_exchange_desc:9 "Notre royaume compte de grands penseurs, mais sans un effort concerté, ils resteront dans leur pays d'origine, où ils continueront d'être considérés comme les hommes les plus sages de hameaux ignorants. En attirant les meilleurs et les plus brillants au Bhoutan, nous pourrons mettre à profit leur intelligence et favoriser la coopération."
 bhu_bring_bhutan_to_every_village:9 "Amener le Bhoutan à Chaque Village"
 bhu_bring_bhutan_to_every_village_desc:9 "Pour les paysans qui mènent une vie de misère dans les petits villages du Népal et du Tibet, nos victoires n’ont rien changé. En réalité, beaucoup d’entre eux ne savent peut-être même pas qui les gouverne et les protège désormais. Nous devons leur montrer notre générosité et notre savoir-faire, afin que chaque village dispose d’un puits ou d’un grenier orné de l’image du grand dragon."
 bhu_expel_foreign_parasites:9 "Expulser les Parasites Étrangers"
 bhu_expel_foreign_parasites_desc:9 "Les Tibétains et les Népalais ont beaucoup cédé aux experts étrangers, permettant à bon nombre d’entre eux de se tailler de petits fiefs au sein de leurs grandes cours. Ces colons arrivistes ont depuis longtemps abusé de l’hospitalité qui leur a été offerte, sapant la richesse et l’indépendance de leurs hôtes. Nous les chasserons et nous nous tournerons plutôt vers les plus brillants et les plus compétents de nos courtisans de confiance pour faire naître une nouvelle ère de prospérité et de stabilité dans le royaume !"
 bhu_airing_out_the_court:9 "Aérer la Cour"
 bhu_airing_out_the_court_desc:9 "Il ne faut pas longtemps pour qu'un cercle restreint se forme dans les couloirs du pouvoir, et bien souvent, ces initiés ne reculent devant rien pour conserver leurs positions privilégiées. Nos récentes conquêtes nous ont apporté une multitude de nouveaux visages, d'experts, d'enseignants et d'hommes d'État chevronnés. Nous devrions faire venir ces personnalités érudites à la capitale, où nous pourrons tirer parti de leurs compétences !"
 bhu_break_out_the_big_guns:9 "Sortir les Gros Canons"
 bhu_break_out_the_big_guns_desc:9 "Depuis des siècles, les canons sont utilisés avec parcimonie lors des combats dans l'Himalaya, bien que leur coût et leur complexité aient empêché toute généralisation de leur utilisation. Cependant, forts de notre nouvelle richesse et de notre nouveau pouvoir, le moment est peut-être venu de les intégrer de manière systématique au sein de nos forces armées."
 bhu_hone_the_knife_tip:9 "Affûter la Pointe du Couteau"
 bhu_hone_the_knife_tip_desc:9 "Ce sont les guerriers les plus courageux du Bhoutan qui ont conquis l’Himalaya, et ce sont les vaillants fils du Bhoutan qui continueront à défendre ces terres. Nous ne pouvons pas compter sur des conscrits indisciplinés et indignes de confiance pour préserver notre victoire ; nous devons au contraire affûter les talents de nos meilleurs soldats. Tant que la redoutable Garde du Dragon se tiendra prête à protéger nos frontières ou à réprimer toute insurrection, nous serons en sécurité."
 bhu_integrate_the_conquered:9 "Intégrer les Conquis"
 bhu_integrate_the_conquered_desc:9 "Sans nouveaux alliés ni collaborateurs, nous ne pouvons espérer conserver les territoires que nous avons conquis. Le fait de conserver et d’intégrer les milices levées par nos anciens ennemis est impopulaire et potentiellement dangereux. Cela pourrait donner aux notables locaux la légitimité nécessaire pour saper nos efforts d’intégration de ces nouveaux territoires. Cependant, nous ne pouvons pas simplement prétendre que ces territoires peuvent être gérés sans nouveaux seigneurs ni gouverneurs : nous n’avons guère le choix si nous souhaitons conserver nos conquêtes."

 bhu_expand_irrigation:9 "Étendre l'Irrigation de la Vallée"
 bhu_expand_irrigation_desc:9 "Chaque année, les canaux d'irrigation rudimentaires qui sillonnent les nombreuses fermes de la vallée qui nourrissent notre royaume se détériorent et tombent en ruine. De nombreuses communautés ne disposent pas de la main-d'œuvre nécessaire pour entretenir correctement ces sources d'eau vitales, ce qui oblige les seigneurs féodaux à mobiliser des effectifs supplémentaires pour leur redonner vie."
 bhu_enforce_trongsa_law:9 "Appliquer la Loi de Trongsa"
 bhu_enforce_trongsa_law_desc:9 "Le Bhoutan est une mosaïque de coutumes et de lois locales, souvent peu encadrées, au profit avant tout des petits seigneurs qui font office à la fois de législateurs et de juges. Dans le fief personnel du roi, de nombreux villages et communautés se sont éloignés des normes traditionnelles de Trongsa, le siège ancestral du clan Wangchuck. Nous devons remédier à cette situation."
 bhu_deal_with_unsanctioned_taxation:9 "S'occuper de la Taxation non Autorisée"
 bhu_deal_with_unsanctioned_taxation_desc:9 "Au Bhoutan, les frontières entre les territoires de tel ou tel chef sont floues, ce qui signifie qu’un paysan peut se retrouver confronté à deux, voire plusieurs personnages exigeant une part de sa récolte, le laissant sans rien. Il faut s’occuper de ces seigneurs parallèles, véritables sangsues qui vident de leur sang les sujets de la couronne, par la force si nécessaire."
 bhu_investigate_dissenter_monks:9 "Enquêter sur les Moines Dissidents"
 bhu_investigate_dissenter_monks_desc:9 "L'ascension récente de Zhabdrung Jigme Dorji a entraîné un déclin lent mais constant de l'homogénéité monastique, les jeunes, en quête de changement, se détournant de leurs aînés pour se tourner vers cette nouvelle voix. Ces voix dissidentes doivent être examinées et prises en compte, sous peine de voir leur influence néfaste se propager plus largement au sein de l'institution la plus fondamentale du Bhoutan."
 bhu_raising_a_host:9 "Lever l'Ost Royal"
 bhu_raising_a_host_desc:9 "Mettre sur pied une armée au Bhoutan n'est ni facile ni simple. Il n'existe ni calendrier de mobilisation, ni liste de réservistes, ni armée permanente sur laquelle s'appuyer. En revanche, on doit compter sur des relations féodales complexes et des voies de communication instables, ce qui signifie que mobiliser l'armée royale est une entreprise vaine, qui se mesure en mois et non en semaines."
 bhu_secure_the_borders:9 "Sécuriser les Frontières"
 bhu_secure_the_borders_desc:9 "Lorsque notre regard se tourne vers l'intérieur, vers les conflits qui agitent le royaume des montagnes, nos voisins risquent d'en prendre note. Même en temps normal, les frontières entre notre royaume et ceux qui l'entourent sont floues et mal surveillées. En ces temps difficiles, il serait peut-être judicieux de réfléchir à la manière de sécuriser ces frontières, ne serait-ce que pour garantir notre stabilité."
 bhu_repair_ta_dzong:9 "Sécuriser nos Dzongs"
 bhu_repair_ta_dzong_desc:9 "Les forteresses dzong constituent le cœur battant de nos communautés, mais des années de paix et un entretien insuffisant ont rendu leur rythme irrégulier et faible. Notre ennemi actuel connaîtra sans doute tous les angles morts, les faiblesses et les brèches qui entachent ces forteresses, et d’importants travaux seront nécessaires pour leur redonner le rôle de remparts qu’elles jouaient autrefois."
 bhu_reorganise_the_royal_guard:9 "Réorganiser la Garde Royale"
 bhu_reorganise_the_royal_guard_desc:9 "Bien que le Bhoutan ne dispose pas d'armée permanente, le roi a toujours été protégé par un petit groupe de guerriers aguerris. Si la guerre civile qui a porté le roi Ugyen au pouvoir avait fait de ses gardes une véritable force de combat, ceux-ci ont, plus récemment, pris un caractère beaucoup plus protocolaire. Nous devons inverser cette tendance."
 bhu_reassure_our_neighbours:9 "Rassurer nos Voisins"
 bhu_reassure_our_neighbours_desc:9 "Le commerce est le moteur de toute nation, même d’une nation aussi isolée que le Bhoutan. L’instabilité a généralement pour effet de dissuader les marchands itinérants venus d’Inde et du Tibet, et leur absence ne fait qu’aggraver l’instabilité, car les communautés se retrouvent privées des produits de première nécessité étrangers dont elles sont désormais dépendantes. En convainquant nos voisins que leurs commerçants seront protégés, nous pouvons éviter cette situation."
 bhu_drill_our_regulars:9 "Entraîner nos Réguliers"
 bhu_drill_our_regulars_desc:9 "La Marche sur Cheri a rassemblé un grand nombre de guerriers et a donné à de nombreux hommes l'occasion de faire leurs preuves au cœur de la bataille. Il convient de se souvenir de ceux qui se sont montrés particulièrement compétents et courageux, et de les recruter afin qu'ils puissent s'entraîner et se former comme il se doit pour devenir des guerriers professionnels."
 bhu_organise_village_defense:9 "Organiser les Défenses de Village"
 bhu_organise_village_defense_desc:9 "Les périodes d'instabilité favorisent généralement l'émergence de bandits, qui s'en prennent en toute impunité aux villages isolés. En regroupant de petits groupes de villages de la région sous un même système de défense, avec des milices collectives, ceux-ci pourraient avoir bien plus de chances de résister aux meutes de loups des hautes terres, même en l'absence de leur seigneur et de ses guerriers."
 bhu_end_revolution:9 "Cendres de la Révolte"
 bhu_end_revolution_desc:9 "Une période de violence a saigné notre nation à blanc et en a fait une épave encore fumante. Pourtant, ces feux de la révolution ont purifié le Bhoutan de la pourriture de la stagnation, nous laissant une toile vierge sur laquelle travailler. Nous devons balayer les cendres pour saisir cette occasion de nous attaquer aux problèmes endémiques de notre nation, en réformant les systèmes dysfonctionnels qui minent depuis longtemps le Bhoutan afin de les transformer selon notre vision d’un gouvernement parfait."

 bhu_deal_with_banditry:9 "S'occuper du Banditisme"
 bhu_deal_with_banditry_desc:9 "Bien que les combats ouverts se soient apaisés au Bhoutan, des bandits continuent de semer la terreur dans les villages et les communautés à travers tout le royaume, en se retranchant dans les cols des vallées et les hautes terres. Les milices villageoises locales ne seront pas en mesure de venir à bout de ces bêtes par elles-mêmes, d’autant plus que bon nombre de leurs meilleurs éléments reposent désormais à Cheri. C’est à nous qu’il reviendra de débusquer ces monstres."
 bhu_reconcile_with_the_monks:9 "Se Réconcilier avec les Moines"
 bhu_reconcile_with_the_monks_desc:9 "Les rebelles monastiques ont constitué le noyau dur des partisans du Zhabdrung, et leur rejet de la relation traditionnelle entre le roi et le Je Khenpo a profondément ébranlé le Zhung Dratshang. Nous devons forger un nouveau pacte avec ceux qui sont restés fidèles à la couronne."
 bhu_unify_the_royal_cause:9 "Unifier la Cause Royale"
 bhu_unify_the_royal_cause_desc:9 "Une grande partie des dégâts causés par le Zhabdrung n'a pu se produire qu'en raison de la faiblesse de la coalition royale, divisée par des décennies de luttes intestines. Nous devons rassembler à nouveau les traditionalistes et les réformateurs si nous voulons conserver notre emprise sur la nation."
 bhu_weave_the_web_of_oaths:9 "Tisser la Toile des Serments"
 bhu_weave_the_web_of_oaths_desc:9 "Notre nation ne repose pas sur la loi, mais sur le réseau de relations humaines qui, une fois tissé, assure la cohésion de notre société. Le conflit récent a rouvert des blessures chez ceux que nous considérons comme nos vassaux et nos alliés, et le moment est tout aussi propice que n’importe quel autre pour raviver leurs anciens serments d’allégeance à la couronne."

 bhu_the_tightened_fist:9 "Le Poing Serré"
 bhu_the_tightened_fist_desc:9 "La quasi-dissolution de la monarchie bhoutanaise aux mains d’un moine bandit arriviste a laissé notre cour sous le choc. Il existe pourtant une réponse claire aux questions que cet événement soulève : nous nous sommes trop ramollis au fil de ces années de paix, laissant trop de dissidence se développer au sein de notre société sans y réagir. Nous devons sévir, avant qu’un nouveau révolutionnaire ne se lève."
 bhu_entrench_the_feudal_compact:9 "Consolider le Pacte Féodal"
 bhu_entrench_the_feudal_compact_desc:9 "Depuis longtemps, notre nation s'appuie sur le sang, la sueur et les larmes de nos serfs sans terre. Si certains tiennent à bouleverser cette source traditionnelle de main-d'œuvre, leur précipitation ne fait que refléter leur naïveté. Il est évident que les serfs constituent le socle de notre société et que nous devons consolider, clarifier et codifier les fondements féodaux du Bhoutan."
 bhu_perserve_the_social_order:9 "Préserver l'Ordre Social"
 bhu_perserve_the_social_order_desc:9 "Notre nouveau régime ne peut espérer compter sur la bonne volonté de ceux qui se sont autrefois opposés à nous. Lorsque le Zhabdrung s'est révolté contre son roi, il a été rejoint par des milliers de personnes désireuses de détruire l'ordre féodal qui assure la cohésion de notre royaume. Les règles qui constituent le fondement de notre société doivent être appliquées, de peur qu'ils ne se mettent à nouveau des idées en tête."
 bhu_curtail_wayward_penlops:0 "Freiner les Penlops Indisciplinés"
 bhu_curtail_wayward_penlops_desc:9 "De nombreux Penlops ont pris le parti de nos rivaux lors de la récente lutte pour le trône. Éliminer ceux qui se sont montrés déloyaux risque certes d’affaiblir notre gouvernement à court terme, mais aucun grand dzong n’a jamais été bâti sur des fondations pourries. Si la plupart finiront par être pardonnés pour leurs erreurs, il faut rappeler à certains le véritable prix de la trahison."
 bhu_militant_court:9 "La Cour Militante"
 bhu_militant_court_desc:9 "La faction traditionaliste de la cour se présente depuis longtemps comme l'épée et le bouclier du Bhoutan. Fort du soutien de l'élite militaire qui sous-tend cette faction, le Druk Gyalpo peut désormais s'imposer comme le détenteur incontesté de cette épée et de ce bouclier, s'entourant d'une cour de conseillers militaires chevronnés chargés de guider la couronne."
 bhu_create_military_school:9 "Ne pas Craindre l'Avenir"
 bhu_create_military_school_desc:9 "Beaucoup pensent que les traditionalistes sont des ploucs arriérés qui craignent les nouvelles technologies du monde extérieur, mais cette idée est on ne peut plus éloignée de la réalité. Malgré notre aversion pour la domination étrangère, nous recruterons des enseignants étrangers pour transmettre les dernières avancées militaires et technologiques à la prochaine génération de Bhoutanais."
 bhu_gather_the_royal_riders:9 "Rassembler les Cavaliers Royaux"
 bhu_gather_the_royal_riders_desc:9 "Le roi ne peut pas compter sur sa garde personnelle pour assurer sa protection tout en jouant le rôle de ses principaux agents militaires à travers le royaume. Une nouvelle unité de guerriers d'élite à cheval, issue des maisons nobles les plus prestigieuses et les plus fidèles du royaume, fera office de poing royal et veillera à ce que la volonté du roi se fasse sentir aux quatre coins du Bhoutan."

 bhu_the_open_palm:9 "La Paume Ouverte"
 bhu_the_open_palm_desc:9 "L'ascension soudaine du Zhabdrung en tant que défenseur du peuple bhoutanais a démontré le danger que représente l'isolement lâche de la cour face à la misérable réalité féodale de son royaume. Nous devons agir rapidement pour mettre en place des réformes limitées mais authentiques au sein de notre société, de peur de perdre à nouveau le contrôle de la nation aux mains d'un autre parvenu."
 bhu_providing_rural_relief:9 "Apporter une Aide Rurale"
 bhu_providing_rural_relief_desc:9 "La notion d’intervention du gouvernement dans les villages du Bhoutan est pratiquement inconnue. En effet, le villageois lambda n’a probablement qu’une vague idée de qui le gouverne, mis à part les anciens de son gewog local et peut-être le seigneur penlop le plus proche. Certains projets menés par le gouvernement central pourraient venir en aide aux populations rurales, rappelant ainsi aux paysans qui les dirige réellement."
 bhu_alleviate_tsatong_appropriations:9 "Alléger les Impôts Tsatong"
 bhu_alleviate_tsatong_appropriations_desc:9 "Les habitants de notre royaume souffrent sous le joug de divers impôts qui se superposent, ne leur laissant pratiquement rien pour subvenir à leurs besoins. Peu d’impôts sont plus détestés que l’impôt Tsatong, qui frappe les familles paysannes au moment où elles sont le plus vulnérables. Suspendre temporairement l’impôt Tsatong le temps que nous recherchions des alternatives viables nous permettrait certainement de gagner la faveur de nos sujets."
 bhu_codify_customary_law:9 "Codifier la Coutume"
 bhu_codify_customary_law_desc:9 "L'un des principaux problèmes auxquels sont confrontés nos sujets est la confusion qui règne quant à leurs droits et leurs devoirs au regard des différents systèmes juridiques coutumiers en vigueur à travers le royaume, une situation dont de nombreux seigneurs tirent parti à des fins personnelles. Nous devons clarifier et codifier la loi."
 bhu_new_civil_service:9 "Les Débuts d'une Fonction Publique"
 bhu_new_civil_service_desc:9 "Les fonctionnaires sont la force vive de tout grand royaume, car ils font respecter l’autorité du roi jusque dans les moindres recoins de son royaume. Au Bhoutan, cependant, c’est une armée de courtisans intrigants et corrompus qui met en œuvre la volonté du gouvernement. Nous devons constituer un nouveau corps de fonctionnaires autour d’un noyau d’hommes loyaux et dynamiques, dévoués au Bhoutan."
 bhu_national_assembly: "Appel à une Assemblée Nationale"
 bhu_national_assembly_desc:9 "Depuis des générations, les habitants du Bhoutan disposent de peu de moyens pour faire part de leurs doléances à leurs supérieurs. En l'absence de mécanismes permettant de gérer ces problèmes et ces griefs, de nombreux gewogs se sont tournés vers le Zhabdrung dans l'espoir d'un avenir meilleur. Nous devons être à l'écoute des habitants de notre royaume, en créant un conseil consultatif capable d'informer correctement le roi des difficultés rencontrées au niveau local."
 bhu_punakha_academy:9 "Ouvrir les Premières Écoles Lobdra"
 bhu_punakha_academy_desc:9 "Traditionnellement, l'éducation au Bhoutan relevait de la compétence des précepteurs et des écoles bouddhistes shedra. En créant un nouvel établissement d'enseignement laïc à Punakha, le Rigney Lobdra, nous formerons une nouvelle génération de dirigeants et d'administrateurs. Nous devrons nous tourner vers l'extérieur de notre royaume pour découvrir les techniques pédagogiques du monde moderne, afin de les associer aux traditions de notre royaume."

 bhu_eliminate_the_royals:9 "Éliminer les Royaux Restants"
 bhu_eliminate_the_royals_desc:0 "Nous ne souhaitons pas nous contenter de régner sur le Bhoutan en tant que successeurs du clan Wangchuck, faible et lâche. Nous allons nous débarrasser de cet héritage d'échecs, en commençant par ces réformistes cupides qui ont vendu notre pays aux Indiens pour une bouchée de pain. Des ennemis et des traîtres se cachent dans chaque dzong et chaque monastère, et le Bhoutan ne sera véritablement libre que lorsqu'ils auront tous été réduits au silence."
 bhu_bind_intransigent_elders:9 "Maîtriser les Anciens Intransigeants"
 bhu_bind_intransigent_elders_desc:9 "Il existe une multitude de moines qui ont soutenu l’ancien régime monarchique des Wangchuck, mais dont les objectifs et les convictions rejoignent largement les nôtres. Aveuglés par leur obstination de vieillards, ces fossiles ont tourné le dos au Zhabdrung au moment où il avait le plus besoin d’eux. Malgré tout, ils méritent d’assister à la glorieuse restauration du Zhabdrung, et leur sagesse pourrait s’avérer utile dans les années à venir."
 bhu_deal_with_opportunists:9 "S'occuper des Opportunistes"
 bhu_deal_with_opportunists_desc:9 "Nous sommes arrivés au pouvoir portés par une immense vague de mécontentement, qui a rassemblé des milliers de personnes de tous horizons se sentant abandonnées par les rois Wangchuck. Bien sûr, certains de ceux qui avaient été mis au ban par l’ancien régime n’étaient guère plus que des bandits, qui ont depuis profité de l’élan de notre victoire pour se tailler de minuscules fiefs, terrorisant les villages en se faisant passer pour des "représentants fidèles" du Zhabdrung. Il faudra les arrêter."
 bhu_reel_in_the_radicals:9 "Mettre les Radicaux au Pas"
 bhu_reel_in_the_radicals_desc:9 "Le soutien qui a permis l’ascension au pouvoir du Zhabdrung provenait des nombreux jeunes moines, exaspérés par l’impuissance des anciens, jugés faibles. Ces figures radicales ont appelé à un changement révolutionnaire, cherchant à ramener le Bhoutan à un âge d’or légendaire. De telles propositions viendraient compromettre les propres projets du Zhabdrung. Il faut contenir ces radicaux avant qu’ils ne prennent le contrôle de notre nouveau mouvement !"
 bhu_where_faith_governs:9 "Là où la Foi Gouverne"
 bhu_where_faith_governs_desc:9 "Les habitants du Bhoutan sont d'abord bouddhistes, puis Bhoutanais. Cette dévotion envers les lignées bouddhistes Drukpa Kagyu et Nyingma constitue le fondement de notre culture et de notre patrimoine. Il est donc naturel que la foi soit le principe directeur de notre gouvernement, les principes du Zhabdrung guidant notre gouvernement tandis que les rituels Nyingma enrichissent notre peuple."
 bhu_exalt_buddhist_canon:9 "Exalter le Canon Bouddhiste"
 bhu_exalt_buddhist_canon_desc:9 "Le Kangyur, en 108 volumes, et le Tengyur, en 225 volumes, constituent la base du canon bouddhiste tibétain. Le Zhabdrung a annoncé son intention de financer la réalisation d’éditions calligraphiques exceptionnelles de ces deux ouvrages fondamentaux, afin de rehausser le prestige de notre gouvernement et d’améliorer le sort des bouddhistes à travers tout le Bhoutan."
 bhu_reform_tsa_yig:9 "Réformer le Tsa Yig"
 bhu_reform_tsa_yig_desc:9 "Le code juridique du Tsa Yig trouve ses racines dans des siècles de remise en question et d’affinement théologiques, menés par des générations de sages chefs monastiques. L’actuelle réincarnation du Zhabdrung Rinpoché se joindra à eux pour poursuivre la réforme et la codification du Tsa Yig, afin de refléter les défis propres à notre époque, ainsi que la force unique de l’actuelle incarnation du Zhabdrung."
 bhu_confirm_clerical_authority:9 "Confirmer l'Autorité Cléricale"
 bhu_confirm_clerical_authority_desc:9 "La frontière entre le pouvoir spirituel et le pouvoir temporel est devenue de plus en plus floue depuis l'avènement du Zhabdrung et la restauration d'un régent Druk Desi dépourvu de tout pouvoir. Si la tradition ancestrale confère des pouvoirs étendus au Zhabdrung, certains privilèges accordés au régent et aux Penlops par des incarnations passées plus faibles doivent à nouveau être arrachés à ces mains corrompues."
 bhu_fund_monastic_schools:9 "Financer les Nouveaux Collèges Shedra"
 bhu_fund_monastic_schools_desc:9 "Les écoles monastiques shedra ont traditionnellement été le moteur de l'enseignement supérieur au Bhoutan, et la plupart des plus grands esprits du pays ont été formés dans ces temples de la sagesse. Malgré la volonté malavisée de créer de nouvelles écoles laïques, nous savons que celles-ci ne sont rien d'autre que de pâles imitations des collèges traditionnels shedra, qui enrichissent les étudiants tant sur le plan spirituel qu'éducatif."
 bhu_welfare_through_the_monasteries:0 "L'Aide par les Monastères"
 bhu_welfare_through_the_monasteries_desc:9 "Les monastères ont longtemps constitué le cœur des communautés locales, en fournissant des services essentiels aux villages environnants. Au-delà de leur rôle de pôles de la vie locale, les monastères ont également, de tradition, apporté leur aide à leurs voisins en cas de besoin. Ces monastères sont bien placés pour jouer le rôle d'arbitres en matière de protection sociale, et il convient de les soutenir dans cette fonction."
 bhu_the_diarchy_rejuvenated:9 "La Diarchie Renouvelée"
 bhu_the_diarchy_rejuvenated_desc:9 "Ngawang Namgyal, la première incarnation du Zhabdrung, a délibérément mis en place la diarchie, en déléguant des pouvoirs au Je Khenpo et au Druk Desi afin d’assurer la stabilité du royaume après sa mort. Il n’avait pas prévu que ces représentants de sa volonté tenteraient de saper sa création en sapant progressivement l’autorité centrale et unificatrice du Zhabdrung. Nous avons enfin rétabli la diarchie telle qu’il l’avait imaginée !"

 bhu_standardise_weights_and_measures:9 "Standardiser les Poids et Mesures"
 bhu_standardise_weights_and_measures_desc:9 "La mise en place de normes uniformes en matière de poids et de mesures constitue un fondement essentiel de l'administration moderne. Alors que chaque communauté s'accroche à ses moyens et méthodes traditionnels de mesure, cette hétérogénéité ne fait que semer la confusion et entraver le commerce et la coopération entre les communautés. L'adoption de méthodes universellement acceptées pour peser et mesurer les marchandises simplifiera le commerce, la fiscalité et l'administration."
 bhu_stamp_our_own_coins:9 "Promouvoir l'Usage des Monnaies"
 bhu_stamp_our_own_coins_desc:9 "Depuis des centaines d'années, les rares pièces de monnaie utilisées au Bhoutan proviennent de l'étranger, qu'il s'agisse de Qing wen en argent, de srangs tibétains ou de roupies indiennes. Bien que nous ne disposions pas de ressources locales en métaux précieux suffisantes pour servir de base à une véritable monnaie, nous pouvons frapper un nombre limité de nos propres pièces en argent, les ngultrums, entièrement contrôlées par notre propre atelier monétaire, afin de compléter les pièces étrangères."
 bhu_dzongs_for_a_new_age:9 "Dzongs d'une Nouvelle Ère"
 bhu_dzongs_for_a_new_age_desc:9 "Les forteresses dzong constituent souvent le cœur d'une communauté : elles servent de siège aux dirigeants locaux, de centre du commerce local et de refuge en cas de catastrophes, qu'elles soient naturelles ou d'origine humaine. Cela fait déjà un certain temps qu'aucun nouveau dzong n'a été construit ni qu'aucun dzong existant n'a été rénové, privant ainsi de nombreuses communautés de ces pôles essentiels."
 bhu_fortify_key_passes: "Fortifier les Passages Clés"
 bhu_fortify_key_passes_desc:9 "Notre royaume montagneux est relié au monde extérieur par plusieurs petits cols situés au nord et au sud du pays. Ces cols constituent la porte d'entrée entre nos terres et le monde extérieur, et si nous voulons contrôler nos frontières, réguler nos échanges commerciaux et défendre nos foyers, nous devrons protéger ces cols à l'aide d'un système de fortifications modernes."
 bhu_build_new_workshops:9 "Construire de Nouveaux Ateliers"
 bhu_build_new_workshops_desc:9 "Les petits ateliers artisanaux qui parsèment les villages et les villes constituent l'épine dorsale du maigre développement industriel du Bhoutan. Ces minuscules ateliers, généralement gérés par une seule famille, ne pourront pas répondre indéfiniment aux besoins du pays. De nouveaux projets, d'une envergure bien plus grande, pourraient contribuer à faire entrer le pays dans l'ère de la révolution industrielle."
 bhu_exploit_our_natural_resources:9 "Exploiter les Richesses des Montagnes"
 bhu_exploit_our_natural_resources_desc:9 "Traditionnellement, ceux qui cherchaient des gisements de métaux au Bhoutan creusaient de petites galeries à l'aide d'outils manuels, sans grand succès. Cela ne signifie pas pour autant qu'il n'y ait pas de ressources abondantes, prêtes à être exploitées ! Certains filons de ressources minérales précieuses pourraient être exploités de manière adéquate grâce à des initiatives minières plus déterminées et mieux organisées, soutenues par le gouvernement central."
 bhu_hew_the_forests:9 "Abattre les Forêts de Plaine"
 bhu_hew_the_forests_desc:9 "La majeure partie du Bhoutan est recouverte de forêts, qui abritent une grande diversité d’essences, allant des feuillus des plaines aux conifères alpins. Le bois constitue la principale source de matériaux de construction et de combustibles, et le développement de notre industrie d’exploitation forestière servira de fondement au développement économique futur."
 bhu_introduce_crop_rotation:9 "Introduire la Rotation des Cultures"
 bhu_introduce_crop_rotation_desc:9 "Les agriculteurs du Bhoutan ont pour habitude de pratiquer la rotation des cultures, laissant chaque année de vastes étendues de terres arables en jachère afin de permettre au sol de se régénérer. En introduisant un certain nombre de cultures plus résistantes, capables de régénérer activement le sol pendant les années de jachère, nous pouvons mieux exploiter les terres dont nous disposons."
 bhu_introduce_new_building_techniques:9 "Introduire de Nouvelles Techniques de Construction"
 bhu_introduce_new_building_techniques_desc:9 "Lorsqu’un grand projet de construction est entrepris sur notre territoire, les bâtisseurs puisent généralement leur inspiration dans le passé, en s’efforçant de reproduire les lamaseries des célèbres incarnations d’autrefois. Sans pour autant oublier cette tradition, nous devons également apprendre à nous tourner vers l’avenir pour y trouver notre inspiration. De nouvelles techniques et de nouveaux concepts s’offrent à nous, et c’est avec eux que nous construirons !"
 bhu_lay_down_lateral_road:9 "Tracer la Route Latérale"
 bhu_lay_down_lateral_road_desc:9 "La grande majorité des routes et des chemins qui sillonnent le Bhoutan s'étendent du nord au sud, facilitant ainsi la circulation des personnes et des marchandises entre le Tibet et l'Inde, mais ne contribuant en rien à relier les communautés de notre nation. La construction d'une nouvelle route reliant les principaux centres urbains du pays sera coûteuse et difficile, mais elle est essentielle pour notre avenir."
 bhu_revitalise_trade_routes:9 "Revitaliser les Routes Commerciales"
 bhu_revitalise_trade_routes_desc:9 "Que nous soyons ou non particulièrement satisfaits des pays qui entourent le Bhoutan, bon nombre des ressources dont nous dépendons aujourd’hui proviennent de pays étrangers et parcourent souvent des milliers de miles avant d’arriver chez nous. Nous devons nouer de nouveaux contacts commerciaux avec les pays voisins, tout en rétablissant notre balance commerciale grâce à de nouvelles exportations."
 bhu_smuggle_foreign_arms:0 "Contrebande d'Armes Étrangères"
 bhu_smuggle_foreign_arms_desc:9 "Même si la contrebande de fusils n'est pas une activité très recommandable, la survie de notre nation dépend de notre capacité à nous procurer des armes modernes. Il existe en Inde et en Chine un certain nombre d'individus peu recommandables qui sont tout à fait disposés à "perdre" quelques fusils qui leur ont été confiés, moyennant une somme suffisante, bien sûr."
 bhu_import_foreign_machinery:0 "Importer des Machines Étrangères"
 bhu_import_foreign_machinery_desc:9 "Si la plupart des tâches peuvent être accomplies grâce au système généralisé de corvée qui assure le fonctionnement de notre nation, nos nouveaux rêves d’expansion industrielle nécessitent de nouvelles machines métalliques destinées à la construction et au transport. Les automobiles et les roadsters ne servent pas à grand-chose dans un pays dépourvu de véritables routes, mais l’achat de véhicules aujourd’hui pourrait déboucher sur de grandes avancées à l’avenir."
 bhu_monopolise_salt_imports:9 "Monopoliser les Importations de Sel"
 bhu_monopolise_salt_imports_desc:9 "Le sel est l'une des principales importations de notre pays, car il n'existe pratiquement aucune source locale d'approvisionnement. En imposant un contrôle centralisé de l'État sur l'importation de cette ressource, nous pouvons limiter l'emprise croissante des puissances étrangères sur notre économie naissante et nous assurer une source lucrative de recettes."
 bhu_harnessing_the_dragon:9 "Oser Dompter le Dragon"
 bhu_harnessing_the_dragon_desc:9 "Le Bhoutan est une vaste étendue de terres divines, restées intactes par l’homme depuis qu’il arpente ses vallées, traverse ses rivières à la nage et escalade ses montagnes. Nous sommes pour l’instant loin de pouvoir tirer parti des importantes ressources naturelles que recèle notre royaume, mais l’avenir approche à grands pas ! Nous entrerons victorieusement dans le XXe siècle !"

 bhu_bowstring_to_gunshot:9 "De l'Arc au Canon"
 bhu_bowstring_to_gunshot_desc:9 "Pendant des siècles, les grands archers du Bhoutan ont constitué le cœur de l’armée de tout seigneur, et le claquement et le sifflement des flèches tirées étaient les sons de la guerre. Aujourd’hui, le crépitement des mousquets et des fusils est devenu le nouveau signe avant-coureur de la mort. Si nous voulons survivre, nous devrons tourner la page de notre héritage de nation d’archers pour accepter les dures réalités de la guerre moderne."
 bhu_next_generation_leaders:9 "La Nouvelle Génération de Dirigeants"
 bhu_next_generation_leaders_desc:9 "Pendant trop longtemps, nous sommes restés fermement convaincus que nos barrières naturelles montagneuses nous protégeraient des horreurs de la guerre moderne. Mais une telle mentalité figée ne peut plus être tolérée. Nous avons besoin d’une nouvelle génération de jeunes esprits novateurs pour réfléchir à nouveau à la meilleure façon de protéger le Bhoutan contre les menaces extérieures auxquelles nous sommes confrontés."
 bhu_noble_officers: "Attirer les Officiers Nobles"
 bhu_noble_officers_desc:9 "La noblesse du Bhoutan est un mélange éclectique de petits seigneurs féodaux et d’abbés sages, dont beaucoup peuvent faire remonter leur lignée jusqu’au Moyen Âge. Issues de ces anciennes lignée, certaines familles ont fait leurs preuves en tant que maîtres des arts martiaux, leurs prouesses ayant été affinées au fil des siècles par les invasions, les conflits et les guerres civiles. C’est parmi les descendants de ces clans et de ces maisons que nous devons puiser notre prochaine génération de dirigeants."
 bhu_meritocratic_approach:9 "Une Approche plus Méritocratique"
 bhu_meritocratic_approach_desc:9 "Si les familles nobles du Bhoutan ont donné naissance à bon nombre de ses esprits les plus brillants et de ses cœurs les plus courageux, les troubles civils de l’année dernière ont montré que des hommes issus de tous les horizons sociaux peuvent se montrer à la hauteur des circonstances. Nous devrions mettre à l’honneur certaines de ces personnalités qui se sont mobilisées en temps de crise, quelle que soit leur origine."
 bhu_study_distant_doctrines:9 "Étudier les Doctrines Lointaines"
 bhu_study_distant_doctrines_desc:9 "L'adoption de nouveaux types d'armes doit s'accompagner de l'adoption de nouvelles tactiques. Les combats à relativement courte distance menés par les archers et les lanciers ne peuvent plus s'adapter à la nouvelle structure de notre armée, désormais fondée sur l'utilisation du fusil. Nous devrions nous inspirer des tactiques mises en œuvre par d'autres nations lors des derniers conflits pour mieux appréhender ces changements."
 bhu_establish_muster_rolls:9 "Établir les Listes d'Appel"
 bhu_establish_muster_rolls_desc:0 "Traditionnellement, les nobles faisaient appel à chaque famille pour qu'elle désigne un homme valide qui s'engagerait comme soldat en temps de crise. Nous allons modifier ce système en demandant aux familles de désigner un fils qui rejoindra les rangs de nos réserves. Ces hommes constitueront l'essentiel de notre nouvelle armée moderne."
 bhu_marshalling_our_men:9 "Mobiliser nos Hommes"
 bhu_marshalling_our_men_desc:9 "Le rassemblement et la mobilisation de nos effectifs constituent une entreprise exigeante, qui met à rude épreuve nos capacités administratives et logistiques. Pourtant, notre nation ne peut être protégée sans protecteurs, et il vaut peut-être la peine de dépenser du capital politique et économique pour mettre davantage de fusils entre davantage de mains."
 bhu_lessons_in_logistics:9 "Leçons en Logistique"
 bhu_lessons_in_logistics_desc:9 "Une armée marche grâce à son ravitaillement, et dans une armée féodale comme la nôtre, cela signifie que les garde-manger situés le long de nos mouvements militaires seront inévitablement pillés. L'organisation des chaînes d'approvisionnement est une tâche ardue, mais de simples efforts visant à fournir aux soldats des rations de base peuvent les aider à mieux se battre, plus longtemps, tout en causant moins de dommages à la paysannerie locale."
 bhu_dust_off_stockpiles:9 "Maintenir les Réserves"
 bhu_dust_off_stockpiles_desc:9 "De nombreux seigneurs régionaux chérissent les fusils qu’ils possèdent, en entretenant avec soin des armes vieilles de plusieurs décennies, voire de plusieurs siècles. Nous devons appliquer à grande échelle ces principes, élaborés au fil des générations, qui se sont révélés si efficaces pour maintenir ces armes en état de marche. Chaque nouveau fusil doit être considéré comme un trésor inestimable, soigneusement réparé et entretenu."
 bhu_arms_by_necessity:9 "Armes par Nécessité"
 bhu_arms_by_necessity_desc:9 "Rares sont ceux qui souhaitent être considérés comme des pillards, et aucune nation ne veut avoir la réputation d’être un royaume de charognards. Pourtant, le besoin en armes modernes est grand, et il n’y a pas de meilleure occasion de se procurer un nouvel équipement que de piller le cadavre d’un ennemi vaincu. Nos armées devraient être renforcées par des bricoleurs ingénieux, capables de réutiliser les armes de nos ennemis à notre avantage."
 bhu_equipping_specialised_units:9 "Équiper des Cadres Modernes"
 bhu_equipping_specialised_units_desc:9 "Le peu d'équipement moderne qui parvient au Bhoutan est très clairsemé, et avidement accaparé par des particuliers qui le considèrent comme un bien précieux. En donnant à certains groupes de guerriers d'élite accès à des stocks plus importants d'équipement moderne, nous pouvons les utiliser comme spécialistes pour soutenir nos troupes régulières, plus hétéroclites."
 bhu_recruit_mountain_guides:0 "Recruter des Guides de Montagne"
 bhu_recruit_mountain_guides_desc:9 "Il y en a parmi nous pour qui les grands sommets sont leur foyer, qui connaissent les cols traîtres et les vallées cachées comme de vieux amis. Ces hommes détiennent des informations cruciales et feraient d’excellents guides pour nos armées, transmettant à la fois leur connaissance de notre terre natale et leur expertise en alpinisme à leurs compagnons d’armes."
 bhu_lords_of_the_passes:9 "Seigneurs des Cols"
 bhu_lords_of_the_passes_desc:9 "Le Bhoutan est notre patrie, et nous la connaissons bien. Chaque sentier étroit emprunté par les mulets recèle une embuscade potentielle, chaque vallée cachée est un campement inaccessible à nos ennemis. Nous cartographierons les zones frontalières, à la recherche de terrains stratégiques pour harceler les envahisseurs et de points d'étranglement que nous pourrons défendre au mieux."
 bhu_use_every_advantage:9 "Utiliser Chaque Avantage"
 bhu_use_every_advantage_desc:9 "Nous devrons compter sur le courage et la détermination de nos soldats pour pallier nos lacunes matérielles, en tirant parti de la reconnaissance pour combattre dans des conditions favorables et sur un terrain facile à défendre. Le recrutement d'éclaireurs chevronnés chargés de préparer le terrain pour nos forces nous aidera grandement à équilibrer les forces en présence."
 bhu_a_force_apart:9 "Une Nouvelle Force à Part"
 bhu_a_force_apart_desc:9 "Lors du passage des forces expéditionnaires britanniques au tournant du siècle, nous regardions leurs soldats de carrière avec admiration et envie. Aujourd’hui, nos forces d’élite font preuve d’une discipline et d’un savoir-faire qui feraient rougir de honte ces paons qui se pavanent."

