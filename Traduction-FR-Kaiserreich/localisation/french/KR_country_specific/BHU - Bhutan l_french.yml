 BHU_tt_smuggling_angry_1:9 "§RCes contrebandiers se méfient de plus en plus de notre fiabilité. Ils travailleront à contrecœur avec nous à l'avenir, mais s'en détourner une fois de plus aura des conséquences.§!"
 BHU_tt_smuggling_angry_2:9 "§RCes contrebandiers sont fatigués de notre manque de fiabilité. Refuser de leur répondre maintenant rompra notre relation définitivement.§!"
 BHU_tt_smuggling_chinese_strengthened:9 "Completing this decision halves the chance that our Chinese smuggling contacts run into trouble. If we complete both “§YForge Closer Ties with our Chinese Contacts§!“ and “§YStrengthen the Northern Smuggling Route§!“, our contacts will additionally provide us with 5 Artillery pieces, so long as they do not run into trouble."
 BHU_tt_smuggling_chinese_bribed:9 "Our Chinese smuggling contacts will no longer periodically demand higher prices for their wares. If we complete both “§YForge Closer Ties with our Chinese Contacts§!“ and “§YStrengthen the Northern Smuggling Route§!“, our contacts will additionally provide us with 5 Artillery pieces, so long as they do not run into trouble. §RWe cannot forge closer ties with our Indian and Chinese counterparts at the same time, so choose wisely!§!"
 BHU_tt_smuggling_indians_strengthened:9 "Completing this decision halves the chance that our Indian smuggling contacts run into trouble. If we complete both “§YForge Closer Ties with our Indian Contacts§!“ and “§YStrengthen the Southern Smuggling Route§!“, our contacts will additionally provide us with 5 Support Equipment, so long as they do not run into trouble."
 BHU_tt_smuggling_indians_bribed:9 "Our Indian smuggling contacts will no longer periodically demand higher prices for their wares. If we complete both “§YForge Closer Ties with our Indian Contacts§!“ and “§YStrengthen the Southern Smuggling Route§!“, our contacts will additionally provide us with 5 Support Equipment, so long as they do not run into trouble. §RWe cannot forge closer ties with our Indian and Chinese counterparts at the same time, so choose wisely!§!"
