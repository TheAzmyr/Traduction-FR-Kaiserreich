 BHU_tt_march_on_cheri:9 "§ONous commencerons notre marche contre le traître du Monastère de Cheri !§!\nNous ne pourrons plus compléter les priorités de préparation "§YSécuriser les Frontières§!", "§YSécuriser nos Dzongs§!" ou "§YRéorganiser la Garde Royale§!"."
 BHU_tt_march_on_cheri_short:9 "§ONous commencerons notre marche contre le traître du Monastère de Cheri !§!"
 BHU_tt_strengthened_zhabdrung_weapons:9 "§RCette caravane renforcera sûrement la position du Zhabdrung si nous l'affrontons au combat !§!"
 BHU_tt_end_of_the_revolution_unlocked:9 "La priorité '§YFin de la Révolution§!' est désormais disponible."
 BHU_tt_revolting_natpop_party_namechange:9 "Le parti §YNational-Populiste§! s'appellera désormais "§Y$BHU_revolting_natpop_party$§!"."
 BHU_tt_lost_authdem_coalition:9 "§RCette querelle récente entre les factions Traditionaliste et Réformiste a causé des dommages significatifs. Il faudra des actions décisives pour réconcilier les factions à l'avenir, quelle que soit notre réponse actuelle.§!"
 BHU_tt_namgyal_bahadur_warning:9 "§RNamgyal Bahadur est un vaillant guerrier, et sa bravoure comme sa force seront utiles si nous faisons face à un ennemi sur le champ de bataille. Il est profondément loyal envers Tshering Penjor, et soutiendra sûrement son patron s'il y est poussé.§!"
 BHU_tt_tshering_penjor_warning:9 "§RTshering Penjor est un commandant tenace, et son leadership expérimenté sera utile si nous faisons face à un ennemi. Il a cependant ses propres ambitions, et peu de loyauté envers l'héritage du roi Jigme.§!"
 BHU_tt_indecision_warning:9 "§RIl y a peu de choses aussi dangereuses que l'indécision. Si le Roi prend de plus en plus de temps à se préparer, mais n'agit jamais de manière décisive, il tombera sûrement lors du conflit à venir.§!"
 BHU_tt_indian_rumours_warning:9 "§RDes rumeurs effrayantes font part de soutiens indiens secrets derrière la révolte du Zhabdrung. Nous ne pouvons nous permettre de prendre ces accusations à la légère.§!"
 BHU_tt_trongsa_authority_warning:9 "§RTrongsa est le cœur du pouvoir et du contrôle de Wangchuck. Frapper là donnerait un coup au cœur de l'autorité du Roi.§!"
 BHU_tt_zhabdrung_zhung_dratshang_party_namechanges:9 "Le parti §YSocial-Conservateur§! s'appellera désormais "§Y$BHU_zhabdrungs_soccons_party$§!".\nLe parti §YAutocrate Paternaliste§! s'appellera désormais "§Y$BHU_zhabdrungs_pataut_party$§!".\nLe parti §YNational-Populiste§! s'appellera désormais "§Y$BHU_zhabdrungs_natpop_party$§!"."
 BHU_tt_zhabdrung_royalist_party_namechanges_and_popularity_shift:9 "Le parti §YDémocrate Autoritaire§! s'appellera désormais "§Y$BHU_zhabdrungs_authdems_party$§!".\nLe parti §YLibéral Économique§! s'appellera désormais "§Y$BHU_zhabdrungs_marlibs_party$§!".\n\n§RDe nombreux anciens §PTraditionalistes§! rejoindront la Résistance royaliste, convertissant un tiers de la popularité des $paternal_autocrat_coloured$ en popularité des $authoritarian_democrat_coloured$.§!"
 BHU_tt_reeling_in_radicals:9 "Nous saperons le pouvoir des moines radicaux avant que la situation ne nous échappe, convertissant la moitié de la popularité des $national_populist_coloured$ en popularité des $paternal_autocrat_coloured$.\n\nNe pas adopter cette priorité nationale assez rapidement pourrait entraîner des §rconséquences§! plus tard."
