### Characters ###
 BAY_ernst_toller:9 "Ernst Toller"
 BAY_ernst_toller_leader_desc:9 "§YNaissance :§! §L1er décembre 1893, à Samotschin, province de Posnanie, Royaume de Prusse, Empire allemand§!\n§YCarrière :§! §LErnst Toller est né dans une famille juive qui tenait un magasin général. Engagé comme volontaire pendant la Grande Guerre, il combattit à Verdun et fut décoré pour son courage, mais commença peu à peu à être déçu par la guerre. Il traversa une crise psychique et physique en 1916 et fut finalement déclaré inapte au service militaire en 1917, ce qui lui permit d’intégrer l’université Ludwig-Maximilien de Munich pour y étudier le droit et la philosophie.\n\nIl intégra le cercle littéraire d’Artur Kutscher et commença à sympathiser avec l’anarchisme. Grâce à ses contacts avec Max Weber, il put s’inscrire à l’université de Heidelberg où il rejoignit la Ligue de la jeunesse pour la politique culturelle, un mouvement en faveur de la paix. La publication par ce groupe d’une pétition pour la paix appelant au socialisme et à la fin des combats entraîna de sévères représailles.\n\nPar la suite, Toller se tourna vers le pacifisme et le socialisme révolutionnaire. Il se révéla être un écrivain et un poète extrêmement prolifique, abordant des thèmes tels que la révolution et l’expressionnisme. Il attira l’attention des services de renseignement socialistes étrangers lors de son séjour à Paris en 1934, puis en participant à un congrès d’écrivains à Paris en 1935. Il souffre de crises de dépression, mais semble avoir retrouvé une nouvelle énergie grâce à la victoire du socialisme et à l’appel à servir sa patrie dans sa reconstruction.§!"

 BAY_eugen_bolz:9 "Eugen Bolz"
 BAY_eugen_bolz_leader_desc:9 "§YNaissance :§! §L15 décembre 1881, à Rottenburg, district de la Forêt Noire, Royaume de Wurtemberg, Empire allemand§!\n§YCarrière :§! §LFils d'un marchand de biens coloniaux, Eugen Bolz rejoignit le Zentrum dans sa jeunesse. Il étudia le droit et servit comme procureur pendant quelques années avant de devenir lieutenant lors de la Grande Guerre.\n\nAprès la guerre, il entra en politique, grimpant dans les rangs du Zentrum et servant à divers postes. Il fut le premier catholique à devenir ministre-président du Wurtemberg, principalement protestant. A la suite de la défaite de l'Allemagne lors de la guerre, il a accepté à reculons de servir de chef à la Confédération d'Allemagne du Sud.§!"

 BAY_franz_von_epp:9 "Franz von Epp"
 BAY_franz_von_epp_leader_desc:9 "§YNaissance :§! §L16 octobre 1868, à Munich, Haute-Bavière, Royaume de Bavière§!\n§YCarrière :§! §LFils d'un peintre de Munich, Franz Epp fréquenta une académie militaire et combattit en Chine lors de la Rébellion des Boxers en 1900-1901, avant d'être envoyé en Afrique du Sud-Ouest allemande où il prit part à des atrocités coloniales. Au cours de la Grande Guerre, il commanda le Régiment d'Infanterie de la Garde royale bavaroise en France, en Serbie, en Roumanie et en Italie avec distinction - il fut adoubé Ritter von Epp en 1918.\n\nMembre du Parti populaire bavarois, il est également connu pour ses opinions d'extrême droite et ses liens avec le mouvement "Die Fronde" du général Max Bauer. Il était également un membre actif de la Société coloniale. Dans un retournement ironique des choses, c'est l'Allemagne qui a été conquise. Ne voyant aucune alternative, et blâmant probablement Berlin pour le désastre, il a accepté à reculons un rôle de leader du nouveau régime sud-allemand.§!"

