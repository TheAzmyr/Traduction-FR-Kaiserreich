### Characters ###
 BAY_ernst_toller:9 "Ernst Toller"
 BAY_ernst_toller_leader_desc:9 "§YBorn:§! §LDecember 1st, 1893, in Samotschin, Province of Posen, Kingdom of Prussia, German Empire§!\n§YBackground:§! §LErnst Toller was born to a Jewish family which ran a general store. A volunteer during the Great War, he fought in Verdun and was decorated for bravery but began to grow disillusioned with war. He suffered a mental and physical crisis in 1916 and was ultimately deemed unfit for military service in 1917, allowing him to enter Ludwig Maximilian University of Munich to study law and philosophy.\n\nHe entered into Artur Kutscher's literary circle and began to sympathise with anarchism. Thanks to his contacts with Max Weber, he was able to enroll in the University of Heidelberg where he joined the pro-peace Cultural Policy League of Youth. Their publication of a peace petition calling for socialism and the end of the fighting drew severe reprisals.\n\nAfter that, Toller turned towards pacifism and revolutionary socialism. He proved to be an extremely productive writer and poet, with themes of revolution and expressionism. He gained the attention of foreign socialist intelligence groups when he visited Paris in 1934 and later attended a writers congress in Paris in 1935. He suffers from bouts of depression, but appears re-energised by the victory of socialism and the call to serve his homeland in their reconstruction.§!"

 BAY_eugen_bolz:9 "Eugen Bolz"
 BAY_eugen_bolz_leader_desc:9 "§YBorn:§! §LDecember 15th, 1881, in Rottenburg, Black Forest District, Kingdom of Württemberg, German Empire§!\n§YBackground:§! §LBorn to a colonial goods merchant, Eugen Bolz joined the Zentrum Party as a youth. He studied law and served as a prosecutor for a few years before serving as a lieutenant during the Great War.\n\nAfter the war he entered politics, rising through the ranks of the Zentrum and serving in various roles. He became the first Catholic to become Minister President of the predominantly Protestant Württemberg. After Germany's defeat in the recent war, he reluctantly agreed to serve at the helm of the South German Confederation.§!"

 BAY_franz_von_epp:9 "Franz von Epp"
 BAY_franz_von_epp_leader_desc:9 "§YBorn:§! §LOctober 16th, 1868, in Munich, Upper Bavaria, Kingdom of Bavaria§!\n§YBackground:§! §LBorn to a painter in Munich, Franz Epp attended a military academy and fought in China during the Boxer Rebellion from 1900-1901 before being sent to German South-West Africa where he took part in colonial atrocities there. During the Great War he commanded the Royal Bavarian Infantry Lifeguards Regiment in France, Serbia, Romania, and Italy with distinction - knighted as Ritter von Epp in 1918.\n\nA member of the Bavarian People's Party, he was also known for his far right politics and his ties to General Max Bauer's \"Die Fronde\" movement. He was also an active member of the Colonial Society. In an ironic turn of events, Germany itself was conquered. Seeing little alternative, and perhaps blaming Berlin for the disaster, he has reluctantly accepted a role heading the new South German regime.§!"

