### Characters ###
 PRE_werner_scholem:9 "Werner Scholem"
 PRE_werner_scholem_leader_desc:9 "§YNaissance :§! §L29 décembre 1895, à Berlin, province de Brandebourg, Royaume de Prusse, Empire allemand§!\n§YCarrière :§! §LIl a rejoint le Parti socialiste (PS) en 1921, devenant un organisateur de plus en plus radical et un éditeur du Die Rote Fahne (Le Drapeau rouge). Scholem a fait face à un harcèlement important de la part du gouvernement, non seulement pour sa politique mais aussi par antisémitisme - ce qui a fait de lui une cible de divers groupes d'extrême droite. Néanmoins, la détermination de Scholem et d'autres acteurs du PS ont fait de lui un choix populaire des autorités socialistes d'occupation pour être nommé chef du nouveau gouvernement de Prusse.§!"

 PRE_albert_grzesinski:9 "Albert Grzesinski"
 PRE_albert_grzesinski_leader_desc:9 "§YNaissance :§! §L28 juillet 1879, à Treptow an der Tollense, Grand-duché de Mecklembourg-Schwerin, Empire allemand§!\n§YCarrière :§! §LFils illégitime d'une servante et d'un apprenti boucher, élevé par un charron, Grzesinski travailla comme métallurgiste à Berlin. Il devint membre de l'Union des Métallurgistes allemands (DMV) en 1897, un syndicat membre de la Fédération générale des Syndicats allemands (ADGB). Un an plus tard, il rejoignit le Parti social-démocrate (SPD) et devint chef syndical émérite et président du SPD local en quelques années.\n\nMembre respecté de l'aile droite du SPD, Grzesinski continua de grandir en influence politique dans divers rôles élus. Il a montré un intérêt particulier pour le maintien de l'ordre et les portefeuilles de l'intérieur, servant comme avocat de 1921 à 1922 et occupant divers rôles de police. Il était également passager du Graf Zeppelin en 1928. Les autorités d'occupation l'ont choisi pour diriger le nouveau gouvernement, considérant qu'il possède les connexions nécessaires en politique, dans les syndicats et en matière de sécurité pour maintenir l'ordre.§!"

 PRE_otto_hoetzsch:9 "Otto Hoetzsch"
 PRE_otto_hoetzsch_leader_desc:9 "§YNaissance :§! §L14 février 1876, à Leipzig, district de Leipzig, Royaume de Saxe, Empire allemand§!\n§YCarrière :§! §LFils d'un plombier et petit-fils d'un directeur de cour, Hoetzsch fréquenta l'université de Leipzig et l'université Ludwig Maximilian de Munich pour y étudier l'Histoire, l'Histoire de l'art et l'économie, obtenant un doctorat en 1900 sous la direction de Karl Lamprecht. Plus tard, il devint rédacteur des "Papiers académiques" de l'Association des Clubs étudiants allemands et travailla également comme bibliothécaire à l'Institut historique de Leipzig. Il était particulièrement fasciné par l'histoire de l'Europe de l'Est et l'histoire russe. Étudiant, il était également membre de l'Association des Étudiants allemands, antisémite, à Leipzig.\n\nA partir de 1906, il commença à enseigner, y compris à l'Académie de Guerre prussienne et à l'université de Berlin. Volontaire pour un an dans l'Armée saxonne peu avant la Grande Guerre, il passa le conflit au département de la presse étrangère de l'état-major général. Après la guerre, il continua de monter en grade dans l'académie et entra également en politique - rejoignant le Parti de la Partie allemand (DVLP) et servant au Reichstag. Polyglotte (ayant passé un examen d'interprète militaire en polonais et en russe ainsi qu'ayant étudié d'autres langues) précédemment sélectionné par le gouvernement allemand au cours de négociations avec la Russie et fondateur de la Société allemande pour l'Étude de l'Europe de l'Est, et bien qu'il soit un nationaliste allemand, il a appelé au rapprochement avec les États orientaux, ce qui lui a attiré les moqueries d'autres membres de l'extrême droite. Cela l'a sûrement aidé à obtenir un rôle important dans le nouvel ordre.§!"

 PRE_eitel_friedrich:9 "Eitel Friedrich von Preußen"
 PRE_eitel_friedrich_leader_desc:9 "§YNaissance :§! §L7 juillet 1883, au Marmorpalais de Potsdam, province de Brandebourg, Royaume de Prusse, Empire allemand§!\n§YCarrière :§! §LSecond fils de Wilhelm II, Eitel Friedrich fut éduqué à la Maison princière de Plön. Il servit comme commandant du 1er régiment de la Garde pendant la Grande Guerre avec distinction puis dans la 1ère division de la Garde sur les Fronts de l'Ouest et de l'Est. De plus, le prince était le Grand-Maître de l'Ordre (protestant) de Saint-Jean.\n\nSa vie après-guerre fut moins heureuse. On dit qu'il était affilié à divers groupes d'extrême droite, mais un scandale de corruption éclata, ce qui le conduisit à être écarté de tous les postes officiels. Son mariage avec Sophie Charlotte d'Oldenburg se révéla houleux, les tabloïds rapportant les affaires extra-conjugales de son épouse et plusieurs procès intentés contre eux eurent pour résultat la lecture publique de lettres d'amour - ce qui fut repris par la presse étrangère et le força à démissionner de son poste de Grand-Maître en faveur de son petit frère. Devenu la risée et le mouton noir de la famille, il se retira de la vie publique.\n\nL'effondrement de l'Allemagne a amené à la déposition des membres les plus importants de la famille. Incapables ou réticentes à les convaincre d'accepter un rôle (moindre) dans le nouveau gouvernement d'Allemagne de l'Est, les autorités d'occupation ont convaincu le prince rejeté et sans descendance d'accepter le rôle. Cette décision a été décriée comme une trahison par de nombreux membres de sa famille, mais il a justifié cette décision comme un mal nécessaire pour conserver le trône de Prusse dans la famille.§!"

