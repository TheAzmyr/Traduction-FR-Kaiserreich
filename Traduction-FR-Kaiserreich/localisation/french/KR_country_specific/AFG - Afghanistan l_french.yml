 AFG_shah_mahmud_khan:9 "Shah Mahmud Khan"
 AFG_shah_mahmud_khan_sic_desc:9 "§YBorn:§! §L1890, in Dehra, North-Western Provinces and Oudh, British India§!\n§YAllegiance:§! §zTelai Branch§!\n§YBackground:§! §LDespite being the youngest of the Musahiban brothers, Shah Mahmud Khan has certainly avoided being overshadowed by his elder siblings. Born alongside them in India as part of the Telai branch's exile, he spent much of his childhood away from Afghanistan, coming as quite a culture shock once the family were allowed to return.\n\nLike his brothers, he quickly fell into a military career, although rather than serving directly in the forces he instead found himself quickly leading the royal guard. After the assassination of Emir Habibullah, and Amanullah's accension to the throne, he was instead reassigned to gubernatorial positions throughout Afghanistan, where he soon learned how useful an open mind can be if used correctly.\n\nUnlike the other Musahiban brothers, he has shown little disdain for Amanullah and other members of the Seraj branch, perhaps owing to his less than troubled times underneath them. Rarely has Shah Mahmud been afraid to dissent from the oftentimes hegemonic views of his brothers, and he has been rather open about his more liberal views when it comes to matters such as Amanullah's Westernisation efforts. It would be a fatal mistake to however mistake this conciliatory nature as that of weakness, with Mahmud being quick to match the approach of his brothers if the time calls for it.§!"
 AFG_abdul_ahad_wardak: "Abdul Ahad Wardak"
 AFG_abdul_ahad_wardak_sic_desc:9 "§YBorn:§! §L1880, in Wardak, Kabul Vilayet, Emirate of Afghanistan§!\n§YBackground:§! §LAs a member of the Mayar Wardak tribe of Pashtuns from the eponymously named region, Abdul Ahad Wardak is one of the most powerful men in Afghanistan who is not a member of the Barakzai dynasty. Like many of Amanullah's allies, his rise began with his arrest after being implicated in the death of Amanullah's father. Those loyal to the new Emir quickly found themselves released, and soon assigned to important roles suitable for loyalists. After a few years in various gubernatorial and emissarial roles, the newly redesignated King appointed Wardak as Interior Minister, giving him a vital role in the King's many reforms.\n\nOwing to connections made in previous positions and years of effective work, Wardak has slowly been granted more and more responsibilities by the King, being the first go to for anything Amanullah needs doing. Whether it comes to managing internal affairs, relations with the Frontier, gathering funds for reform efforts, or even coordinating new telegraph lines; it all tends to pass through Wardak first before being further devolved to the lower rungs who carry out the tasks. Such importance has made him well known by those across the nation, although renown is perhaps a double edged sword in a government with many enemies.§!"
