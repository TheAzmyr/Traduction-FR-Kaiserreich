### Focuses ###

 AFG_quest_for_a_national_economy:9 "En Quête d'une Économie Nationale"
 AFG_quest_for_a_national_economy_desc:9 "Dire que notre économie est sous-développée serait un euphémisme. Une grande partie de notre population ne fait guère plus que pratiquer une agriculture et un élevage de subsistance. Si l’Afghanistan veut prendre part à la prospérité du XXe siècle, nous devons nous développer à partir de la base. Nous devons lancer des projets à l’échelle nationale visant à moderniser le niveau de vie des Afghans et à mieux nous préparer à entretenir des relations au-delà de nos frontières."
 AFG_complete_the_kabul_peshawar_railroad:9 "Compléter la Ligne [267.Controller.GetVictoryPointName_10737]-[442.Controller.GetVictoryPointName_12717]"
 AFG_complete_the_kabul_peshawar_railroad_desc:9 "Depuis notre acquisition du Pachtounistan, relier la ville de [267.Controller.GetVictoryPointName_10737] à la frontière instable est devenu une priorité absolue pour le gouvernement. L'achèvement de la ligne ferroviaire entre [267.Controller.GetVictoryPointName_10737] et [442.Controller.GetVictoryPointName_12717] contribuerait à moderniser les infrastructures, à dynamiser l'économie et à renforcer notre emprise sur le Pachtounistan grâce à une liaison directe facilitant le commerce et la mobilisation."
 AFG_towards_a_trans_afghan_railway:9 "Vers un Chemin de Fer Trans-Afghan"
 AFG_towards_a_trans_afghan_railway_desc:9 "Les nombreuses tribus et villages qui composent l'Afghanistan sont isolés et bien trop autonomes pour former une nation centralisée. La mise en place d'un réseau ferroviaire planifié de manière centralisée à travers le pays porterait atteinte à l'autonomie de ces régions, favorisant ainsi l'émergence de nouvelles communautés plus denses, qui se développeraient et se mélangeraient, tout en étant plus faciles à gouverner."
 AFG_diversify_transport_infrastructure:9 "Diversifier les Infrastructures de Transport"
 AFG_diversify_transport_infrastructure_desc:9 "Les Afghans sont depuis longtemps reliés entre eux sans avoir besoin d'infrastructures logistiques artificielles. En exploitant davantage les cours d'eau du pays et en améliorant les routes qui les relient, nous pourrions facilement relier une grande partie du territoire sans avoir à réaliser d'investissements coûteux et chronophages dans l'extension du réseau ferroviaire."
 AFG_taming_the_winter_capital:9 "Dompter la Capitale d'Hiver"
 AFG_taming_the_winter_capital_desc:9 "La ville de [267.Controller.GetVictoryPointName_10737] est perchée au sommet de notre étendue montagneuse, ce qui signifie que les hivers y sont rigoureux et ne conviennent pas à notre gouvernement. Heureusement, la prise de [442.Controller.GetVictoryPointName_12717] nous permet d'utiliser cette ville comme capitale alternative, grâce à son climat plus tempéré. Cela nous donnerait également un contrôle encore plus grand sur la province, plaçant ainsi tous les insurgés directement sous notre surveillance."
 AFG_crowning_the_kings_city:9 "Couronner la Ville du Roi"
 AFG_crowning_the_kings_city_desc:9 "Après des années d'efforts et de nombreux revers, la capitale s'impose aujourd'hui fièrement comme la plus grande ville du pays. Ce qui n'était au départ qu'une simple annexe de [267.Controller.GetVictoryPointName_10737] n'est plus qu'à un dernier effort de devenir un chef-d'œuvre autonome, guidé par la grande vision du roi Amanullah. Il est désormais temps de lui donner cet élan."
 AFG_rejection_of_rural_neglect:9 "Rejection of Rural Neglect"
 AFG_rejection_of_rural_neglect_desc:9 "Out of fear of the backlash from local tribes, the Kingdom of Afghanistan has left much of the country to govern itself. As a result, many communities are stricken with poverty, backwardness, and lack basic resources. We must reverse this policy of neglecting our countryside, and begin implementing programmes to centrally modernise our rural regions, and bring much-needed prosperity to our people."
 AFG_develop_the_herat_crossing:9 "Develop the [415.Controller.GetVictoryPointName_4893] Crossing"
 AFG_develop_the_herat_crossing_desc:9 "The city of [415.Controller.GetVictoryPointName_4893] sits on the western end of Afghanistan, acting as a gateway between Persia and Central Asia to India. Capitalising on Herat's location through expanding its size and infrastructure would undoubtely mean prosperity for the rest of Afghanistan, and open the door for both diplomatic and economic opportunies with Persia."
 AFG_turkestan_infrastructure_projects:9 "Projets d'Infrastructure du Turkestan"
 AFG_turkestan_infrastructure_projects_desc:9 "Le nord de l'Afghanistan abrite de nombreux peuples que nos voisins turcophones considèrent comme leurs frères. Malheureusement pour nous, leur isolement et leurs différences culturelles ont conduit bon nombre d'entre eux à s'allier pour renverser notre gouvernement. La construction de routes et de chemins reliant ces communautés au reste du pays contribuera à améliorer leurs conditions de vie et nous aidera à nous mobiliser contre ceux qui restent ingrats."
 AFG_inviting_additional_architects:9 "Inviting Additional Architects"
 AFG_inviting_additional_architects_desc:9 "[267.Controller.GetVictoryPointName_12769]'s construction has taken many years, but it has put us in contact with some of the best architects we could find. While we continue work on our capital city, we should invite more engineers and architects to help us modernise the rest of the nation. These projects will help endow our people with a sense of national pride and declare to the world that Afghanistan is a major power."
 AFG_harness_the_chak:9 "Harness the Chak"
 AFG_harness_the_chak_desc:9 "In the mountainous province of Wardak lies the village of Chak, which sits at the convergence of the [267.Controller.GetVictoryPointName_10737] and Lorgar Rivers. The Lorgar River can at times be unpredictable and out of control, making Chak the perfect place for a regulatory hydroelectric dam, thanks to its proximity to [267.Controller.GetVictoryPointName_10737]. Building this dam would provide our largest city with a significant source of electricity."
 AFG_swat_hydroelectric_developments:9 "Swat Hydroelectric Developments"
 AFG_swat_hydroelectric_developments_desc:9 "The Swat River in Pashtunistan has immense potential for the construction of hydroelectric projects. The constructions of dams and levees will support greater development of the area and create jobs, in which more loyal citizens can settle and increase our level of control over the frontier province."
 AFG_modernise_the_kariz:9 "Moderniser les Kariz"
 AFG_modernise_the_kariz_desc:9 "Une grande partie de notre population dépend des kariz, d’anciens réseaux d’aqueducs souterrains, pour son approvisionnement en eau. Si les kariz ont toujours été un moyen fiable d’alimenter en eau les petites communautés, la croissance démographique exige désormais que des améliorations soient apportées. Nous construirons des puits tubulaires dans les zones où les surfaces à irriguer sont plus étendues, et nous étendrons les kariz aux régions du pays où l’eau se fait rare."
 AFG_national_electrification_campaign:9 "Campagne Nationale d'Électrification"
 AFG_national_electrification_campaign_desc:9 "L'électricité est pratiquement inexistante en dehors de nos grandes villes, ce qui signifie que beaucoup utilisent encore des méthodes obsolètes pour éclairer les bâtiments. Nous devons entamer la construction de réseaux électriques afin de desservir davantage de zones rurales et lancer le processus d'électrification. Ainsi, notre population n'aura plus à compter sur des lampes à pétrole, mais pourra compter sur notre gouvernement central."
 AFG_the_dawn_of_afghan_capital:9 "La Naissance du Capital Afghan"
 AFG_the_dawn_of_afghan_capital_desc:9 "Grâce aux efforts ingénieux d’Abdul Majid Zabuli, l’Afghanistan dispose désormais d’une banque fiable et prospère, la Bank-i-Milli. Zabuli a également créé plusieurs entreprises florissantes sur le plan financier, ouvrant ainsi la voie à de nouvelles opportunités. Nous devons encourager cette réussite en développant la banque, en accordant des monopoles aux entreprises performantes et en offrant à nos commerçants la possibilité d’investir dans de nouvelles initiatives."

 AFG_nationhood_in_the_20th_century:9 "La Nation au XXe Siècle"
 AFG_nationhood_in_the_20th_century_desc:9 "Comment définir l'Afghanistan ? S'agit-il d'un domaine appartenant aux rois et aux émirs de l'histoire ? D'un ensemble de tribus dispersées et en conflit les unes avec les autres ? Présenter l'une ou l'autre de ces affirmations comme réponse risque d'engendrer la division et la confusion. Il est de notre responsabilité de définir l'Afghanistan d'une manière qui transcende ces identités superficielles et qui trace une voie d'avenir reconnaissant l'unité nationale de notre peuple, quel qu'il soit."
 AFG_renovation_of_the_defence_ministry:9 "Rénovation du Ministère de la Défense"
 AFG_renovation_of_the_defence_ministry_desc:9 "À l'heure actuelle, le ministère de la Défense, tout comme l'armée afghane, a cruellement besoin d'être réformé. Heureusement, de jeunes officiers de l'armée ont proposé un plan visant à centraliser et à réformer le ministère de la Défense, ce qui contribuerait à renforcer les liens entre le gouvernement et l'armée, au détriment de l'autonomie des milices tribales. Cela devrait donner à notre gouvernement une marge de manœuvre bien nécessaire pour mener à bien les réformes civiles et militaires."
 AFG_further_administrative_reach:9 "Further Administrative Reach"
 AFG_further_administrative_reach_desc:9 "Reliance on local tribal authority to govern is no longer a viable option. Afghanistan needs to dramatically expand its bureaucratic apparati if we want to unify this country and fight corruption. This means hiring even more census takers, tax collectors, auditors, and providing them with the authority to collect information and resources necessary to get an accurate understanding of the entire nation."
 AFG_budding_security_state:9 "Budding Security State"
 AFG_budding_security_state_desc:9 "With the reformation of our Army underway and our establishment of a proper civilian Defence Ministry, Afghanistan now has the groundworks necessary for establishing an internal security force. We may soon begin to keep tabs on our enemies, infiltrate foreign adversaries, and, if necessary, utilise our power to eliminate potential threats as we see fit."
 AFG_emulating_foreign_policing:9 "Emulating Foreign Policing"
 AFG_emulating_foreign_policing_desc:9 "Currently, law enforcement in Afghanistan is overreliant on local tribes keeping their people in line with whatever means they deem fit. If we are to govern effectively, our law enforcement needs to be standardised and professional. Luckily, there are many countries out there with effective and respectable police forces we can take inspiration from."
 AFG_founding_an_information_ministry:9 "Founding an Information Ministry"
 AFG_founding_an_information_ministry_desc:9 "All decisions and governance relies on information, and if this information is inaccurate, then so is our governing ability. With our expanding state apparatus, we can establish a Ministry of Information, where our government can collect and publish data, announcements, and any information necessary for effective administration. The Ministry will also double as a counter to false narratives peddled by internal enemies, ensuring the totality of truth."
 AFG_expand_military_governance:9 "Expand Military Governance"
 AFG_expand_military_governance_desc:9 "Our centralisation efforts have left us with numerous offices and positions that need to be manned by loyal civil servants. At the same time, the lack of respect and opportunity for our military leaves us with a glut in recruitment. We will address both issues by placing officers in civil servant positions, helping ensure our control over local government while presenting the armed forces as an opportunity for stablity and pride."
 AFG_seeking_alternate_foreign_investment:9 "Seeking Alternative Foreign Investment"
 AFG_seeking_alternate_foreign_investment_desc:9 "While Afghanistan may have ample opportunities for development and investment, it sadly does not have the capital to see these ventures through. To remedy this, we shall provide foreign investors with opportunities to invest in Afghanistan's burgeoning economy, and undermining our reliance on tribal economics."
 AFG_reverse_the_economic_ministrys_decay:9 "Reverse the Economic Ministry's Decay"
 AFG_reverse_the_economic_ministrys_decay_desc:9 "The stagnant and backwards economy of Afghanistan has left our economic ministry in a sorry state. If we are to continue enacting policies to foster economic growth and modernisation, our government cannot do so without a functioning economic ministry. Giving this ministry the authority to regulate industries and investments will bode well for future economic endeavors."
 AFG_establish_the_bank_of_afghanistan:9 "Établir la Banque d'Afghanistan"
 AFG_establish_the_bank_of_afghanistan_desc:9 "The financial and monetary situation of Afghanistan is a convoluted mess of tribal tributes. The economy of Afghanistan needs a proper distributor of capital and currency in order to function. Luckily, entrepreneur Abdul Majid Zabuli has already established the largest bank in Afghanistan, the Bank-i-Milli. If we grant the Bank-i-Milli the authority to regulate and distribute currency, we can begin the process of modernising our monetary system."
 AFG_prioritise_economic_liberalisation:9 "Prioritise Economic Liberalisation"
 AFG_prioritise_economic_liberalisation_desc:9 "While our government-sponsored economic initiatives are successful and forward-thinking, we cannot rely on authority alone to grow the economy. We must begin deregulating various industries and fostering private investments in our economy, so that our citizens may build their own wealth, and in turn build the wealth of our entire nation."
 AFG_building_civilian_institutions:9 "Building Civilian Institutions"
 AFG_building_civilian_institutions_desc:9 "The power of our military and our state has grown to impressive levels, but the overreliance on force to govern can result in catastrophic backlash if mishandled. Therefore, to ensure peaceful governance and compliance, we will begin to have different positions and administrative institutions be locally decided, to prevent the fostering of antigovernment activities."
 AFG_forming_the_transport_ministry:9 "Forming the Transport Ministry"
 AFG_forming_the_transport_ministry_desc:9 "With the continuing modernisation of our infrastructure underay, we are in need of an insitution that can govern and regulate our infrastructure. We shall establish a transport ministry with authority over the roads, railways and logistics of transport within Afghanistan, ensuring that we have control over our own forms of travel and can expand if necessary."
 AFG_decentralised_state_revenue:9 "Decentralised State Revenue"
 AFG_decentralised_state_revenue_desc:9 "Our military administration has full authority over local governments, and is loyal to the national government. As a sign of faith and goodwill to our citizens, we shall grant them autonomy in the collecting and spending of taxes, provided that they are with the consent of our military administrators."
 AFG_centralised_taxation_systems:9 "Centralised Taxation Systems"
 AFG_centralised_taxation_systems_desc:9 "Although significant efforts have been made to fully establish a central modern system for tax collection, we still rely heavily on outdated methods that often see vital revenue falling through the cracks, a threat posed both by those not wishing to pay but also those sent to collect their taxes. Further efforts towards a centralised system with modern methods of bookkeeping and revenue extraction must be prioritised to fund the rest of the government."
 AFG_priorities_of_the_education_ministry:9 "Priorités du Ministère de l'Éducation"
 AFG_priorities_of_the_education_ministry_desc:9 "The primary functions of administrative and governing institutions would fall apart if the education of our citizens was insufficient. Therefore, it is of the upmost priority of our Education Ministry to ensure we have institutions that are able to provide our leadership with the education and knkowledge necessary to run the country. We must determine the course of action in providing this education."
 AFG_found_the_university_of_kabul:9 "Fonder l'Université de [267.Controller.GetVictoryPointName_10737]"
 AFG_found_the_university_of_kabul_desc:9 "[267.Controller.GetVictoryPointName_10737]'s status as the largest city in Afghanistan and our former capital make it the perfect location for a modern University. Here in [267.Controller.GetVictoryPointName_10737], partnered with universities around the world, the future leaders of our nation will receive the best education they can, and in turn bring to Afghanistan the fruits of their knowledge."
 AFG_rely_on_edwardes_and_islamia:9 "S'appuyer sur Edwardes et Islamia"
 AFG_rely_on_edwardes_and_islamia_desc:9 "The College of Edwardes and Islamia in [442.Controller.GetVictoryPointName_12717] are already the perfect university for Afghans to receive a modern education. There is little need to replace these already great institutions with something new, when we can instead prioritise their expansion to benefit all those in need of higher education."

 AFG_royal_army_reform_of_1936:9 "Réforme de l'Armée Royale de 1936"
 AFG_royal_army_reform_of_1936_desc:9 "If the past decade has shown us anything, it is that a strong modern army will be needed to enforce the King's will in spite of the nation's many detractors. Taking the needed steps towards building such an army is however bound to be rather controversial..."
 AFG_armies_of_personality:9 "Armées de Personnalités"
 AFG_armies_of_personality_desc:9 "An effective officer class is a necessity for a modern army, after all we can hardly expect every order to come directly from [AFG.Capital.GetCapitalVictoryPointName] in the heat of battle. We must therefore shift our focus towards building such a class of dedicated officers, especially putting much greater stock into promoting officers based on merit, rather than personal status."
 AFG_contributions_of_tribal_militias:9 "Contributions des Milices Tribales"
 AFG_contributions_of_tribal_militias_desc:9 "It is impossible to win a war without soldiers to fight it, and historically the Afghan state has always relied upon its relationships with tribal leaders, to whom the issue of recruitment had been devolved. Even with the introduction of conscription by King Amanullah, these leaders still play a vital role in recruitment, but nothing lasts forever, and it is time to consider whether this role is one that should be phased out."
 AFG_attracting_western_army_aid:9 "Attracting Western Army Aid"
 AFG_attracting_western_army_aid_desc:9 "It would be absurd for us to attempt to catch up with the great armies of the world entirely on our own, and it would be equally foolish to not take advantage of the great powers who are amicable towards us, who have large amounts of military surplus almost begging to find a new home."
 AFG_modern_training_methods:9 "Méthodes d'Entraînement Modernes"
 AFG_modern_training_methods_desc:9 "Many of the fundamentals of warfare have found themselves cast in doubt ever since the world first found itself plunged into a global war a few decades ago, yet much of our army is still trained as though it were the 19th century. Taking cues from the Russians and the Germans, we should reevaluate our training methods and ensure that our troops are based on modern concepts rather than outdated ideals."
 AFG_combined_arms_experiments:9 "Combined Arms Experiments"
 AFG_combined_arms_experiments_desc:9 "Gone are the days where a few cannons and men on horseback with lever action rifles was all you needed to win a war. Wars these days are being fought more and more with air power, something we experienced first hand with the rebellion in 1929. We need to ensure that if the time comes where we face a similar threat in future our men are trained to properly fight underneath the wings of our bombers."
 AFG_utilise_the_kohat_arms_industry:9 "Utilise the Kohat Arms Industry"
 AFG_utilise_the_kohat_arms_industry_desc:9 "If one thing is true of untamed frontiers, there is always a need for firearms, and the people of Kohat have for many years now produced local copies of foreign arms to meet the armament demands of the locals. Far from a few men in sheds, these operations have become almost professional in nature, especially as things deteriorated in India. With official backing, these small factories could easily develop into a national arms industry for the nation."
 AFG_upholding_professional_standards:9 "Upholding Professional Standards"
 AFG_upholding_professional_standards_desc:9 "It is one thing to have standards for your army, and it is another to actually apply them in practice. Without proper discipline measures and rule enforcement, the men of our army will easily run wild, a rather dangerous affair when it comes to sustained warfare, and something we must ensure does not happen."
 AFG_arsenals_of_kandahar_and_herat:9 "Arsenaux de Kandahar et Hérat"
 AFG_arsenals_of_kandahar_and_herat_desc:9 "Afghanistan is not just [AFG.Capital.GetCapitalVictoryPointName] and its surrounding settlements, yet much of the existing army infrastructure seems to act like it is. It is important that we spread our armouries and stockpiles out to the western cities, so that our army can continue to operate even if the capital were to fall."
 AFG_afghan_supply_corps:9 "Afghan Supply Corps"
 AFG_afghan_supply_corps_desc:9 "With how much equipment and supplies are needed to sustain a modern military campaign, one cannot expect to supply an armed force with just whatever can be requisitioned locally. Centralised networks, running back to the capital, must be established and maintained, especially if we ever wish to capitalise on opportunities to expand the Afghan state."
 AFG_advanced_communication_systems:9 "Advanced Communication Systems"
 AFG_advanced_communication_systems_desc:9 "While bad for the continued employment of couriers riding on the back of ponies, the invention of radio has been a marvellous breakthrough for communications across the globe. More than just a novelty for the elite of [AFG.Capital.GetCapitalVictoryPointName], radios are affordable enough nowadays to be rolled out to much of our army, greatly improving our communication abilities."
 AFG_strongholds_of_the_hindu_kush:9 "Strongholds of the Hindu Kush"
 AFG_strongholds_of_the_hindu_kush_desc:9 "The mountains of the Kush range have long protected Afghanistan, funnelling our enemies through the narrow Khyber Pass. Any invasion from the west must pass through it to get to [267.Controller.GetVictoryPointName_10737], and such a natural chokepoint can easily be made nigh impregnable by building fortifications throughout it."
 AFG_building_conscription_infrastructure:9 "Building Conscription Infrastructure"
 AFG_building_conscription_infrastructure_desc:9 "While a rather controversial measure, conscription is necessary for a modern army to function. Even with its implementation in past years, its effectiveness has been limited by constant draft dodging and corrupt officials allowing it to happen. We must focus on mitigating the ability for this corruption to even happen in the first place, through a wide range of improvements such as better record keeping and better policing methods."
 AFG_favour_foreign_instructors:9 "Favour Foreign Instructors"
 AFG_favour_foreign_instructors_desc:9 "While home grown officers are important, nothing can truly beat the expertise foreign experts can impart upon an army, especially those who have significant training and real world experience with combat. The wisdom of these advisors should be paramount for our military doctrines, as they ultimately know best."
 AFG_prioritise_afghan_officers:9 "Prioritise Afghan Officers"
 AFG_prioritise_afghan_officers_desc:9 "Nobody knows how to fight a war in Afghanistan better than the Afghans, and no level of experience or fancy education can trump that. The priority of our officer corp should be to further the education and training of our best men, who will lead our troops today and impart their wisdom on the soldiers of tomorrow."
 AFG_expanding_the_royal_airforce:9 "Expanding the [GetRoyalOrRepublicanCap] Airforce"
 AFG_expanding_the_royal_airforce_desc:9 "Built from planes acquired from the Russians and the British, Afghanistan's airforce is still rather small and humble, but certainly a good starting point. While it is unlikely to reach the heights of the forces of those whose planes kickstarted it, with enough support it could evolve into the largest and most effective airforce in our region of the world."
 AFG_ahmad_shah_airfield:9 "Aéroport Ahmad Shah"
 AFG_ahmad_shah_airfield_desc:9 "Much like it is pointless to maintain a navy without suitable ports, it is equally pointless to maintain an airforce without suitable bases for them to be stationed. There are multiple spots just outside [267.Controller.GetVictoryPointName_10737] that would be perfect for the construction of such a base, one that shall hopefully be a great improvement over the current tiny airstrips on which we rely."
 AFG_pilot_training_schemes:9 "Pilot Training Schemes"
 AFG_pilot_training_schemes_desc:9 "Historically our airforce has been staffed almost entirely by Russian pilots, enticed into our service with generous payment and endorsement from their state. We cannot however rely on this arrangement forever, especially as more and more Russian pilots find themselves needed to defend the homeland. We must therefore turn our attention to training our own pilots, even if it may take an accident or two to get the hang of it."

 AFG_anarchy_in_afghanistan:9 "Anarchie en Afghanistan"
 AFG_anarchy_in_afghanistan_desc:9 "Alors même que les redoutables Saqqawistes venaient enfin d'être repoussés pour de bon, un nouveau conflit a éclaté. Le roi Amanullah Khan est revenu de Berlin pour s'opposer à la tentative d'usurpation du pouvoir de Nadir. Non contents de se contenter d'enterrer les morts, les deux rois se sont lancés dans une nouvelle guerre civile sanglante qui décidera du sort de l'Afghanistan."
 AFG_the_conquering_hero:9 "Le Héros Conquérant"
 AFG_the_conquering_hero_desc:9 "In Afghanistan's hour of need, it was Mohammad Nadir Shah who defended her, not the craven Amanullah. While Amanullah flouted his way through Europe, and his son failed in his duties, Nadir saved the nation from the pillaging bandits. Now, he must once again defend his kingdom from those who would ruin it with decadence and cowardice."
 AFG_the_true_king:9 "Le Véritable Roi"
 AFG_the_true_king_desc:9 "In the midst of his education on the modern world, Amanullah Khan has found himself betrayed by his own family, as his ancestors once warned would happen. Now, a usurper sits upon his throne, threatening to undo all of Amanullah's work by turning Afghanistan into a backwards domain. If Afghanistan is to endure, Amanullah must be returned to his rightful place as her King!"
 AFG_put_faith_in_the_army:9 "Avoir Foi dans l'Armée"
 AFG_put_faith_in_the_army_desc:9 "Before Nadir was King of Afghanistan, he was the leader of her Royal Army. Who better to turn to for support than the men who fought and bled alongside the King in our country's hour of need? We must call upon our military allies to help expel the decadent Amanites."
 AFG_secure_ambivalent_generals:9 "Secure Ambivalent Generals"
 AFG_secure_ambivalent_generals_desc:9 "While the Royal Army knows where its loyalties lie, there are some within who have their doubts. We must reassure them of Nadir Shah's legitimacy and the righteousness of our cause, either through persuasion, the calling of favours, or the use of force. If that proves insufficient, we have many friends who are overdue for promotions."
 AFG_sever_the_branches:9 "Sever the Branches"
 AFG_sever_the_branches_desc:9 "With our superior military intelligence and resources, we can begin to intercept and isolate Amanite forces more effectively. We will soon be turning entire fronts into pockets, and wiping those pockets of traitors off the face of the Earth."
 AFG_turn_to_the_tribes:9 "Turn to the Tribes"
 AFG_turn_to_the_tribes_desc:9 "The neutrality of the numerous tribes that make up Afghanistan means untapped sources for allies in this civil war. Through a series of bribes, threats, and promises, we can secure ourselves with a number of competent and loyal warriors that will turn the tides of this civil war."
 AFG_patronage_intelligence_networks:9 "Patronage Intelligence Networks"
 AFG_patronage_intelligence_networks_desc:9 "People talk, they always have. Not even a singular armed soldier can walk through a village without at least one person being willing to gossip about it, especially to those they defer to. By utilising connections throughout the realm, we can easily turn the talk of our towns into practical information gathering networks, letting us know exactly what the Amanites are up to at all times."
 AFG_absorbing_the_anti_amanites:9 "Absorbing the Anti-Amanites"
 AFG_absorbing_the_anti_amanites_desc:9 "Although the Saqqawists were little better than desire driven savages, it would be foolish to simply chalk up everyone involved as simply wishing to loot and pillage. Many rode under the Saqqawist banner to rid the realm of Amanullah's blasphemy, a cause we now ironically represent, and as such it should not be hard to convince them to fight for a new banner instead."
 AFG_win_over_the_ghilji:9 "Win over the Ghiljī"
 AFG_win_over_the_ghilji_desc:9 "The Ghilji are one of the largest tribes of Afghanistan, with many finding themselves neutral in the ongoing conflict. Whoever secures their support should have a significant advantage of both men and resources in this struggle for the throne. The promise of patronage and the protection of their traditions and customs should be sufficient in winning them over, and can pave the way for further reforms in the future."
 AFG_the_khost_stronghold:9 "The Khost Stronghold"
 AFG_the_khost_stronghold_desc:9 "We have received credible information that Nadir plans to move on the city of Khost in a major offensive. Now that we have been blessed with this foresight, we can properly prepare the city for the traitor's attack, and shatter his army against our defences."
 AFG_call_upon_amanite_allies:9 "Call Upon Amanite Allies"
 AFG_call_upon_amanite_allies_desc:9 "Nadir's overconfidence in his ties to the Royal Army shall be his undoing. Contrary to his beliefs, there are many within the military and government who sympathise with us, for our modernisation efforts or through personal loyalty. Calling upon these loyalists will give us an edge against the unsuspecting usurper, and will catch his forces off guard."
 AFG_loyalty_of_the_hazara:9 "Loyalty of the Hazara"
 AFG_loyalty_of_the_hazara_desc:9 "While Amanullah might be the rightful King of Afghanistan, there is another king in the realm almost as legitimate. That man is Amin Jan, Amanullah's half brother, and the so called \"King of the Hazara\". Half Hazara on his mother side and a frequent defender of them, Amin Jan commands the respect of most Hazara leaders, and if given the order will lead them into battle under his brother's banner."
 AFG_gathering_foreign_support:9 "Gathering Foreign Support"
 AFG_gathering_foreign_support_desc:9 "Amanullah's time abroad has exposed him to the modern, civilised world. Luckily for him, there are many nations and peoples who would love to see Afghanistan join them in civilisation. In exchange for preferences and priorities from the Afghan government, we can secure international support for our cause."
 AFG_secure_the_khyber:9 "Secure the Khyber"
 AFG_secure_the_khyber_desc:9 "The Khyber is one of the most famous and easily defended parts of Afghanistan. By occupying the Khyber pass, we can directly prevent any support for Nadir that may originate from outside the country, and starve him like the rat he is."

 AFG_return_of_the_king:0 "Le Retour du Roi"
 AFG_return_of_the_king_desc:9 "Amanullah once again sits atop his throne, this time perched on a mountain of traitors. The rightful ruler of Afghanistan has returned, and has vanquished the enemies of the nation. Now, Amanullah can truly begin to bring Afghanistan into the twentieth century!"
 AFG_crushing_saqqawist_remnants:9 "Crushing Saqqawist Remnants"
 AFG_crushing_saqqawist_remnants_desc:9 "The Saqqawists have been a consistent thorn in the side of the King for years. Several attempted uprisings, insurgent movements, and even the support for a backwards pretender. We will not suffer their presence amongst our Turkic subjects any longer: they must be wiped out."
 AFG_dealing_with_the_traitors:9 "Dealing with the Traitors"
 AFG_dealing_with_the_traitors_desc:9 "Far too many within our military and our royal government sided with Nadir Khan in our hour of need. Amanullah has no use for these traitors and sycophants of regression, and has put measures into place to deal with them. They will stand trial for their betrayal of the King and his people, where they will subsequently be dealt with in a permanent manner."
 AFG_destroying_the_mojadidis:9 "Destroying the Mojadidis"
 AFG_destroying_the_mojadidis_desc:9 "Of the Ulema who stand in the way of our modernisation efforts, the Mojadidi family is the most dangerous. Rallying support amongst fanatics to weaponise Islam against King Amanullah, himself a faithful servant of Allah, the Mojadidis committed the ultimate betrayal with their support for the pretender Nadir. We now have a chance to silence these troublesome scholars once and for all."
 AFG_protection_against_radicalism:9 "Protection Against Radicalism"
 AFG_protection_against_radicalism_desc:9 "In our efforts to modernise Afghanistan, we admittedly partook in the involvement of rather... destabilising figures within our government. Republicans, atheists, revolutionary sympathisers, these men are a step too far. A modern Afghanistan does not need to throw away her defining qualities, and as such, these radicals must go."
 AFG_rebuild_ties_with_the_ulema:9 "Rebuild Ties with the Ulema"
 AFG_rebuild_ties_with_the_ulema_desc:9 "When Amanullah began his modernisation efforts, it was to save Afghanistan from obscurity and backwardsness. In our efforts, the Ulema called for reason and piety to guide us, and we foolishly chose to ignore them. We must reach out to these holy men, and admit to them that we need their guidance more than ever, to ensure Afghanistan never strays from His will again."
 AFG_good_king_bad_boyars:9 "Good King, Bad Boyars"
 AFG_good_king_bad_boyars_desc:9 "King Amanullah always had the best interests of Afghanistan in his heart. Alas, early in his reign, those he trusted to modernise the country have turned out to be degenerates and apostates. Luckily, the people of Afghanistan recognise Amanullah was misrepresented in his rule by these men. We must show them that the King deserves their trust, and get rid of the rot."
 AFG_restoring_darulaman:9 "Restaurer [267.Controller.GetVictoryPointName_12769]"
 AFG_restoring_darulaman_desc:9 "Des années de progrès dans la plus belle capitale de l'Afghanistan, et une guerre civile a failli tout réduire à néant. Pourtant, [267.Controller.GetVictoryPointName_12769] est toujours debout, témoignant de sa force et de sa résilience, ainsi que de celles d’Amanullah. À l’image de l’Afghanistan, [267.Controller.GetVictoryPointName_12769] sera reconstruite et plus forte que jamais, un exemple éclatant de notre nation moderne !"

 AFG_an_end_to_the_chaos:9 "La Fin du Chaos"
 AFG_an_end_to_the_chaos_desc:9 "Enfin, le règne d’Amanullah est assuré. Les ennemis de l’Afghanistan ne nous poignarderont plus dans le dos, car ils ont tous été vaincus. Le destin de l’Afghanistan repose entièrement entre les mains du roi, voué à une grandeur qu’aucune autre nation au monde ne peut atteindre."
 AFG_the_pearl_of_the_east:9 "La Perle de l'Orient"
 AFG_the_pearl_of_the_east_desc:9 "L'Afghanistan ne sera plus considéré comme un royaume montagneux arriéré. Cette nation autrefois isolée et féodale s'impose désormais comme un État moderne, guidé par la raison. Le roi Amanullah ne s'arrêtera pas là, car il voit dans la destinée de l'Afghanistan celle d'un phare du progrès, un modèle que ses voisins pourront suivre, établi par le roi lui-même. Que le travail commence !"
 AFG_formation_of_the_national_assembly:9 "Formation de l'Assemblée Nationale"
 AFG_formation_of_the_national_assembly_desc:9 "Les nombreux peuples d'Afghanistan ont, au cours de l'histoire, toujours été les sujets d'un roi ou d'un émir. Cela ne sera désormais plus la norme. Les citoyens ne sont plus des sujets, mais les citoyens d'une nation moderne. À ce titre, ils méritent une représentation à la hauteur d'une gouvernance moderne. Il est temps de mettre en place un véritable organe législatif, l'Assemblée nationale."
 AFG_the_monarcho_party_state:9 "The Monarcho-Party State"
 AFG_the_monarcho_party_state_desc:9 "With the King's blessing, the country has moved away from rule by royal decree. However, the guidance of the King is still a necessity: after all, it was King Amanullah who modernised Afghanistan, not the people. As such, we shall establish a party to represent the interests of the King, that will guide Afghanistan through this new era."
 AFG_lead_the_fight_against_authoritarianism:9 "Mener la Lutte contre l'Autoritarisme"
 AFG_lead_the_fight_against_authoritarianism_desc:9 "Trop nombreux sont les ennemis de l'Afghanistan qui ont recouru à la force brutale pour asseoir leur pouvoir : les Nadiristes, les Saqqawistes, et bien d'autres encore. Le roi Amanullah comprend mieux que tout autre dirigeant les dangers de la brutalité autoritaire, et il saura préserver la nation de tout démagogue ou autocrate potentiel. Après tout, il incombe au roi de garantir l'équité et la représentation sur l'ensemble du royaume."
 AFG_healing_the_scars_of_the_realm:9 "Guérir les Plaies du Royaume"
 AFG_healing_the_scars_of_the_realm_desc:9 "En pleine guerre et en pleine période de réformes, le roi s'est retrouvé confronté à de nombreux groupes mécontents à travers le pays. Cela n'a jamais été son intention, mais simplement une conséquence des mesures extrêmes prises en ces temps difficiles. Une période de réconciliation et d'apaisement doit désormais s'ouvrir, au cours de laquelle tous ceux qui auraient pu être négligés par leur roi se verront tendre la main de l'amitié."
 AFG_the_economic_independence_plan:9 "Le Plan d'Indépendance Économique"
 AFG_the_economic_independence_plan_desc:9 "Le fait de miser sur les investissements étrangers pour moderniser l’Afghanistan était une idée de génie, car cela a permis d’introduire de nouvelles industries et d’apporter de la richesse au pays. Cependant, nous ne sommes pas aveugles : nous avons vu comment la domination étrangère a ruiné nos voisins. C’est pourquoi nous avons élaboré un plan visant à contrer toute ingérence étrangère dans notre économie, afin de garantir que nous restions indépendants."
 AFG_patronise_the_royal_academy:9 "Patronise the Royal Academy"
 AFG_patronise_the_royal_academy_desc:9 "Education efforts have always been a key aspect of modernisation programmes. Afghanistan already has several fantastic universities, but none that are directly connected to the King himself. Amanullah has decided to establish a Royal Academy, an institution of higher learning for Afghanistan, to show the world his goodwill and charitable character."
 AFG_enforcement_of_ideological_unity:9 "Enforcement of Ideological Unity"
 AFG_enforcement_of_ideological_unity_desc:9 "The pluralisation of Afghan politics has just been established and already politicians are obstructing good governance with petty disputes and disagreements. As Afghanistan's herald and King, Amanullah has a responsibility to curb ideological disagreements and ensure that politics do not obstruct responsible leadership."
 AFG_dissolve_the_power_of_tribal_leaders:9 "Dissolve the Power of Tribal Leaders"
 AFG_dissolve_the_power_of_tribal_leaders_desc:9 "For far too long, King Amanullah has needed to consult the backwards tribes that manage his Kingdom. With the establishment of a modern nation-state, these tribal structures are obsolete, and promote disunity amongst the Afghan people. We will no longer suffer their petty fiefs, or any resistance they may give us. "
 AFG_mass_expansion_of_shirkats:9 "Mass Expansion of Shirkats"
 AFG_mass_expansion_of_shirkats_desc:9 "Now that our economy has been established via government monopolies and a national bank, we can begin introducing new opportunities to enrich our people. We will begin the mass establishment of shirkats, joint stock companies, and give people the chance to become proper business owners and stockholders. This will surely bring even more prosperity to our nation, without relying upon foreign capital."
 AFG_renewal_of_the_realm:9 "Renouveau du Royaume"
 AFG_renewal_of_the_realm_desc:9 "Lorsque Amanullah est monté sur le trône, l'Afghanistan était un despotisme féodal, accroché à l'autorité tribale et à l'élevage, alors que le reste du monde allait de l'avant. Aujourd'hui, c'est une nation moderne, où les citoyens votent, jouissent de droits et possèdent des entreprises. Le royaume du roi n'est plus un territoire arriéré : c'est un véritable État-nation, dirigé par un monarque éclairé et doté d'une économie moderne."

 AFG_for_the_sake_of_order:9 "Pour le Bien de l'Ordre"
 AFG_for_the_sake_of_order_desc:9 "L'Afghanistan est moderne, certes, mais à quel prix ? Soulèvements, fanatisme et destruction du royaume d'Amanullah. Dans notre quête pour sauver l'Afghanistan, nous avons négligé les piliers mêmes sur lesquels il reposait. L'Afghanistan a plus que jamais besoin de stabilité, et c'est la tradition qui la lui apporte. Nous devons rectifier le tir et ramener l'Afghanistan à la tradition là où cela compte vraiment."
 AFG_legitimacy_through_the_jirga:9 "Legitimacy Through the Jirga"
 AFG_legitimacy_through_the_jirga_desc:9 "Amanullah looked beyond Afghanistan for legislatures to govern the country, when all he needed was within: the Jirga. The assembly of Pashto tribal leaders has helped the Kings and Emirs of Afghanistan write laws, construct legal codes, and even draft constitutions. What better way is there to establish a legislative institution than by officialising this ancient body of leaders?"
 AFG_dismiss_the_ahn:9 "Dismiss the AHN"
 AFG_dismiss_the_ahn_desc:9 "The Anjuman-i Himayat-i-Niswan (Association for the Protection of Women) was the brainchild of Amanullah's wife and sisters. An experiment of feminine emancipation, the AHN sought to make women equal under the laws of Afghanistan. While King Amanullah loves and respects the works of his family, the truth is that the AHN is far too radical for Afghan society, and must be detached from the royal government entirely."
 AFG_shatter_qanun_primacy:9 "Shatter Qanun Primacy"
 AFG_shatter_qanun_primacy_desc:9 "The King of Afghanistan has a right as a King to decree laws and legal codes. However, what right does a King have to proclaim himself the better of any man, when all pious men are brothers in the eyes of Allah? Therefore, only those scriptures revealed to the Prophet (Peace Be Upon Him) must form the basis for justice and law, as studied and proclaimed by the Ulema."
 AFG_work_with_ulema_loyalists:9 "Work with Ulema Loyalists"
 AFG_work_with_ulema_loyalists_desc:9 "Amanullah is a man who knows to seek guidance when his own judgement is in question. In Afghanistan, the pious Ulema are a pillar of knowledge and spiritual strength, and fine shoulders to lean upon. King Amanullah will begin to rely on these wise scholars to fill his ministries, to remind Afghanistan of the centuries of tradition it sits upon, and to assist him in matters of Kingship."
 AFG_purge_of_corrupt_officials:9 "Purge of Corrupt Officials"
 AFG_purge_of_corrupt_officials_desc:9 "The modernisation efforts have allowed all kinds of opportunists to fester within the Kingdom. As a pious man, the King must do everything within his power to ensure that virtue governs Afghanistan, not the demands of petty bureaucrats and secular leeches. The King will struggle, as is his responsibility as a Muslim, against injustice and corruption within his government."
 AFG_return_to_pashtun_traditions:9 "Retour aux Traditions Pachtounes"
 AFG_return_to_pashtun_traditions_desc:9 "The traditions of the Pashtun tribes have defined Afghanistan for centuries, only for the actions of foreigners and infidels to attempt to destroy them. To be a Pashtun is to be a subject of the King, an honour older than the concept of modernity. We must strive to restore these traditions within our legal codes, customs, and communities, as a bulwark against cultural collapse."
 AFG_overturn_tribal_conscription:9 "Overturn Tribal Conscription"
 AFG_overturn_tribal_conscription_desc:9 "The tribes of Afghanistan have been loyal to the King for far too long just to be rewarded with the shipping away of their sons for war. We must restore the Hasht Nafari conscription laws, as a sign of good faith towards our tribal subjects. While this may harm our recruitment efforts for the army, the preservation of tribal relations is more important for Afghanistan's stability."
 AFG_cooperating_with_village_elders:9 "Coopérer avec les Anciens des Villages"
 AFG_cooperating_with_village_elders_desc:9 "Dans de nombreux villages à travers le pays, les aînés sont les plus sages et les plus expérimentés en matière de direction. Nous devons intégrer directement les conseils de ces hommes dans nos actions administratives, tant en matière de justice que pour répondre aux besoins de leurs communautés."
 AFG_turn_the_economy_inwards:9 "Tourner l'Économie vers l'Intérieur"
 AFG_turn_the_economy_inwards_desc:9 "C'était une erreur d'inviter des entreprises étrangères en Afghanistan, car elles se sont rapidement mises à exploiter notre peuple. L'économie ne doit plus servir les intérêts des banquiers et des entreprises étrangères : elle doit se concentrer sur l'autosuffisance de la société afghane et se prémunir contre toute ingérence."
 AFG_the_iron_padishah:9 "Le Padishah de Fer"
 AFG_the_iron_padishah_desc:9 "Lorsque le grand-père d’Amanullah, Abdur Rahman Khan, monta sur le trône, la capitale était tombée, des pillards rebelles ravageaient le pays et de faux prétendants tentaient de s’emparer du trône. Le grand émir de fer écrasa tous ses adversaires, fit disparaître les ennemis de l’islam et unifia la nation, tout en se soumettant à la Grande-Bretagne. Amanullah, le padishah de fer, a non seulement égalé ces exploits, mais il y est parvenu par ses propres moyens après avoir chassé les Britanniques, se forgeant ainsi un héritage qui traversera les âges."

 AFG_the_final_fall_of_amanullah:9 "La Chute Finale d'Amanullah"
 AFG_the_final_fall_of_amanullah_desc:9 "L'ambition irréfléchie d'Amanullah, qui visait à occidentaliser l'Afghanistan, s'est avérée excessive. Il a craché au visage de l'Afghanistan, de son peuple, et peut-être même au visage de Dieu. Sa folie a causé sa chute, tout comme elle causera celle de l'influence occidentale en Afghanistan : l'alliance entre Hazrat Nur al-Mashayikh et Hashim Shah y veillera."
 AFG_abolish_the_amanite_constitution:9 "Abolir la Constitution Amanite"
 AFG_abolish_the_amanite_constitution_desc:9 "À quoi sert une Constitution, si ce n’est à corrompre l’esprit des Afghans pieux avec les sornettes occidentales ? Les droits accordés à notre peuple ne proviennent pas d’esprits laïques, mais de la volonté d’Allah. Nous devons rejeter ce document inutile et rappeler au peuple que seul Allah peut nous juger égaux."
 AFG_destroy_the_westernisation_of_women:9 "Détruire les Droits Destructeurs des Femmes"
 AFG_destroy_the_westernisation_of_women_desc:9 "Le plus grand péché des Amanites fut peut-être leur campagne visant à déshonorer et à détruire les femmes de la nation. Sous leur règne tyrannique, les femmes ont été exposées aux tentations des hommes par l’abolition de l’Ikhtilat, ont été induites en erreur pour qu’elles participent à l’éducation des garçons, et ont même été manipulées pour qu’elles renoncent à leur voile par ceux qui s’opposent à l’islam. Nous devons libérer les femmes de cette oppression et leur permettre de retrouver la place qui leur revient naturellement."
 AFG_favour_the_village:9 "Favoriser les Villages"
 AFG_favour_the_village_desc:9 "Lorsque Mohammad Hashim Shah a accédé au trône d'Afghanistan, ce sont les villageois qui l'y ont porté. Dans l'histoire afghane, ce sont toujours nos villages qui ont constitué l'épine dorsale de notre société. Nous devons accorder à ces villages le droit de s'autogouverner et leur fournir les ressources et les moyens nécessaires pour prospérer selon leurs traditions."
 AFG_increase_the_ulemas_control_of_education:9 "Accroître le Contrôle des Oulémas sur l'Éducation"
 AFG_increase_the_ulemas_control_of_education_desc:9 "Les oulémas comptent parmi les érudits les plus savants et les plus sages d’Afghanistan. Amanullah a commis une erreur tragique en écartant ces érudits de l’éducation de notre peuple. Désormais, les systèmes éducatifs mis en place par Amanullah seront réorganisés, et ce sont les oulémas qui orienteront les programmes scolaires de notre nation, comme cela aurait toujours dû être le cas."
 AFG_total_ulema_independence:9 "Indépendance Totale des Oulémas"
 AFG_total_ulema_independence_desc:9 "L'islam repose sur des piliers fondamentaux, une caractéristique que l'Afghanistan doit adopter. Le roi Amanullah a refusé de reconnaître cette nécessité, s'appuyant uniquement sur le pouvoir royal. Nous savons que l'Afghanistan ne doit pas reposer uniquement sur le palais royal, mais aussi sur ses madrasas. Nous reconnaîtrons la pleine indépendance des oulémas vis-à-vis de l'autorité royale, en leur accordant une vaste compétence juridique au sein de la société."
 AFG_restoring_parochial_autonomy:9 "Restaurer l'Autonomie Paroissiale"
 AFG_restoring_parochial_autonomy_desc:9 "L'Afghanistan n'est ni [267.Controller.GetVictoryPointName_10737], ni la somptueuse [267.Controller.GetVictoryPointName_12769]. L'Afghanistan, ce sont les montagnes, les villages et les tribus qui n'ont pas besoin d'un gouvernement central oppressif. Amanullah était un autocrate avide de pouvoir qui a tenté de plier ces communautés à sa volonté, un choix insensé. Nous devons tirer les leçons de son erreur."
 AFG_lord_of_the_mob:9 "Le Seigneur de la Foule"
 AFG_lord_of_the_mob_desc:9 "Mohammad Hashim Shah est parvenu au pouvoir grâce à l'action du peuple afghan, qui lui a confié la couronne qu'il avait retirée à l'incompétent Amanullah. Ses alliés, désireux de modeler l'Afghanistan à leur image, ont oublié ce fait et ont traité le roi comme s'il n'était que leur marionnette. Il est temps de leur rappeler qu'il est roi et qu'ils doivent être ses fidèles sujets."
 AFG_mouthpiece_of_the_mullahs:9 "Le Porte-Parole des Mollahs"
 AFG_mouthpiece_of_the_mullahs_desc:9 "Mohammad Hashim Shah est avant tout un homme pieux. Comment pourrait-il en être autrement ? Son règne a anéanti les ennemis du peuple, les apostats, les infidèles et les étrangers. Plus que tout, il a su écouter la sagesse des oulémas avant toute autre, au point que leurs paroles sont devenues les siennes. En vérité, Mohammad Hashim Shah est un roi pieux."

 AFG_the_durrani_conspiracy:9 "La Conspiration Durrani"
 AFG_the_durrani_conspiracy_desc:9 "Trahir ses propres alliés pour tenter de regagner le soutien des autorités religieuses fut la plus grande et dernière erreur d’Amanullah. Il gît désormais sans vie, assassiné par des forces inconnues, sauf des auteurs mêmes de ce crime qui règnent désormais à sa place. Le roi Inayatullah, frère du défunt souverain, s’attelle désormais à leurs côtés pour instaurer une démocratie viable en Afghanistan et poursuivre la modernisation du pays."
 AFG_rewrite_the_amanite_constitution:9 "Réécrire la Constitution Amanite"
 AFG_rewrite_the_amanite_constitution_desc:9 "Lorsque nous avons rédigé une constitution au nom de l’Afghanistan, Amanullah l’a dénaturée jusqu’à en faire une parodie de sa forme initiale, s’octroyant des pouvoirs qu’aucun homme ne devrait détenir et accordant des concessions à ses alliés rétrogrades. Heureusement, bon nombre de ses modifications peuvent être facilement annulées, et nous pouvons nous appuyer sur ce qui reste pour élaborer une constitution véritablement tournée vers l’avenir, à la hauteur du peuple afghan."
 AFG_liberalisation_of_the_judiciary:9 "Libéralisation de la Justice"
 AFG_liberalisation_of_the_judiciary_desc:9 "L'une des caractéristiques essentielles de toute nation moderne réside dans un système judiciaire qui reconnaît pleinement les droits énoncés dans la Constitution. Lorsqu'Amanullah a mis en place un système judiciaire moderne, il l'a doté de ses proches et a introduit des exceptions au principe des droits civils. Nous devons passer au crible l'ensemble de notre système judiciaire et veiller à ce qu'il respecte véritablement les droits énoncés par les Lumières et notre Constitution."
 AFG_furthering_international_trade:9 "Accroître le Commerce International"
 AFG_furthering_international_trade_desc:9 "Le libéralisme est un aspect déterminant de la société moderne, et rien ne caractérise mieux le libéralisme que le libre-échange. Une nation qui ne fait pas grand-chose pour entraver son intégration dans les marchés internationaux permet à ses citoyens de profiter pleinement de la prospérité que le monde peut offrir. Nous devons prendre des mesures pour encourager davantage les échanges commerciaux avec les pays étrangers dans le cadre de nos projets."
 AFG_the_national_urbanisation_scheme:9 "Le Plan National d'Urbanisation"
 AFG_the_national_urbanisation_scheme_desc:9 "Une nation composée de paysans et d'agriculteurs ruraux n'est pas propice à une société démocratique qui fonctionne bien. Lorsque les gens sont trop occupés à joindre les deux bouts dans les champs, ils ne prêtent aucune attention au reste de la société et ne participent pas non plus aux affaires publiques. Les politiques visant à accroître notre urbanisation rapprocheront notre population de la modernité comme jamais auparavant."
 AFG_promote_an_academic_influx:9 "Promouvoir un Afflux Académique"
 AFG_promote_an_academic_influx_desc:9 "En matière d'éducation, l'Afghanistan laisse beaucoup à désirer. Bien que nous fassions des progrès dans l'éducation de notre population, nos universités ont désespérément besoin d'intellectuels et d'universitaires de renom et laïques. Offrons des incitations importantes aux intellectuels étrangers afin qu'ils puissent gagner leur vie dans nos centres de savoir."
 AFG_democracy_beyond_the_cities:9 "Démocratie Au-delà des Villes"
 AFG_democracy_beyond_the_cities_desc:9 "Trop de tribus, de villages et de communautés fonctionnent comme de petits fiefs, où les anciens et les dynasties dirigent les localités depuis des générations. Si nous voulons nous moderniser, nous devons veiller à ce que, comme dans toute commune qui se respecte, les responsables soient élus et ne héritent pas de leurs fonctions."
 AFG_seeking_imperial_recognition:9 "Chercher la Reconnaissance Impériale"
 AFG_seeking_imperial_recognition_desc:9 "L'Allemagne, la Russie, le Japon, l'Empire ottoman et même l'Autriche : quels sont les deux points communs entre tous ces pays ? Depuis des décennies, ils sont reconnus comme les plus grandes puissances mondiales, et ils ont existé, au moins pendant la majeure partie de cette période, sous l'autorité d'un empereur. Si nous souhaitons nous placer sur un pied d'égalité avec elles, nous ne pouvons pas simplement être perçus comme un humble royaume, ce qui renverrait à la soumission britannique ; nous devons au contraire être considérés comme une nation impériale moderne dirigée par un empereur."
 AFG_enjoining_good_and_forbidding_wrong:9 "Enjoindre au Bien et Pardonner le Mal"
 AFG_enjoining_good_and_forbidding_wrong_desc:9 "Les principes moraux issus de la foi et de la religion constituent le fondement même des sociétés les plus laïques. À ce titre, nous pouvons puiser notre inspiration dans la tradition pour élaborer nos lois et notre éthique. Ancrer nos lois dans les principes de l'islam permet de promouvoir une société moralement responsable sans avoir à dépendre d'oulémas réactionnaires."
 AFG_rollback_feminist_concessions:9 "Revenir sur les Concessions Féministes"
 AFG_rollback_feminist_concessions_desc:9 "Même si le règne d’Amanullah restera à jamais dans les mémoires pour ses grands efforts en faveur du progrès, il sera malheureusement toujours éclipsé par le chaos qu’il a engendré, le programme féministe extrémiste ayant été le clivage qui a déchiré la société. Le Premier ministre Dawi s’étant toujours opposé aux politiques les plus anti-islamiques à l’égard des femmes, il est tout à fait naturel que ce soit lui qui, finalement, protège la nation contre leurs nouveaux méfaits."
 AFG_officialise_the_ahn:9 "Officialiser l'AHN"
 AFG_officialise_the_ahn_desc:9 "Dans le cadre de la modernisation de l'Afghanistan, nous devons moderniser sa population et sa conception de la place des femmes au sein de la société. Heureusement, il existe une organisation qui œuvre dans ce sens : l'AHN, une initiative lancée par l'épouse et les sœurs du roi Amanullah. En en faisant un organisme gouvernemental officiel, on lui donnera l'autorité et les ressources nécessaires pour instaurer l'égalité entre les hommes et les femmes en Afghanistan."
 AFG_combating_the_corruption_of_islam:9 "Combattre la Corruption de l'Islam"
 AFG_combating_the_corruption_of_islam_desc:9 "L'islam a toujours été une religion fondée sur la raison, la tolérance et le perfectionnement personnel. Malheureusement, comme beaucoup de religions, il a été détourné et utilisé pour encourager la violence et exercer un contrôle sur autrui, donnant ainsi naissance à des groupes tels que les redoutables Saqqawistes. Nous devons commencer à lutter contre la rhétorique violente qui ronge la Oumma et ouvrir la voie à un nouvel islam, libéré de l'extrémisme corrupteur."
 AFG_the_dream_of_the_mashruta_khwahan:9 "Le Rêve du Mashruta Khwahan"
 AFG_the_dream_of_the_mashruta_khwahan_desc:9 "Notre avancée au nom de la nation n’est pas nouvelle. Autrefois déjà, les Mashruta Khwahan avaient tenté de donner vie à un nouvel Afghanistan à travers un programme constitutionnaliste, mais le roi Habibullah les avait réprimés. Aujourd’hui, nous nous tenons devant la nation, portant leur flambeau : nous avons fait de l’Afghanistan une nation de liberté, de bonne volonté et de raison, un monument à l’œuvre de ceux qui nous ont précédés !"

 AFG_to_the_victor:9 "Au Vainqueur..."
 AFG_to_the_victor_desc:9 "Enfin, Mohammad Nadir Shah a été couronné roi. Sa famille, autrefois en exil, a vaincu cet imbécile d’Amanullah et va désormais remettre l’Afghanistan sur la bonne voie. Pour y parvenir, Nadir doit s’entourer de serviteurs fidèles : qui mieux que les membres de sa propre famille ? Après tout, ils ont patiemment attendu ce moment précis en exil."
 AFG_extinguish_the_charkhi_line:9 "Éteindre la Lignée Charkhi"
 AFG_extinguish_the_charkhi_line_desc:9 "Depuis son accession au pouvoir, Amanullah s'est entouré de la famille Charkhi, un groupe de frères qui complotent pour prendre le contrôle de l'Afghanistan par son intermédiaire. Maintenant que Nadir s'est débarrassé de ce roi rebelle, il est temps de faire taire une bonne fois pour toutes ces serpents influents, afin de renforcer la position de Nadir face aux Amanites."
 AFG_bring_the_ulema_into_government:9 "Amener les Oulémas au Gouvernement"
 AFG_bring_the_ulema_into_government_desc:9 "Les oulémas ont toujours été de fervents partisans de notre règne, car, contrairement à Amanullah, nous comprenons l’importance de leur sagesse. Qui d’autre que les oulémas a osé s’élever lorsque cet imbécile a décidé de faire fi des traditions afghanes ? Nous devons inviter ces hommes à rejoindre notre gouvernement, afin qu’ils nous aident à réparer les dégâts causés par Amanullah."
 AFG_buying_tribal_loyalty:9 "Acheter la Loyauté Tribale"
 AFG_buying_tribal_loyalty_desc:9 "À bon nombre de nos alliés tribaux qui ont pris part à la guerre civile, on a promis le pouvoir en échange de leur soutien. Nous leur accorderons ce pouvoir, en signe de reconnaissance pour leur aide. Nous profiterons également de cette occasion pour démontrer à tous ceux qui doutent de leur loyauté les avantages qu’il y a à collaborer avec Mohammad Nadir Shah."
 AFG_reshape_amanullahs_legacy:9 "Remodeler l'Héritage d'Amanullah"
 AFG_reshape_amanullahs_legacy_desc:9 "Amanullah était un imbécile, mais il menait l’Afghanistan dans la bonne direction. Cependant, reconnaître cela reviendrait à avouer notre illégitimité. Il nous suffit de nous approprier les projets de modernisation les plus raisonnables qu’il a élaborés, et de le laisser dans la mémoire collective afghane comme un dirigeant précipité et instable, qui tentait de détruire ce que nous souhaitons protéger."
 AFG_uphold_saqqawist_proclamations:9 "Uphold Saqqawist Proclamations"
 AFG_uphold_saqqawist_proclamations_desc:9 "Part of the reason we had to deal with the Saqqawists in the first place was thanks to Amanullah's hasty and ridiculous modernisation attempts. As such, we do not want to repeat his mistakes: we must adopt for our reign the most agreeable of the demands of the Saqqawists, and begin working the most compliant of the bunch into our government."

 AFG_the_gradual_approach:9 "L'Approche Progressive"
 AFG_the_gradual_approach_desc:9 "Amanullah avait vu la vérité : l'Afghanistan est un pays arriéré. Son erreur a été que, dans sa hâte de guérir le pays, il a appliqué un remède trop fort et trop rapide, ce qui a causé sa chute. Nous, en revanche, savons qu'il ne faut pas commettre cette erreur : seules des réformes progressives et raisonnables permettront de soulager l'Afghanistan de ses maux, sans le détruire de l'intérieur."
 AFG_secularise_the_judicial_system:9 "Laïciser le Système Judiciaire"
 AFG_secularise_the_judicial_system_desc:9 "The control of our judicial system belongs to the Ulema, both as the justices of the realm and through the usage of Sharia law for our legal codes. This religious control over our courts and laws puts the Kingdom at a disadvantage, especially in the context of betrayal by the Ulema: the courts must be secular."
 AFG_modernise_the_treatment_of_prisoners:9 "Moderniser le Traitement des Prisonniers"
 AFG_modernise_the_treatment_of_prisoners_desc:9 "During the civil war, Mohammad Nadir Shah was exposed to the treatment of prisoners by all participants; brutality and cruelty were commonplace across the entire country. As such, we must modernise our prison system, and treat those who have done wrong with the respect reserved for our fellow men: we are not barbarians after all."
 AFG_tolerate_liberal_dissent:9 "Tolérer la Dissidence Libérale"
 AFG_tolerate_liberal_dissent_desc:9 "When you silence those who speak against you, you can no longer hear the ones who make plans. Allowing dissent and criticism of the government is both a common-sense standard for a modern nation, and a way to keep an eye on any potential enemies of the state."
 AFG_abolish_anti_dhimmi_discrimination:9 "Abolir les Discriminations Anti-Dhimmi"
 AFG_abolish_anti_dhimmi_discrimination_desc:9 "As it stands, the Dhimmi in Afghanistan are required to pay the Jizya tax as non-believers, and must wear clothing marking them as such. What have we become when we allow our fellow Muslims to treat those who are not part of the Ummah as second-class citizens? It goes against our very teachings! The state must make an effort to undo these medieval customs: all are Afghan, regardless of faith."
 AFG_the_kindling_of_constitutionalism:9 "L'Étincelle du Constitutionnalisme"
 AFG_the_kindling_of_constitutionalism_desc:9 "While Mohammad Nadir Shah rules with an iron will, this will not be necessary for the rest of Afghanistan's history. The decisions we make are the seeds planted for a society that needs not potentially rely on the will of an unworthy King, but upon the rights a proper King grants to his subjects. One day, Afghanistan will truly be modern: this is why we move steadily."

 AFG_the_steady_hand:9 "La Main Ferme"
 AFG_the_steady_hand_desc:9 "Afghanistan is fresh out of a civil war, the latest of far too many. To begin drastic changes now, after deposing Amanullah for his radical reforms, would be suicide. We must instead improve Afghanistan with as few changes as possible, while securing the loyalty of the state."
 AFG_facilitate_the_growth_of_native_industry:9 "Faciliter la Croissance de l'Industrie Locale"
 AFG_facilitate_the_growth_of_native_industry_desc:9 "Compared to the rest of the world, our economy lags far behind. We need to ensure, before any changes can be made, that we have industries necessary for a modern nation. We shall enact protectionist policies for domestic businesses, and invest directly into the economy."
 AFG_develop_a_loyalist_legislature:9 "Développer une Législature Loyaliste"
 AFG_develop_a_loyalist_legislature_desc:9 "The reign of Amanullah was simply one long series of mistakes, unneeded errors that he blindly fell into despite those around him spotting them prior. His desire to rule from above, without seeking the legitimacy of those who lift him up to those heights, was perhaps chief amongst those mistakes. Through having a national legislature, stacked to the brim with loyalists, we can much more easily justify our actions, and have a scapegoat for our most controversial policies."
 AFG_adopt_the_vilayet_system:9 "Adopter le Système des Vilayets"
 AFG_adopt_the_vilayet_system_desc:9 "L'administration de l'Afghanistan repose sur des accords et des serments de loyauté conclus entre le roi et diverses tribus et villages. Il en résulte un méli-mélo de relations qui limitent notre autorité. Nous devons nous inspirer du système des vilayets de nos frères turcs à l'Ouest et mettre en place un système de municipalités administratives afin de simplifier la gouvernance et de rationaliser le développement."
 AFG_conciliation_and_progress_committees:9 "Comités de Progrès et de Conciliation"
 AFG_conciliation_and_progress_committees_desc:9 "Une grande partie du pays a été meurtrie et dévastée par des combats et des effusions de sang sans fin. Il en résulte de profondes fractures au sein de la société, qui risquent d'engendrer encore davantage de conflits. Nous devons mettre en place des instances chargées de résoudre les conflits et de réconcilier notre pays profondément divisé, afin que nous puissions continuer à vivre ensemble en paix."
 AFG_reform_the_dar_ul_muallemin:9 "Réformer le Dar-ul-Muallemin"
 AFG_reform_the_dar_ul_muallemin_desc:9 "Une éducation de qualité pour tous constitue un véritable tremplin vers la modernité, un objectif qui reste inatteint depuis des années. Si nous voulons véritablement nous atteler à la tâche d’apporter l’éducation et l’alphabétisation à notre population, nous devons renforcer nos capacités. Le Dar-ul-Muallemin est malheureusement loin d’être prêt à assumer une telle responsabilité, une lacune que nous devons combler."
 AFG_reorient_tribal_army_contributions:9 "Réorienter les Contributions Tribales à l'Armée"
 AFG_reorient_tribal_army_contributions_desc:9 "Historiquement, les tribus d'Afghanistan ont toujours fourni des hommes à l'armée dans le cadre de notre système de conscription. Le roi Amanullah a apporté de nombreux changements à ce système, ce qui a suffisamment irrité les tribus pour qu'elles nous apportent leur soutien. Il est désormais temps pour nous de leur rendre la pareille : modifions la manière dont nos alliés fournissent leur contingent de soldats."
 AFG_refilling_the_treasury:9 "Remplir le Trésor"
 AFG_refilling_the_treasury_desc:9 "Toute guerre coûte cher, en particulier les guerres civiles, lorsque le contrôle du pays est au plus bas. Nous nous retrouvons donc avec d'énormes déficits à combler, tant au niveau de notre dette que de nos projets. Nous devons commencer à renforcer nos efforts en matière de fiscalité afin de renflouer nos caisses."
 AFG_reintroduce_purdah:9 "Rétablir le Purdah"
 AFG_reintroduce_purdah_desc:9 "Nos alliés issus des milieux les plus conservateurs de la société nous ont apporté un soutien sans faille et ont assuré la stabilité de notre règne ; nous devons leur rendre la pareille en réformant la société selon leur vision. L'une des questions qui se posent est celle de la mise à nu des femmes, une pratique indécente propagée par les puissances occidentales. Le purdah sera rétabli, interdisant ainsi aux femmes de se montrer à des personnes extérieures à leur famille."
 AFG_crack_down_on_anti_islamic_westernism:9 "Réprimer l'Occidentalisme Anti-Islamique"
 AFG_crack_down_on_anti_islamic_westernism_desc:9 "Grâce à Amanullah, les vices venus du monde entier se sont installés en Afghanistan : l'alcool, les jeux d'argent et d'autres activités trop indécentes pour être mentionnées. En tant que gardien de l'islam en Afghanistan, il incombe au roi de lutter contre ces comportements immoraux et de veiller à ce que ses sujets mènent une vie pieuse."
 AFG_grant_key_positions_to_the_mojadidis:9 "Accorder des Postes Clés aux Mojadidis"
 AFG_grant_key_positions_to_the_mojadidis_desc:9 "Aucun des oulémas ne dispose d’un pouvoir et d’une influence comparables à ceux des Mojadidis. Érudits de haut vol, les Mojadidis sont indispensables au sein de notre gouvernement pour garantir que la volonté du roi soit à la fois pieuse et sage. Nous les inviterons à occuper des postes clés au sein du royaume, afin que leur jugement puisse éclairer le roi."
 AFG_the_ulema_tribunal:9 "Le Tribunal Ouléma"
 AFG_the_ulema_tribunal_desc:9 "Les oulémas ont toujours été les plus éminents érudits du Coran et, à ce titre, font office de juges de la charia. Qui mieux qu’eux pourrait rendre justice aux malfaiteurs et aux ennemis de l’Afghanistan ? Nous mettrons sur pied un tribunal composé des oulémas les plus sages afin de diriger nos efforts dans le traitement des questions juridiques, en particulier celles concernant nos ennemis."
 AFG_brotherly_cooperation:9 "Coopération Fraternelle"
 AFG_brotherly_cooperation_desc:9 "La famille constitue l'une des entités les plus importantes en Afghanistan, et aucune famille n'est plus essentielle au bon fonctionnement du pays que la famille royale, en particulier les frères de Mohammad Nadir Shah. Il est dans l'intérêt de tous que les frères de Nadir s'efforcent de soutenir le roi : celui-ci ne peut gouverner sans eux."

 AFG_the_cabal_of_kabul:9 "La Cabale de [267.Controller.GetVictoryPointName_10737]"
 AFG_the_cabal_of_kabul_desc:9 "Nadir gît sans vie, sans doute victime des Amanites, mais la nation résiste fermement à leur insurrection. Les frères du défunt roi, menés par Hashim, ont rétabli l'ordre avec l'aide du maréchal Momand, et Zahir a succédé à son père sur le trône. Les oncles du roi continueront à garantir la stabilité, en anéantissant les ennemis de la nation et en la ramenant à ses racines."
 AFG_developing_a_pashtun_state:9 "Développer un État Pachtoune"
 AFG_developing_a_pashtun_state_desc:9 "L'Allemagne est une nation allemande, la France est une nation française et la Russie est une nation russe, même si elles comptent de nombreuses minorités sur leur territoire. Pourquoi donc l'Afghanistan, patrie des Pachtounes, ne se reconnaîtrait-il pas comme une nation pachtoune ? La langue de notre nation doit être celle des Pachtounes, sa culture doit également être pachtoune, tout comme ses dirigeants."
 AFG_aid_the_refinement_of_pashtun_society:9 "Aider au Raffinement de la Société Pachtoune"
 AFG_aid_the_refinement_of_pashtun_society_desc:9 "Si la culture pachtoune est la culture afghane, nous ne devons pas pour autant négliger d'améliorer la société pachtoune. De nombreuses traditions peuvent aujourd'hui être considérées comme arriérées, voire barbares. Nous devons montrer au monde entier que le peuple pachtoune est un peuple moderne, dont la culture mérite le même respect que celui accordé à n'importe quel autre peuple du monde."
 AFG_the_family_circle:9 "Le Cercle Familial"
 AFG_the_family_circle_desc:9 "À la mort de Mohammad Nadir Shah, ce sont ses frères qui ont su rassembler la nation, et ce sont eux encore qui devront continuer à guider l’Afghanistan pour le sortir de cette période sombre. Pour y parvenir, seuls ceux qui jouissent de la confiance de la famille royale et de son entourage se verront confier le pouvoir dans le royaume, afin de ne pas tenter le destin et de ne pas perdre un autre roi."

 AFG_the_state_of_the_people:9 "L'État du Peuple"
 AFG_the_state_of_the_people_desc:9 "Pour la première fois de son histoire, l'Afghanistan n'est plus un fief royal, mais un État dirigé par le peuple et pour le peuple. C'est un événement réjouissant : l'Afghanistan s'engage sur une voie qu'il n'a jamais empruntée auparavant !"
 AFG_consolidation_of_the_republic:9 "Consolidation de la République"
 AFG_consolidation_of_the_republic_desc:9 "La famille royale ayant été chassée du pouvoir, l'Afghanistan se trouve au bord d'un tournant historique. Les anciens systèmes ont déjà été balayés et remplacés par de nouvelles institutions, conçues spécialement pour le peuple. Une nouvelle Constitution, un nouvel organe législatif : tout doit être imprégné de cette vigueur révolutionnaire."

 AFG_foundations_of_the_peoples_party:9 "Fondations du Parti Populaire"
 AFG_foundations_of_the_peoples_party_desc:9 "Mohammad Gul Khan Momand s'est engagé dans une voie visionnaire, celle de fonder un parti politique digne de guider notre jeune république. Ce parti sera avant tout fidèle à la nation afghane et à son peuple, car quel parti pourrait mieux guider l'Afghanistan qu'un parti au service du peuple ?"
 AFG_rewarding_army_loyalists:9 "Récompenser les Loyalistes de l'Armée"
 AFG_rewarding_army_loyalists_desc:9 "Nos amis de l'armée ont joué un rôle déterminant dans notre victoire qui a permis de proclamer la République, et nous devons les récompenser pour cela. Des promotions, une influence politique et bien d'autres avantages seront accordés à nos alliés, ce qui renforcera encore les liens entre notre parti et les forces armées, afin d'assurer la sécurité de notre nation."
 AFG_intensify_army_westernisation_efforts:9 "Intensifier les Efforts d'Occidentalisation de l'Armée"
 AFG_intensify_army_westernisation_efforts_desc:9 "L'Afghanistan n'ayant plus à tenir compte des critiques réactionnaires ou monarchistes, il est temps de réformer en profondeur nos forces armées. Des progrès ont certes été réalisés, mais il reste encore beaucoup à faire pour placer nos soldats à l'avant-garde de la guerre moderne, et nous ne devons pas gaspiller ces efforts."
 AFG_legitimisation_of_rule:9 "Légitimer le Pouvoir"
 AFG_legitimisation_of_rule_desc:9 "La République et son parti populaire en sont encore à leurs balbutiements, ce qui offre à beaucoup l'occasion de nous nuire et de nous déjouer. Nous ne pouvons pas nous permettre de laisser à nos adversaires le luxe de définir ce nouvel Afghanistan : nous devons consolider notre pouvoir et mettre en œuvre des politiques qui légitiment notre autorité."
 AFG_reformation_of_the_tax_system:9 "Réforme du Système d'Impôts"
 AFG_reformation_of_the_tax_system_desc:9 "Enfin, nous pouvons nous libérer de ce système fiscal pesant et archaïque qui est le nôtre. Les tribus n'auront plus à payer de tribut sous forme de chèvres et de troupeaux : un Afghanistan moderne a besoin d'argent pour dynamiser sa nouvelle économie et financer notre gouvernement."
 AFG_building_an_afghan_intellectual_class:9 "Construire une Classe Intellectuelle Afghane"
 AFG_building_an_afghan_intellectual_class_desc:9 "Le pilier de toute république réside dans une élite intellectuelle disposant des ressources et de la formation nécessaires à la gouvernance et à la vie politique. Nous devons former une nouvelle classe d’Afghans, aussi humbles que nos villageois, aussi prospères que nos propriétaires terriens et aussi érudits que nos oulémas. Ils seront l’avenir de l’Afghanistan."
 AFG_answer_the_plight_of_women:9 "Répondre aux Demandes des Femmes"
 AFG_answer_the_plight_of_women_desc:9 "Nous avons trop longtemps laissé des traditions archaïques définir le rôle des femmes. À présent que notre État est à la fois laïc et progressiste par nature, nous pouvons inscrire l'égalité totale dans notre nation et offrir cette égalité à nos sœurs afghanes."
 AFG_concede_to_the_conservatives:9 "Concessions aux Conservateurs"
 AFG_concede_to_the_conservatives_desc:9 "La stabilité apportée par les membres socialement conservateurs de la société est importante pour l'avenir de notre république. Nous devons veiller à ne pas surcharger nos détracteurs, pourtant satisfaits, de réformes susceptibles de aller à l'encontre de leurs traditions. Nous ferons ce que nous pouvons, mais l'Afghanistan reste traditionnel pour l'instant."
 AFG_initiate_land_reform_efforts:0 "Débuter les Efforts de Réforme Agraire"
 AFG_initiate_land_reform_efforts_desc:9 "Le territoire ne doit plus être le facteur déterminant de la société dans laquelle naît un citoyen afghan. Nous devons veiller à ce que notre peuple puisse disposer de terres en abondance et les acquérir en toute légalité. Une série de réformes sera mise en œuvre afin de créer une nouvelle classe de propriétaires fonciers loyaux, à l’abri du fléau de l’aristocratie."
 AFG_harness_pashtun_nationalism:9 "Exploiter le Nationalisme Pachtoune"
 AFG_harness_pashtun_nationalism_desc:9 "On peut difficilement qualifier le peuple pachtoune de nation ; pour beaucoup, ce ne sont encore que des pratiques culturelles qui les lient les uns aux autres. Si vous demandez à un homme de Bati Kot quel est son peuple, il vous répondra que ce sont les Shinwari, et non les Pachtounes. Les hommes sans nation courent toujours le risque de devenir les esclaves de ceux qui en ont une, un sort que trop de Pachtounes ont été contraints d’endurer. Construire cette identité nationale et unir notre peuple sous cette bannière doit donc être une priorité absolue."
 AFG_stacking_the_deck:9 "Stacking the Deck"
 AFG_stacking_the_deck_desc:9 "The new Afghan citizen is educated, nationalist, and loyal to his party above all. Such a man deserves a taste of governance: we shall begin promoting our new middle class citizens to positions of power in the administration and the party, to ensure their loyalty while crafting the apparati necessary for a modern nation-state."
 AFG_father_of_afghan_azadism:9 "Le Père de l'Azadisme Afghan"
 AFG_father_of_afghan_azadism_desc:9 "What once was a passion project for those who sought to purify Afghanistan in the army has blossomed into a fully fledged national movement. Azadism has begun to enlighten the people of Afghanistan and the truth of Pasthun heritage. It is all thanks to one man, our supreme leader, Mohammad Gul Khan Momand!"
 AFG_the_padishah_president:9 "Le Padishah-Président"
 AFG_the_padishah_president_desc:9 "To steer Afghanistan towards being a proper nation, we need a leader with the iron will of the Padishahs before him. The power now in the President's hands is perhaps even greater than his predecessors, and yet it will not corrupt him. He shall serve his people, and uplift the nation for the benefit of all of the Pashtun people."
 AFG_the_aryana_ideal:9 "L'Idéal d'Aryana"
 AFG_the_aryana_ideal_desc:9 "The Pashtun nation has long been plagued by rumours and legends of a Semitic origin, with fools claiming we come from such weak and perfidious shepherds. They have been blinded by the obvious truth: we are the descendants of the Aryan peoples, the warriors of ancient times, who conquered a vast empire from Persia to India. These are our true ancestors, and we must reforge our identity to reflect this!"
 AFG_prince_of_the_republic:9 "Le Prince de la République"
 AFG_prince_of_the_republic_desc:9 "Mohammad Daoud Khan is a man who stands in two worlds: he is the founding father of our republic, yet he comes from the royal family. How can such a man be our leader? Only a man who knows the ways of a ruler may shepherd our nation towards its destiny. Mohammad Daoud Khan shall be given the full reigns of the republic, and guide us to glory."
 AFG_cementation_of_the_party_state:9 "Cementation of the Party State"
 AFG_cementation_of_the_party_state_desc:9 "Our victory in establishing a proper republic is not based upon luck, nor is it based upon a divine mandate to rule. It is based upon the will of the people, the only force that truly matters. As our party represents the people, we must ensure that it is present at every facet of government."
 AFG_the_balanced_veneer:9 "Le Vernis de l'Équilibre"
 AFG_the_balanced_veneer_desc:9 "Même si les deux hommes nourrissent manifestement l'ambition de devenir l'homme le plus puissant du pays, le président et le Premier ministre ont été contraints de reconnaître qu'ils avaient tous deux à y gagner en gouvernant ensemble sur un pied d'égalité. Il serait illusoire de s'attendre à ce que les manœuvres politiques passent définitivement au second plan, mais, pour l'instant du moins, cet équilibre sera maintenu."
 AFG_the_man_behind_the_eagle:9 "L'Homme Derrière l'Aigle"
 AFG_the_man_behind_the_eagle_desc:9 "En tant que président de la nation, Momand a sauvé le pays du chaos et de la destruction, mais il ne gouverne pas seul. Derrière le grand Aigle se cache le prince, Daoud Khan, qui laisse Momand incarner le visage de la nation, tandis que Daoud veille à ce que la volonté du gouvernement soit appliquée, sans que beaucoup ne se rendent compte de l'étendue réelle du pouvoir qu'il détient."
 AFG_uphold_the_democratic_facade:9 "Maintenir la Facade Démocratique"
 AFG_uphold_the_democratic_facade_desc:9 "La liberté de choix dont jouit le peuple afghan représente un fardeau trop lourd pour qu’il puisse véritablement le porter. Trop d’ennemis peuvent en tirer parti : démagogues, réactionnaires, monarchistes et bien d’autres encore peuvent s’engouffrer dans la brèche lorsque s’installe un mécontentement sans objet, et ruiner ce que nous avons mis tant d’efforts à construire. C’est pourquoi nous devons veiller à ce que tous les choix effectués par le peuple se fassent sous notre tutelle, sans pour autant porter atteinte à l’image d’une démocratie libre."

 AFG_from_the_frontier_to_the_heartlands:9 "De la Frontière au Cœur du Pays"
 AFG_from_the_frontier_to_the_heartlands_desc:9 "Lorsque le Royaume s'est emparé de la Frontière, il est rapidement apparu que le cœur du royaume n'avait pas les moyens de la gouverner. Le Pachtounistan a donc été contraint de s'autogouverner, en créant ses propres partis politiques, en organisant des élections locales et en mettant en place son propre pouvoir législatif, devenant ainsi, pourrait-on dire, davantage une nation que celle qui l'avait annexé. Le cœur du royaume étant désormais incapable de se gouverner lui-même, il semble que le Pachtounistan doive une nouvelle fois prendre le relais."
 AFG_assurances_to_afghan_minorities:9 "Assurances to Afghan Minorities"
 AFG_assurances_to_afghan_minorities_desc:9 "For too long Afghanistan has relied upon the suppression of local cultures and peoples, as a consequence of royal authority and then Pashtun nationalism. In building of a new Afghanistan, we must do what we can to ensure that Afghanistan is welcome to all, regardless of tribe, language or culture."
 AFG_establish_a_universal_schooling_system:9 "Établir un Système d'Écoles Universel"
 AFG_establish_a_universal_schooling_system_desc:9 "Pour beaucoup d'Afghans, l'éducation est un privilège plutôt qu'un droit fondamental accessible à tous. On ne peut guère s'attendre à ce que ceux qui en sont privés parviennent à s'élever au-dessus de leur condition modeste ; ils se contenteront d'accepter la médiocrité et les injustices de leur vie. Un système éducatif national, accessible à tous les Afghans quelle que soit leur condition sociale, doit donc figurer parmi les priorités absolues du gouvernement."
 AFG_adaption_of_the_frontiers_systems:9 "Adoption des Systèmes de la Frontière"
 AFG_adaption_of_the_frontiers_systems_desc:9 "L'expérience démocratique de la Frontière a donné naissance à un écosystème politique au sein du royaume, où le droit de vote ne faisait aucun doute, où la pluralité était la norme et où la liberté régnait dans les rues. C'était véritablement un exemple éclatant de ce que l'Afghanistan pourrait devenir. Nous devons faire tout notre possible pour adapter au reste du pays les lois, les pratiques et les systèmes électoraux que la Frontière a mis en place."
 AFG_nurture_afghan_democracy:9 "Cultiver la Démocratie Afghane"
 AFG_nurture_afghan_democracy_desc:9 "Des siècles de régime autocratique ont été balayés en un clin d’œil ; l’Afghanistan a besoin de se reconstruire, sous peine de retomber dans l’autoritarisme. Il est toutefois possible de garantir que l’Afghanistan reste démocratique sans nuire à notre propre démocratie : pluralisons le système politique, donnons à notre peuple la chance de se gouverner lui-même et renforçons-nous face à ceux qui prétendent qu’il en est incapable."
 AFG_the_fight_against_feuds:9 "The Fight Against Feuds"
 AFG_the_fight_against_feuds_desc:9 "Les vendettas et les rancunes de longue date ont marqué les relations tribales et familiales tout au long de l'histoire afghane. Pour beaucoup, les guerres civiles qui nous ont ravagés ont été l'occasion de régler leurs comptes et d'assouvir leur soif de vengeance. À l'heure où nous construisons une démocratie moderne, nous devons mettre en place des mécanismes permettant de régler ces conflits, tout en promouvant une éducation et des pratiques qui encouragent le pardon et les règlements à l'amiable."
 AFG_islamic_progressivism:9 "Progressisme Islamique"
 AFG_islamic_progressivism_desc:9 "Depuis des siècles, l'islam est un vecteur de progrès qui a permis d'élargir les droits des femmes et des opprimés, et de promouvoir la science et la raison. Pourtant, nous avons laissé des fanatiques rétrogrades et avides de pouvoir détourner l'islam à leur propre profit, au détriment d'autrui. Nous devons tout mettre en œuvre pour promouvoir l'islam tel qu'il a été conçu : une force au service d'Allah pour faire avancer le monde, et non pour le faire reculer."
 AFG_uplifting_the_rural_poor:9 "Soutenir les Pauvres Ruraux"
 AFG_uplifting_the_rural_poor_desc:9 "La pauvreté en Afghanistan est endémique et touche plus durement les habitants des villages et des tribus que partout ailleurs. Le fait que le pilier de notre nation vive dans la misère est une injustice à laquelle il faut remédier. Nous mettrons en place des mesures visant à garantir que les plus démunis de notre peuple ne souffrent pas, notamment en leur permettant de subvenir à leurs besoins même avec très peu d'argent."
 AFG_establishing_a_fair_judiciary:9 "Établir une Justice Équitable"
 AFG_establishing_a_fair_judiciary_desc:9 "Le système judiciaire afghan a longtemps servi d'instrument au gouvernement au pouvoir pour réprimer ses ennemis sous couvert de légalité, afin de donner une apparence d'équité. À l'heure où l'Afghanistan s'engage sur la voie d'une société libre et équitable, il est temps de veiller à ce que nos instances judiciaires en soient le reflet. Les juges ne seront plus les pions des pouvoirs en place : désormais, ils seront au service de la justice !"
 AFG_erosion_of_feudal_power:9 "Érosion du Pouvoir Féodal"
 AFG_erosion_of_feudal_power_desc:9 "Les structures sociales de l'Afghanistan sont terriblement dépassées, les classes sociales fondées sur la propriété foncière servant même de base aux lois et aux codes de justice. Cette inégalité juridique et politique empêche le pays d'aller de l'avant : nous devons veiller à ce que tous les Afghans jouissent des mêmes droits, quelle que soit leur origine, et mettre fin au caractère féodal de la propriété foncière."
 AFG_combating_extravagance:9 "Combattre les Extravagances"
 AFG_combating_extravagance_desc:9 "Le train de vie excessif de la famille royale était à la fois coûteux et injuste, et nous sommes soulagés qu’il ait disparu. Malheureusement, de nombreuses personnes fortunées en Afghanistan continuent de mener une vie digne de la royauté. Comment les riches et les puissants de ce pays peuvent-ils se permettre de vivre dans le luxe importé alors que leur peuple peine à se nourrir ? Nous devons encourager la modestie au sein de notre population, afin de réduire les inégalités et la dépendance vis-à-vis des produits étrangers."
 AFG_the_reformation_of_afghan_society:9 "La Réforme de la Société Afghane"
 AFG_the_reformation_of_afghan_society_desc:9 "L'Afghanistan était autrefois une nation fondée sur des lois féodales, des traditions répressives et l'imitation des pires excès de l'humanité. Aujourd'hui, non seulement ce pays s'est modernisé, mais il est également plus juste, plus tolérant et plus uni que jamais. Puisse ce nouvel Afghanistan s'ériger en phare de liberté et de progrès aux yeux de tous !"

 AFG_swept_by_the_red_tide:9 "Emporté par la Vague Rouge"
 AFG_swept_by_the_red_tide_desc:9 "Dans l'histoire de la révolution ouvrière, personne n'aurait jamais imaginé que l'Afghanistan puisse être le berceau d'un mouvement socialiste. Et pourtant, nous avons déjoué les prévisions des réactionnaires : bientôt, l'Afghanistan brandira un drapeau rouge au sommet des montagnes, à la vue de toute l'Asie !"
 AFG_harmony_with_the_aia:9 "Harmonie avec l'AIA"
 AFG_harmony_with_the_aia_desc:9 "Sous la houlette de Calcutta, les socialistes de la Frontière collaborent depuis de nombreuses années avec Ghaffar Khan et ses partisans, et nous ne voyons aucune raison d’y mettre fin aujourd’hui. Même si nous ne pouvons ignorer les divergences importantes qui nous séparent, notamment en matière de non-violence, ceux qui défendent les Afghans les plus démunis ne doivent pas laisser des problèmes mineurs les détourner de leurs objectifs fondamentaux."
 AFG_the_national_united_front:9 "Le Front National Uni"
 AFG_the_national_united_front_desc:9 "L'Afghanistan a cruellement besoin de forces progressistes capables de bâtir la société indispensable à l'instauration du socialisme. C'est pourquoi nous devons former une coalition avec les nombreux partis, organisations et mouvements progressistes d'Afghanistan, afin de garantir que notre nation soit forte face aux forces réactionnaires et qu'elle soit un jour prête pour une démocratie exempte de toute inégalité."
 AFG_reinforcement_of_ideological_purity:9 "Renforcement de la Pureté Idéologique"
 AFG_reinforcement_of_ideological_purity_desc:9 "Nous sommes peut-être d'accord avec les Khan sur nos objectifs ultimes, mais nos divergences fondamentales quant à la manière de les atteindre ne feront que nous freiner si nous continuons à travailler avec eux. Le nouveau gouvernement doit être composé exclusivement de personnes qui croient sincèrement en la cause socialiste et qui sont prêtes à prendre les armes contre les agents du capital, qui ne se lasseront pas de les frapper, quel que soit le nombre de fois où on leur tendra l'autre joue."
 AFG_crackdown_on_liberal_reformists:9 "Réprimer les Réformistes Libéraux"
 AFG_crackdown_on_liberal_reformists_desc:9 "Le libéralisme est une idéologie particulièrement subversive, qui fait des promesses superficielles et apporte des changements superficiels à la société afin de permettre au capital de maintenir son emprise sur la classe ouvrière. La seule force capable de libérer véritablement le peuple est celle de notre parti socialiste : il ne faut pas laisser les réformistes réactionnaires continuer à colporter leur pain et leurs jeux."
 AFG_develop_a_socialist_constitution:9 "Développer une Constitution Socialiste"
 AFG_develop_a_socialist_constitution_desc:9 "Les constitutions des monarchistes et des réactionnaires n’ont toujours été que des textes symboliques destinés à accorder au peuple le strict minimum, afin que la classe dirigeante puisse poursuivre son oppression. Nous ne tolérerons plus cette rhétorique stérile : nous rédigerons une constitution fondée sur les idéaux socialistes, garantissant l’égalité juridique et économique, tout en interdisant la propriété privée."
 AFG_the_islamic_socialist_ideal:9 "L'Idéal Socialiste Islamique"
 AFG_the_islamic_socialist_ideal_desc:9 "Lorsque l'islam a fait son apparition dans le monde, c'était en réaction aux marchands de La Mecque, qui colportaient leurs religions comme on vend des fruits sur un marché. L'islam s'est opposé à cette exploitation de la foi et a mis les riches au défi de donner aux pauvres. Ce sont là des idées auxquelles le mouvement socialiste adhère : nous devons faire un effort conscient pour tisser des liens entre l'islam et le socialisme, car les deux ne sont pas incompatibles."
 AFG_destroy_the_enemies_of_the_state:9 "Détruire les Ennemis de l'État"
 AFG_destroy_the_enemies_of_the_state_desc:9 "Les autocrates royaux et les fanatiques zélés ne tourmenteront plus notre peuple. Ni les marchands opportunistes ni les réformistes bavards ne chercheront plus à tirer profit d’un semblant de réformisme réactionnaire. Il s’agit d’une révolution du peuple, pour le peuple : tous ceux qui s’opposent à nous doivent être vaincus !"
 AFG_request_allied_military_aid:9 "Demander de l'Aide Militaire Alliée"
 AFG_request_allied_military_aid_desc:9 "Les ennemis de la révolution disposent de richesses et d'un arsenal illimités, un luxe que nous ne pouvons pas nous permettre. Nous devons nous tourner vers ceux qui nous ont aidés à renverser nos oppresseurs, à savoir les mouvements socialistes de l'Est, et solliciter à nouveau leur aide."
 AFG_empowering_the_rural_labourer:9 "Empowering the Rural Labourer"
 AFG_empowering_the_rural_labourer_desc:9 "Perhaps Afghanistan is not an urban industrialised society, but the proletariat was not relegated solely to the city. As recognised by Bhagat Singh and our other Indian affiliates, the hardworking farmhands and labourers, forced to toil by hapless landowners and aristocrats, are as much proletariat as those in urban factories. These Kirti, those who lack the means of production, must be the backbone of our party and of our society."
 AFG_a_forceful_end_to_feudalism:9 "La Fin du Féodalisme"
 AFG_a_forceful_end_to_feudalism_desc:9 "Le féodalisme a trop longtemps accablé les travailleurs afghans, en échange d’une forme d’esclavage que même les partisans du capitalisme rejettent. Nous ne pouvons plus tolérer ces aristocrates de droit sans pitié : nous allons démanteler et collectiviser les terres féodales, et veiller à ce que tous ceux qui travaillent la terre soient égaux devant la loi et en matière de propriété. Ceux qui résisteront ? La justice les attend."
 AFG_equal_liberation:9 "Libération Égale"
 AFG_equal_liberation_desc:9 "Tout comme l'exploitation ne fait pas de distinction, la libération du peuple ne doit pas non plus en faire. Historiquement, les femmes ont travaillé aussi dur que n'importe quel homme, mais en raison des forces répressives de la réaction, elles sont traitées comme des citoyennes de seconde zone. Nous veillerons à ce que chaque homme, chaque femme et chaque enfant soit traité sur un pied d'égalité, et nous mettrons fin à ces siècles d'exploitation des femmes qui nous affligent."
 AFG_followers_of_the_prophet_and_of_marx:9 "Fidèles du Prophète et de Marx"
 AFG_followers_of_the_prophet_and_of_marx_desc:9 "N'est-ce pas le Coran et les hadiths qui exigeaient que les riches partagent leur richesse avec les pauvres ? Le socialisme est le souffle vital du peuple, mais l'islam défendait déjà le peuple bien avant l'avènement de la société industrielle. Il n'y a aucune contradiction entre les deux : l'égalité autrefois accordée à tous par Allah a été concrétisée par la révolution."

 AFG_restore_the_foreign_ministry:9 "Restaurer le ministère des Affaires étrangères"
 AFG_restore_the_foreign_ministry_desc:9 "Maintenant que nous avons consolidé notre contrôle sur la nation, il est temps de tourner notre attention vers l'extérieur. Nous sommes restés isolés du reste du monde pendant bien trop longtemps. il est temps de rétablir notre ministère des Affaires étrangères afin de commencer notre réintégration dans les relations internationales."
 AFG_prioritise_the_defence_of_loy_afghanistan:9 "Prioritise the Defence of Loy Afghanistan"
 AFG_prioritise_the_defence_of_loy_afghanistan_desc:9 "The Third and Fourth war against the British secured not only Afghan independence, but Pashtun unity, yet the wheels of destruction continue to turn. If we do not continue to vigilantly defend the nation, it may be once again subjugated and threatened with partition. We therefore must begin preparations for the fortification of our outer provinces, to ensure that we are ready for an attack from any direction."
 AFG_defending_the_borders:9 "Défendre les Frontières"
 AFG_defending_the_borders_desc:9 "Nos mesures visant à protéger nos frontières ont été mises en œuvre. Nos soldats patrouillent les routes menant au cœur de notre territoire. Nous avons élaboré des plans visant à renforcer considérablement nos capacités de fortification partout où cela s'avère nécessaire. Les crânes de nos ennemis joncheront le pied de nos montagnes s'ils posent ne serait-ce qu'un pied sur notre sol."
 AFG_the_afghan_war_effort:9 "L'Effort de Guerre Afghan"
 AFG_the_afghan_war_effort_desc:9 "Tout comme pendant la Grande Guerre, les Afghans se retrouvent une nouvelle fois pris dans un conflit opposant les grandes puissances mondiales. Si, avec le recul, notre prestation lors de la Grande Guerre s’est avérée médiocre, largement masquée par la faiblesse de l’Inde, nous avons aujourd’hui l’occasion de prouver tout le chemin que nous avons parcouru en incarnant David, capable de terrasser l’ennemi Goliath."
 AFG_rally_the_tribesmen:0 "Rallier les Tribus"
 AFG_rally_the_tribesmen_desc:9 "Les frontières sont tombées, et nos villes et villages sont aujourd’hui activement pillés par des envahisseurs étrangers. Il n’y a personne en Afghanistan qui ne soit poussé à la colère et à la rage par cette destruction barbare, et même ceux qui se considèrent comme des ennemis du gouvernement n’hésiteront pas à prendre les armes pour le défendre et repousser cet ennemi commun de l’autre côté du Khyber !"
 AFG_detente_with_india:9 "Détente avec l'Inde"
 AFG_detente_with_india_desc:9 "La violence n’a jamais été la solution, un principe auquel l’AIA et une grande partie du peuple indien restent fermement attachés, malgré les fautes de nos prédécesseurs qui ont défini notre relation à travers elle. Il est désormais temps de tendre la main aux Indiens et de résoudre pacifiquement nos différends persistants avec eux, en recherchant l’harmonie et la reconnaissance de l’unité pachtoune durable, et en dissipant toute idée persistante de reconquête irrédentiste de la Frontière."
 AFG_liberating_the_colonised_pashtuns:9 "Libérer les Pachtounes Colonisés"
 AFG_liberating_the_colonised_pashtuns_desc:9 "Nos efforts pour ramener nos frères et sœurs pachtounes au sein de notre nation ne sont pas encore achevés : à l’est et au sud, bon nombre de nos compatriotes pachtounes, notamment les Baloutches, subissent l’oppression indienne. Au nord, d’anciennes terres afghanes restent séparées de nous, après nous avoir été volées dans le cadre du Grand Jeu russo-britannique, et même à l’ouest, d’autres Pachtounes croupissent sous la domination [PER.GetAdjective]. Il est de notre devoir de veiller à leur libération !"
 AFG_the_conquest_of_karachi:9 "La Conquête de Karachi"
 AFG_the_conquest_of_karachi_desc:9 "Pour la première fois de l'histoire, l'Afghanistan n'est plus une nation enclavée. Notre acquisition de Karachi nous a donné une ville portuaire, et ainsi des bénéfices innombrables. Nous devons faire ce qu'il faut pour intégrer ces territoires dans notre nation, et nous assurer un lien avec l'océan pour les siècles à venir !"
 AFG_lay_the_first_brick:9 "Poser la Première Pierre"
 AFG_lay_the_first_brick_desc:9 "Maintenant que nous avons accès aux eaux internationales, nous pouvons enfin nous doter d'une marine. La constitution d'une force navale sera notre priorité absolue et nous apportera la protection nécessaire à toute activité de transport maritime international. Nous ne compterons plus sur les autres pour protéger notre commerce : nous sommes désormais en mesure de le faire nous-mêmes."
 AFG_establishing_a_shipping_industry:9 "Établir une Industrie Maritime"
 AFG_establishing_a_shipping_industry_desc:9 "L'accès à un port permet d'accéder aux voies maritimes internationales qui sillonnent le monde entier. Pour tirer parti de cet accès aux marchés, il faut disposer d'un secteur du transport maritime suffisamment développé pour acheminer et réceptionner les marchandises. Nous devons investir massivement dans le transport maritime et intégrer ce secteur si profondément dans l'économie qu'il devienne indissociable de celle-ci."
 AFG_avenging_the_great_game:9 "Se Venger du Grand Jeu"
 AFG_avenging_the_great_game_desc:9 "Au XIXe siècle, l'Afghanistan s'est retrouvé à la merci de la Russie et de la Grande-Bretagne, simple pion dans ce qu'on appelait le "Grand Jeu" entre ces deux puissances. Maintenant que nous sommes plus forts, modernisés et unifiés, nous pouvons nous affirmer face à ceux qui ont contribué à saper notre souveraineté, à commencer par les pions russes en Asie centrale."
 AFG_extend_our_authority_to_darwaz:9 "Étendre notre Autorité à Darwaz"
 AFG_extend_our_authority_to_darwaz_desc:9 "Vers la fin du siècle dernier, le pouvoir sur l'émirat de Darwaz a changé rapidement de mains, et malgré tous les efforts déployés par plusieurs dirigeants afghans, sa conquête n'a jamais été menée à bien. Maintenant qu'il est enfin sous notre contrôle, il serait dommage de simplement l'abandonner ; nous devrions au contraire affirmer pleinement notre autorité sur ce territoire et les régions environnantes."
 AFG_unify_pashtunistan:9 "Unifier le Pachtounistan"
 AFG_unify_pashtunistan_desc:9 "La prise de [442.Controller.GetVictoryPointName_12717] n'a pas marqué la fin de notre offensive au Pachtounistan. Maintenant que nous sommes plus forts et que notre armée a été entièrement modernisée, nous pouvons enfin parachever notre unification avec nos frères et sœurs pachtounes d'Inde."
 AFG_free_the_western_balochs:9 "Libérer les Baloutches de l'Ouest"
 AFG_free_the_western_balochs_desc:9 "Malgré certaines différences entre nous, le peuple baloutche nous est plus proche que n’importe quel autre peuple de son entourage ; certains au sein de notre nation le considèrent comme une sous-catégorie des Pachtounes, tandis que d’autres le voient davantage comme des cousins. Rares sont toutefois ceux qui contestent la nécessité pour eux de disposer d’une patrie libre, et nous libérerons ceux qui sont sous domination [PER.GetAdjective] afin de les réunir avec leurs frères et sœurs en Afghanistan."
 AFG_champion_of_islam:9 "Champion de l'Islam"
 AFG_champion_of_islam_desc:9 "Enfin, tous les musulmans, de l'Indus à l'Oural, se retrouvent libérés de leurs oppresseurs impérialistes, grâce aux courageux moudjahidines d'Afghanistan ! Ils ne seront plus jamais soumis à un régime apostat ni à l'oppression impérialiste. L'islam peut désormais s'épanouir, libéré du joug étranger, et la Oumma peut avoir l'esprit tranquille, sachant que nous sommes ses gardiens !"

### Bookmark ###
 AFG_KR_gathering_storm_desc:9 "Le règne d'Amanullah Khan a connu beaucoup d'extrêmes. Un régicide et un coup d'État, l'entrée dans la guerre mondiale, une décennie d'occidentalisation, et de multiples rébellions violentes qui ont presque mis fin à son règne : le Roi a tout connu.\n\nL'État afghan, s'étendant de Hérat à Peshawar, débute 1936 en espérant laisser les troubles derrière lui, et cimenter sa place au sein des nations modernes du monde. Mais de nombreux ennemis du Roi rôdent toujours dans l'ombre, et menacent de briser ces espoirs s'ils en ont l'occasion."

### Intro Screen ###
 AFG_country_intro_background:9 "GFX_AFG_intro"
 AFG_country_intro_header:9 "Histoire récente de l'Afghanistan : la Weltkrieg"
 AFG_country_intro_content:9 "Lorsque la Weltkrieg commença, l'Afghanistan, alors un Émirat sous protection britannique, choisit la neutralité plutôt que d'être entraîné dans le conflit. Cette neutralité ne devait cependant pas durer, l'appel du Calife au Jihad contre l'Entente et les désirs irrédentistes de reprendre les anciens territoires en Inde attisant rapidement des sentiments pro-guerre. Le premier domino tomba lorsqu'en août 1915, une expédition conjointe germano-ottomane, menée par Oskar von Niedermayer et Werner Otto von Hentig, arriva en Afghanistan dans le but d'encourager une révolte des Afghans et des Indiens contre les Britanniques.\n\nMalgré tous leurs efforts, l'Émir afghan Habibullah Khan refusa de prendre part à une quelconque guerre contre la Grande-Bretagne, croyant que le risque était trop grand pour l'Afghanistan, la Russie et l'Inde britannique pouvant aisément écraser l'Afghanistan en cas de guerre. Croyant leur mission échouée, l'expédition partit l'année suivante, sans savoir à quel point elle avait été influente. Le frère de l'Émir, Nasrullah, et son deuxième fils Amanullah furent fortement influencés par l'expédition, croyant que l'Afghanistan avait beaucoup à gagner en combattant la Grande-Bretagne et par la réforme nationale. Une conspiration secrète entre les deux hommes aboutit à l'assassinat de Habibullah en février 1919, l'Émir étant abattu d'un tir dans la tête par un assaillant inconnu lors d'une partie de chasse.\n\nLes semaines suivantes virent l'ascension de Nasrullah sur le trône, soutenu par le fils aîné de l'ancien Émir, Inayatullah, mais le virent également être renversé par Amanullah lors d'une trahison soudaine. Nasrullah se rendit à Amanullah pour tenter d'éviter un bain de sang, le nouvel Émir lui promettant la sécurité, mais après avoir été averti par un diplomate ottoman Nasrullah choisit de fuir le pays, se réfugiant à Constantinople. Amanullah fut pleinement reconnu comme Émir à la fin février, et une enquête conclut en avril à la complicité de Nasrullah dans l'assassinat, ce dernier étant condamné par contumace à la prison à vie. Son règne étant assuré, les Russes étant hors du conflit et les garnisons britanniques en Inde ayant été redéployées en Europe pour préparer l'Offensive de Mai, Amanullah finit par accepter l'offre des Allemands et lança une attaque contre l'Inde en mai 1919.\n\nMême s'il fut incapable de s'assurer l'aide militaire des Puissances centrales à cause de sa position isolée, la frontière indienne quasiment sans défense fut rapidement submergée par les troupes afghanes. Peu après, une fois la nouvelle de son intervention arrivée, il put recevoir une reconnaissance officielle des gouvernements allemand et ottoman. Les combats durèrent à peine plus d'un mois, et un armistice fut signé entre les Puissances centrales et l'Entente en août. Ravie de la victoire, une délégation afghane fut envoyée aux négociations de paix, menée par le ministre des Affaires étrangères Mohammad Wali Khan Darwazi, et il en résulta un traité de paix entre les Britanniques et les Afghans en novembre. Malgré les grands désirs d'annexion de la Province de la Frontière du Nord-Ouest, la Ligne Durand continua d'être reconnue comme la frontière, mais la reconnaissance officielle de l'indépendance afghane fut obtenue à la place."

 AFG_country_intro_header_1:9 "Histoire récente de l'Afghanistan : la Route vers Loy Afghanistan"
 AFG_country_intro_content_1:9 "Désormais pleinement libéré du contrôle britannique, le nouvel Émir tourna son regard vers les demandes de réforme de l'État afghan. Fortement influencées par son beau-père, le réformateur Mahmud Tarzi, des réformes inspirées des Ottomans et des Européens prirent place dans tous les aspects de la société Afghane. De nouvelles écoles aux enseignants turcs furent établies, des commerces allemands et russes ouvrirent à Kaboul, et avec l'aide russe les forces armées connurent des efforts de modernisation importants. Même si elle était accueillie par diverses pans de la société, surtout les élites urbaines, un mécontentement croissant contre cette occidentalisation se répandit rapidement dans les tribus de la nation. Les réformes les plus controversées, comme les droits croissants des femmes, l'abolition du mariage des enfants et la mise en place de la conscription, suffirent à alimenter une rébellion contre le gouvernement central.\n\nEn mars 1924, la première rébellion majeure contre les réformes d'Amanullah éclata, des tribaux menés par des oulémas se soulevant contre Amanullah à Khost, au sud de Kaboul. Les combats entre les troupes gouvernementales et les rebelles durèrent presque un an, le gouvernement ne prenant pas initialement la rébellion au sérieux. La persistance des rebelles et leur force croissante furent contrées par une répression de plus en plus forte, une force aérienne étant établie en utilisant l'aide russe pour s'occuper plus efficacement des rebelles. Bien qu'elle fut finalement écrasée, la rébellion marqua le premier contrecoup majeur contre les réformes d'Amanullah, et vit une réévaluation des priorités gouvernementales. La fin violente des chefs religieux de la rébellion ne passa pas non plus inaperçue, et alimenta un dédain permanent envers Amanullah de la part des oulémas.\n\nLa rébellion ne fut cependant pas limitée à l'Afghanistan lors de cette période, la direction afghane tournant rapidement son attention vers l'effondrement de l'Empire britannique et les troubles croissants en Inde voisine. En mars 1925, la guerre civile avait effectivement commencé dans le sous-continent, même si la rébellion de Khost limita la capacité de réaction de l'Afghanistan. Au lieu d'une invasion militaire, ses efforts furent dirigés vers l'aide aux rébellions dans la Province de la Frontière du Nord-Ouest, ou PFNO, particulièrement dans la région du Waziristan. En janvier 1926, l'armée afghane était perçue par son commandement comme ayant assez récupéré, et une invasion fut déclenchée en soutien aux rébellions tribales sur les ordres d'Amanullah.\n\nDirigées par le ministre de la Guerre Mohammad Nadir Khan, les forces afghanes submergèrent une fois de plus la Frontière comme elles l'avaient fait lors de la Weltkrieg, les troupes britanniques se retirant de la région. Malgré l'espoir de conquérir beaucoup plus, les grandes défaites subies en tentant d'envahir Quetta et de traverser l'Indus menèrent à l'arrêt des offensives pour consolider le contrôle de la PFNO. Même si aucun traité de paix officiel ne fut signé, ce qui allait être connu sous le nom de Quatrième Guerre anglo-afghane fut rapidement reconnue comme terminée par les deux camps après seulement quelques semaines de combat."

 AFG_country_intro_header_2:9 "Histoire Récente de l'Afghanistan : les Réalités du Pouvoir"
 AFG_country_intro_content_2:9 "Ce qui aurait dû être une grande victoire pour l'Afghanistan devint lentement un fardeau au cours de la décennie suivante, le contrôle de la Frontière s'avérant bien plus difficile que ce qu'Amanullah ou ses ministres s'imaginaient. Même si le gouvernement depuis Kaboul rencontra peu d'opposition directe, l'annexion étant globalement soutenue, diriger une région plus prospère et presque plus peuplée que l'Afghanistan lui-même, alors que le pays était si arriéré, se révéla rapidement impossible. La Frontière, devenant plus connue sous le nom de "Pachtounistan", dût se diriger elle-même, surtout lorsque l'attention d'Amanullah commença à revenir vers le cœur du pays.\n\nDans ce marasme, les frères Abdul Ghaffar Khan et Abdul Jabbar Khan, chefs de l'Anjuman-e-Islah-e Afghania, commencèrent à lentement rassembler leurs pions, devenant de facto les chefs du Pachtounistan. Les années suivantes, les Khan supervisèrent l'établissement d'un gouvernement local à Peshawar, modelé sur les institutions indiennes auxquelles ils étaient habitués, créant presque une nation secondaire au sein de l'Afghanistan mais sans désir de l'un ou de l'autre de faire sécession. Bien qu'il n'ait reçu aucune reconnaissance officielle de Kaboul, le nouveau statu quo, tout comme la prise de la Frontière, a depuis été tacitement reconnu par les deux parties, le Pachtounistan étant content de s'autogérer en tant que partie de l'Afghanistan, et Amanullah étant content tant qu'ils continuent de payer leurs impôts et de reconnaître son règne.\n\nDans le cœur du pays, la machine des réformes continuait de tourner, surtout après avoir pris conscience, coup sur coup, que l'Afghanistan était incapable de se gouverner tant sur le plan administratif que militaire. Les années qui suivirent virent s'intensifier considérablement les efforts d'occidentalisation, à commencer par le changement de statut de l'Afghanistan, qui passa d'émirat à royaume, s'alignant ainsi davantage sur les nations les plus modernes du monde. Ce changement s'accompagna d'une série de modifications du drapeau, jusqu'à ce qu'un drapeau tricolore noir, blanc et vert soit finalement adopté des années plus tard. Des plans furent mis en œuvre pour construire une nouvelle grande capitale à proximité de Kaboul, qui devait s'appeler Darulaman, et une équipe d'ingénieurs allemands fut recrutée pour bâtir la ville selon les normes européennes. Des fonds supplémentaires furent alloués aux forces armées, et de nombreux officiers furent envoyés en Russie pour y suivre une formation, ce qui eut pour conséquence de leur transmettre de nombreuses idées issues du mouvement nationaliste naissant en Russie.\n\nVers la fin de l'année 1927 et au début de l'année 1928, le roi Amanullah entreprit une grande tournée européenne, qui valut au royaume une grande renommée diplomatique : il côtoya les dirigeants des grandes nations européennes et se présenta comme l'égal du Kaiser et du Calife. Fort de ces succès, il fit, l'année suivante, à son retour d'Europe, un pas encore plus grand vers la réforme nationale, ce qui suscita une vive opposition de la part des chefs tribaux et religieux du pays. Le Loya Jirga d'août 1928, au cours de laquelle la reine ôta publiquement son voile aux côtés d'autres femmes de la noblesse, fut perçu comme la goutte d'eau qui fit déborder le vase pour beaucoup, y compris d'anciens alliés d'Amanullah. En l'espace de quelques mois, une rébellion bien plus importante que celle de Khost éclata dans le nord du pays, menée par le chef de bandits Habibullah Kalakani."

 AFG_country_intro_header_3:9 "Histoire Récente de l'Afghanistan : Saqqawistes et Stagnation"
 AFG_country_intro_content_3:9 "Débutant initialement par une révolte de tribus Shinwari contre la couronne, le mécontentement en Afghanistan, ainsi que l'effondrement de l'autorité russe en Asie centrale après la tentative de coup d'État du général Boldyrev, permirent à une armée principalement tadjike, connue sous le nom de Saqqawistes, de prendre le contrôle du nord de l'Afghanistan dans le chaos. En septembre 1929, la plupart des villes du nord s'étaient soumises aux rebelles, qui commencèrent à planifier un assaut sur la capitale. En octobre, des milliers de rebelles marchèrent sur Kaboul, rassemblant de plus en plus de monde sous leur bannière chaque jour. Le siège se termina cependant par un échec pour la rébellion, son chef Kalakani étant tué lors des combats. Des forces venues du Pachtounistan, commandées par des chefs locaux, furent vitales pour repousser l'attaque. Des rébellions de Saqqawistes continuèrent l'année suivante, l'oncle de Kalakani Purdil Khan continuant de se battre jusqu'à ce qu'une défaite écrasante près de Hérat le conduise à se replier vers Khiva.\n\nCet effondrement potentiel du régime Amanite, combiné peu après avec le retrait complet de l'influence russe en accord avec leur budget de 1931, eurent pour résultat plusieurs années de stagnation totale pour l'Afghanistan en comparaison avec la décennie précédente. Se rangeant finalement aux conseils de ceux qu'il qualifiait auparavant d'opposants, de nombreuses réformes d'Amanullah furent abandonnées pour le bien de la stabilité nationale. Même si Darumalan fut inaugurée en 1933, la réduction de l'aide allemande la même année empêcha les développements ultérieurs. L'ascension de Boris Savinkov comme président russe l'année suivante apporta un peu de répit à l'État afghan, le nouveau gouvernement cherchant à rapidement restaurer l'influence russe dans la région, surtout en Afghanistan et en Perse voisine.\n\nDésormais au début de l'année 1936, les ambitions réformistes du roi Amanullah semblent avoir trouvé au moins l'opportunité de réémerger. Le soutien étranger au gouvernement est revenu aux niveaux prévus lors de la dernière décennie, et un grand plan de réforme de l'armée a été attribué au ministre de l'Intérieur Abdul Ahad Wardak. Ces plans seront-ils appliqués aussi bien que ce à quoi le Roi et ses ministres s'attendent ? Seul le temps nous le dira."

 AFG_guide:9 "Page 1 : Guerre Civile Afghane & Chemins d'Amanullah Khan\n\n§MLa Guerre Civile Afghane§!\n£white_dot À la fin février 1939, une guerre civile commencera en Afghanistan, menée à travers des décisions et événements, opposant §fAmanullah Khan§! et §zNadir Khan§!.\n£white_dot Lorsque la guerre commencera, la §YColère§! contre §fAmanullah§! sera inversement convertie en §CForce§!, limitée entre un minimum de 25% et un maximum de 75%.\n£white_dot Pour qu'§fAmanullah§! gagne la guerre, sa §CForce§! doit atteindre 100%. Compléter la chaîne de décisions qui commence par §Y$AFG_launch_an_assault_against_herat$§! lui donnera automatiquement 100% de §CForce§!.\n£white_dot Pour que §zNadir§! gagne la guerre, la §CForce§! d'Amanullah doit atteindre 0% ou bien que 180 jours se soient écoulés. Compléter la chaîne de décisions qui commence par §Y$AFG_drive_loyalists_from_jalalabad$§! réduira automatiquement la §CForce§! à 0%.\n\n§MLe Retour du Roi§! (§PAutocrates Paternalistes§! / §gDémocrates Autoritaires§!)\n£white_dot Gagnez la guerre civile avec §fAmanullah Khan§!.\n£white_dot Après avoir gagné la guerre, un événement permettra de choisir entre un chemin Réformiste si le Cours de l'État est à moins de 25% dans la direction Traditionaliste, ou un chemin Traditionaliste si il est à moins de 25% dans la direction Réformiste.\n£white_dot Après la guerre civile, complétez avec succès la mission §Y$AFG_reasserting_amanullahs_authority_mission$§!.\n£white_dot Si l'option Réformiste a été choisie, l'Afghanistan deviendra Démocrate autoritaire sous le §gFerqa-i-Esteqlal wa Tajaddod§!. Sinon, il restera §PAutocrate paternaliste§!.\n\n§MLa Conspiration Durrani§! (§lSociaux-Libéraux§! / §cSociaux-Conservateurs§!)\n£white_dot Gagnez la guerre civile avec §fAmanullah Khan§!.\n£white_dot Après avoir gagné la guerre, choisissez l'option Traditionaliste lors de l'événement suivant.\n£white_dot Ne complétez pas la mission §Y$AFG_reasserting_amanullahs_authority_mission$§!.\n£white_dot Amanullah sera assassiné, et Inayatullah Khan deviendra Roi.\n£white_dot Lors des élections suivantes, vous aurez le choix entre le §lHezb-e Demokratik Poshton§! de Ghulam Mohiuddin Arti et le §cHezb-e Islami§! d'Abdul Hadi Dawi.\n\n§MLa Chute Finale d'Amanullah§! (§PAutocrates Paternalistes§! / §nNationaux-Populistes§!)\n£white_dot Gagnez la guerre civile avec §fAmanullah Khan§!.\n£white_dot Après avoir gagné la guerre, choisissez l'option Réformiste lors de l'événement suivant.\n£white_dot Ne complétez pas la mission §Y$AFG_reasserting_amanullahs_authority_mission$§!.\n£white_dot Amanullah sera tué par des paysans envahissant le palais, et Mohammad Hashim Khan deviendra Roi avec le §nBārakzai-Telai (Réactionnaire)§!.\n£white_dot Choisir de compléter la priorité §Y$AFG_lord_of_the_mob$§! aura pour résultat la transformation de l'Afghanistan en Autocrate paternaliste sous le §PBārakzai-Telai (Palais)§!."
 AFG_guide_1:9 "Page 2 : Chemins de Nadir Khan\n\n§MAu Vainqueur...§! (§PAutocrates Paternalistes§!)\n£white_dot Gagnez la guerre civile avec §zNadir Khan§!, qui prendra le pouvoir avec le §PBārakzai-Telai (Palais)§!.\n£white_dot Après la guerre civile, complétez avec succès la mission §Y$AFG_stabilise_the_realm_mission$§!.\n\n§MLa Cabale de Kaboul§! (§PAutocrates Paternalistes§!)\n£white_dot Gagnez la guerre civile avec §zNadir Khan§!.\n£white_dot Ne complétez pas la mission §Y$AFG_stabilise_the_realm_mission$§!.\n£white_dot Nadir sera assassiné, Mohammad Gul Khan Momand devenant temporairement régent.\n£white_dot Si le §YCours de l'État§! penche du côté Traditionaliste, Momand donnera le pouvoir à Hashim Khan, installant le fils de Nadir, Zahir, comme nouveau Roi avec le §PBārakzai-Telai (Palais)§!.\n\n§MFondations du Parti Populaire§! (§gDémocrates Autoritaires§! / §PAutocrates Paternalistes§! / §nNationaux-Populistes§!)\n£white_dot Gagnez la guerre civile avec §zNadir Khan§!.\n£white_dot Ne complétez pas la mission §Y$AFG_stabilise_the_realm_mission$§!.\n£white_dot Nadir sera assassiné, Mohammad Gul Khan Momand devenant temporairement régent.\n£white_dot Si le §YCours de l'État§! penche du côté Réformiste, Momand déclarera une république, devenant Président avec le §gHezb-e Khalq (Réformiste)§!.\n£white_dot Si la Province autonome du Pachtounistan a été établie, négociez avec Ghaffar Khan pour stabiliser la république.\n£white_dot Dans les événements de l'enquête sur l'assassinat de Nadir, enquêter sur la Garde royale et Daoud Khan provoquera sa purge et la prise de pouvoir totale de Momand avec le §nHezb-e Khalq (Azadiste)§!.\n£white_dot Choisir d'enquêter sur l'armée et les proches de Momand transformera l'Afghanistan en Autocrate paternaliste avec le §PHezb-e Khalq (Loyaliste)§!.\n£white_dot Ou bien, enquêter sur les Amanites gardera l'Afghanistan en Démocrate autoritaire.\n\n§MDe la Frontière au Cœur du Pays§! (§SSociaux-Démocrates§! / §mLibéraux Économiques§! / §cSociaux-Conservateurs§!)\n£white_dot Lors de la Crise du Pachtounistan, choisissez de négocier avec les Khans et d'établir la Province autonome du Pachtounistan.\n£white_dot Suivez la section Fondations du Parti Populaire jusqu'à ce qu'un événement se produise concernant le Pachtounistan.\n£white_dot Choisissez d'envoyer des troupes pour prendre le contrôle de la Frontière.\n£white_dot Cela échouera, et les troupes loyales au gouvernement autonome prendront le contrôle de la capitale.\n£white_dot Une fois qu'elles auront le contrôle, choisissez d'inviter Ghaffar Khan à organiser un nouveau gouvernement avec l'§SAnjuman-e-Islah-e Afghania§!.\n£white_dot Au cours des événements d'élection, il sera possible d'élire le §cHezb-e Islami§! d'Abdul Hadi Dawi ou le §mTehrik-i-Naujawanan Baidar§! d'Abdul Hai Habibi.\n\n§MEmporté par la Vague Rouge§! (§RRadicaux-Socialistes§!)\n£white_dot Suivez la section De la Frontière au Cœur du Pays ci-dessus, jusqu'à ce que les troupes de la Frontière s'emparent de la capitale.\n£white_dot Si l'Afghanistan est frontalier d'une nation socialiste, l'option de devenir son vassal et rester socialiste sera disponible.\n£white_dot Un nouveau gouvernement sera établi avec Ghulam Mohammad Ghobar comme président fantoche pour le §RHezb-e Watan§!.\n£white_dot Compléter la priorité §Y$AFG_followers_of_the_prophet_and_of_marx$§! rendra son indépendance à l'Afghanistan."

### Events ###

 afghanistan_events.1.t:9 "Le Rapport Wardak"
 afghanistan_events.1.d:9 "Alors que la nation afghane entre dans la nouvelle année, un homme a été chargé d'assurer que son armée l'y accompagne. A la suite de discussions avec le Roi, des officiers afghans et des membres d'un attaché militaire russe, le ministre de l'Intérieur Abdul Ahad Wardak a passé les derniers mois à rédiger sans relâche des plans d'une réforme importante de l'Armée royale afghane, dans l'espoir de l'amener au niveau des forces armées modernes du monde. Le plan étant désormais complet, Wardak a rencontré le Roi cet après-midi et lui a présenté son rapport en personne.\n\nA part les éléments les plus évidents d'un tel plan de réforme, comme l'acquisition de nouveaux équipements auprès des alliés de la nation, le plan propose l'établissement d'une académie militaire basée sur celle d'Ekaterinodar, la promotion d'officiers non membres de la famille royale à des postes de haut niveau, et un entraînement plus rigoureux pour toutes les recrues. Mais les plans pour réprimer l'évitement de la conscription en ciblant la corruption, ainsi que l'intégration des milices tribales qaumi dans la chaîne de commandement sont plus controversés. Bien que Wardak ait dit clairement au Roi que ces éléments spécifiques sont susceptibles de provoquer des troubles, la conscription étant déjà l'une des mesures les plus impopulaires d'Amanullah, il a informé le Roi de sa croyance ferme en leur nécessité.\n\nMême avec ces problèmes potentiels, le Roi a apparemment été extrêmement enthousiaste à propos des propositions de Wardak, espérant pousser leur mise en œuvre le plus tôt possible. A cette fin, une deuxième rencontre entre les deux hommes a été prévue pour les prochains jours, où ils seront rejoints par Nadir Khan, chef de l'Armée royale, dans l'espoir de débuter ces réformes aussi tôt que possible."
 afghanistan_events.1.a:9 "L'Afghanistan sera bientôt la Prusse de\nl'Orient !"

 afghanistan_events.2.t:9 "Une Rencontre avec Nadir"
 afghanistan_events.2.d:9 "Contrairement à l'enthousiasme affiché par le Roi, la réponse de Nadir Khan au Rapport Wardak a été plutôt négative. Bien que Nadir ait exprimé son accord à de larges parties du plan, il a pris ombrage des parties dont Wardak s'attendait qu'elles soient les plus controversées. Pour Nadir, bien que le nombre d'évitements de la conscription soit loin d'être idéal, il pense qu'il s'agit d'un mal nécessaire pour garder les tribus dociles en matière de conscription. Pour ceux qui s'y opposent, cela leur permet d'y échapper de manière non-violente plutôt que de tenter de détruire le système par la force, comme ils l'ont déjà tenté par le passé. De plus, il croit que toute tentative d'intégrer davantage les qaumi sera considérée comme un affaiblissement du pouvoir des chefs tribaux, qui ont peu de chances de rester passifs face à la restriction de leur influence.\n\nCependant, au final, après avoir passé assez de temps à discuter avec le Roi, il a déclaré qu'il était prêt à appliquer les réformes si elles sont réellement désirées, même s'il a requis qu'elles soient au moins approuvées par un loya jirga pour légitimer ces réformes aux yeux des chefs tribaux. Bien que l'homme soit un cynique, le nombre de ses prédictions correctes a poussé Amanullah à reconnaître que Nadir est parfois une Cassandre, et il a accepté de rassembler un jirga composé des hommes les plus importants d'Afghanistan afin de donner au plan la légitimité dont il a besoin."
 afghanistan_events.2.a:9 "Il est toujours douloureux quand Nadir a raison."

 afghanistan_events.3.t:9 "Amanullah Rassemble un Loya Jirga"
 afghanistan_events.3.d:9 "Conformément à sa promesse à Nadir, le roi Amanullah a appelé les chefs et les hommes les plus puissants de la nation à se rassembler à [267.Controller.GetVictoryPointName_12769] dans une semaine, pour débattre des détails du Rapport Wardak et décider comment les réformes de l'armée nationale devraient être conduites. Le jirga sera composé de gens venus de tous horizons : les chefs de nombreuses tribus, des figures religieuses clés telles que Fazl Omar Mojadidi, des industriels comme Sher Khan Nashir et bien sûr la plupart du commandement des forces armées.\n\nLe Roi espère que tout cela ne soit qu'une formalité pour adopter la proposition, mais ses plus proches conseillers ont tenté de l'avertir et de le préparer au cas où les choses ne tourneraient pas en sa faveur."
 afghanistan_events.3.a:9 "Pourquoi diraient-ils autre chose que oui ?"

 afghanistan_events.4.t:9 "Le Rempart Traditionaliste"
 afghanistan_events.4.d:9 "Loin d'être la "chambre d'enregistrement" qu'Amanullah espérait, le Loya Jirga s'est engagé dans un débat vigoureux sur les détails du plan de réforme de l'armée. Alors que beaucoup de membres réformistes du jirga soutiennent intégralement le plan du Roi, les chefs tribaux et religieux se sont comme prévu vivement opposés aux propositions de répression de l'évitement de la conscription et à l'affaiblissement de leur position que les réformes relatives aux qaumi amèneraient. L'armée est restée en majorité indécise, souhaitant clairement voir des réformes mises en place mais voulant éviter de mettre en colère les éléments traditionalistes, ce qui pourrait facilement provoquer une grande révolte si les choses venaient à dégénérer.\n\nBien qu'un consensus semble peu probable, Wardak a proposé au Roi en privé de trouver un compromis avec les chefs traditionalistes qui diluerait les parties les plus controversées du plan, comme une chasse moins rigoureuse des insoumis à la conscription. Se préparant également à la possibilité que cette idée échoue, Wardak a aussi suggéré de promettre assez de faveurs et d'influence là où c'est possible pour convaincre les éléments les plus réfractaires, en espérant que le reste suive. Dans la situation actuelle, si Amanullah tente de passer en force sans appliquer aucune de ces idées, son plan d'adopter ces réformes par le biais du jirga échouera sans aucun doute."
 afghanistan_events.4.a:9 "Après suffisamment de discussions, les plans sont totalement approuvés."
 afghanistan_events.4.b:9 "Un consensus est atteint pour un plan moins ambitieux."
 afghanistan_events.4.c:9 "Le Jirga refuse de soutenir les réformes."

 afghanistan_events.5.t:9 "Amanullah Force l'Adoption des Réformes"
 afghanistan_events.5.d:9 "Clairement impassible face au rejet clair du Rapport Wardak par le jirga, Amanullah a simplement ordonné que les réformes soit mises en place. En tant que roi, une telle action est certainement en son pouvoir, mais beaucoup de monde sera mécontent d'une telle expression de ses prérogatives.\n\nL'armée a déjà été déployée dans des zones dont on estime qu'elles seront particulièrement agitées, pour réprimer toute révolte potentielle. Même s'il est peu probable qu'une grande rébellion résulte des actions d'Amanullah, son mépris flagrant de la volonté du jirga ne sera pas oublié de sitôt."
 afghanistan_events.5.a:9 "Le roi a toujours raison, peu importe ce que les autres pensent."

 afghanistan_events.6.t:9 "Le Puits Allemand S'assèche"
 afghanistan_events.6.d:9 "L'effondrement quasi total de l'économie allemande a certainement causé un choc à [267.Controller.GetVictoryPointName_12769] quand ceux-ci apprirent la nouvelle il y a quelques jours, mais personne n'était prêt pour la plus terrible nouvelle: L'empire allemand a coupé toute future assistance à notre nation alors qu'ils tentent eux-mêmes de rester à flot. Les plans de modernisation de Amanullah sont intimement liés à l'aide allemande depuis de nombreuses années, contraint qu'il était de se passer de l'aide russe qui s'était évaporée à la suite du Putsch de 1929.\n\nIl semble que l'aide allemande subisse désormais le même sort, sans qu'aucune alternative viable ne se profile à l'horizon. Le nombre de projets en cours qui vont prendre l'eau est accablant, et la nation doit agir aussi vite que possible pour trouver de nouvelles sources de revenu, que ce soit en saignant à blanc notre peuple, ou en essayant de trouver une autre grande puissance prête à patronner le roi et ses grandes ambitions. Quel que soit notre méthode, nous devrons agir avec rapidité mais aussi avec prudence à moins que l'on souhaite que la tête du roi ne finisse sur l'échafaud aux côtés de ses plans."
 afghanistan_events.6.a:9 "Pourquoi les allemands sont incapable de gérer une économie correctement ?!"

 afghanistan_events.7.t:9 "Les Entreprises Allemandes se Retirent d'Afghanistan"
 afghanistan_events.7.d:9 "Un autre désastre a frappé la nation, même si celui-ci était attendu depuis des jours. Luttant pour survivre même chez elles, la plupart des entreprises allemandes en Afghanistan ont cessé leurs opérations, y compris les plus importantes : Krupp et Siemens-Halske.\n\nBien qu'on s'attende à ce que la voie ferrée de [267.Controller.GetVictoryPointName_12769] continue de fonctionner, tout ceci est un coup majeur porté aux ambitions réformistes, un coup qui pourrait renvoyer l'Afghanistan des décennies en arrière si nous ne sommes pas prudents. Nous devons espérer que si la situation s'améliore en Allemagne, nous pourrons attirer à nouveau ces entreprises en Afghanistan et restaurer un semblant de normalité."
 afghanistan_events.7.a:9 "L'Afghanistan subit clairement le Lundi Noir le plus fort."

 afghanistan_events.8.t:9 "Les Contrebandiers de l'Amu Darya"
 afghanistan_events.8.d:9 "L'Amu Darya est une rivière qui trouve son origine dans les monts Pamir au nord de l'Afghanistan, à la frontière avec l'Émirat de Boukhara, et qui traverse Khiva avant de se jeter dans la Mer d'Aral. Ce cours d'eau massif est une artère majeure pour la contrebande en Asie centrale. Les villageois des montagnes sont extrêmement peu coopératifs dans nos efforts pour arrêter les responsables, ce qui est probablement dû à l'implication de membres de leur famille ou de leur tribu, ou même simplement à un dégoût du gouvernement et un code d'honneur du silence.\n\nSelon la rumeur, soutenue par les preuves que nous avons pu arrêter et collecter, le trafic d'armes est devenu le commerce principal ces dernières années. Si on pourrait en conclure que Khiva, Tachkent et peut-être même Boukhara cherchent à renforcer leurs armureries par des moyens illégaux et clandestins, il est également probable qu'Amanullah se soit fait beaucoup d'ennemis au cours du temps. Beaucoup, particulièrement en privé ou parmi ceux qu'il écoute, suggèrent que les Saqqawistes préparent une seconde révolte pour venger la mort de leur ancien chef Habibullah Kalakani. Que les ennemis d'Amanullah s'arment, ou bien simplement les nations d'Asie centrale, ou bien encore les bandits de Transcaspienne et de Transoxiane, les patrouilles frontalières font des détours (apparemment) avec zèle pour arrêter les responsables."
 afghanistan_events.8.a:9 "La contrebande est toujours un problème, peu importe qui en est à l'origine."

 afghanistan_events.9.t:9 "Réaffirmation de l'Accord de Helmand"
 afghanistan_events.9.d.AFG:9 "With the advent of the Narodist regime in Russia, Savinkov's foreign policy in [PER.GetName] and Afghanistan has been one of emphatic support and friendship. Consequentially, the time has come for our two nations to get along. For over a glorious century the Durrani Empire controlled the Sistan region at the delta of the Helmand, while [PER.GetName] contested the territory until the First Sistan Boundary Mission, in which the British designated most of the region to be rightfully [PER.GetAdjective] but failed to produce a suitable outcome for either side. The Second Sistan Boundary Mission was chartered by Henry MacMahon, a British diplomat who was able to accomplish a mildly more satisfactory delineation. Nonetheless, as British influence wanes in the region, old feuds and disputes refuse to die out just yet.\n\nBut still, it is in our best interest to continue and maintain the healthiest relationships possible with our neighbours. Through renewed Russian mediation, the Helmand Agreement has reaffirmed the conclusions of MacMahon, guaranteeing [PER.GetName] access to some of the water from the Helmand River. This is a great victory for Russian diplomacy and a promising sign that Moscow's influence in the region is one of great promise."
 afghanistan_events.9.d.PER:9 "With the advent of the Narodist regime in Russia, Savinkov's foreign policy in [PER.GetName] and Afghanistan has been one of emphatic support and friendship. Consequentially, the time has come for our two nations to get along. For over a century the Durrani Empire surreptitiously controlled the Sistan region at the delta of the Helmand, while we contested the territory until the First Sistan Boundary Mission, in which the British designated most of the region to be rightfully [PER.GetAdjective] but failed to produce a suitable outcome for either side. The Second Sistan Boundary Mission was chartered by Henry MacMahon, a British diplomat who was able to accomplish a mildly more satisfactory delineation. Nonetheless, as British influence wanes in the region, old feuds and disputes refuse to die out just yet.\n\nBut still, it is in our best interest to continue and maintain the healthiest relationships possible with our neighbours. Through renewed Russian mediation, the Helmand Agreement has reaffirmed the conclusions of MacMahon, which has legally provided our nation with rightful access to some of the water from the Helmand River. This is a great victory for Russian diplomacy and a promising sign that Moscow's influence in the region is one of great promise."
 afghanistan_events.9.a:9 "Le Vozhd a restauré la nature équitable de la Russie."

 afghanistan_events.10.t:9 "Agitation au Kohistan"
 afghanistan_events.10.d:9 "Une des premières réponses du Roi à la récente catastrophe économique a naturellement été d'augmenter les impôts, les collecteurs royaux devant rassembler des niveaux proches de l'extorsion de toutes les manières possibles. Il n'y a jamais eu dans l'Histoire de moment où les collecteurs d'impôts ont été populaires, particulièrement lorsqu'ils sont envoyés récolter davantage qu'auparavant. Il est donc peu surprenant d'entendre qu'un collecteur de la région du Kohistan, envoyé récolter autant qu'il pouvait des locaux, a été abattu par des membres de la tribu Shinwari.\n\nBien que, selon les sources officielles, le collecteur d'impôts demandait clairement bien plus que ce que le Roi avait ordonné, les locaux sont restés sceptiques face à cette explication, et ont tenté de soulever la région contre cette taxation "injuste". Cette insurrection n'a été jusqu'ici que de simples escarmouches avec les unités locales, mais l'histoire des insurrections contre la Couronne ces dernières années a montré avec quelle rapidité une telle agitation peut dégénérer si elle n'est pas traitée rapidement. Que la question soit réglée avec la carotte ou avec le bâton, cela dépend du Roi."
 afghanistan_events.10.a:9 "Exemptez-les d'impôts supplémentaires, nous ne pouvons pas nous permettre cette agitation."
 afghanistan_events.10.b:9 "Send in Nadir to crack a few skulls, there's still more blood to get from this stone."

 afghanistan_events.11.t:9 "Conflit Tribal sur les Impôts à [AFG_random_location_name]"
 afghanistan_events.11.d:9 "Pour financer les efforts d'occidentalisation d'Amanullah, la modernisation et la paye de l'armée, ainsi que les dépenses du gouvernement, des impôts sont levés sur tous les Afghans, quels que soient leur tribu, leur métier ou leur origine. Cependant, notre composition malheureusement hétérogène et divisée, ainsi que nos administrés souvent indignés, font de la perception des impôts une affaire extrêmement complexe et souvent ardue. Beaucoup ont recours à des manœuvres d'évasion fiscale, comme la sous-déclaration du cheptel, le fait "d'oublier" de consigner et de déclarer les naissances, ou encore de donner une fausse image de la taille et de la productivité de leurs terres. Dans de nombreuses tribus, il existe encore un sentiment de loyauté envers l'héritage et l'identité tribaux plutôt qu'envers une identité "afghane" unifiée et légitime, ce qui sape leur envie de verser des impôts à un roi auquel ils ne se sentent pas particulièrement liés.\n\nPlusieurs tribus de [AFG_random_location_name] se sont rendues coupables d'une évasion fiscale flagrante, et un audit approfondi les a pratiquement amenées à l'admettre, tout en accusant le gouverneur régional de détournement de fonds pour justifier tacitement leur comportement. Face à leur refus catégorique de s'acquitter de leurs arriérés d'impôts, nous devons choisir avec soin notre approche de la question."
 afghanistan_events.11.a:9 "Ignorez-les pour le moment."
 afghanistan_events.11.b:9 "Rendez à Amanullah ce qui est à Amanullah, sinon..."

 afghanistan_events.12.t:9 "Les Chefs Tribaux de [AFG_random_location_name] Protègent les Insoumis"
 afghanistan_events.12.d:9 "Bien que le système de conscription "Pishk" mis en place par Amanullah soit globalement supérieur à l'ancien, puisqu'il sélectionne les conscrits parmi les tribus par tirage au sort plutôt que de laisser aux anciens tribaux le soin de choisir eux-mêmes leurs représentants (ce qui revenait généralement au plus faible et au plus chétif de la tribu), les tribus désapprouvaient et désapprouvent toujours ce système. Certains conscrits étant catégoriquement refusés de servir sous le drapeau afghan et s'identifiant exclusivement à leur propre tribu, ou craignant tout simplement la vie militaire, les commissions de conscription n'atteignent le plus souvent pas un taux de présence de 100%.\n\nQue ce soit parce qu'ils n’ont pas réussi à soudoyer leurs agents de conscription locaux, ou parce que les membres de la commission font partie des rares personnes insensibles à la corruption, une liste de réfractaires a récemment été fournie au régiment local de [AFG_random_location_name] et une tentative a été faite pour les arrêter dans leur village. Cependant, les chefs de la tribu ont catégoriquement refusé de livrer les réfractaires, déclarant qu'ils se trouvaient officiellement sous leur protection et demandant à l'armée de simplement fermer les yeux sur cette affaire. C'est à nous de décider si nous prenons des mesures punitives contre leur désobéissance, ou si nous laissons simplement passer cet incident et préservons la paix."
 afghanistan_events.12.a:9 "Punissez à la fois les hommes et leurs protecteurs."
 afghanistan_events.12.b:9 "We don't really need every soldier now do we?"

 afghanistan_events.13.t:9 "Affrontement avec la Modernité à [AFG_random_location_name]"
 afghanistan_events.13.d:9 "Même si la marche de l'occidentalisation reste franche et directe, elle n'est certainement pas sans accroc. Le choc culturel de l'introduction des valeurs européennes dans la société afghane est important et très alarmant pour les tribus et les oulémas, qui attendent toujours de constater la gloire de la vision d'Amanullah pour l'Afghanistan. L'importation de biens étrangers, les campagnes pour dévoiler les femmes, et même l'introduction de véhicules motorisés et l'infrastructure pour les soutenir sont accueillis avec une grande appréhension ou un rejet absolu de la part des conservateurs locaux, qui souhaitent préserver leurs traditions et éviter la corruption de ce qui leur paraît être une dégénérescence non-islamique.\n\nLes tentatives de mise en œuvre du programme du gouvernement ont été bloquées sans relâche par des figures influentes à [AFG_random_location_name]. Nous pourrions tenter de les impressionner par notre insistance ou par la force, mais il serait plus prudent de laisser le progrès agir sans les brusquer."
 afghanistan_events.13.a:9 "L'avenir est proche, vieil homme."
 afghanistan_events.13.b:9 "Progress takes time, we can't rush things."

 afghanistan_events.14.t:9 "Croissance de la Clique Azadiste"
 afghanistan_events.14.d:9 "Enhardie par la force de plus en plus importante des nationalistes extrémistes en [PER.GetName] et du régime svobodnik en Russie, la dite "Clique Azadiste" de l'Armée royale a grandi à la fois en taille et en influence au cours des derniers mois. Ces Azadistes, qui tirent leur nom de leurs alliés idéologiques en Iran, se sont développés à la fin des années 20 après la naissance du parti Iran-e Now en [PER.GetName] et l'extension de l'influence russe, alors que la coopération militaire entre eux et l'Afghanistan grandissait. Le chef de facto de la clique, Mohammad Gul Khan Momand, a commencé à développer les idées qui définissent désormais la faction lors d'une mission militaire en Russie, où il a rapidement été influencé par les officiers russes les plus loyaux envers la cause de Savinkov.\n\nManquant d'une idéologie clairement définie, les membres de la clique adhèrent généralement tous à une certaine forme de nationalisme pachtoune, avec l'idée d'une identité aryenne commune entre les Afghans et leurs voisins, remplaçant les anciennes croyances d'une descendance de la Tribu de Benjamin. Même s'ils sont similaires aux idées de feu Mahmud Tarzi, ils croient également fortement en une modernisation rapide de l'État afghan, un fait qui les rapproche grandement du roi Amanullah.\n\nCependant, les penchants républicains des membres de la clique les placent en opposition au Roi, ceux-ci considérant la monarchie comme une institution archaïque à remplacer. Bien que ce ne soit pas la croyance principale, le nombre important de membres républicains a apporté à la clique le soutien des républicains de gauche tels que Gholam Mohiuddin Arti et Abdul Rahman Loudin, malgré leurs grandes différences idéologiques.\n\nMême avec ces tendances républicaines, tant que la clique sera dirigée par Momand il semble peu probable qu'elle représente une menace pour le Roi, et jusqu'ici elle a été une alliée précieuse par son soutien fervent à la modernisation. Momand lui-même semble assez ambivalent vis-à-vis du républicanisme, ses opinions sur le sujet étant complètement insignifiantes comparées à sa loyauté envers l'État afghan et la modernisation. Par dessus-tout, l'homme est loyal à Nadir Khan, dont il est décrit avec amour comme le sixième frère malgré son absence de lien familial. Le neveu de Nadir, Mohammad Daoud Khan, a été sous l'aile de Momand depuis de nombreuses années, et est considéré comme son protégé et son successeur naturel. Quoi qu'il en soit, là où Nadir se rend, Momand le suit, et sa clique le suivra lui aussi."
 afghanistan_events.14.a:9 "Les Azadistes sont certainement utiles, mais nous devrions les tenir à l'œil."

 afghanistan_events.15.t:9 "L'Arche Rouge"
 afghanistan_events.15.d:9 "Mauvaises nouvelles de [760.Controller.GetVictoryPointName_6666] : le Comité international de la Croix-Rouge a rejeté notre pétition de reconnaitre notre société nationale. Le roi Amanullah est en contact avec le CICR depuis des années, après qu'ils l'aient contacté et suggéré que nous créions notre propre branche en Afghanistan. Pour répondre à [760.Controller.GetVictoryPointName_6666], le roi Amanullah a créé le Mehrab-e-Ahmar, ou Société de l'Arche Rouge, et a soumis la pétition.\n\nMalheureusement, la réception par le CICR a été plutôt tiède. Malgré les nombreux autres cas d'acceptation de symboles propres, le CICR a décidé de rejeter notre proposition, car selon eux la multiplication des symboles en diminuerait le sens. Clairement, ils considèrent notre nation comme une puissance mineure et insignifiante, tout en ignorant l'importance du Mehrab comme symbole national du peuple afghan.\n\nLe roi Amanullah est particulièrement fâché de toute cette affaire, et a été entendu dans ses quartiers privés menaçant fortement de retirer la Société de l'Arche Rouge du CICR dans son ensemble. Sa colère est dirigée contre l'usage du Lion Rouge, objectant que le CICR l'a adopté comme symbole national, mais a mis son véto au symbole afghan. Néanmoins, il est probable qu'Amanullah se calmera et acceptera les suggestions du CICR, mais pas sans protester."
 afghanistan_events.15.a:9 "C'est scandaleux ! C'est injuste !"

 afghanistan_events.16.t:9 "Renewed Parliamentary Debate"
 afghanistan_events.16.d:9 "As has slowly become the norm, the regional government in [442.Controller.GetVictoryPointName_12717] has this week dissolved its legislature in advance of their next election, the fourth since the government's establishment by local powerbrokers in the aftermath of the Fourth Anglo-Afghan War. Although the Frontier's government has never technically received official backing from [267.Controller.GetVictoryPointName_12769], this was not always meant to be the case. Shortly after its establishment plans were put in place to establish an all-Afghan national legislature, including the [442.Controller.GetVictoryPointName_12717] in some form, but these plans initially fell through due to the Saqqawist rebellion, and disagreements over matters like the exact role of Pashtunistan in the process have consistently scuppered further attempts.\n\nUnsurprisingly the electoral season in the Frontier has prompted renewed discussions back in the heartlands over reviving the parliamentary plans. With things somewhat more stable now, economic woes notwithstanding, it may finally be time to put our full attention towards finally solving all the fine details and at last bringing in a national assembly. Alternatively it may be best to continue the status quo, as quite a few ministers believe that any parliamentary plans will simply hit the same pitfalls as before, and that time is best spent on other more immediate matters."
 afghanistan_events.16.a:9 "Other matters require our more immediate attention."
 afghanistan_events.16.b:9 "We should be considering a revival of these plans."

 afghanistan_events.17.t:9 "Le Prince Guerrier"
 afghanistan_events.17.d:9 "Aujourd'hui, Amanullah n'est pas seulement un père fier de la modernité afghane, mais un père fier de son propre fils. Le prince Rahmatullah vient juste de s'engager dans l'armée et a commencé l'entraînement militaire. Cet événement a été publié prudemment mais avec excitation, car Amanullah a saisi l'occasion de renforcer l'image de sa famille comme des guerriers religieux qui peuvent et veulent se battre pour préserver l'Islam.\n\nRahmatullah devrait exceller dans son entraînement (même s'il est probable que les sergents ne malmèneront pas le Prince autant que les autres cadets, par peur d'offenser sa famille) et améliorer son image personnelle avant sa future accession au trône, dans l'idéal aussi tard que possible."
 afghanistan_events.17.a:9 "Il sera un puissant moudjahid, comme son père !"

 afghanistan_events.18.t:9 "Elections in Pashtunistan"
 afghanistan_events.18.d:9 "Almost sheltered from events in the rest of the country, the region of Pashtunistan has spent the past few weeks holding elections for its local assembly, the de facto government of the region. Unsurprisingly to many, the Anjuman-e-Islah-e Afghania has maintained their dominant position, with Abdul Jabbar Khan (Dr Khan Sahib) remaining Chief Minister. In a notable turn however the United Muslims Nationalist Party, the main opposition, have increased their winnings to 10 of the 51 seats in the assembly, suggesting a potential pushback against the AIA's more radical policies.\n\nHaving held elections every three years since 1927, the democracy present in Pashtunistan is a rather stark contrast against the supposed absolute rule of the King in [267.Controller.GetVictoryPointName_12769]. In the chaos and uncertainty that followed the invasion, the subsequent lack of authority asserted from the heartlands led to Dr Khan Sahib and his brother Abdul Ghaffar Khan (Bacha Khan) stepping up to fill the void. A government for the former North-West Frontier Province was established under them, modelled heavily upon the former British institutions many in the region were used to. Owing in large part to their personal connections and charisma their government has surprisingly found itself backed by those from all walks of life, including not just the agrarian poor and the urban elites but even tribal leaders like Mirza Ali Khan Wazir of Ipi.\n\nDespite the Pashtunistan government having no official authority on paper or direct backing from the King, there has never been any official opposition to their existence either. In the years since its establishment, there has been an almost unspoken agreement on the matter between the Crown and the Assembly that they can do whatever they like as long as they stay loyal to the realm and pay their taxes. There has been little objection to this in Pashtunistan so far, as although some in recent years have considered whether they would be better off alone, the high opinion of King Amanullah and a strong level of Pashtun nationalism have many proud to remain part of the Afghan nation, even if they may be in practice so different from it."
 afghanistan_events.18.a:9 "No need to fix what isn't broken."

 afghanistan_events.19.t:0 "Jour de l'Indépendance"
 afghanistan_events.19.d:9 "Aujourd'hui marque l'anniversaire de la reconnaissance officielle de l'indépendance afghane par le Traité de Hanovre, signé par nos alliés après notre victoire lors de la Troisième Guerre anglo-afghane. La guerre avait commencé avec l'ascension du roi Amanullah, alors simple émir, lorsqu'il a déclaré un jihad contre nos oppresseurs britanniques. Les forces britanniques étant occupées en Europe, nos forces ont pu rapidement avancer en Inde, dans une déclaration de notre puissance sur la scène mondiale. Notre accession a été accueillie par une reconnaissance officielle de notre indépendance par l'Allemagne et l'Empire ottoman, qui a ensuite été ratifiée lors de la Conférence de Hanovre.\n\nLe jour de la signature du traité est désormais le jour de l'indépendance de l'Afghanistan, et les célébrations d'aujourd'hui sont adéquates. Un grand défilé militaire descend les rues de [AFG.Capital.GetCapitalVictoryPointName], commémoré par des discours sur la bravoure des soldats de l'Afghanistan au service de leur nation. Les discours ont été reçus chaleureusement par toute la nation, ce qui fait d'aujourd'hui un jour d'unité dans la fierté pour nos Forces armées."
 afghanistan_events.19.a:9 "Il s'agit de l'épée qui protège l'Islam."

 afghanistan_events.20.t:9 "Jour de l'Unité"
 afghanistan_events.20.d.regular:9 "A more recent national holiday has emerged in the form of Unity Day, which commemorates the capture of [442.Controller.GetVictoryPointName_12717] in the Fourth Anglo-Afghan War and the unification of the Pashtun people. While the Third Anglo-Afghan War was our war for independence, the Fourth was our war for unification. After the defeat of Britain and her allies in the Weltkrieg, longtime agitators in the region of Waziristan began organising, in the face of British collapse. A series of withdrawals by British forces allowed our army to easily cross the Afghan-Indian border, securing Pashtun majority areas and supporting freedom fighters in the region. Our greatest victory was the capturing of [442.Controller.GetVictoryPointName_12717], the largest city in Pashtunistan.\n\nParticularly beloved amongst nationalists in the country, Unity Day this year is commemorated with the usual military parades, but also commemorated via new poetry and music produced by nationalist intellectuals in the nation, reminding us that we, the Afghan people, will soon be reunited with our brothers beyond our borders."
 afghanistan_events.20.d.crisis:9 "On any other year, Unity Day would be one with nation wide celebrations, yet the ongoing quagmire in the Frontier has left a grey cloud over this year's proceedings. To avoid provoking further instability in Pashtunistan, the yearly military parade has been cancelled, as troops in the region right now would be a poor idea. If things continue like this, it will be hard to imagine another Unity Day actually being celebrated..."
 afghanistan_events.20.a:9 "J'oublie le trône de Delhi, lorsque je me rappelle la beauté du Pachtounistan."
 afghanistan_events.20.b:9 "This crisis will pass!"

 afghanistan_events.21.t:9 "Les Soldats Abandonnés"
 afghanistan_events.21.d:9 "La capacité d'une armée à recruter sans l'aide de la conscription dépend fortement de l'attrait que représente la carrière militaire. Pendant plusieurs années, que l'on soit soldat ou officier, on ne recevait généralement pas assez d'argent pour pouvoir financer à la fois le train de vie de sa famille et ses propres vêtements. La croissance régulière de l'économie afghane a donné à [267.Controller.GetVictoryPointName_12769] un budget capable d'allouer plus d'argent aux salaires des fantassins, mais la demande financière de la modernisation, la construction d'infrastructures et les autres dépenses restreignent le champ du budget militaire.\n\nLa pauvreté est endémique dans l'armée. On fait état de plusieurs cas de soldats mendiant dans les rues pour pouvoir nourrir leurs familles. Cette humiliation représente un tableau troublé de la manière dont Amanullah traite ceux qui prennent les armes pour le défendre lui et le gouvernement, et rend l'engagement au mieux peu attrayant. Le haut du panier militaire a demandé à plusieurs reprises à Amanullah d'épargner assez d'argent pour que les soldats n'aient plus à supplier pour des miettes. Beaucoup grommellent de plus en plus que si le Roi venait à détourner quelques financements "excessivement" généreux de ses projets réformateurs et occidentalisants vers l'armée, le problème disparaîtrait tout simplement."
 afghanistan_events.21.a:9 "Peut-être qu'ils devraient mieux gérer leurs fonds."
 afghanistan_events.21.b:9 "Réduire nos soldats à de simples mendiants est humiliant."

 afghanistan_events.22.t:9 "Téléphone vers [442.Controller.GetVictoryPointName_12717]"
 afghanistan_events.22.d:9 "La cohésion coopérative et la communication entre nous et la région du Pachtounistan, qui ne fait l'objet que d'une intégration très lâche, sont, pour employer un euphémisme, extrêmement compliquées et peu efficaces. Dans le cadre de nos efforts visant à intégrer davantage la Frontière dans le système administratif, une ligne télégraphique et téléphonique directe entre [267.Controller.GetVictoryPointName_12769] et [442.Controller.GetVictoryPointName_12717] a été officiellement inaugurée. Pour marquer l’événement, Amanullah Khan et Ghaffar Khan se sont réunis aujourd’hui, pour la première fois, depuis le confort de leurs domiciles respectifs. En veillant à ce que la transcription soit largement diffusée dans tous les journaux désireux de la publier, ils ont réaffirmé leur appel à la coopération, à l’unité et au soutien mutuel en faveur des programmes réformateurs de chacun des dirigeants.\n\nLes journaux amanullites ont notamment mis en avant la réaffirmation apparente par Ghaffar Khan de sa loyauté envers [267.Controller.GetVictoryPointName_12769], une déclaration qui brillait par son absence dans les publications de [442.Controller.GetVictoryPointName_12717]. Bien qu’il reste difficile de déterminer quelle version de la transcription a été modifiée, cette ligne téléphonique constitue un grand pas en avant pour l’intégration du Pachtounistan."
 afghanistan_events.22.a:9 "La seconde capitale est plus proche que jamais."

 afghanistan_events.23.t:9 "La Concession d'Exploration des Terres"
 afghanistan_events.23.d:9 "Dans un contexte d’incertitude quant à la production pétrolière, généralement due aux conflits sociaux qui ont suivi le Lundi Noir, de nombreux prospecteurs pétroliers et hommes d’affaires voient dans l’instabilité économique une opportunité. Une entreprise dirigée par l’ancien diplomate américain Charles Calmer Hart et le géologue Frederick Gardner Clapp, par l’intermédiaire de leur "Inland Exploration Company", a bénéficié d’un nouveau souffle grâce à l’octroi d’une concession couvrant l’ensemble de l’Afghanistan, à l’exception de la région autonome du Pachtounistan. Les termes de l'accord stipulent qu'Inland doit verser au gouvernement afghan près de 14 000 dollars américains par an, cette somme devant presque doubler au bout de cinq ans pour la durée de 60 ans de l'exclusivité garantie en matière d'exploration.\n\nCet accord est le fruit d’années de démarchage mené par Amanullah Khan auprès des investisseurs américains afin de contrebalancer l’influence russe, allemande et (autrefois) britannique. On s’attend désormais à ce que des dizaines, voire des centaines de prospecteurs pétroliers américains s’installent en Afghanistan à la recherche de l’or liquide, diffusant ainsi l’influence occidentale et favorisant l’industrialisation !"
 afghanistan_events.23.a:9 "L'Afghanistan sera bientôt la capitale mondiale du pétrole !"

 afghanistan_events.24.t:9 "La Reine des Femmes"
 afghanistan_events.24.d:9 "La femme d'Amanullah et reine d'Afghanistan, Soraya Tarzi, est la colonne vertébrale de ses réformes émancipatoires et peut-être le soutien le plus actif et le plus important de la cause des femmes de tout le continent asiatique. En effet, c'est l'Afghanistan qui a donné le droit de vote aux femmes avant même que les "bastions des valeurs démocratiques", comme les États-Unis, aient promulgué de telles mesures. Les droits des femmes ne font cependant pas l'unanimité, et les conservateurs religieux sont les ennemis jurés des politiques féministes d'Amanullah.\n\nAyant déjà ouvert plusieurs écoles primaires pour les filles, comme l'École Masturat, Tarzi a récemment inauguré le tout premier collège entièrement féminin d'Afghanistan, nommé le "Collège Soraya Tarzi", à [267.Controller.GetVictoryPointName_12769]. Basé sur les standards initiés par d'autres centres d'éducation similaires dans l'Empire ottoman, l'école devrait accueillir près de 200 élèves pour son premier semestre. Tarzi n'a pas l'intention de s'arrêter ou de ralentir : elle a ouvertement proclamé son intention de bâtir des écoles industrielles et de standardiser totalement l'accès des femmes à l'éducation, espérant même établir des établissements d'enseignement supérieur à [442.Controller.GetVictoryPointName_12717] un jour.\n\nPour les conservateurs, le soutien d'Amanullah, qu'il soit tacite ou non, est peut-être le plus grand mal sur la Terre. Une grande manifestation menée par un mollah local a déjà provoqué le report de l'inauguration de l'école, et les publications conservatrices nationales font furieusement polémique sur l'institution et la trahison hérétique des valeurs islamiques par Amanullah. Contrecoup ou non, la nouvelle école devrait rester ouverte au moins pour le reste de son règne ; mais pour calmer leur colère, il serait prudent de calmer les ambitions de Tarzi, sinon les conservateurs pourraient être poussés à bout."
 afghanistan_events.24.a:9 "Les femmes contribuent autant que les hommes au développement de l'Afghanistan..."
 afghanistan_events.24.b:9 "...but perhaps we should convince her to hold her horses."

 afghanistan_events.25.t:9 "La Chaîne de Commandement"
 afghanistan_events.25.d:9 "Des nouvelles troublantes nous arrivent de la garnison de [415.Controller.GetVictoryPointName_4893], où le meurtre d'un commandant farsiwan par un fils de Khan pachtoune a provoqué une controverse non seulement dans la ville, mais jusqu'à [267.Controller.GetVictoryPointName_12769]. Après une enquête rapide, il a été découvert que le commandant déléguait des tâches excessivement subalternes à la jeune recrue, le forçant à nettoyer les latrines, à creuser des tranchées, et à lui apporter ses repas. De telles discriminations sont monnaie courante, les officiers ayant grimpé dans la hiérarchie depuis le bas ayant une opinion très défavorable vis-à-vis des fils de gens importants, et aimant les faire travailler très dur pour leur apprendre l'humilité.\n\nLe meurtrier en question a commis son acte à minuit, apparemment pour essayer de passer inaperçu, mais les implications ethniques du crime lui ont retiré toute sympathie de la part du peloton principalement composé de farsiwan. La peine de mort devrait être inévitable, mais sa famille a fait appel au Roi pour qu'il lui accorde l'amnistie et lui permette de rentrer dans son village. Ils prétendent qu'il a souffert de crises de colère toute sa vie et ne peut pas être tenu pour responsable de ses actes, mais qu'il peut être réhabilité par le mollah du village, qu'il considère comme un mentor.\n\nMême si Amanullah pourrait pardonner cet homicide, étant donné qu'il aurait été "provoqué", le faire mettrait absolument en colère la communauté farsiwan et accentuerait les biais pro-pachtounes du régime. Cependant, les publications conservatrices les plus importantes ont publié des éditoriaux en faveur du tueur, et le renvoyer auprès de sa famille nous permettrait de marquer des points auprès d'elles."
 afghanistan_events.25.a:9 "Il passera en cour martiale et sera jugé pour meurtre, comme n'importe qui."
 afghanistan_events.25.b:9 "Ce n'est qu'un garçon, laissez ses aînés s'en occuper."

 afghanistan_events.26.t:9 "A New Mehtar in Chitral"
 afghanistan_events.26.d:9 "Unfortunate news from northern Pashtunistan today as the ruling Mehtar of the Chitral Princely State, Shuja ul-Mulk, has suddenly perished of heart failure. Succeeding him is Nasir ul-Mulk, who will formally inherit the throne in a grand ceremony hastily planned to take place six days after his father's death.\n\nThe influence of these small princedoms inherited with the rest of Pashtunistan is rather small, and even in spite of Shuja ul-Mulk's pro-British leanings he had seen the wisdom of declaring fealty to Amanullah in the wake of British India's rapid insolvency. Nasir ul-Mulk is an enlightened figure with great interest in academic development, hoping to develop an ambitious education system in his realm. Chitral's treasury can not accommodate all of his designs, so it may do us some good to offer him some funds with the tacit understanding that he unequivocally supports [267.Controller.GetVictoryPointName_12769]'s programmemes in return."
 afghanistan_events.26.a:9 "Amanullah is happy to support a modern-minded ruler."
 afghanistan_events.26.b:9 "Send our congratulations, but nothing more."

 afghanistan_events.27.t:9 "Our Dir Brothers"
 afghanistan_events.27.d:9 "Shocking, but thankfully unimpactful news has been received from Pashtunistan, with the State of Dir experiencing an attempt at overthrowing the reigning Alamzeb Khan, carried out by his brother and former ruler Mohammad Shah Jahan Khan. During the Afghan takeover of Pashtunistan, Jahan Khan's attempts to remain loyal to his British benefactors resulted in his overthrow and subsequent exile by Alamzeb, who has so far remained a loyal toadie of Amanullah and perhaps his greatest bulwark of support in the frontier. Jahan's latest incursion was dispersed immediately by Alamzeb's own forces, but his plotting brother has yet again managed to evade capture back to [RAJ.GetNameDef]\n\nThe revolt does underscore Alamzeb's waning hegemony, however. Jahan's forces were purportedly staffed in part by Indian revolutionary mercenaries looking to make a buck who recruited a number of dissidents in Dir itself. Alamzeb is requesting an infusion of funds to improve his forces and expand Dir's police state, and while this would help entrench a loyal ally it would also reinforce the most backward of the Pashtunistan princedoms."
 afghanistan_events.27.a:9 "A strong Eliteheer for a strong Dir."
 afghanistan_events.27.b:9 "No coins for the Khan, we're afraid."

 afghanistan_events.28.t:9 "Treasures of Bagram"
 afghanistan_events.28.d:9 "Wonderful news! We have recently discovered a vast collection of artifacts in the city of Bagram, which is located near the ancient city of Kapisa. The discovery and excavation was conducted in a joint effort between Afghanistan's National Museum and the Ethnological Museum of Berlin.\n\nAfghanistan is home to centuries of rich history, spanning from the ancient empires of Persia, to the conquests of Alexander the Great and his successors, all the way to the arrival of the Prophet Muhammad. Particularly, Bagram is located near the city of Kapisa, the ancient capital of the Kushan Empire that ruled over the area in the last few centuries prior to the birth of Muhammad.\n\nThe effort was spearheaded by a one Theodor Bartus, a known archaeologist and museum curator famous for being the technical head of the German archaeological expeditions in Turfan. Bartus's expertise in excavation proved to be incredibly useful to both German and Afghan site workers, as extensive work was needed to uncover a storeroom. Once uncovered, Bartus and the team discovered a wide range of artifacts, including glass, bronze and plaster sculpture works from the Hellenistic period and even the far-flung Roman Empire. Most notably, the team came upon a collection of ivory carvings, plaques and figures, dating back to the Kushan Empire of the first and second century CE. Already talks between Afghanistan and Germany have begun, determining what artifacts are to remain in Afghanistan and which are to be sent to Berlin. For now, the archaeology world rejoices at such an exquisite find."
 afghanistan_events.28.a:9 "A fantastic find for the National Museum."

 afghanistan_events.29.t:9 "The Crisis in Turkestan"
 afghanistan_events.29.d:9 "A crisis has arisen in Turkestan, as several Turkic states have banded together in a coalition against the state of Bukhara. This situation is surely to be exacerbated by eventual intervention from Russia. While we are unsure of the exact details of the conflict, we know that we must take a side. The question is, who should we side with?\n\nOn one hand, our relationship with several of the states in the area is preidcated on our shared Muslim faith, and a dedication to anti imperialism, no matter who it comes from. On the other hand, Russia's intervention on behalf of Bukhara is not without merit, as they have historically considered the area to be within their sphere of protection. Regardless, it is likely that this conflict will result in severe economic and political ramifications for the entire area."
 afghanistan_events.29.a:9 "Send aid to our fellow mujahideen."
 afghanistan_events.29.b:9 "We must help the Russians maintain order."
 afghanistan_events.29.c:9 "We have enough of our own people to use those guns on."

 afghanistan_events.30.t:9 "Aide de l'Afghanistan"
 afghanistan_events.30.d:9 "Bonne nouvelle : nous avons récemment reçu une cargaison d'armes du gouvernement afghan. Notre relation avec l'Afghanistan a toujours été équitable, notre Foi commune étant une base solide, mais elle s'est dégradée ces dernières années à la suite d'accusations de leur part concernant notre prétendu accueil de dissidents et de contrebandiers.\n\nCependant, cette livraison nous rassure sur le fait que malgré ces contretemps, nos frères musulmans d'au-delà des montagnes sont toujours nos amis."
 afghanistan_events.30.a:9 "Assurez-vous d'informer Amanullah de notre gratitude."

 afghanistan_events.31.t:9 "Refugees from Central Asia"
 afghanistan_events.31.d:9 "As predicted, the war in Central Asia has resulted in a humanitarian crisis, and we are no better from it. The struggle amongst the Turkic and Russian forces has created a caravan of refugees, many of whom have fled to our country in search of safety. Naturally, we have opened our borders to shelter our weary neighbours. Unfortunately, this has created several problems we have to deal with. The most striking being that their settling in our lands exacerbates ethnic tensions amongst Turkic and Pashtun populations, with northern provinces seeing a rise in violence and unrest.\n\nWhat is even more concerning is the ideology of some of the refugees: Central Asia has always been a scholarly centre for much of Islam, but many a Mullah today turns towards a radical form of Pan-Islamism, the very kind that the Saqqawists and othe reactionaries have aligned themselves with. As a result, many refugees have joined amongst the ranks of Saqqawist bandits, motivated by radical beliefs and desperation in the face of destitution. Our national government has done what we can to alleviate such a crisis, but many have begun to sympathise with the day the war is over so that we may begin returning these people back to their country."
 afghanistan_events.31.a:9 "Let's hope their stay here is short."

 afghanistan_events.32.t:9 "The King in Your Home"
 afghanistan_events.32.d:9 "Although regarded at first as little more than one of Amanullah's pet fancies, radio has surprisingly had significant staying power in Afghanistan, with the nation's first radio station continuing to run out of [267.Controller.GetVictoryPointName_10737] palace since its establishment in 1925. For fans of the radio, and perhaps soon to be fans, today's announcement should bring great joy, as the installation of a new transmitter has finally finished. This new 20 kilowatt transmitter is said to allow the station to operate at 600 kHz, a figure the King is said to be greatly impressed with, even if he is a bit fuzzy on what that exactly means.\n\nMore importantly than the technical details however is that the new transmitter is said to also allow the station to broadcast to the farthest reaches of the nation, even as far as the Zaranj border post. The King, excited by the prospect, was quick to issue a prepared speech on the radio, going out for the first time to all of his subjects (or at least the few with radio access). It seems that no more shall the monarch simply be the man on your coins, every man and woman will soon get to know him and his voice personally, in the way only a generic and indirect radio broadcast can truly provide."
 afghanistan_events.32.a:9 "The wonders of modern technology."

 afghanistan_events.33.t:9 "The Benefits of Japanese Agriculture"
 afghanistan_events.33.d:9 "It has been yet another year of diplomatic exchanges between Afghanistan and Japan, and relations could not be better. To the untrained eye, there does not seem to be much held in common between the mountainous Afghanistan and Japan, an island country on the edge of Asia. However, looking closer, the two are like brothers: both are monarchies that have pushed hard for modernisation, both countries had to assert themselves against encroaching European powers, and both countries understand the profitability of investing in Afghanistan.\n\nOne paricular cooperation between the two countries is on the subject of agriculture. Several years ago, Japan sent envoy Mitsuo Ozaki to [267.Controller.GetVictoryPointName_12769], along with a team of engineers and agricultural technicians. Ozaki, an expert in agriculture and forestry, has been working hard surveying locations such as [1117.Controller.GetVictoryPointName_5064] and [267.Controller.GetVictoryPointName_12831], and presented the Afghan government with a collection of materials on ways to improve our agricultural efficiency, announcing his desire to stay and oversee these efforts. Joining him will be representatives from the Japanese company Mitsui, looking to invest in our economy. It is clear from Ozaki's efforts that an ongoing relationship between Japan and Afghanistan will be incredibly lucrative for all."
 afghanistan_events.33.a:9 "Perhaps he can show the King about those \"bonsais\" next."

 afghanistan_events.34.t:9 "A New Generation of Mullahs"
 afghanistan_events.34.d:9 "In light of the instability in Transcaspia and Transoxiana to the north, students studying Islam at the Madrasahs in Bukhara have returned to their homes early. Prior to state efforts at expanding domestic theological education, Afghan prospects traveled to institutions in India and Bukhara to learn and qualify themselves to become religious scholars and Mullahs, however with the construction of a few new institutions Afghanistan now possesses the capacity for their education to continue at home. It is of additional help that some of their educators fled here and have resumed their duties at our Madrasahs instead.\n\nNew generation notwithstanding, they share much of the same apprehension toward Amanullah's westernisation programmes as the Ulema do. Many believe that, as a self-proclaimed \"Defender of Islam\", Amanullah should have taken more proactive action in defending Central Asian Muslims from Russian imperialism. As far as Amanullah is concerned, it feels like even if he were to declare a Jihad against the Russians and somehow liberate every Muslim across all of Earth, the conservative establishment would still proclaim that he doesn't do enough for Islam."
 afghanistan_events.34.a:9 "When has anyone ever listened to students?"
 afghanistan_events.34.b:9 "The Ulema must know that nobody loves Allah more than Amanullah Khan."

 afghanistan_events.35.t:9 "The Veil of the Unveiling"
 afghanistan_events.35.d:9 "In October of 1928, Amanullah Khan gave a speech proclaiming that Islam does not dictate that women must cover their faces. As he uttered these words, Queen Soraya stood and removed her veil from her face in front of a massive crowd, with several other women attending the speech following suit. A tremendous message was delivered that day; Amanullah's Islamic modernism and Westernisation efforts would under no circumstance leave women in the dust. The royal women thenceforth served as an example and an inspiration for unveiling, despite no official decrees outlawing use of the face veil and \"chadari\" (commonly known as the burqa).\n\nOver a decade later, unveiling has failed to penetrate Afghan society in any meaningful way. There have been modest attempts at prohibiting the veil in [267.Controller.GetVictoryPointName_12769] as there were in [267.Controller.GetVictoryPointName_10737], but this has really only affected Afghan high society. Everywhere else down to the village level has completely disregarded the anti-veil push. In an effort to resurrect the issue, Queen Soraya has initiated a speaking tour aimed at promoting the denunciation of the veil in the other major settlements of Afghanistan. This tour has seriously outraged the Ulema and conservatives across the nation have called on Amanullah to rein in the Queen."
 afghanistan_events.35.a:9 "The voice of liberation will not be silenced."
 afghanistan_events.35.b:9 "We should streamline the tour before we burn too many bridges."

 afghanistan_events.36.t:9 "The Enduring Mojadidi"
 afghanistan_events.36.d:9 "After his victory in the Civil War, King Amanullah thought he was finally free to reform the nation in his image. Yet, despite the waves of positive reception to his reforms, there stands a legion of naysayers guided by a single man, a rallying point for those who cling fanatically to tradition: Fazl Omar Mojadidi.\n\nMojadidi, like many of his ancestors, is among the most prominent of the country's Ulema, leading his influential family as well as the nation's branch of the Naqshbandi Order. Pious, wise, and incredibly outspoken, Mojadidi and his advocacy for Sharia law reaches across the country, with many seeing him as a champion of Islam in an era where our faith is in crisis. There have always been rumours of connections between Mojadidi and the anti-Amanullah extremists of the Saqqawist movement, especially as both are vocal critics of our reforms, but alas, nothing concrete enough has been found to justify getting rid of him.\n\nFor as long as Afghanistan has been on the path of modernity he has been attempting to drag it back, with him personally to blame for almost all opposition to the Wardak Report amongst the elites a few years prior. In more recent weeks, Mojadidi has continued to make public statements against the government, declaring our programmes both \"atheist\" and \"syndicalist\", while claiming that Amanullah is being misguided by Western fools. Although Amanullah's reign is stronger than ever, we are stuck listening to the so called \"Hazrat Nur al-Mashayikh\" prattle on, though we shall watch him closely, eager to silence the impudent cleric."
 afghanistan_events.36.a:9 "He'll slip up one day..."

 afghanistan_events.37.t:9 "The Inevitability of Corruption"
 afghanistan_events.37.d:9 "Conservative newspapers have begun harping on the malversation of many of our provincial officials, highlighting cases of bribery and in multiple instances the arrant flaunting of wealth in comparison to the usually poor conditions of those they govern. One bejeweled tax collector possesses a vast, manicured estate with a western-style mansion in a region dominated otherwise by pastoral herders. The conservative press and by extension their target audience have for a long time bemoaned and decried the provincial system as being fertile ground for little other than graft. Such bureaucracy to them encourages thiefdom and kleptocracy and it is frequently said that the most honourable men are inevitably doomed to conform to the system of corruption that Amanullah pretends he does not see.\n\nMost of these administrators owe their status to the King, and they know it. Loyalty matters a lot, and part of the reason why the issue hasn't been tackled except in the most outrageous cases is to prevent jeopardising government unity and the creation of more political enemies. But does corruption not undermine the image of Afghanistan that Amanullah has strived so hard to construct? Are we not betraying the people by permitting this to continue? Is the wealth of these officials not extracted from what is rightfully ours?"
 afghanistan_events.37.a:9 "Subornation is subordination, carry yourselves modestly or else."
 afghanistan_events.37.b:9 "They do a good job and they're reliable, let them eat cake."

 afghanistan_events.38.t:9 "Parliamentary Proposal Prepared"
 afghanistan_events.38.d.start:9 "Bureaucracy has never been described by anyone as fast, but few would be forgiven for being exhausted with how long attempts to institute a National Assembly have been going on for. Now over a decade since discussions first began, we may be at last seeing the light at the end of the tunnel. With issues surrounding the Pashtunistan government no longer a roadblock, and things at least stable enough to institute such changes, an actual finalised proposal has at last been approved by the King.\n\nUnder proposed plans the National Assembly, the Shura-e Milli, "
 afghanistan_events.38.d.end:9 "Members will serve for three year terms, with a large array of de jure powers laid out for the Assembly. To keep its members in check a second body known as the Senate, the Majlis-i-A'yan, is also set to be established, with 25 members appointed directly by the King. Both will have the right to propose legislature, although only passing with the approval of both, with the King personally resolving any deadlock between the two.\n\nWith Amanullah's approval the groundwork on implementing these plans has already begun, leading to hopes that parliament will be opened by the King not long after his return from Europe. Assuming all goes well, this time next year the King will at last have the parliament he has long hoped to institute."
 afghanistan_events.38.d.pashtunistan:9 "$afghanistan_events.38.d.start$is to be composed of 135 elected seats on a national level. 111 of these seats are initially set to be distributed across the heartlands, with a further 24 in the Frontier. $afghanistan_events.38.d.end$"
 afghanistan_events.38.d.nopashtunistan:9 "$afghanistan_events.38.d.start$is to be composed of 111 elected seats on a national level, spread across the provinces by population. $afghanistan_events.38.d.end$"
 afghanistan_events.38.a:9 "The King shall return to a new era!"

 afghanistan_events.39.t:9 "The Cotton King of Kunduz Passes On"
 afghanistan_events.39.d:9 "Afghanistan has lost one of its greatest entrepreneurs today, with the passing of Abdul Aziz Londoni. His mercantile career kicked off in the latter stages of the Weltkrieg, where he made several risky but highly profitable trades with Qarakul skins, kicking off a major industry for Afghanistan and establishing a consistent buyer in London, to which Abdul Aziz earned his namesake from. With Russia's Uzbek cotton markets in bedlam, he pounced on the opportunity and established a lucrative deal which established a highly profitable line of cotton from the Amu Darya to Moscow. Londoni saw the potential of this \"White Gold\", and promptly with the assistance of foreign machinery, partnerships and settlers in the aftermath of the first Saqqawist Insurrection made incredible strides toward clearing the Malaria-infested swamps which made Kunduz an infamous death trap.\n\nThe Afghan Civil War and the resulting stressors of ensuring the cotton industry's sustaining health contributed to a heart attack that Londoni unfortunately did not survive. Though his enterprises have passed on to those who shared his vision from the beginning, Afghanistan has nonetheless lost an economic genius and an industrial pioneer."
 afghanistan_events.39.a:9 "Indeed, we belong to Allah, and indeed, to Him we will return."

 afghanistan_events.40.t:9 "Advent of Non-Pashtun Capital"
 afghanistan_events.40.d:9 "Through the growth of the national bank, we have witnessed the rise of capitalism in almost all reaches of Afghanistan. Commercial enterprise flourishes not just in [267.controller.GetVictoryPointName_10737], [267.controller.GetVictoryPointName_12769], and other important trade cities, but in the regions of Qataghan, [1117.Controller.GetVictoryPointName_5064], [1117.Controller.GetVictoryPointName_2017], and even in the reaches of Nuristan and Maymanah. State revenues are slowly diversifying from their prior chief makeup of livestock taxes and other forms of direct taxation toward indirect taxes and duties on exports.\n\nPashtuns, having formally dominated the economy, have begun to witness their monopoly slowly disintegrate in the face of Uzbek and Tajik enterprise. Their success, among other non-Pashtun businesses, has raised some alarm for the displacement of Pashtun cultural hegemony. Ethnonationalists who aspire to a strong, united Pashtun cultural identity for the whole of Afghanistan clamour for something to be done about the spread of Uzbek and Tajik culture. It has been recommended that the bank's activities be restricted so that it becomes more difficult for these entrepreneurs to obtain loans and investment. While this would unfortunately stymie Afghanistan's economic growth, it would please the nationalists and provide us with more oversight over the bank's activities."
 afghanistan_events.40.a:9 "Capitalism must be controlled with a steady hand, lest we lose our identity."
 afghanistan_events.40.b:9 "Good business begets a good economy, good economy begets a good nation."

 afghanistan_events.200.t:9 "Foundation of the Pashtun Democratic Party"
 afghanistan_events.200.d:9 "Amid the first national election in Afghan history, many have strenuously put forth candidacies and parties to fill the political and administrative black hole where autocratic monarchism once stood. Emerging from this quagmire of politics is Ghulam Mohiuddin Arti and his new party, the Hezb-e Demokratik Poshton.\n\nKnown in English as the Pashtun Democratic Party, Arti's new party is the culmination of modernist reforms across the Islamic world, yet without the personality cult of Amanullah. Taking inspiration from both Enlightenment-style liberalism and nationalism, as well as Mustafa Kemal Gelibolu's OHF and the Indian AIHRP; the Pashtun Democrats advocate for the modernisation of our economy and the continued progress towards a fair and equal society.\n\nAmongst the constituents of Arti's latest foray into politics are allies of the former King Amanullah, exiled democratic activists from India, the Afghan Intelligentsia, and our steadily growing middle class. While Arti's party has yet to stand on its own legs in an election, it is safe to say that the coalition it has forged operates smoothly, representing a sense of reformed continuity with the Amanite years. With ample sources of funds and a dedicated body of advocates to reach out to voters; regardless of the party, this coalition seems like it is here to stay."
 afghanistan_events.200.a:9 "Can Amanites succeed without Amanullah?"

 afghanistan_events.201.t:9 "The Party for Modern Moderates"
 afghanistan_events.201.d:9 "For every victory progress etches into history, the forces of tradition and reaction adapt and persist in their new environment. Here, the aristocratic and the pious of Afghanistan have found their champion, former Minister of Commerce and diplomat Abdul Hadi Dawi.\n\nDawi was not always a man who counted Ulema and tribal leaders as his allies. Coming from a background in the newspaper business, Dawi was a committed ally of Amanullah, serving as his Minister of Commerce to push for economic and political reforms for the country. Yet, Dawi was also much more hesitant in comparison to his colleagues, believing in a much more gradual approach to modernisation. This disagreement came to a head when Dawi resigned over the more feminist aspects of modernisation, seeing it as a step too far too quickly; and his subsequent political exile when reassigned as a foreign ambassador by the King in the following months.\n\nNow working within a new Afghanistan free from Amanullah's whims, Dawi has taken the opportunity to reflect his views on a national level, founding the Hezb-e Islami Afghanistan, or the Islamic Party of Afghanistan. The Islamic Party frames its steadfast commitment to democracy as a commitment to the people who overwhelmingly are guided by Islamic values, rather than for progress for its own sake. The Islamic Party counts support from groups ranging from the rural peasantry to the Kabuli elite, and from the lowest tribes of the nation all the way up to the ever-present Ulema. Dedicated to rolling back overambitious programmes inspired by feminism and secularisation, while staying faithful to the political and economic liberalisation of the state, it seems that the once zealous opposition to progress have ultimately moderated, accepting many reforms as the norm, and pushing for what they see as a \"middle ground\"."
 afghanistan_events.201.a:9 "Will such a middle ground be palatable to voters?"

 afghanistan_events.202.t:9 "The First National Elections"
 afghanistan_events.202.d:9 "Excitement buzzes in the air, as today marks the first election for the National Assembly since the establishment of our new constitution. It is a historic day, as many believed this would never happen, some even hoping it never would. Yet, in spite of those who doubted the nation, Afghanistan stands proud as another country with a mandate from the people.\n\nSo far the vote seems to be between the Pashtun Democrats and the Islamic party. Both parties have campaigned hard, trying to convince others that their vision for the nation is the best path forward: Ghulam Mohiuddin Arti and the Democrats have promised to push for further liberalisation, while Abdul Hadi Dawi rallies the Muslim vote to ensure that reforms do not trespass against the tenets of Islam. Many still flock to the polls to cast their first ever vote, but we shall soo have ourselves a new government. The question remains, who will lead it?"
 afghanistan_events.202.a:9 "The Pashtun Democrats secure victory."
 afghanistan_events.202.b:9 "The Islamic Party wins the vote."

 afghanistan_events.203.t:9 "Afghanistan Goes to the Polls"
 afghanistan_events.203.d:9 "It has been three years since our last election, and once again Afghanistan proves to be a nation ready for the torch of democracy. The vote seems to once again be between the liberalisation-oriented Pashtun Democrats, headed by Ghulam Mohiuddin Arti, and the more conservative Islamic Party, led by Abdul Hadi Dawi.\n\nBoth parties continue to campaign hard, arguing that the mandate of their rule must be continued, or, as the insurgents, the current government is not doing enough for the nation and its people. Once again, the election is close, begging the question: who will shepherd the fate of the nation?"
 afghanistan_events.203.a:9 "The Pashtun Democrats secure victory."
 afghanistan_events.203.b:9 "The Islamic Party wins the vote."

 afghanistan_events.204.t:9 "Shifting the Blame"
 afghanistan_events.204.d:9 "Despite Amanullah's death solving a large deal of our issues, it has left us with new issues to resolve; finding someone to blame for his assassination, and the religious establishment remaining steadfast against any level of reformism. Fortunately enough, with enough clever thinking, these issues can easily cancel each other out.\n\nAfter the arrest and torture of two associates of the Mojadidi family, a full confession has been given, declaring that the late King's murder was orchestrated by Fazl Omar Mojadidi. As the story goes, despite Amanullah's attempts to regain his support, Mojadidi believed the King would simply turn his back on him the second the nation began to stabilise. Men paid by Mohammad Sadiq Mojadidi then infiltrated the royal palace and carried out the deed, aiming to ultimately secure the installation of Hashim Khan as a more palatable monarch.\n\nBoth of these men, alongside other prominent members of the Mojadidi family and non-familial associates, have now been arrested. Execution orders have been given for Mohammad Sadiq and those less prominent, however they have been stayed for Fazl Omar to avoid a repeating the mistakes of the Khost rebellion. Exile is expected for him, at last ridding us of two birds with one stone."
 afghanistan_events.204.a:9 "Amanullah should have had them all shot years ago."

 afghanistan_events.205.t:9 "Pacts in Pashtunistan"
 afghanistan_events.205.d:9 "Although the recent elections proved to be quite competitive in the urban areas of the heartlands, and in some of the rural areas with notable enough turnout, the same cannot be said for the Frontier. Despite both the Democrats and the Islamic Party campaigning in the Frontier, virtually every seat was won instead by local parties, benefitting greatly from years of established presence. The [AFG.GetRulingParty] has been able to form a government in spite of this, however it seems likely there will have to be cooperation with parties on the Frontier to ensure a smooth passage of legislation.\n\nTo that end, discussions are ongoing between the government and the Frontier parties on their exact place within the new all-Afghan democratic system, with the opposition holding similar talks as well. At present, it seems that the AIA is likely to find itself aligned with the Democrats, agreeing with them on many ideological matters and being a vital additional support base for the Democrats. The Islamic Party on the other hand seem to having great success negotiating with the UMNP, with a meeting between Gandapur and Dawi said to have gone extremely well. Whether these agreements result in full mergers, or simply electoral pacts, it seems at the very least that the Frontier is at last fully integrated into the political system."
 afghanistan_events.205.a:9 "Devolution continues, yet we are closer than ever."

 afghanistan_events.206.t:9 "A New Age of Azadism"
 afghanistan_events.206.d:9 "The Afghan civil war saw the destruction of the Azadist Clique, who poorly chose to throw their weight behind Nadir, yet surprisingly their influence still lingers. Although it was primarily a military organisation, quite a few civilians were associated with the clique, and unlike Momand or Daoud their lack of direct treason gave them little reason to go into exile. These civilian associates, still believers in the Azadist ideology, have at last formed together into a new political party, under the leadership of Ghulam Mohammad Farhad.\n\nFarhad, a former government official mostly associated with electrification, is said to have come into contact with the Azadists through work performed at military bases throughout the years. His alleged favouritism for project approvals towards his new friends saw him dismissed from his posts following Amanullah's restoration, and in the months since he has fully shifted his attention towards political organisation.\n\nHis new party, operating under the name of the \"Afghan Social Democratic Party\" is said to be rather at odds with the common ideas such a name would conjure up. Like the Azadists, Pashtun nationalism and modernisation are their two most ardent positions, although with a larger degree of leftist ideas sprinkled in, such as support for trade unions and welfare policies. The party however stands at odds with many democratic values, opposing universal suffrage, and believing that Afghanistan should solely be a Pashtun state ran by Pashtuns for Pashtuns. Although not expected to contest elections yet at a national level, the party is hoping to gain ground locally, with Farhad planning to run in the next Kabuli mayoral election, a bid many commentators are currently expecting him to succeed with."
 afghanistan_events.206.a:9 "They are neither social, nor democratic, nor an empire...wait that's something else."

 afghanistan_events.207.t:9 "Friends in High Places"
 afghanistan_events.207.d:9 "The civil war brought death and destruction, but for the nation's richest it ultimately proved to be just a few months of an enforced holiday. One such man, Abdul Majid Zabuli, has at last returned to Afghanistan, having had holiday homes overseas to retire to during the conflict. Although no stranger to politics, Zabuli stayed unusually quiet during the civil war itself, chalked up to having allies on both sides of the conflict. Now home however, he has begun to reacclimatise himself to the new political realities, meeting today with the Prime Minister for private discussions.\n\nAt this meeting, it is said that Zabuli expressed his full support for the new government, offering large charitable contributions to any remaining reconstruction efforts. Allegedly however, Zabuli's financial offers did not simply stop at these contributions, and the man is said to have offered to directly bankroll the [AFG.GetRulingParty]. Rather than openly discussing the quid pro quo of the situation, it has simply been implied that in return the government should be expected to ensure certain legislation he just so happens to favour is passed in the coming months. That is of course, if the Prime Minister is willing to make such a deal."
 afghanistan_events.207.a:9 "There is little Zabuli's money can't buy."
 afghanistan_events.207.b:9 "This kind of backroom dealing cannot end well."

 afghanistan_events.208.t:9 "The Rising Star of the Exiled Prince"
 afghanistan_events.208.d:9 "With a large number of the current generation of reformers either dead, exiled, or having abandoned politics all together as a result of the civil war and subsequent purges, many have come to question if anyone from the next will begin to pick up the torch. Within the Democrats it appears at least one firebrand of the next generation has been found, in the form of Shahzada Rehmatullah Khan Durrani, the young exile from Quetta.\n\nEver since Amanullah's assassination, Durrani's profile has steadily been growing, with the young man said to be a favourite of Inayatullah and therefore pushed into prominence. For those who were in the know, this favouritism of a useful ally has come of little surprise, no different than the late Amanullah's favouritism towards Shuja-ud-Daula Ghourbandi, of whose involvement in Habibullah's killing has long been rumoured.\n\nNow part of the Pashtun Democrats, Durrani has quickly risen through the party's ranks, prominently now leading the youth league. His passionate activism for the Democrats combined with his family connections, especially amongst the Sadozai, has many speculating that he is a future prime minister in the making. For now at least however, he seems to be serving effectively in spreading the party's support across the country, and it'll be many years before he is suitable for national leadership, as long as his skeletons stay buried of course."
 afghanistan_events.208.a:9 "A promising young man, but lets hope the rumours stay as such."

 afghanistan_events.209.t:9 "Notre économie"
 afghanistan_events.209.d:9 "Despite the interruptions faced by the civil war, Afghanistan's industry continues to rise, rather than stagnate back into feudal nothingness. Much of this growth has been attributed to major moguls such as Sher Khan Nashir and Abdul Majid Zabuli, who have become the face of national commerce and trade. For some however, rather than representing progress, the increasing influence of these men is instead regarded as a step backwards into despotism, simply devolved to the elites rather than a singular king.\n\nOne of the leading voices when it comes to this criticism has been Representative Ghulam Mohammad Ghobar, an independent affiliate of the Pashtun Democrats. Although once an ally of the Prime Minister and other Democrats, Ghobar declined an offer to join the party on its foundation, having grown disillusioned at the involvement of both foreign and national business magnates in Afghan reformism. Their continued influence into the constitutional era has only further confirmed his apprehensions, and today he has published an article criticising the Democrats known as \"Our Economy\".\n\nIn this article Ghobar takes aim at not only the magnates like Zabuli and Nashir, but also at foreign companies such as Krupp and even Prime Minister Arti for allowing their influence to become so entrenched. According to Ghobar the growth of unfettered capitalism in a previously feudal society has simply allowed renewed oppression of the workers rather than the peasants. His article's primary conclusion states that for Afghan society to prosper, legal protections must be introduced for workers, trade unions must become commonplace, and monopolies must be broken up through legislation and nationalisation. To many his ideas seem one turn away from syndicalism, yet the article is already seeming to have an impact on economic discourse."
 afghanistan_events.209.a:9 "The man's right on the money, we should be open to his ideas."
 afghanistan_events.209.b:9 "Men like Zabuli are the future, they must be embraced."

 afghanistan_events.210.t:9 "Republicanism in a Constitutional Age"
 afghanistan_events.210.d:9 "The idea of simply a constitutional monarchy has long been regarded as a pipe dream in Afghanistan, and that is just when looking at those in the intelligentsia who had even begun to comprehend such a possibility. The idea of an actual republic was considered even more of an impossibility, discounting the bastardised evolution of despotism upheld by Azadist radicals wishing to be the new Savinkov, especially when the \"enlightened absolutism\" of Amanullah was taking the nation by storm.\n\nYet now, with Amanullah dead and buried, and a constitutional monarchy finally in place, perhaps what was once thought impossible may finally begin to have a chance. Members of the Democrats such as Abdul Rahman Loudin have long harboured republican sentiments, and even the Prime Minister is known to have condemned the institution of monarchy in private before. In recent weeks these members have begun to agitate for their cause, beginning with questioning what purpose the monarchy still serves with its power almost entirely stripped away.\n\nAlthough still appealing to prime minister Arti, it appears blindingly obvious that there is little to gain from proclaiming the end of the monarchy tomorrow, and that it would simply serve to set much of the nation against the government in a time where healing is desperately needed. When the time is right however, perhaps when the monarchy's popularity fades, a republic could be a more viable prospect. Quite a few Democrats however have also begun to prefer the current system, and perhaps instead committing to the status quo would be more beneficial."
 afghanistan_events.210.a:9 "A republic must remain on the table, but only once there is the will for it."
 afghanistan_events.210.b:9 "The crown is already defanged, the boat doesn't need to be rocked further."

 afghanistan_events.211.t:9 "New Day, Same Debate"
 afghanistan_events.211.d:9 "Little has been more controversial over the past decade than the status of the veil, and more time has perhaps been spent debating and fighting over the issue than any other in recent years. Even since the former queen Soraya first lifted her veil, people in Afghanistan have fought back against this idea spreading to their women. In those days two of the most vocal internal critics of Amanullah's unveiling policy were Abdul Hadi Dawi and Abdul Rahman Loudin, leading to their disillusionment with Amanullah's rule.\n\nAlthough in Dawi's case his opposition to the veil led him down a more conservatively minded path, taking umbrage with other reformist ideas perceived as too radical, Loudin continued his association with the left in spite of this. Even now however, as the Ministry for Women furthers attempts to spread unveiling to rural areas, Loudin continues his crusade against the idea. The past weeks have been filled with internal party debate over the issue, with opponents arguing it will risk further national conflict, while supporters counter this by asking how things could even get worse at this point. Few however expect this to lead to any policy changes, with the government committed to the changes."
 afghanistan_events.211.a:9 "The worst has already happened, why turn back now?"

 afghanistan_events.250.t:9 "Officialising the King's Party"
 afghanistan_events.250.d:9 "With the elections now weeks away, the Party of Independence and Reform is at last fully beginning to assemble, going from a few lines on paper to an actual functioning political party.\n\nCandidates for every constituency have been selected, with the major constituencies providing votes a choice between multiple FET candidates, although a few rural ones simply have a singular approved candidate. Amanullah's most loyal supporters have been given premium constituencies, with the people strongly encouraged to back the correct candidate on the ballot. It seems at last that the King's grand designs are at last falling into place."
 afghanistan_events.250.a:9 "Who needs any other party?"

 afghanistan_events.251.t:9 "Les premières élections nationales"
 afghanistan_events.251.d:9 "Throughout the nation voters have gone to the polls, with election officials reporting to the government how overjoyed the nation's citizens have been at finally being gifted the right to elect Afghanistan's government.\n\nWithin a few hours the official results are expected to be announced, adjusted as needed, with many waiting with bated breath to see at last the fruits of their democratic duty."
 afghanistan_events.251.a:9 "The Party of Independence and Reform wins!"
 afghanistan_events.251.b:9 "The King's party wins the vote!"
 afghanistan_events.251.c:9 "Victory goes to Amanullah's Party!"

 afghanistan_events.252.t:9 "Afghanistan Goes to the Polls"
 afghanistan_events.252.d:9 "Once again the Afghan people have been blessed with a right to vote, allowing them to show their support for the candidates the government has selected for them, and get rid of those who have run their course in government.\n\nAlthough unofficial turnout numbers appear to be lower than last time, the official reports have praised the outstanding commitment of the people to democracy, with the votes soon to be fully counted."
 afghanistan_events.252.a:9 "The King's party wins once again."

 afghanistan_events.253.t:9 "The King's New Clothes"
 afghanistan_events.253.d:9 "The suit: perhaps the greatest symbol of Western dominance since the pith hat or field gun. For a decade now the only time you would see the King not wearing one is when he donned an army uniform, with it quickly becoming a great symbol of his rule. In the years prior to the civil war, it was even illegal for a man to wear anything else in the capital, even with enforcement being far from universal. Although certainly not the most unpopular thing Amanullah ever did, many of the nation's tribal leaders have long resented being forced to dress like a German businessman every time a Jirga was summoned, being one of the thousand cuts that brought about his temporary ouster.\n\nIt no doubt came as a shock to many in [AFG.Capital.GetCapitalVictoryPointName] then when the king marched out on the streets this week, dressed more akin to a regular goat herder than the Western man he has long portrayed himself as. Some were allegedly so confused by the incident that rumours begun to swirl that someone else had taken the throne once again, with Amanullah unrecognisable in his new robes. It appears as though the King, determined to win back the tribes, has fully abandoned Western wear, and his previous decrees are seemingly now null and void. The idea of not having to squeeze into an ill fitting dress jacket has certainly been well received by the rural elite, however few are convinced that this sudden change of heart is anything but cynical."
 afghanistan_events.253.a:9 "At least they're not invisible."

 afghanistan_events.254.t:9 "Loose Ends and Loose Lips"
 afghanistan_events.254.d:9 "Although the official story of Habibullah Khan's assassination has always been, and will always be, that an unknown assassin killed the late Emir on orders of Nasrullah Khan, the unofficial narrative is much more malleable. For many years there has been rumours, perhaps credible, that the man who carried out the foul deed was none other than Shuja-ud-Daula Ghourbandi. For many years there has also been even less credible rumours that Amanullah was the one to order the killing, inflamed further by the many promotions Ghourbandi received from the King to cushy positions.\n\nUntil recently, Ghourbandi found himself in one of the highest ranking positions of the Directorate of Intelligence Records, after a long string of policing and security related jobs within government. Unfortunately for Ghourbandi, the Directorate has been a target of Amanullah over recent months, with the King said to blame them for not stopping Purdil or Nadir before they even had a chance to seize the throne. Ghourbandi for once found himself out of a job, and shunned from high society.\n\nLosing his job in such a disgraceful manner has apparently hit the man hard, with many credible reports that he has turned to drink, an addiction so bad he can't even control what is coming out of his mouth anymore. Shockingly in his delusion he seems to have been going around to anyone who will listen, and falsely confessing to having assassinated the late Emir, attributing it partially to personal distain but more importantly partially to an order from Amanullah. Although clearly the false words of a man taking it out on the world, perhaps it is worth sending a few of his successors from the Directorate to make sure he stays silent for good."
 afghanistan_events.254.a:9 "It was terrible to hear of his suicide...wait or was it a robber?"
 afghanistan_events.254.b:9 "Who will they believe, a jaded drunk or their king?"

 afghanistan_events.255.t:9 "Expendable Engineering"
 afghanistan_events.255.d:9 "With work on [267.Controller.GetVictoryPointName_12769] slowly progressing past the stage of simply putting the pieces back together, and into the stage where creative decisions will have to be made, it has become apparent that a new team of architects will be needed if work is to continue. Most of the previous team is now either dead or refusing to return to Afghanistan to continue work, and for the past few weeks attempts to find replacements have been ongoing. With most of [267.Controller.GetVictoryPointName_12769] being designed by Germans, it is only logical their replacements also be German, and so recruiters have been dispatched to attempt to find enough desperate men in Germany for a new team.\n\nUnsurprisingly it hasn't been too hard to find educated German men willing to be somewhere else other than Europe in these trying times, and so a new team has finally been assembled. Outside of the formalities though, one of these men has been suggested as a replacement for the currently vacant position of chief architect, that being one Franz Ruff. Ruff is said to be from a Bavarian architectural family, and claims to be able to expertly mimic the style of Walter Harten, the original project lead of [267.Controller.GetVictoryPointName_12769]. If desired, he may be a fitting pick to fill the vacancy."
 afghanistan_events.255.a:9 "Ah good, hopefully he'll last longer than the last one."
 afghanistan_events.255.b:9 "No, I'm sick of Germans."

 afghanistan_events.256.t:9 "Replacing Rahmatullah"
 afghanistan_events.256.d.start:9 "Although he will never show it, especially to the public, the death of Crown Prince Rahmatullah still hits Amanullah to this day. His favourite son, taken from him far too young by bandit savages, labelled by many a failure rather than the great ruler he was destined to be. Unfortunately for the King, a ruler does not have the luxury to mourn forever, and as morbid as it may be he still has other sons to consider."
 afghanistan_events.256.d.reformist:9 "$afghanistan_events.256.d.start$\n\nWith his wife Queen Soraya Amanullah has fathered four sons, although only one still remains. Rahmatullah's fate is now common knowledge, but many outside of the royal household have slowly forgotten the lives of Saifullah and Hymayatullah, also taken far too young but from disease in their cases. The young Prince Ehsanullah still however lives, brought up alongside half a dozen of sisters, of whom fortunately none have suffered a similar fate to their brothers.\n\nWith Ehsanullah finally getting to the age that Rahmatullah first began to assume royal duties, it appears that it is time for the King to move on, and begin raising his son to be his successor. Not wishing to see the same happen twice, he has ensured that Ehsanullah does not seek a military career, instead seeking to educate him more into the blossoming field of politics. Hoping to continue close relations between the two families, Amanullah has even begun considering his niece Leyla Tarzi as a perfect wife for the prince, with her being the Prime Minister's daughter, a suitable bride for a politics focused prince."
 afghanistan_events.256.d.traditionalist:9 "$afghanistan_events.256.d.start$\n\nOwing to harem era traditions of favouring the primary wife, only the scions of his relationship with Queen Soraya have been historically considered in line to the throne. Yet despite that, the poor public opinion of the Queen combined with linger instability has led to Amanullah to perhaps reconsider this idea. From his first marriage, when he was barely a man, Amanullah Khan fathered Prince Hedayatullah, losing his wife unfortunately in the process. Not expecting to take the throne, Hedayatullah has instead become a rather well known academic in the study of Pashto literature, staying outside of royal politics.\n\nFor a realm that has begun to shift towards celebrating traditional Pashtun culture, who else could be more fitting of a Crown Prince than one so dedicated to promoting it...and one who has stayed quiet enough to avoid generating unwanted enemies. Although not yet moving to officially recognise Hedayatullah as his heir, Amanullah has at least begun the process of grooming him to the position, hoping to have him fully suitable before breaking the news to the Queen."
 afghanistan_events.256.a:9 "Maybe he should stay away from any frontlines, just in case."

 afghanistan_events.257.t:9 "Forming the Nazo Ana Auxiliary"
 afghanistan_events.257.d:9 "For a land where it has long been taboo for a woman to simply leave her home without a man alongside her, the suggestion that one day women might serve in the armed forces would have been regarded as a joke up until a few weeks ago. In times of war, when the men are sent off to the frontlines to fight and die for the nation, it has long been recognised that not every man can actually be sent. To support the armed forces, thousands of men stay behind, coordinating the things that make the army actually tick, such as supply lines and increasingly now radio communications.\n\nMany have long pondered however: why do these roles have to be carried out by men? After all, why waste more bodies on the backlines when they could be out there fighting for the nation. The solution has become increasingly obvious, that a large number of these roles could instead be handed to women. To that end a new scheme has been launched, with the backing of Amanullah's sister Princess Kubrah, to trial a women's auxiliary force to handle administrative and clerical tasks for the men at the front.\n\nWishing to appeal to nationalist fervour, the auxiliary has been named after Nazo Ana, the great Pashtun poet who famously charged into combat alongside the men to protect her home. The scheme's supporters, especially those within the AHN, have praised it as a fantastic way for women to support themselves and remain active while their men are away from home, believing in time many women will choose to sign up in times of conflict. Once the initial trial period is over they hope to expand the idea even further, perhaps even considering a role for women in the Air Force as well."
 afghanistan_events.257.a:9 "Let it be known women can serve the nation just as a man can."

 afghanistan_events.300.t:9 "Arrival of the Brothers"
 afghanistan_events.300.d:9 "The rather sudden turn of fortune experienced by Hashim has been a surprise for all of the Musahiban brothers, to the point that perhaps it would have been Mahmud or Wali made king if they were the ones closest to the capital at the time of Amanullah's demise. All three of Hashim's living brothers, alongside Momand and his men, have finally arrived back in the capital to meet with the King. Discussions on what to do next have been immediate, with none of those present liking the current situation, especially with Fazl Omar Mojadidi slowly attempting to consolidate power in himself.\n\nIt did not take long for all four brothers to agree that the current alliance with Saqqawist remnants and the dominating position of the Mojadidis must remain a temporary affair, and that royal power must begin to reassert itself. Both Wali and Aziz have pushed to begin immediately reigning back in the Sher Agha and reasserting authority, although Mahmud is said to prefer a more restrained approach until things have further stabilised. If however Hashim truly wishes to be King, rather than the next Shah Alam, he will have to make his move at some stage."
 afghanistan_events.300.a:9 "The enemy of my enemy quickly stops being my friend..."
 afghanistan_events.300.b:9 "We are hardly in a position to begin moving against the Mojadidis."

 afghanistan_events.301.t:9 "The King in Kandahar"
 afghanistan_events.301.d:9 "Already weary from the civil war, the death of Amanullah was enough of a shock to see many of his fervent supporters either immediately lay down their arms, or flee the country at the earliest opportunity. Some however have remained defiant, especially those who see an opportunity to stake a claim for themselves. To the south of the capital, the late king's brother in law Ali Ahmad Khan has declared himself Amanullah's successor, with the backing of local tribal leaders.\n\nRather than repeating the successes of Amanullah in raising an army against the rightful king, few have heeded Ahmad Khan's calls, with only a token force operating under the pretender's banner. Even fewer stayed and fought alongside him when the royal army arrived to put down his insurrection, quickly fleeing upon realising how doomed this plan was. Unfortunately for their would-be king, rather than perishing as a martyr for the cause, he was simply wounded and later captured by our troops. He now finds himself being dragged back to [267.Controller.GetVictoryPointName_10737], where he will soon be praying to Allah that he had died in Kandahar instead."
 afghanistan_events.301.a:9 "Hopefully the last of their insolence."

 afghanistan_events.302.t:9 "The City of Sin"
 afghanistan_events.302.d:9 "[267.Controller.GetVictoryPointName_12769]: Once the great symbol of Amanullah Khan's reign, a shining jewel of European ideals stamped next to the former capital, now finds itself to be little more than ruins and rubble, perhaps still rather symbolic of the late King's legacy. With the city being seen as almost an idol that represented Amanullah's blasphemy and destruction, it was reduced to its present state when Saqqawist forces captured it. Although Amanullah began efforts to restore the city during his brief restoration, his death unsurprisingly scuppered all remaining plans.\n\nDespite the nation's radicals seeming content to leave [267.Controller.GetVictoryPointName_12769] destroyed due to what it represents, the more levelled headed cannot disagree more. Amongst the Telai brothers, Aziz especially, the idea of just leaving it as such as the nation rebuilds seems completely asinine. Our \"allies\" have objected however to Aziz's plans, demanding that the city remain a testament to Amanullah's folly and blasphemy, and that we must not begin back down the path he once walked."
 afghanistan_events.302.a:9 "The city is ours to rule, not ruin."
 afghanistan_events.302.b:9 "It shall stay a ruin for now."

 afghanistan_events.303.t:9 "The Continuity Cabinet"
 afghanistan_events.303.d:9 "The combination of both the civil war and the swift Musahiban restoration has virtually eliminated all traces of the previous Amanite administrations. Most ministers from the Amanullah years find themselves now in a ditch, or refugees in the lands of the Turks, with the jury still out on which of them suffered a worse fate. Despite however the old king favouring loyalist cronies for cabinet positions, a few of his ministers surprisingly both owe little loyalty to the man over the state itself, and are actually good at their jobs.\n\nTwo of these men, Ali Muhammad Khan and Faiz Khan Zikeria, have been offered their old jobs back owning to their effective work and non-partisan nature. Their ties to Momand and his Azadist allies have certainly further cemented the King's confidence in their loyalty to the realm. Unsurprisingly however, the Hazrat Nur al-Mashayikh has objected to this idea, believing all those who worked for Amanullah to be tainted. Mojadidi, from his self appointed position of authority, has demanded that these men be removed at once, and be replaced with members of the ulema appointed by himself."
 afghanistan_events.303.a:9 "We're not in a position to turn down good men."
 afghanistan_events.303.b:9 "Even the most incompetent mullah will do the job better than these lackeys."

 afghanistan_events.304.t:9 "Mojadidi's Proclamation"
 afghanistan_events.304.d:9 "Although solely appointed as Interior Minister one would think that Fazl Omar Mojadidi had crowned himself with the way he has been acting since Hashim's ascension. Over the past few days especially he has reportedly begun giving grand speeches in [267.Controller.GetVictoryPointName_10737], stated to be official government policy.\n\nMany of these policies have however come as a shock to the King and his brothers, who have been informed of them through second hand reports of the Hazrat Nur al-Mashayikh's speech. It seems that unless something is done, the man will just continue to get bolder and bolder..."
 afghanistan_events.304.a:9 "Who died and made him the king?"

 afghanistan_events.305.t:9 "The Matter of the Azadists"
 afghanistan_events.305.d:9 "As one of the most steadfast allies of the Musahiban, the appointment of Mohammad Gul Khan Momand as head of the armed forces has long been planned, even before the death of Nadir. Since Hashim's ascension however, the plan has yet to be executed, owing almost entirely to stiff opposition from Fazl Omar Mojadidi and his supporters. To them the Azadists, who Momand leads, are guilty of the same sins of anti-Islamic westernisation that Amanullah met his end over.\n\nNot only has Mojadidi gone as far as demanding that Momand be blocked from leading the army, he has taken a step further and called for the expulsion of all Azadists from the armed forces, to \"purify\" them. Although perhaps they are right in regards to the Azadists being incompatible with our current direction, it can hardly be worth purging so many competent men from our armed forces, especially those so closely allied to the King."
 afghanistan_events.305.a:9 "There is no man better for the job than Momand."
 afghanistan_events.305.b:9 "Hold off on the promotion, but keep the Azadists around."
 afghanistan_events.305.c:9 "They are no better than Amanullah, get rid of them."

 afghanistan_events.306.t:9 "Purging of the Syndicalists"
 afghanistan_events.306.d:9 "When Amanullah Khan first presented his constitution in 1923, it was the Hazrat Nur al-Mashayikh who first openly criticised it as a syndicalist document, decrying it in the middle of the bazaar. Since then he has rallied against so called \"syndicalist liberals\" who aided Amanullah in creating it, regarding them not just as a threat to the nation but to the entire Islamic world. Even after our token response to his calls to expel Amanite ministers, it appears that Mojadidi is not yet satisfied.\n\nEven now, more of the men who once served Amanullah find themselves in our current government or working alongside it, having been regarded as skilled non-partisan actors. The Sher Agha however has come down hard, and called for a total break from the Amanite years, doomsaying about potential syndicalist infiltration if not quickly dealt with. Whether or nor we wish to give in to these further demands is a decision only the King can make."
 afghanistan_events.306.a:9 "Purge these degenerate westernisers."
 afghanistan_events.306.b:9 "Those who genuinely aim to improve Afghanistan must be worked with."

 afghanistan_events.307.t:9 "The Islamic State"
 afghanistan_events.307.d:9 "The Sher Agha is not the only religious leader in the Islamic world to hold the views that he does, a fortunate or unfortunate factoid depending on your opinions on the man. In neighbouring India, the scholar Abul A'la Maududi has been both a great inspiration and great peer for Mojadidi, with both men regularly communicating with each other, especially on topics of Islamic governance. On the invitation of Mojadidi, Maududi visited Afghanistan earlier this week, a visit agreed upon without the King's personal input.\n\nThe primary topic of discussion between these two religious leaders concerned Maududi's recently developing ideas of an \"Islamic State\", creating what he believes to be a nation truly based on Sharia without the corruptions of modern society. Under his vision Islamic law would be the sole law, where anti-Islamic practices such as usury or ikhtilat are treated as crimes against Allah, rather than being accepted as just the realities of modern life.\n\nUnsurprisingly Mojadidi has greatly approved of such a vision, believing it to be what the Afghan state should actually be reforming towards, rather than the Western and secular vision once upheld by Amanullah. Within the non-Mojadidi led parts of government however, this vision has been torn apart as incompatible with reality, with ministers condemning Maududi's positions on economics especially as borderline illiterate, and a vision we must strive to avoid letting happen."
 afghanistan_events.307.a:9 "Maududi's grand vision is one we should strive towards."
 afghanistan_events.307.b:9 "An Indian quack who doesn't even believe in economics isn't worth listening to."

 afghanistan_events.308.t:9 "The Voice of Truth"
 afghanistan_events.308.d:9 "Although the Hazrat Nur al-Mashayikh may be the most prominent Mojadidi in the political realm, the rest of his family find themselves doing their own part to shape the government towards their vision. Mohammad Sadiq, alongside Fazl Omar's own son Muhammad Ibrahim Mojadidi, have worked hard for months now to begin production of a new government sanctioned newspaper known as the Neda-e-Haq, the Voice of Truth.\n\nPolitical newspapers are nothing new to Afghanistan, but the Mojadidis seemingly hope that in time their paper will be the sole source of truth throughout the nation, whatever they decide the truth shall actually be. Allowing them such unfettered control is hardly a popular proposition in the palace, with Hashim's brothers wishing to take over the paper instead to ensure it is their version of the truth being distributed by the government. Moving against Fazl Omar's own son will be seen as a direct provocation however, and Hashim has begun to consider whether it may be best to avoid doing so, or to alternatively appoint oversight to the paper to ensure they print the actual truth, even if that comes at the detriment of both parties."
 afghanistan_events.308.a:9 "The only truth is the King's."
 afghanistan_events.308.b:9 "It would be unwise to interfere."
 afghanistan_events.308.c:9 "Ensure they print the unbiased truth."

 afghanistan_events.310.t:9 "The Cabinet Reshuffle"
 afghanistan_events.310.d:9 "With his power continuing to slip with each passing month, the great influence Fazl Omar Mojadidi once had over the government now seems like a distant memory. Rather than the silent power behind the throne he has long imagined himself as in his head, the King's constant moves against him and his ideas has slowly eroded away what little power the man actually held.\n\nThe final blow against him has come today, with Shah Wali Khan now set to replace him as Interior Minister. The once great Hazrat Nur al-Mashayikh, now just another mullah, is set to be reappointed as a foreign ambassador, the traditional polite way to exile someone in Afghan society."
 afghanistan_events.310.a:9 "It'll be nice to finally be rid of him."

 afghanistan_events.311.t:9 "The King's Power Fades"
 afghanistan_events.311.d:9 "Even with the best efforts of the Musahiban brothers, it seems that the rule of the Mojadidis is not so easily broken. More and more policies going their way over the recent months have allowed the Sher Agha to completely cement his grip over the government, to the point that further action against him is now perceived as too dangerous to consider.\n\nRather than risk retaliation and potential dethronement for attempting to challenge the power behind the throne, attempts to move against him have simply been shelfed for now. Perhaps one day however, when he makes a mistake or finally leaves this mortal coil, another opportunity may present itself..."
 afghanistan_events.311.a:9 "The Hazrat Nur al-Mashayikh reigns supreme."

 afghanistan_events.350.t:9 "The Prodigal Emir"
 afghanistan_events.350.d:9 "Although many are aware that Amanullah first obtained the Afghan crown through his father's suspicious death, many have slowly forgotten that it did not immediately pass to him. At the insistence of Emir Habibullah's eldest son Inayatullah, the crown instead initially went to the Emir's brother Nasrullah. Within days however the snake Amanullah launched a rebellion against his uncle, forcing Nasrullah's surrender and seizing the crown for himself, promising not to harm Nasrullah in return.\n\nWhat happened next has long been a source of debate, although the commonly accepted theory amongst the nation's elite is that an Ottoman emissary overheard plans to execute Nasrullah and blame him for Habibullah's killing. This emissary reportedly then informed the former Emir, and aided in his escape to the Ottoman Empire, before any soldiers could carry out Amanullah's orders. In absentia Nasrullah was sentenced to death, although no attempts were made to carry out this sentence, with him maintaining a low profile in exile.\n\nNow however, with his usurper having received a taste of his own medicine, Nasrullah has reached out to the new government and simply requested a desire to return from exile to live as a private citizen, hoping to once again see his homeland. Although a rather understandable desire, one to with many hold great sympathy, the potential threat of Amanites reshifting their allegiances to a returned Nasrullah could be too great a risk so soon after the civil war, giving the government plenty of cause to reject his request."
 afghanistan_events.350.a:9 "There is little harm in him returning."
 afghanistan_events.350.b:9 "He'll just plot against us, no."

 afghanistan_events.351.t:9 "The Anti-Yahya Khel Party"
 afghanistan_events.351.d:9 "The flight of pro-Amanullah intellectuals and writers has unfortunately given rise to an organised opposition group for exiles, known as the Afghan Democratic Party. Led by a disparate coalition of leaders, many of whom actively bicker with each other, this so-called \"party\" has a shambolic platform that loosely resembles progressive republicanism. Much of the party brass does not seem to be ideologically devoted to their cause so much as embittered against the Yahya Khel (synonymous for Musahiban).\n\nThe party has landed itself in Lahore, kept aloft by the local emigre community and with some tacit and hands-off support from [891.owner.GetNameDef]. Amanullah's penchant for personalism has, fortunately for us, left him with no clear political heirs, and thus it is unlikely that this organisation can or will present any sort of threat in the foreseeable future. That our neighbours see fit to entertain their seditious finger-wagging is an issue that will only disturb regional diplomacy, however."
 afghanistan_events.351.a:9 "Get a chance, losers."

 afghanistan_events.352.t:9 "A New Coin for a New Dawn"
 afghanistan_events.352.d:9 "The currency of Afghanistan for the last several years has borne the name of Amanullah Khan. Though no currency has ever featured his likeness (for that would imply the King's image competes with that of Allah's, as many Mullahs believe no human form should be depicted in art) there now exists a dissonance between the name on the money and the name on the throne. Per a firman issued by King [ROOT.GetLeader], a resolute campaign to replace Amanullah's name with [ROOT.GetLeader] on the Afghani over the span of the next two years has begun. The government shall begin exchanging outdated currency with the new, melting down the subdivided puls to offset costs for the government mint.\n\nAlthough this housekeeping is necessary, it is going to be a tedious and diligent affair, given how decentralised the kingdom can be. Once his name has been wiped from the coin, it is believed that people will have an easier time seeing the Seraj era as history and the Telai era as the one they're now living in."
 afghanistan_events.352.a:9 "We're making big money moves!"

 afghanistan_events.353.t:9 "The Shinwari Shuffle"
 afghanistan_events.353.d:9 "The Shinwari Tribe, ever so eager for a chance to rise against the government, have engaged in a campaign of guerilla warfare against our outposts and, most concerningly, against dignitaries from foreign nations. Having previously risen against Amanullah at the end of the 1920s, one would think their enmity to his rule would make them predisposed toward Nadir's much more pragmatic reign, but bafflingly so they've declared their intention to be his restoration to the throne. Even if tribal taxation conflicts were most certainly worse under Amanullah, supposedly our continued collection was the trigger for their activities.\n\nA threat to our consolidation as they already are, we also stand to lose out on our carefully crafted diplomatic alliances with the great powers of the world. We have been warned by the ambassadors from our most prominent benefactors that we must contain their insurgency or face repercussions. The elders of the tribe are lukewarm on the efforts of their tribesmen, making them susceptible to the timeless strategy of bribing them.\n\nThat… or we could just shoot a lot of them. That would work too."
 afghanistan_events.353.a:9 "Tribal elders; this is Afghanistan. You can always cut a deal!"
 afghanistan_events.353.b:9 "I've given them enough chances."

 afghanistan_events.354.t:9 "The Victories of Violence"
 afghanistan_events.354.d:9 "Our campaign to forcefully repress the Shinwari tribe's guerilla campaign has succeeded! Over the last two weeks, troops led by Momand have ambushed and dispersed them, tracking them back to their hideaways and eliminating all pockets of resistance remaining in their region.\n\nFor good measure, the Shinwari elders have been exiled to Iran, bottlenecking their influence and setting an example to the other tribes on precisely what dividends resistance will pay out for them."
 afghanistan_events.354.a:0 "Excellent !"

 afghanistan_events.355.t:9 "The Blunders of Bloodshed"
 afghanistan_events.355.d:9 "Unfortunately, our military campaign against the Shinwari insurgency has become much more protracted and costly than what we initially envisioned. While steady progress has been made, this is not an opinion shared by foreign dignitaries.\n\nSeveral diplomats have temporarily abdicated on the recommendation of their home office, and our alleged inability to guarantee their safety has called not only our foreign affairs into question but also the legitimacy of our government."
 afghanistan_events.355.a:9 "We just need time, time and money, and we'll get them off our back."

 afghanistan_events.356.t:9 "Between Probity and Quid Pro Quo"
 afghanistan_events.356.d.body:9 "As Nadir's plans to establish \"Conciliation and Progress Committees\" across the nation pass the initial planning phase, Afghanistan takes another step toward a long-awaited future of unity. These committees, which will function as a judicial intermediary body between the Palace and the Tribes, will make our dealings with the tribes vastly more efficient and will better integrate them into the government framework. Additionally, intertribal disputes and tribunals will be handled through these committees.\n\nWe have a number of options available with which we may staff the committees. Firstly, we may adopt preferential treatment for members of the Mangal and Mahsud tribes, who have demonstrated strong loyalty to Nadir. This would chiefly serve to reward them for choosing the right side of history and ensure their allegiance."
 afghanistan_events.356.d.tradnadir:9 "$afghanistan_events.356.d.body$ Secondly, we can just inject the committees with independent loyalists who possess minimal tribal affiliation, minimising intertribal biases while maximising Nadir's grip on decisions made by the committee."
 afghanistan_events.356.d.reformnadir:9 "$afghanistan_events.356.d.body$ Secondly, we can promote a sense of democratic responsibility and have the tribes all elect their own representatives onto the committees. This would ease rural Afghanistan into democracy and lay the foundation for a more modern and participatory kingdom."
 afghanistan_events.356.a:9 "This world is run on favours."
 afghanistan_events.356.b:9 "Consolidate our influence with loyalists."
 afghanistan_events.356.c:9 "The tribes ought to have a say in their representatives."

 afghanistan_events.357.t:9 "A Not-So-Dim Future for the Dhimmi"
 afghanistan_events.357.d:9 "The Jizya tax, enforced on all non-Islamic Afghan citizens, has finally been repealed by King Nadir. This tax, which had so long served as a tool with which to discriminate against those who did not profess their faith for Allah, severely limited the class mobility of Christians, Jews, Hindus, and even the Zoroastrians. This act has set Afghanistan apart from many other Muslim monarchies, something Nadir has been keen to emphasise and in fact made a show of promoting in a grand conference with several ambassadors. Indeed, this has greatly bolstered Afghanistan's international image, not to mention that several minorities now owe their increased freedoms to the King and thus are counted on to be more loyal than ever before.\n\nNot everyone is happy, especially the Ulema, who are renowned for not being very happy with the government in the vast majority of cases. Accused of selling Afghanistan to Jews and the Christian foreign powers, Nadir's prestige as a defender of Islam appears to have been overshadowed by Amanullah's, who never went quite this far in promoting interfaith egalitarianism."
 afghanistan_events.357.a:9 "Who cares? Give it a few years and they'll forget about it."

 afghanistan_events.358.t:9 "All the King's Men"
 afghanistan_events.358.d:9 "The new legislative makeup, soon to be packed with the King's very own yes-men, fools few but yet provides a reasonable veneer of constitutionalism. The King's faux-commitment to democracy nonetheless, there is observed a burgeoning faction of progressives who, while loyal, make known their dissent to his conservative policies.\n\nThese progressives are made up of former Amanites who were pragmatic enough to lay low during the civil war, disparate liberals opposed to Amanullah's authoritarianism (yet quiet when Nadir is similarly autocratic) and merchants interested in a liberalisation of the market. These progressives are hardly capable of presenting capable opposition and do not register as a threat, but instead manifest as more of a controlled opposition that helps lessen the impression that the legislature is entirely subordinate to the Telai family's whims."
 afghanistan_events.358.a:9 "The opposition defeats itself merely because it exists, and little else."

 afghanistan_events.359.t:9 "Fall Guys"
 afghanistan_events.359.d.body:9 "Though Amanullah's tribal conscription reforms were extremely contentious and a considerable source of unrest for the tribes, we had initially seen the fruits of such a centralised system for the army. As such, the legislature fell in line and the majority voted in favour of retaining it... to the dismay of the tribes.\n\nSeveral tribal elders felt their loyalty to [ROOT.GetLeader] was with the understanding that his reign would bring an end to such a grievous encroachment on tribal autonomy. They've petitioned the King directly, making their anger known, and with such an overwhelming nigh-unanimity a wake-up call has most certainly been had for us."
 afghanistan_events.359.d.nadir:9 "To protect his reputation amidst the tribes, Nadir made a show of intervening in the legislature and proclaiming his support for an end to Amanite conscription and the development of a brand new system, coordinated with the tribal elders directly. While not technically overruling their decision, it practically did anyway as the legislature held another vote and almost unanimously fell in line with Nadir's proclaimed new policy.\n\nOf course, Nadir is going to claim it was his idea all along, and thus will reinforce his image as a protector of the tribes against the excesses of \"urbanites\" who have little regard for the bedrock of Afghanistan's civilisation."
 afghanistan_events.359.d.zahir:9 "To protect Zahir and the rest of the Telai branch's reputation, we have directly overruled the legislature and enforced a system more pliable to the tribes. This was met with muted opposition, as most of them know better than to kick up a considerable fuss against our decisions, but there were indeed a few self-destructively liberal-minded types who have taken their criticisms just a hair too far.\n\nA public affair was made of their open censure by other loyal members of the legislature for verbal offences to the throne, and now it would appear as if any attempt to keep Amanullah's conscription system was the work of insidious neo-Amanite infiltrators, instead of King Zahir and his advisors."
 afghanistan_events.359.a:9 "If the legislature could think for themselves, we'd be in trouble."
 afghanistan_events.359.b:9 "Nice try, but Liberals never win!"

 afghanistan_events.360.t:9 "Cleaner Jails for Meaner Males"
 afghanistan_events.360.d:9 "An inquiry put forth by reformists in Nadir's establishment against the prison system has revealed downright embarrassing and inhumane conditions. Prisoners are fed borderline rotten slop, given slabs of stone to sleep on and guards employ sadistic punishments to keep inmates in line, with security commandant Torah Baz Wazirabadi's brutality being specifically highlighted. Resolving these issues has become a priority, and several reforms have been employed to reduce the mortality rate and hopefully give the incarcerated a chance to exit their sentences with some intention to re-enter society and not track and beat their former tormentors the first opportunity they get.\n\nTo these ends, most of the harsh punishments have been entirely repealed, excluding against the nation's worst enemies, and a new system put in place to promote responsibility among inmates and develop skills they can use when their sentence has concluded. Prisoners are encouraged to sign up for janitorial duties, promoting hygienic conditions and reducing the spread of disease, as well as the construction of libraries and infirmaries to increase the standard of living. Additionally, to improve their performance, a pay increase has been authorised for prison guards and a crackdown on illicit pitfighting and annual auditing will take place to ensure our guardians of the law actually uphold it."
 afghanistan_events.360.a:9 "Afghan prisoners deserve standards."
 afghanistan_events.360.b:9 "...But foreign agents don't necessarily count."

 afghanistan_events.361.t:9 "Brothel Raid in [267.controller.GetVictoryPointName_10737]"
 afghanistan_events.361.d:9 "As part of our efforts to cleanse the nation of unholy, anti-Islamic debasements, an illicit brothel in one of our greatest cities was raided and all of its occupants arrested. As the proprietors, employees, and patrons are to be subject to humiliation, prison, and in some cases the death penalty, we have hit a sort of snafu. A high-ranking member of the army was one of the patrons arrested, obviously unaware of the operation, and after much haggling on his end was set free and allowed to go home without any immediate punishment.\n\nThough the issue could've been over with there in an ideal world, the local police have of course spread the incident as viciously as they could. Rumours are abound that this man was caught in bed with not one, but two prostitutes, both of whom dressed to look like the wives of Amanullah and Nadir! Whether or not that's true, this is tremendously embarrassing for not only our great army, but our nation as a whole! We can either cover this terrible incident up at all costs and punish whoever we can prove is blabbering about this scandal, or instead fire the ignoble moron who got himself caught in the first place."
 afghanistan_events.361.a:9 "Let nobody get away with slandering the army apparatus!"
 afghanistan_events.361.b:9 "...He dares scandalise the Queens? Quarter him!"

 afghanistan_events.362.t:9 "Unequal Taxation"
 afghanistan_events.362.d:9 "War is costly, especially civil war, and Afghanistan is no exception to this fact. Paying off tribal Lashkars and mercenaries, the costs of reconstruction and the purchase of arms from traders, legitimate and illegitimate alike, it all adds up. Tribal taxation was one of Amanullah's greatest and most prolonged challenges, and it's no different for [ROOT.GetLeader]. The tribes which supported our effort to rescue the nation from Amanite excesses have received quid pro quo wherever we can afford; indeed, they have been taxed less than under the Amanullah. But those who supported Amanullah have received considerably less favour, in fact, the fief they pay is disproportionately larger than Telai Loyalist tribes.\n\nFrom the get-go, we've received a number of petitions to rectify how unequal this arrangement is, and though we've happily ignored them for this long, the protesting has become aggravating. Many tribes are now refusing taxation until their grievances are heard, and while they've been subsequently coerced against such measures, it's about time we make a statement on the matter. We can either outright deny there's an intentional bias based on loyalties in taxation, or instead frame it as a \"Destruction Tax\" levied against tribes that supported the Amanite counterinsurrection to fund repairs for the devastation that they supported."
 afghanistan_events.362.a:9 "C'mon, guys, you don't trust the winners to be fair?"
 afghanistan_events.362.b:9 "It should be expected that they pay for what they've broken!"

 afghanistan_events.363.t:9 "Rise of the Westernist Bloc"
 afghanistan_events.363.d:9 "The vast majority of liberals, progressives, and modernists were all run off far away into exile with the rest of the Amanite scoundrels, but farsighted enough to avoid picking sides in the war were able to remain. Nadir has seen fit to make use of the liberals, as with their incorporation into the government comes a healthy public image much appreciable to high-minded foreign diplomats. Of course, some debate around policy is healthy, just so long as these liberals understand that at the end of the day the King makes the final call.\n\nThrough creaking open the floodgates ever-so-slightly, Nadir has allowed the so-called \"Westernist Bloc\" to attain a comfortable minority in the legislature. Ideological uniformity is to be desired among them, however. Federalists who wish to apply the thought of Chinese Warlord Chen Jiongming to Afghanistan's needs, Kemalists who heed the Islamic Modernism of Mustafa Kemal in Anatolia, and many who look to the democratic foundations of the United States as blueprints for Afghanistan's future. Though their contributions are fated to be achingly gradual, who knows how their ideas may contribute to Nadir's vision of the nation in the future?"
 afghanistan_events.363.a:9 "A rudiment of democracy survives in Afghanistan."

 afghanistan_events.364.t:9 "Nasrullah Speaks Up"
 afghanistan_events.364.d.reform:9 "With our acquiescence to his return, Amanullah's exiled uncle, the brief Emir of Afghanistan Nasrullah, has come back to his homeland as a private citizen, settling into a comfortable retirement in a comfortable [267.controller.GetVictoryPointName_10737] residence. Fears that he would serve as a lightning rod for Amanite discontent were quickly put to rest, as the elderly prince quickly and resolutely voiced his loyalty and commitment to the reigning monarch, instead committing himself to his longstanding religious pursuits.\n\nA deeply religious figure, Nasrullah is a recognised hafiz, one who has memorised the entire Qur'an, and he was a longstanding royal ally of conservative religious circles under the late Habibullah. For most of his adult life, Nasrullah spent as much time as he could spare to mingle with Hanafi scholars, and his return from exile has seen him quickly recultivate relationships with the latest generations of religious leaders in the kingdom. Already, he has ingratiated himself as an informal patron of mosques and madrasas, lending a hint of royal tinted legitimacy to various clerics, classrooms, and charities.\n\nIt is from this vantage point that Nasrullah has been tapped by several leading religious figures to voice their concerns and anger regarding Nadir Khan's recent move to dismantle the preeminence of Islamic law. While Nasrullah does not have the king's ear, it is true that his voice is respected by many, even some within Nadir Khan's inner circle. A reserved and soft-spoken figure, Nasrullah has not outright condemned the palace for their actions, but he has privately derided so-called “excesses” in royal policy. There is little point in silencing the old prince, as it would only further inflame religious conservatives. In fact, his gentle protestations, though embarrassing, may serve to vent some of the growing anger in the Ulema."
 afghanistan_events.364.d.trad:9 "With our acquiescence to his return, Amanullah's exiled uncle, the brief Emir of Afghanistan Nasrullah, has come back to his homeland as a private citizen, settling into a comfortable retirement in a comfortable [267.controller.GetVictoryPointName_10737] residence. Fears that he would serve as a lightning rod for Amanite discontent were quickly put to rest, as the elderly prince quickly and resolutely voiced his loyalty and commitment to the reigning monarch, instead committing himself to his longstanding religious pursuits.\n\nA deeply religious figure, Nasrullah is a recognised hafiz, one who has memorised the entire Qur'an, and he was a longstanding royal ally of conservative religious circles under the late Habibullah. For most of his adult life, Nasrullah spent as much time as he could spare to mingle with Hanafi scholars, and his return from exile has seen him quickly recultivate relationships with the latest generations of religious leaders in the kingdom. Already, he has ingratiated himself as an informal patron of mosques and madrasas, lending a hint of royal tinted legitimacy to various clerics, classrooms, and charities.\n\nWith our recent moves to promote piety in our government and among our people, Nasrullah has grown only more supportive of our rule. He has hosted an informal gathering of the religious establishment in his home to push for increased Ulema support for the monarchy, tasking the assembled clerics with promoting and aiding the roll out of these new initiatives. While he remains personally opposed to our concessions to the tribes and the reversal of Amanullah's conscription efforts, there is no question that Nasrullah is contented to be a dignified supporter of the Telai monarchy. He is an elder uncle of the nation, one of the last remnants of the bygone age of Abdur Rahman."
 afghanistan_events.364.a:9 "Let the old man gripe."
 afghanistan_events.364.b:9 "His support is most appreciated!"

 afghanistan_events.365.t:9 "Unmanacling the Mullahs"
 afghanistan_events.365.d.body:9 "Abdur Rahman attacked their influence, Habibullah lent them a cautious olive branch, but then Amanullah clashed and beleaguered them. The Ulema desires, after countless decades, to see a monarchy that might yet lift the boot. [ROOT.GetLeader]'s Afghanistan will right the wrongs of the past and grant the Ulema the privileges that they've deserved. This is not so much an ideological move as much as pragmatic; in the wreckage of Amanullah's reign and during the civil war much of Nadir's support came from the religious establishment, for he had long been one of the most moderate voices in Amanullah's circle. As autonomy not heard of in years has been granted to them, the new constitution is diffused with faith, too. The preamble now starts with \"In the name of Allah, the Most Merciful\" and the official religion is reinforced as being the Hanafi Shari'a of Sunni Islam.\n\n"
 afghanistan_events.365.d.reformistnadir:9 "$afghanistan_events.365.d.body$Though Islam shall play a larger role in the new government, that is not to say Afghanistan has bent to fundamentalism. The new constitution states that \"Shi'a Muslims, Hindus, Jews, and otherwise enjoy protection and shall not be discriminated against on the basis of their faith alone\". These are great signals for the religious minorities, especially the Shi'a Muslims, who usually have to practice Taqiya and cosplay themselves as Sunni Tajiks to avoid discrimination and hold government posts (the reality for a considerable number of civil servants). Nadir has appointed two Shi'as to (albeit symbolic) positions in his cabinet to reinforce his regime's plurality. Though this displeases the Ulema, it would seem most have decided not to raise too much of a fuss, as Nadir has thus far proven to be the best friend they've had from the Barakzai yet."
 afghanistan_events.365.d.tradnadir:9 "$afghanistan_events.365.d.body$Though Islam shall play a larger role in the new government, that is not to say Afghanistan has bent to fundamentalism. The new constitution states that \"Shi'a Muslims, Hindus, Jews, and otherwise enjoy protection provided they do not violate the ordinary rules of conduct and propriety\", albeit these rules are vague and undefined. Though a nice gesture on paper, in practice this means little to the religious minorities of Afghanistan. Most out and open Shi'a Muslims employed by the government can name daily instances of discrimination, and most yet employ the use of Taqiya to deny that they are Shi'a and instead claim to be Sunni Tajiks. In addition to his family occupying almost his entire appointed cabinet, Nadir has appointed two prominent members of the Ulema to reinforce their privileged position in the renewal of Islam in Afghanistan."
 afghanistan_events.365.d.zahir:9 "$afghanistan_events.365.d.body$Though Islam shall play a larger role in the new government, that is not to say Afghanistan has bent to fundamentalism. The new constitution states that \"Shi'a Muslims, Hindus, Jews, and otherwise enjoy protection provided they do not violate the ordinary rules of conduct and propriety\", albeit these rules are vague and undefined. Though a nice gesture on paper, in practice this means little to the religious minorities of Afghanistan. Most out and open Shi'a Muslims employed by the government can name daily instances of discrimination, and most yet employ the use of Taqiya to deny that they are Shi'a and instead claim to be Sunni Tajiks. Unfortunately for them, being a Sunni Tajik doesn't seem to quite cut it anymore, and Zahir's cabinet has cracked down on \"Tajik fifth-columnists\" due to their supposed ties to the erstwhile Saqqawist insurrectionists. Now only faithful Sunni Pashtuns occupy the most important government posts, regardless of their qualification. Though this has led to some inefficiencies, one can't deny that Pashtun unity will only bring security to our administration's integrity, especially with the support of the faithful Ulema."
 afghanistan_events.365.a:9 "One big step toward a spiritual and united Afghanistan."

 afghanistan_events.366.t:9 "An Amnesty, For Your Hand"
 afghanistan_events.366.d:9 "There currently exists a strange co-existence of a nominally secular legal system and one based within the principles of Hanafi Shari'a. Consequentially, this means that the inconsistency of sentencing may lend itself to convicted criminals having two options to pick from. Secular judgments often employ standard punishments like jailtime, with criminals often being sent to the unsanitary and suffocating Deh Mazang prison in [267.controller.GetVictoryPointName_10737]. However, if a judgment is passed by a Qazi, the penalty exchanged is far more eye-for-an-eye in nature.\n\nIn a recent example, a petty pickpocket who was caught red-handed in Kandahar was originally sentenced to five years imprisonment. To the free spirit of an Afghan, this is a terrible penance to pay. The thief instead opted to plead for an alternative judgment by a Qazi, who, according to the principles of Hanafi Shari'a, declared that the man should instead have his right hand severed so that he may never reach into the belongings of another ever again. Amanullah-era legislation introduced modern science into the equation, so now instead of the hand being gorily lopped off via axe or sword, surgeons in the capital do a delicate procedure with the use of anesthesia, preventing the wrist from damage and making the experience less traumatic than it used to be. This instance is echoed in most cases where the secular court deploys a multi-year sentence, and even a few cases where the criminal is sentenced to decades for a crime that Shari'a sentences death, they swiftly opt for the latter."
 afghanistan_events.366.a:9 "How long until we do away with the secular courts?"

 afghanistan_events.367.t:9 "Blood Feuds, Ancient and Modern"
 afghanistan_events.367.d:9 "Today, our great nation narrowly avoided a terrible tragedy, as three bullets failed to strike Nadir in his vitals and instead only one struck him in the muscle of the shoulder. This all occurred during a public inspection of the army garrison at Herat, where just as the ceremony began a young man brandishing a pistol barbarically fired upon the King! He was apprehended immediately, and his identity revealed to be Abdul Khaliq Hazara, a child (allegedly) of the executed Amanite Loyalist Ghulam Nabi Charkhi. Obviously seeking revenge for the death of his father (his ties to which are often alleged to be through adoption, rather than through blood) he cited the \"unjust persecution and taxation\" of the Hazara as his motives. Nonetheless, his miserable scheme ended in failure, and he currently resides in a military prison where he is routinely beaten and humiliated.\n\nThough the sentence for such a foul, treasonous attack is almost surely execution, expedited as swift as possible, Nadir does have the option to commute the young man's sentence and send him into exile instead. Educated in a German school in [267.controller.GetVictoryPointName_10737], his family sent him to the Royal Friedrich Wilhelm University in Berlin for higher education after a two year sabbatical to promote Afghanistan's ties with the German Empire. Though he has his whole life ahead of him still, he made the decision to throw it away for the sake of revenge all by himself, and his quartering would only honour that choice."
 afghanistan_events.367.a:9 "Let us be magnanimous; back to Berlin for him."
 afghanistan_events.367.b:9 "You reap what you sow."

 afghanistan_events.368.t:0 "La Constitution de [GetYear]"
 afghanistan_events.368.d.body:9 "With the coronation of the new monarchy comes the need to demonstrate to Afghans and the world at large what to expect of the renewed kingdom. To accomplish this, Nadir has set about the creation of a new constitution, one that will provide a clear vision of his reign to all Afghans and to the world itself. Similar to plans by the former King Amanullah, a bi-cameral parliament, consisting of a Lower and Upper House, is to be established. The Lower House is to be elected for 3-year terms to vote on various bills and approve Firmans issued by the King. The Upper House would function as an appointed body of “far-sighted and experienced notables”, serving as a consultative body that also was responsible for passing bills from the Lower House (a function bypassed if they're in recess). All in all, a constitutional monarchy has taken shape.\n\n"
 afghanistan_events.368.d.reformistnadir:9 "$afghanistan_events.368.d.body$Though constitutional on paper, in practice it is fairly obvious that Nadir still intends to exercise considerable control over the government. For Afghanistan to stay in one piece as it undergoes metamorphosis into a modern nation-state, a competent and sane leader must carefully lead it by the hand. Nonetheless, his government is staffed largely with civilian personnel, his brothers constituting a minority where otherwise many thought they might come to dominate the ministries. Additionally, clear guarantees of a free press, and all Afghans with citizenship, including women, are considered equal. Though sociologically women will not experience the same emancipation they had under Amanullah and much of the liberation enforced in the urban centres will be drastically scaled back, it is at least not a total loss of their rights."
 afghanistan_events.368.d.tradnadir:9 "$afghanistan_events.368.d.body$Though constitutional on paper, in practice it is fairly obvious that Nadir still intends to exercise considerable control over the government. For Afghanistan to stay in one piece as it undergoes metamorphosis into a modern nation-state, a competent and sane leader must carefully lead it by the hand. The ministries of government have been packed by his brothers and close family associates, forming an ironclad oligarchy that de facto negates the parliamentarian institutions the constitution has established. The nominal free press guaranteed in Article 23 is prohibited in the same breath by a “so long as it does not offend or insult the King, the Government, or besmirch Allah and his commandments”. Additionally, the equal rights granted to all Afghan citizens conspicuously occludes the mention of women, painting an ominous portrait of what the destiny of their emancipation looks like."
 afghanistan_events.368.a:9 "A new dawn has begun."

 afghanistan_events.369.t:9 "Scratching at Old Wounds"
 afghanistan_events.369.d:9 "The official account of Habibullah Khan's assassination, drafted by Amanullah and his cronies in the months following his ascension to power, is that an unknown assassin killed the late Emir on orders of Nasrullah Khan. With the downfall of Amanullah and the return of Nasrullah, however, efforts to determine the truth of the matter have resurfaced, though without much success. For many years it was rumoured that the late emir was shot by Shuja-ud-Daula Ghourbandi on the orders of Amanullah, and that Nasrullah was merely a convenient scapegoat for the Amanite conspiracy. Other rumours, perhaps more credible, claim that Nasrullah and Amanullah conspired together to assassinate their intransigent liege, only turning against one another in the wake.\n\nThose hoping for some clarity from the mouth of Nasrullah have been left sorely disappointed, as the reserved former exile has spoken little of the event. In private, he has firmly reiterated that he had no part in the assassination of his brother, instead voicing his belief that Amanullah was behind Habibullah's death. However, he has no salacious details to add to the rumour mill, and claims to have no knowledge beyond that which is already widely known.\n\nInstead, he has responded to questions surrounding the death of Habibullah with praise for the newfound peace brought to Afghanistan by the Telai clan, and their ending of the longstanding cycles of bloodshed and civil strife which have dominated the last decade. Whether these are genuinely held beliefs, or merely a calculated attempt to stay in the good graces of those in power, his words have resonated with a populace tired of ceaseless civil war."
 afghanistan_events.369.a:9 "A pleasant surprise."

 afghanistan_events.370.t:0 "La Nouvelle Oligarchie"
 afghanistan_events.370.d:9 "Much time has passed since Nadir's reign began. Before his choice to save the nation, Afghanistan was wrought with instability. To fix her flaws, tools of reckless imposition were sought instead of tools of precision. Foreign methods of government were imposed to appease imperialist powers, government considerations hardly saw past the urban centre, and resources were drained building the costly vanity project of [267.controller.GetVictoryPointName_12769]. The tribes took up arms, tensions rose with our Pashtun brothers in Peshawar, and the wise Ulema was antagonised at every turn.\n\nNow, instead of one man tearing his nation down with his clouded ambitions, there exists a structure of men at the top shepherding Afghanistan through the storm of the 20th century. The great King Nadir and his brothers have accomplished what his predecessor could never achieve; a stable and strong Afghanistan. No decision needs to be taken alone, for he can rely on the advice and consensus of his family before making any potentially risky choices. One mind is certainly not as strong without several others to back it up, especially if that mind is actually willing to listen. There can be no risk of opportunists if the system is designed to allow only one family to the levers of power, too. Some day, the Crown Prince Mohammad Zahir Khan shall take his fathers place, and Allah willing, his uncles will be there to guide him along the same footsteps as his father."
 afghanistan_events.370.a:9 "Oligarchies are inevitable; Afghanistan is lucky to have one so wise!"

 afghanistan_events.371.t:9 "Liberalism Run Amok?"
 afghanistan_events.371.d:9 "Mahmud's tenure as Prime Minister thus far has overseen a steady maintenance of the liberalisation that Amanullah's reign rather recklessly pursued. So much so that the exiled Amanite Abdul Ahad Wardak, one of the biggest faces of Afghan Westernism, has actually applauded our government for not completely bending to backwards reaction and retaining much of the political freedoms that had been developed up to that point.\n\nThe current Minister of the Treasury, Abdul Majid Zabuli, has become the face of the \"Westernist Bloc\" and the most powerful proponent of continued liberalisation. An associate of Mohammad Daoud Khan and a Pashtun nationalist, he enjoys the privilege of speaking his mind much more openly than his Liberal contemporaries and seems to be making a habit of clashing with the Conservatives in the cabinet, most of whom are members of Nadir's family. Now, he clashes with the man credited with convincing Nadir to preserve parliamentarianism. Zabuli believes that the power of the throne must be scaled back considerably in favour of embracing a truly constitutional democracy. To him, Mahmud and Nadir are unnecessarily delaying Afghanistan's progress when the institutions for it are already cemented in place. Fortunately for him, he's kept much of his complaining behind closed doors, preventing Nadir and Mahmud from heeding Hashim's advice that the man ought to be sacked for his intransigence."
 afghanistan_events.371.a:9 "Maybe he'll tire himself out faster than our patience will."

 afghanistan_events.372.t:9 "Modernity's Shepherd"
 afghanistan_events.372.d:9 "The Westernist Bloc, though ideologically disparate, has found itself uniting more and more under the banner of Abdul Majid Zabuli. Finding himself stonewalled in his direct appeals to Mahmud, he has taken to mobilising the Liberals and is behind the proposition of a new bill dedicated to supporting the \"liberalisation and enforcement of women's rights in rural and tribal Afghanistan\". Though our constitution guarantees the equal and fair treatment of women by the government, we've been wise enough not to interfere in local and societal matters, as we're not stupid enough to repeat the same mistakes that Amanullah had. Ordinarily, our Loyalist deputies would simply strike the bill down, but Zabuli has managed to convert a number of them to his side, perhaps weaponising his wealth and economic connections for bribery. Making matters worse, Zabuli waited for the Upper House to go into recess, meaning all he needs to do is pass the bill through the Lower House to sign it into law and delays efforts for the Upper House to vote and repeal it, which gives him ample time to lobby enough of them to his side to stymie a consensus. As it stands, the bill is very likely to pass the Lower House, which is very troubling.\n\nThe last hope of shooting the bill down is through Nadir putting his foot down with a Firman and overriding the Lower House, even if such an action isn't technically constitutionally sound. We're not beholden to constitutionalism, and even Mahmud has indicated to Nadir that a crackdown is very likely going to be necessary. One must wonder if Zabuli is simply trying to goad us, however. A direct confrontation like this will damage our government's constitutional reputation and potentially incite serious unrest with the reformists that we've come to align with. It might be wiser to negotiate for the bill to be watered down, lest we destabilise our ministries unnecessarily."
 afghanistan_events.372.a:9 "Politics is a game of give and take, Mahmud will negotiate with him."
 afghanistan_events.372.b:9 "We can't let them shatter the tribal support we've carefully cultivated!"

 afghanistan_events.373.t:9 "The Showdown Deepens"
 afghanistan_events.373.d:9 "Negotiations between Mahmud and Zabuli had initially gone very well. Recognising Mahmud's concerns that his proposed bill would incite unrest amid the tribes, especially since it implicates broad applications of force in ensuring compliance with the law, he has watered his proposition down to the direct criminalisation of violence against women and mandating that such cases be prosecuted through secular courts only. Of course, this was his plan all along, but at least it would have been an acceptable pill for us to swallow.\n\nBut Zabuli has gotten greedy. Believing he negotiates from a place of greater strength than is reality, he now demands that we formally consent to the establishment of a party uniting the Westernist Bloc and for the nominated Upper House to be abolished in favour of a democratically elected unicameral legislature. If we do not assent, he plans to (cue our horror and dismay) resign and voluntarily exile himself. He is of course an experienced economist and a valuable asset to the ministry, but this is an egregious overestimation of his value.\n\nThough many die-hard Liberals may follow his example and go into exile, leaving us with a hollowed government apparatus that hardly satisfies neither the reactionaries nor the reformists, maybe we can subvert him. If we call his bluff and have Nadir pre-emptively issue a Firman criminalising femicide and domestic violence, we could split the bloc and make Zabuli's resignation appear more like a petty grab for power. It will also be a lot simpler to stamp our foot down and crack down on them anyway."
 afghanistan_events.373.a:9 "Issue the firman and embarrass Zabuli."
 afghanistan_events.373.b:9 "The Liberals have gone too far anyway, crack down on the lot of them."

 afghanistan_events.374.t:9 "A Benevolently Guided Democracy"
 afghanistan_events.374.d:9 "Nadir's Firman appears to have successfully killed the bill. Several Liberals and most of the Loyalists argued that the bill was no longer necessary and that the Firman did a much more successful and pragmatic job of securing better rights for women than taking such a heavy-handed approach with the tribes. This disagreement delayed passage of the bill long enough for the Upper House to exit recess, and despite the bill passing anyway, it was subsequently killed in the Upper House.\n\nCaught with his pants down and having overplayed his hand, Zabuli has quieted himself and seems to be secluding himself in his office. Though it appeared to be that he was on the verge of resignation, Daoud Khan privately consulted with him and convinced him to stay on while he defended the man's zeal to the rest of the cabinet. Though Nadir himself seemed pretty uncertain of keeping Zabuli in his position, none could argue that he was probably still the best man for his post, and so no action was taken against his career."
 afghanistan_events.374.a:9 "But if he tries it again, it'll be a ticket straight to Iran for him."

 afghanistan_events.375.t:9 "Troubles in the Chambers"
 afghanistan_events.375.d:9 "Immediately after the bill's passage, Nadir issued a veto overriding the bill and shooting it down. This has caused a major uproar in the Lower House. Infuriated by the complete disregard of the constitutional bounds the Lower House enjoys, the Westernist Bloc and several so-called Loyalists have walked out, eking out enough of a majority to prevent parliament from being called into session (requiring at least 50% attendance) and paralyzing the civilian government. As this debacle continues to unfold, the Liberals in [267.controller.GetVictoryPointName_10737] have called a protest and are loudly demonstrating in front of the Royal Palace and other government buildings, demanding that Nadir make good on his promises to retain a constitutional democracy.\n\nWho do these fools think they are, abandoning their positions to yammer about on the streets? Outraged and incensed by Zabuli's constant indignation, Mahmud has not only forced Zabuli to resign but has requested the army step in to restore order. If they don't get back to their seats willingly, then they'll lose them, permanently."
 afghanistan_events.375.a:9 "Democracy must be disciplined with a firm hand."

 afghanistan_events.376.t:9 "A Firmly Guided Democracy"
 afghanistan_events.376.d:9 "It is a sight not uncommon in this world. Liberal visionaries with their head in the clouds take their stand against pragmatic and realistic leaders, believing they have the right to throw a tantrum and threaten the livelihood of the state with instability. Ad nauseam, the answer is not unlike what a parent gives a child who screams and cries when he is not given the impossible. No shots were fired, but several arrests were made and the ringleaders of the strikes were summarily beaten and thrown in prison for their disturbance. A third of the Westernist Bloc's membership were far-sighted enough to see this coming, having avoided taking direct part in any strike action and returning back to their position the next week, but now, pending a snap election, a sizable chunk of the Lower House is eerily empty.\n\nZabuli has gone quietly into exile, managing his affairs from overseas and continuing to contribute to the companies he has a share in. Irrevocably embittered, we no longer have to suffer his tiresome antics. Though a shame that the situation panned out as it did, Mahmud has a renewed mandate to control Afghanistan's evolution with sterner disposition than Nadir recommended prior. Democracy is not dead, but perhaps it's better off that we keep a rifle to its head than let idealism endanger the peace we've so carefully reconstructed."
 afghanistan_events.376.a:9 "Don't we deserve credit for not simply gunning them all down?"

 afghanistan_events.400.t:9 "Heir of Grief"
 afghanistan_events.400.d:9 "Mohammad Zahir Khan was coronated as Mohammad Zahir Shah today, in a hastily organised ceremony primarily set up by his family and Mohammad Gul Khan Momand to ensure a swift succession and to prevent the imminent anarchy that had begun to sprout after Nadir's assassination. Various regional leaders, citizens of [267.controller.GetVictoryPointName_10737], and of course the entire Musahiban family were in attendance, however foreign dignitaries were unusually scant for such a seminal diplomatic event. It would appear that the enduring chaos of Afghanistan has shaken the nerves (and confidence in our ability to last) of most of these yellow-bellied ambassadors.\n\nRetaining his post as Prime Minister, Mohammad Hashim Khan is set to take on a domineering role in leading the nation. Despite being in his 20s, Zahir is yet still inexperienced in the nuances of governance, necessitating a sort of semi-regency by his uncles. The young man is in no hurry to take on a forward stance, either; his father's body has hardly been cleaned off the streets yet, and he has a lot of anguish and mourning to shoulder. Though his reign begins in tragedy, Zahir has declared at a speech ghostwritten by Hashim that the following years will see Afghanistan heal from her scars and enter an era of unbeholden unity in the face of those who wish to tear it down."
 afghanistan_events.400.a:9 "He has a lot of weight on his shoulders, including the hand of his father's ghost."

 afghanistan_events.401.t:9 "Where We Left Off"
 afghanistan_events.401.d:9 "The tragedy of Nadir's untimely demise aside, the ascendance of his son to the throne comes with the imperative that it epitomises a repudiation of the chaotic past and the genesis of a stable and ordered future. As such, the [GetYear] Constitution has been authored primarily by the brothers of Nadir, based primarily on his own ideas and wishes, and has been enshrined effective immediately. A bicameral parliament, with an elected Lower House and an appointed Upper House of \"experienced and far-sighted notables\" has been enstated.\n\nDespite the Lower House consisting of elected officials with 3-year terms, the King may dismiss and re-appoint them should they \"offend the integrity of the Government or besmirch Allah and his commandments\". Though the Houses have the power to vote on and reject Firmans issued by the King, the King has the power to override any rejections anyway \"should it be deemed vital to the security of the nation\". Zahir's uncles and other members of the family additionally dominate virtually all government ministries, resulting in an ironclad oligarchy of the Musahiban family.\n\nDetractors, safely outside the jurisdiction of our government, claim we're barely even pretending to establish a constitutional monarchy. For daring to promote distrust and instability in such trying times, especially as we still grieve the loss of Nadir, any subversive exile we've been able to identify has been rewarded with an arrest warrant that guarantees retribution should they dare to step foot in Afghanistan ever again."
 afghanistan_events.401.a:9 "We will survive… we will flourish."

 afghanistan_events.402.t:9 "Despair Searching"
 afghanistan_events.402.d:9 "With Zahir on the throne and Nadir in the afterlife, the government has mobilised and engaged in a rigorous effort to uncover the identity of the black-hearted criminal(s) responsible for the death of the former King. There are already several suspects in custody, all of which are being subject to fierce interrogations, though many are either presumed to be in hiding within Afghanistan's frontiers or have already fled across the border.\n\nThe most promising lead connects the bombing to Hazara groups living near the capital, notoriously loyal allies of Amanullah. For now, movements in their home regions are being heavily monitored, especially amid rising discontent and complaints of \"unjust persecution\", which in reality appear to be attempts at manufacturing a casus belli for a revolt. In any case, it appears almost certain that the investigation will conclude that they're involved in one way or another."
 afghanistan_events.402.a:9 "All the while, Zahir quietly mourns from within the palace."

 afghanistan_events.403.t:9 "The Culprit Uncovered!"
 afghanistan_events.403.d:9 "After a score of vigorous interrogations, several suspects have named Amin Jan Khan, one of Amanullah's brothers, as the principal organiser of the assassination. In addition, all of his co-conspirators are made up of either Hazaras or radical Amanite Loyalists. Supposedly, the man has gone into hiding in Bamyan, deep within the Hazarajat region in Afghanistan's central highlands, where he is organising an uprising among the Hazara people.\n\nTo halt this crisis before it grows any more severe, Mohammad Gul Khan Momand has led an army into Hazarajat, turning over villages in search of Amin Jan and his thugs. Already tender by our heavy-handed authority over the last few weeks, several local strongmen have banded their forces together to rise up against our forces, though they've been crushed with comparative ease.\n\nDespite the bloodshed, it was discovered that Amin Jan had actually fled across the border into India almost immediately after Nadir's death. Once order had properly been restored and no further signs of rebellious activity persisted, Momand finally withdrew from Hazarajat. Though Nadir's assassin remains at large across the border, all of his co-conspirators have been captured and executed, and the mystery of the bombing is now at least formally solved."
 afghanistan_events.403.a:9 "But we shall never forget the perfidy of the Hazara."

 afghanistan_events.404.t:9 "Memoirs of the Civil War"
 afghanistan_events.404.d:9 "Some two years after the devastating Afghan Civil War comes the first autobiographical account published and sold in various bookstores and libraries. Shah Wali Khan spent much of his free time after his obligations to the government and ministries authoring his personal account of the anti-Amanullah putsch, hoping to provide the outside world with an accurate perspective of the late King Nadir's perspicacious decision-making and the difficult position that the Telai branch of the Barakzai family found themselves in.\n\nMuch of the book is spent hero-worshipping and glorifying Nadir as a martyr who died protecting his nation from Amanullah's borderline syndicalist ambitions, blurring the line between Wali Khan simply holding his brother in high regard or rather using his name as a propaganda tool. Much attention is given to accounts of village-burning and atrocities committed by Amanite forces, and the benevolent (and often self-sacrificial) aid given to peasants and civilians injured by the war by Nadir's troops. During the immediate aftermath of Purdil Khan's rebellion, Wali Khan magnanimously pardons a vagabond for looting what remained of Darulamann's museum moments before he was to be shot on the spot by a platoon of troops. There is very little mention of impropriety on the part of Nadir's forces during the war, and what instances there are subsequently describe a crackdown on such injustice and the swift punishment of those responsible.\n\nThe book ends with Zahir's coronation, somberly mourning what could've been under Nadir but optimistically looking forward to a long reign of healing under Zahir. While these memoirs are unlikely to be read by many outside of Afghanistan's urban centres, it will serve as a defining historical account of one of Afghanistan's most tumultuous periods nonetheless."
 afghanistan_events.404.a:9 "Wiley Wali Khan is a wizardly wordsmith!"

 afghanistan_events.405.t:9 "Jahan Khan, The Restored Nawab"
 afghanistan_events.405.d:9 "Though Pashtunistan remains cautiously cooperative with the new government in [AFG.Capital.GetCapitalVictoryPointName], the region can not be said to be wholly scrupulous toward our government. Amanullah's chief loyalist in the region, Nawab Alamzeb Khan of Dir, has long been anxious of his standing with the new King despite mutual reassurances of peace and respect having already been exchanged. Alamzeb has overseen a major expansion to Dir's security forces, citing increased banditry, but privately fashioning the Princely State into a fortress in the event that we decide to haunt him for his Amanite past.\n\nHis paranoia has become his downfall, however. His recruitment drive inadvertently reaped a trove of fifth-columnists loyal to his brother, the exiled Jahan Khan. In the middle of the night, a 150-strong militia of men stormed Alamzeb's royal residence and forced him to abdicate under threat of death. The next morning, his brother arrived at the palace and was offered back his throne, ending over a decade of Alamzeb's reign over the realm. Not without a heart, Jahan Khan refused to execute his brother and instead banished him into permanent exile.\n\nThis shakeup is entirely in our favour. Jahan Khan has already telegraphed his full loyalty to our government, and mutual plans are being drawn up for investment into Dir's public services. With Alamzeb gone, our biggest uncertainty in Pashtunistan has been completely patched up."
 afghanistan_events.405.a:9 "It's always nice when a problem fixes itself for us."

 afghanistan_events.406.t:9 "The Afghan Cultural Exposition"
 afghanistan_events.406.d:9 "One of Afghanistan's greatest treasures, Pashtun culture is rich, vibrant, artisanal and severely underappreciated on the global stage. As part of our mission to establish Afghanistan as a Pashtun nation, Zahir has sponsored marshal Momand's Pashto Literature Society and provided generous seed capital for a travelling fair, hitherto known as \"The Afghan Cultural Exposition\". Every other year, this fair shall travel to a foreign country, typically European, to showcase Pashtun textiles, cuisine, and traditions.\n\nAttendees will learn firsthand about the code of \"Pashtunwali\", the bedrock of a Pashtun man's hospitality, honour, sense of justice and nobility. Concession stands will offer servings of classic Pashtun foods, usually of lamb, including Kabuli Pulao, Chapli Kebab, Afghan Halva and more. Each day of the festival, running for about a week, will cap off with an Attan dance. All in all, it is believed that this shall promote our culture abroad and manifest as a boon for investment, though some worry that this may attract a level of tourism that will agitate Afghans who are naturally wary of foreigners coming to visit our country."
 afghanistan_events.406.a:9 "What is important is that the world knows Afghanistan is a Pashtun realm!"

 afghanistan_events.407.t:9 "Family Knows Best"
 afghanistan_events.407.d:9 "Before, there was Amanullah, the man behind the chessboard who could control and place his pieces as needed, and nobody could influence his choices without him expressly permitting them to do so. An absolute mastery of control, indeed, is that not how a King should be able to rule?\n\nApparently not, according to the family of Zahir Shah.\n\nHis relatives and uncles have run roughshod across the government, conveniently with the help of Amanullah's autocratic institutions which they have reverse-engineered for their own use. Instead of a King with a vision for his people, there now exists an oligarchy whose vision extends to maintaining the status quo, oppressing minorities, and hardly anything more hopeful. Zahir Shah struggles to bring change without it being watered down to an unrecognisable state, or intervene in matters that the Uncles see fit to handle themselves. All he can do for now is bide his time, be patient, and slowly push the envelope until he is appropriately respected in his own right. Afghanistan, over the last several decades, has been traumatised with hatred, conflict, and destruction; Zahir Shah intends to heal his people, and his intentions will not be quieted for long."
 afghanistan_events.407.a:9 "One day he'll assert himself, and his uncles will simply have to bow their heads."

 afghanistan_events.450.t:0 "Le Gouvernement Provisoire"
 afghanistan_events.450.d:9 "Whether pushed into his actions by those around him, his fears of further chaos erupting over the throne, or perhaps reasons known only by him; Momand has announced the dissolution of the monarchy in favour of a republic. Army troops, led by Azadist officers, have now taken control of most of the nation's major cities on the marshal's orders, officially there on peace keeping operations.\n\nAs part of his proclamation, marshal Momand has announced that he will serve as the nation's provisional president, until a proper constituent assembly can officialise his leadership. His protégé and royal family member Mohammad Daoud Khan has also been announced to serve as interim Prime Minister, tasked personally with preparing the nation for its transition into a republic. Little has been heard from the other Musahiban members however, despite efforts by the now president to reach out to them."
 afghanistan_events.450.a:9 "Only now can the nation heal."

 afghanistan_events.451.t:9 "Brotherly Betrayal"
 afghanistan_events.451.d:9 "It seems the reason for the silence by Zahir and his uncles to Momand's coup has finally been discovered, with it now blatantly obvious that they fled the country upon hearing news of troop gatherings in the capital. Although there is no world where Momand would have allowed harm to come to them, and wished to see them take part in the new republican government alongside him, it seems they lacked faith in their so-called brother to guarantee their safety. Their exact location is currently unknown to the president, and it appears that they hope to keep it that way for as long as they can.\n\nThe news appeared to hit the marshal extremely hard, with him delegating full duties to Daoud for an entire day, not leaving his office in the Arg even for food. Although this morning Momand has finally emerged, and continued to carry out the duties needed of him at this vital time, it appears a great sadness still hangs over him when thinking of his now former family. The little consolation the president has received has come from Daoud and his brother Naim Khan, telling him that their slain uncle Nadir would have appreciated the sacrifices the marshal has had to make for the nation."
 afghanistan_events.451.a:9 "This will always weigh on Momand's heart."

 afghanistan_events.452.t:9 "Fate of the Frontier"
 afghanistan_events.452.d.traditionalist:9 "Despite fears of unrest against the republic's declaration, especially by Amanite loyalists hoping to take advantage of the chaos, the army has not faced any notable resistance in asserting the marshal's will...at least in the heartlands. In the Frontier however, the story is very different, owing to the region still being a hotbed of Amanullah's loyalists.\n\nTribal chiefs, urban leaders, and even the vassal princes have frustrated efforts to assert control over the region, hoping to bring down the republic. With the lack of resistance elsewhere however, we have many men ready to be deployed to Pashtunistan, perfect for punishing their insolence."
 afghanistan_events.452.d.reformist:9 "One of the greatest holes in our national security manifests itself as the autonomy of Pashtunistan. When tensions bubbled and brought [442.Controller.GetVictoryPointName_12717] to the brink, Amanullah made several concessions and continued to tolerate the existence of their autonomous government. Ghaffar Khan and Khan Sahib are powerful and immensely respected across Pashtunistan, and it is for that reason that they have the potential to take a path of intransigence and pose a destabilising threat to our government.\n\nThough they are reasonable men, and a peaceful accord may be possible with the notoriously pacifistic Ghaffar Khan, who's to say such pacifism is no less than a Machiavellian smokescreen? Pre-emptively sucker-punching them before they can rally against us may be our best bet at minimising the chance of a catastrophic revolt."
 afghanistan_events.452.a:9 "A show of force should bring them to heel."
 afghanistan_events.452.b:9 "The Khans are reasonable, let us talk to them."
 afghanistan_events.452.c:9 "Send in the troops, the Frontier will fold."

 afghanistan_events.453.t:9 "Pashtunistan Pacified"
 afghanistan_events.453.d:9 "Our pacification campaign over Pashtunistan has been a rousing success! The presence of our troops has shown the Princely States and other tribal leaders that despite the hectic situation surrounding [AFG.Capital.GetCapitalVictoryPointName] over the past several months, our might is not to be trifled with.\n\nAn agreement has nonetheless been made with the Princes to reassure them of our intention to sustain their realms, as hopefully by looming the shadow of the stick we may still see a future where only the carrot may be needed."
 afghanistan_events.453.a:9 "The whole nation is now ours to rule."

 afghanistan_events.454.t:9 "[442.Controller.GetVictoryPointName_12717] Government Agrees to Negotiations"
 afghanistan_events.454.d:9 "Rather than shedding the blood of our fellow Pashtuns, an invitation was sent to the Frontier's government, inviting representatives to discuss their place in the new republic. Although clearly hesitant to support what they appear to view as an authoritarian regime, those who have arrived in [AFG.Capital.GetCapitalVictoryPointName] have been open enough to working with the Azadist government. Unsurprisingly however, they have not simply accepted the marshal's rule out of the goodness of their hearts, nor simply accepting that the nation will benefit the most if they just fall in line without asking for anything in return.\n\nThey have demanded that the Frontier's full autonomy continues for at least a year, with negotiations then open for its full integration into the republic's administration. They have also taken umbrage at Azadist plans to institute a party state, drawing a line in the sand regarding the continuation of the democratic process in at least the Frontier itself, and a say in government by [442.Controller.GetVictoryPointName_12717]'s representatives. A lofty list of demands to be sure, but perhaps ones worth accepting to at last stabilise the nation."
 afghanistan_events.454.a:9 "Agree to their terms, we all stand to benefit."
 afghanistan_events.454.b:9 "We share power with no one, send in the troops!"

 afghanistan_events.455.t:9 "The Failed Gambit"
 afghanistan_events.455.d:9 "What was thought as a simple show of force attack into the Frontier to make the Khans fall in line has quickly proved to be the Azadist's undoing. Upon arriving in [442.Controller.GetVictoryPointName_12717] and being given the orders to begin arresting members of the government, and putting them down with force if needed, a mass mutiny began to occur by the lower ranks against their commanders. Demanding that no more Pashtun blood be spilled by their brothers after the violence of the civil war, they threw down their arms and stood with Ghaffar Khan. The few willing to carry out the orders were quickly subdued by the defectors and members of the Frontier Defence Forces.\n\nNews of this mutiny quickly spread to the capital, alongside news that the Frontier Defence Forces had begun a march towards the heartlands to defend the Frontier. Almost all they encountered along the way similarly refused to fight, letting these insurrectionists into [AFG.Capital.GetCapitalVictoryPointName]. A final holdout by Azadist loyalists was the most notable battle, but soon they laid dead, although not alongside their leaders who had already fled into exile. The capital is now in the hands of the FDF, led by Abdur Rahim Popalzai."
 afghanistan_events.455.a:9 "Even Kerensky's government lasted longer..."

 afghanistan_events.456.t:9 "Those Left Standing"
 afghanistan_events.456.d:9 "Leadership of Afghanistan has been nothing short of a game of musical chairs over the last few months. Amanullah, then Nadir, then Momand, and now Popalzai is the man in the high chair tasked with successfully keeping it away from the reactionaries now that men with greater ideals have earned their shot at uplifting the nation. It is very important that we act as fast as we can, for schemers such as the Mojadidi family and the exiled royals eye [AFG.Capital.GetCapitalVictoryPointName] like predators waiting for their prey to fall asleep.\n\nGhaffar Khan and Khan Sahib are the most well known men on our side of the equation, and perhaps the most stabilising choice to form a proper government with. Handing them the reins of power shall still place Afghanistan in the capable leadership of men whose vision of Afghanistan is not entirely alien or far off from Popalzai's own dreams. Alternatively however, if we had a foreign benefactor to support us, perhaps Popalzai could finally see the chance to transform Afghanistan into a socialist republic, loyal to Allah and to the principles of Islam, and untainted and untethered by the crooked whims of reactionary Mullahs."
 afghanistan_events.456.a:9 "The Khans are the only legitimate power left in Afghanistan."
 afghanistan_events.456.b:9 "Perhaps [AFG_potential_socialist_overlord.GetNameDef] would help set up a socialist state."

 afghanistan_events.457.t:9 "An Appeal by Afghan Socialists"
 afghanistan_events.457.d:9 "An interesting situation previously thought impossible has occurred in Afghanistan. The seemingly never-ending chaos they have been experiencing may perhaps finally be at an end, with socialist militants led by Abdur Rahim Popalzai being the latest force to take control of [AFG.Capital.GetCapitalVictoryPointName]. Although supposedly loyal to the moderate regional government in Afghanistan's Frontier region, Popalzai has reached out to our government rather than handing power over to his allies.\n\nIn his appeal, the man known as the \"Marxist Maulana\" has requested our aid in establishing a socialist government, following his party's brand of Islamic Socialism. In order to undertake such a monumental effort in such a backwards nation, he needs plenty of support, and being acutely aware of this he has approached us with urgent requests for aid and support to sustain and entrench his regime. This is a rather excellent opportunity to extend and deepen our influence in the region, but it is also a question of whether or not Afghanistan may be more practical as a neutral buffer state against the other powers on their border."
 afghanistan_events.457.a:9 "Send them the support they need."
 afghanistan_events.457.b:9 "Its not worth the effort, they won't last a week regardless."

 afghanistan_events.458.t:9 "[FROM.GetNameDefCap] Agrees to Aid Us"
 afghanistan_events.458.d:9 "As we hoped, [FROM.GetNameDef] has accepted our pleas and is already sending over guarantees, troops, and other forms of support to buffer our government against any challengers to our rule. Though for the time being we will be wholly reliant on them for our survival, under their auspices the reactionary Mojadidis, Ulema, and the rest of the Barakzai family will have an agonising time trying to challenge our authority.\n\nThough it seems that he expected us to offer him leadership of the government, Ghaffar Khan has refrained from challenging this turn of events and has instead tendered us a pledge of support. As reactionaries fume from the shadows, the sun shines brightly upon our path forward!"
 afghanistan_events.458.a:9 "The Red Tide reaches Afghanistan!"

 afghanistan_events.459.t:9 "[FROM.GetNameDefCap] Refuses to Aid Us"
 afghanistan_events.459.d:9 "Tragically, [FROM.GetNameDef] doesn't see the value in helping us set up a socialist government in Afghanistan and seeing to the liberation of Muslim workers and peasants from capitalist tyranny. Alas, without the proper support, there's no chance we'd last longer than the previous rulers to inherit [AFG.Capital.GetCapitalVictoryPointName] after the fall of Amanullah.\n\nBeing as Ghaffar Khan already seems to expect us to hand over the reins of power, and he is certainly a more widely appealing and popular leader than Popalzai is, the Marxist Maulana has begun making preparations for an orderly transfer of power."
 afghanistan_events.459.a:9 "Let us turn power over to the Khans then."

 afghanistan_events.460.t:9 "Founding the People's Party"
 afghanistan_events.460.d:9 "It seems that at last the marshal has enforced his grip over all of Afghanistan, with his PM having worked over the past weeks to lay out the foundations for the new Azadist government.\n\nThe time for rule through military might alone is quickly coming to an end, and as such plans to reform the Azadist powerbase into a more civilian focused political party have been put into place. Rather than simply ruling with the army's iron fist, the nation shall be governed by the People's Party, who shall truly represent the will of every Pashtun, whether at home or languishing under foreign occupation."
 afghanistan_events.460.a:9 "A proper party for the Pashtun people."

 afghanistan_events.461.t:9 "The Party for Modern Moderates"
 afghanistan_events.461.d.body:9 "The establishment of the republic has brought forth the need for political parties to represent the people, and for those who found themselves in agreement with Amanullah's policies but jaded on his excesses, the party established today is likely to be up their alley. Abdul Hadi Dawi, once an ally of Amanullah who found himself sidelined after the latter's deposition, has spent the past month staging a grand return to politics, and at last his plans have finally been announced with him set to lead the Hezb-e Islami Afghanistan, the Islamic Party of Afghanistan.\n\n"
 afghanistan_events.461.d.pashtunistan:9 "$afghanistan_events.461.d.body$To found this new party, Dawi has reached out to the United Muslims Nationalist Party, who have for years struggled to find a foothold in the frontier but whose policies could easily appeal to voters in the heartlands. As part of an agreement between Dawi and Aurangzeb Khan Gandapur, the UMNP is set to be reformed on the national level into the Islamic Party, while still maintaining the UMNP name for local frontier politics. It is seemingly hoped by the UMNP's leadership that with Dawi as leader the party will finally find a base in the heartlands, and through that the party can finally assert itself on an all-Afghan basis, but only time will tell if this strategy will succeed."
 afghanistan_events.461.d.notpashtunistan:9 "$afghanistan_events.461.d.body$While still committed to modernising the nation as he was under Amanullah's rule, Dawi has long been critical of some of the most controversial elements of the former King's reforms. Mostly significantly, he was one of the most outspoken voices again the \"excesses\" of Afghanistan's feminist movement over the past decade, with the new party promising to bring Islamic values back to Afghanistan on these kinds of issues, an appealing prospect for many of the capital's intellectuals."
 afghanistan_events.461.a:9 "Will such a middle ground be palatable to the people?"

 afghanistan_events.462.t:9 "The Liberal Enlightenment"
 afghanistan_events.462.d:9 "Although the rule of Nadir may have been short, it left a lasting impact on the nation's liberal movement, with many of its former champions now imprisoned, exiled, or dead in some instances such as with Taj Muhammad Paghmani. The ideas of liberalism seem hard however to quash completely, and it appears a new generation of liberals have begun to emerge to fill the void. A new group, officially acting as a party but being more akin to a loose liberal coalition, has now been founded under the name of the Tehrik-i-Naujawanan Baidar, the Movement of Enlightened Youth.\n\nTracing their origin to the more nationalist-minded tinge of the Young Afghans, the party's membership is comprised of many liberal academics known to focus on Pashtun culture. Its two primary leaders, Abdul Hai Habibi and Abdul Rauf Benawa, both espouse a version of liberalism that is said to be incompatible with the conservative or leftist leanings of other parties, but heavily nationalist in nature. Whether or not they will find any success however will likely come down to how well this message translates outside of academic circles."
 afghanistan_events.462.a:9 "A party for sensible people, will they actually find any?"

 afghanistan_events.500.t:9 "Investigating the Regicide"
 afghanistan_events.500.d:9 "Despite having personally been the one to declare a republic, it would be hard to describe Momand as a die-hard republican, with no one yet to hear him openly condemn the previous monarchy despite many of his underlings willing doing so at every opportunity. The man's loyalty to Nadir, even after his death, is almost certainly the cause for this deference, and the order given by him earlier today has only gone further to confirm this theory. Despite regicide often being praised in a republic, Momand has ordered a full investigation into Nadir's death, wishing to put to death his killer for committing treason against the nation.\n\nEven amongst those who can actually be described as die-hard republicans there seems to be little opposition to this investigation, with few wishing to openly oppose the President on an issue so close to him. One way or another, a killer will be found for Momand, and perhaps if his staffers do a good enough job it might even be the correct one."
 afghanistan_events.500.a:9 "Momand owes it to Nadir to punish whoever did this."

 afghanistan_events.501.t:9 "Chasing the Leads"
 afghanistan_events.501.d:9 "It may be early days with the regicide investigation, but that has not stopped multiple leads already emerging. The most promising lead has unsurprisingly been one tied to Amanite loyalists, with evidence leading to Hazara tribesmen tied to Amanullah's half Hazara brother Amin Jan. Further, less substantiated leads however, have pointed to those closer to home, perhaps too close for comfort.\n\nEven if Amin Jan was behind the assassination, the only realistic way he could have gotten explosives onto the slain king's car would be if he had a man on the inside. This would naturally point to senior officers, many of whom still serve closely with the President, yet not closely enough to be above reproach. Those within the royal guard however would also have such close access, especially those in the personal service of the royals, including the men that once guarded the Prime Minister when he was just a prince.\n\nAlthough it would pay to be diligent and investigate all of these leads, it could easily give rise to factionalism if certain unfortunate things were discovered about party members, and could even lead to such even if they weren't. It may perhaps be easier to simply look into the Amanites, although thoroughness may be needed to finally bring relief to the grieving nation, or at least the grieving President."
 afghanistan_events.501.a:9 "Follow the lead on the Amanites."
 afghanistan_events.501.b:9 "Someone in the army must have been involved."
 afghanistan_events.501.c:9 "No one must be above suspicion, even Daoud."

 afghanistan_events.502.t:9 "Hazara Tribesmen Implicated in the Plot"
 afghanistan_events.502.d:9 "With the president authorising investigators to look specifically into Amanite links amongst the Hazara, enough evidence has now been found to finally narrow down the search.\n\nVillagers living just outside Maidan Shar have reported three Hazara men, all in their early 20s, as having frequently met with a man matching Amin Jan's description. The Directorate of Intelligence Records now has the names and addresses of all three men, ready to dispatch soldiers to arrest and question them as soon as the order is given."
 afghanistan_events.502.a:9 "Bring them in for \"questioning\"."

 afghanistan_events.503.t:9 "Amanullah's Revenge"
 afghanistan_events.503.d:9 "Despite the arrest of the tribesmen not going as smoothly as hoped, with one of the men unfortunately killed in the apprehension attempt before he could be questioned, two of them were still brought back to the Arg's prison in enough of a shape to still communicate. A few hours alone with warden Sarajadin Gardizi and his men, experts in extracting a confession from even the most steadfast of men, was all it took for the two to finally crack.\n\nWe now have in writing a confession that Amin Jan was behind the assassination of Nadir, with hopes that his death would be the opportunity needed to restore his brother to the throne. His accomplices, whose execution is scheduled for the morning, were tasked with contacting a relative they had within the Royal Guard, and providing him with a bomb to sneak into the King's car. This man has too been arrested, soon to face a similar fate, and although some may doubt confessions given through torture the president finds little reason to doubt the narrative as presented."
 afghanistan_events.503.a:9 "A light punishment for their crime."

 afghanistan_events.504.t:9 "Azadist Officers Implicated"
 afghanistan_events.504.d:9 "Although still under the belief that the Amanites were likely behind the assassination, the President could not shake the feeling that perhaps they were assisted by someone closer to home. Upon the insistence of the Prime Minister, an investigation of the armed forces has been conducted, primarily focused on those who were operating in the capital on the day of the king's assassination. Little was found at first, before one of Daoud's men stumbled across peculiar irregularities in the records for who was where that day.\n\nAccording to one set of documents, two officers close to the president were supposed to be leading exercises on the eastern edge of the capital, yet other documents appear to confirm their unexpected presence in the royal palace instead. The PM, believing this to be potential proof of a coverup and perhaps a deeper conspiracy, has pushed Momand to authorise their arrest regardless of their position, so that they can at least be questioned at a minimum. Whether such potentially flimsy evidence is worth such drastic action however is what now must be decided."
 afghanistan_events.504.a:9 "If they are guilty, they must be brought to justice."
 afghanistan_events.504.b:9 "This evidence is flimsy, look into the Amanite lead."

 afghanistan_events.505.t:9 "Authorising the Purge"
 afghanistan_events.505.d:9 "After deep and intensive questioning, the officers brought in have confessed to the existence of a long term republican conspiracy that culminated in Nadir's murder. According to their confessions Azadist officers close to Momand have for years planned to seize power and institute a republic, yet Nadir's takeover complicated matters. Knowing that Momand would never move against Nadir, they orchestrated his assassination, finally bringing about their vision.\n\nWith how deep the rot is, some of these men being the president's closest and oldest allies, the Prime Minister has requested authorisation to conduct a largescale purge of all those implicated in the conspiracy. To replace them, he has given a list of names to be promoted to their positions, coincidentally many of those personally loyal to him. Although Momand is doubtful all these men truly are guilty, he has given Daoud authorisation, hoping that a wide enough net will eliminate all the true perpetrators."
 afghanistan_events.505.a:9 "Can no one truly be trusted?"

 afghanistan_events.506.t:9 "Guard Alleges Daoud's Involvement"
 afghanistan_events.506.d:9 "The idea of a member of the Royal Guard being involved in the late king's killing is one that made sense to many, but there are hundreds of men who were actively operating on that day, with no way to know how to narrow it down. That is however until the name of a particular guardsman was handed to members of the Directorate of Intelligence Records by an army officer who recalls suspicious actions by the man on the day of the regicide.\n\nAfter confirming that the man was indeed present on the day, and that the guardsman would have possibly been in a position to carry out the foul deed, authorisation was given to bring him to the Arg's prison. A few hours alone with warden Sarajadin Gardizi and his men, experts in extracting a confession from even the most steadfast of men, was all it took for the accused to finally crack.\n\nIt has said that the guard has confessed to everything, even a few things that he likely had no way of being involved in, but has more importantly given a written confession that he killed Nadir on Daoud Khan's orders. He claims that Daoud knew he had no way to take power as long as Nadir and Hashim stood in his way, and that by killing Nadir he would create a large enough opening to insert himself in, with Daoud promising the guardsman a major position in return. Although there is little else to back this claim, it is the best evidence we currently have, and perhaps we may need to have a word with the Prime Minister..."
 afghanistan_events.506.a:9 "He can't have...investigate this now."
 afghanistan_events.506.b:9 "Torture will make people confess the sky's red, look back into the Amanites."

 afghanistan_events.507.t:9 "The Case of the Disappearing Prime Minister"
 afghanistan_events.507.d:9 "There are two places in the universe that as far as humanity knows are completely devoid of life: The first being the heavens above, and the second now apparently being the Prime Minister's residence. Those dispatched to find Daoud, after he failed to respond to the Marshal's summons, have found nothing but the lingering evidence of a quick departure. This clearly happened under the cover of darkness, or the man has somehow acquired the loyalty of everyone in the immediate area, as no one questioned even reported hearing any unusual noises, let alone seeing the Prime Minister flee.\n\nWhatever the case, news of the guardsman's confession must have clearly gotten to Daoud before it got to the president, and he must have elected to flee rather than face any questioning. Whether or not the Prime Minister is truly guilty of the crime he is accused of seems irrelevant at this point, as it is obvious he at least believed that exile would be preferrable to attempting to defend himself."
 afghanistan_events.507.a:9 "Only a guilty man runs, we'll find him one day."

 afghanistan_events.508.t:9 "Replacing Daoud"
 afghanistan_events.508.d.pashtunistan:9 "$afghanistan_events.508.d.notpashtunistan$\n\nA third alternative of course could always be to reach over to the Frontier, and appoint one of the Khan brothers as Prime Minister, as despite their differences with the Azadists they are likely to prove useful in furthering the President's Pashtun focused goals."
 afghanistan_events.508.d.notpashtunistan:9 "Despite little yet being proven, to all involved the Prime Minister's sudden disappearance amidst the ongoing investigation has left little doubt about his guilt. He has been dismissed from his post in absentia, and a warrant has been issued for his arrest, although it seems likely he is potentially multiple countries away by now. The position of Prime Minister cannot realistically go vacant for long though, and while the hunt for Daoud is still ongoing a replacement will have to be chosen.\n\nChief among the list of names for a new prime minister are bank president Abdul Majid Zabuli, currently part of the People's Party, and Abdul Hadi Dawi, leader of the minor Islamic Party. Zabuli seems the obvious choice to many, as an existing member of the party and one with deep ties and deep pockets, however those are not always positives. Zabuli was part of Daoud's inner circle, and his appointment may simply see us here again soon enough. Dawi on the other hand, as an outsider to the Azadists, is much less likely to have unsavoury factionalist ties, and the man has long proven he can handle important roles."
 afghanistan_events.508.a:9 "Reach out to the AIA."
 afghanistan_events.508.b:9 "Dawi would be a competent PM."
 afghanistan_events.508.c:9 "Zabuli can be trusted with the job."

 afghanistan_events.510.t:9 "Officialising a New Constitution"
 afghanistan_events.510.d:9 "With the issue of Nadir's death resolved, and the republic stable enough to not be dislodged by its enemies at a moment's notice, it is at last time to officialise a new constitution. Until now the nation had been operating on a mix of the Amanite constitution and martial law, but there is only so long such a temporary situation can persist.\n\nMembers of the People's Party, alongside non-affiliated figures considered major enough to have a say, are now set to gather in [AFG.Capital.GetCapitalVictoryPointName] to draft up the republic's first constitution, and legitimise Azadist rule."
 afghanistan_events.510.a:9 "Prepare the Assembly."

 afghanistan_events.511.t:9 "The Status of Elections"
 afghanistan_events.511.d.start:9 "Most of the mundane issues in the constitution have been quickly resolved without much dispute, with few having any qualms about matters such as the officialisation of the position of president and prime minister. The first major point of contention has however come about when it comes to the status of elections, and how well the nation should tolerate minor political parties that serve as the token opposition."
 afghanistan_events.511.d.end:9 "Amongst most of the People's Party, even allowing a powerless position within the legislature is seen as an unneeded concession. They argue that an inch of power is all it will take to corrupt the opposition into attempting to enforce their will on the party and the nation, and they must be curtailed for the country's sake. A smaller but still influential section of the party believe the opposite, countering that by allowing the opposition a token outlet through parliament, they will be too placated to oppose the government in other ways, preemptively preventing organised unrest."
 afghanistan_events.511.d.pashtunistan:9 "$afghanistan_events.511.d.start$\n\nAs per our agreements with the parties of the Frontier, which there is not enough political will yet to go against, an exception will be constitutionally protected for them to continue handling local elections as they see fit. On a national level however, we must decide whether we will tolerate parties like the Islamic Party and Enlightened Youth actually contesting elections in a token fashion, or if a complete constitutional ban on non-approved candidates will be enacted.\n\n$afghanistan_events.511.d.end$"
 afghanistan_events.511.d.notpashtunistan:9 "$afghanistan_events.511.d.start$\n\nThrough discussions with the leaders of the smaller parties, the government has been convinced to allow their continued existence on a local government level, although requiring the candidates to officially register as independents on the ballot. On a national level however, we must decide whether we will tolerate parties like the Islamic Party and Enlightened Youth actually contesting elections in a token fashion, or if a complete constitutional ban on non-approved candidates will be enacted.\n\n$afghanistan_events.511.d.end$"
 afghanistan_events.511.a:9 "Only People's Party candidates may run at a national level."
 afghanistan_events.511.b:9 "Allow a token opposition, for now..."

 afghanistan_events.512.t:9 "Governance of the Realm"
 afghanistan_events.512.d.pashtunistan:9 "$afghanistan_events.512.d.start$\n\nAlthough we have agreed to the Frontier's autonomy already, the idea of a hopefully temporary period of greater provincial autonomy elsewhere is now the question. $afghanistan_events.512.d.end$"
 afghanistan_events.512.d.start:9 "The greatest weakness of every prior Afghan state has not been their positions on the most disputed issues, like religion against secularism or women's rights; it has been their inability for those with power to enforce their positions onto the rest of the nation. It hardly mattered when King Amanullah decreed that women should lose their veils and men should wear suits, if 20 minutes outside of [AFG.Capital.GetCapitalVictoryPointName] the locals decided that they shouldn't. A strong central government, actually able to institute its authority, is agreed upon by the entire party as a vital thing to bring about."
 afghanistan_events.512.d.end:9 "Centralisation has never been popular, as the greed of the uncontrolled masses pushes them to empower themselves at the nation's detriment. Through a slower move to a unitary nature we can hopefully get the peasants to surrender their power to us without a fight. There is no guarantee however that this will not just become the new status quo, and it may be worth the risk to move immediately to unitary centralisation, and put down any who resist if needed."
 afghanistan_events.512.d.notpashtunistan:9 "$afghanistan_events.512.d.start$\n\nWhether we bring this about immediately however, or whether we for now allow a hopefully temporary period of greater provincial autonomy is the question. $afghanistan_events.512.d.end$"
 afghanistan_events.512.a:9 "Officialise the Frontier's autonomy for now, but centralise the heartlands."
 afghanistan_events.512.b:9 "The state shall be unitary."
 afghanistan_events.512.c:9 "Significant provincial autonomy is the best way forward."

 afghanistan_events.513.t:9 "The Place of Women"
 afghanistan_events.513.d.start:9 "The issue of women's rights is undoubtedly a controversial one, if the past decade or two of civil unrest and conflict stemming from it did not already make that obvious. Even within the People's Party there are views ranging from seeing women's rights as vital for national liberation, and those who view them as the decadent corruption of western liberalism that seeks to destroy not only Pashtuns but every Islamic influenced people. Even before the constitution's drafting began, the government had to adopt a provisional position on the issue, to which it still sticks now.\n\n"
 afghanistan_events.513.d.rights:9 "$afghanistan_events.513.d.start$Therefore as per our prior proclamations, the constitution will seek to establish the full equality of women in modern society, continuing on from the Amanite years and bringing us on par with the other great powers of the modern world. This is no doubt going to ruffle a few feathers, yet the President and his party have little to fear from a few angry mullahs, especially old men like the Sher Agha who are already one bad day away from dying of advanced age anyway."
 afghanistan_events.513.d.norights:9 "$afghanistan_events.513.d.start$Therefore as per our prior proclamations, the constitution will not grant women any further rights than those already given to them, and in a few places limit some of the excesses of the Amanite years. Although there is no plans to constitutionally reinstitute purdah or ikhtilat like the most zealous of mullahs might wish for, and we of course will tolerate the continued role of the women's wing of the People's Party, sacrifices have to be made for stability. Unofficially we will continue to encourage a regression back to the status quo of yesteryear, where women cover themselves in public and primarily seclude themselves in their homes, at least until it is politically opportune to change course."
 afghanistan_events.513.a:9 "Women shall be given the same rights we give men."
 afghanistan_events.513.b:9 "Give them some basic rights, but nothing too extreme."

 afghanistan_events.514.t:9 "The Balance of Power"
 afghanistan_events.514.d:9 "Since taking control of the nation, factionalism within the People's Party has unfortunately been rife. Those loyal to Momand, those loyal to Daoud, and those who do not define themselves by their loyalty to either have spent much of the early life of the Republic attempting to claw their way to the top of the totem pole.\n\nIt seems however that after enough infighting, the party has settled into a stable enough status quo, with the current balance of power now written into the official powers granted to each of the major offices."
 afghanistan_events.514.a:9 "The President's shall be the ultimate authority."
 afghanistan_events.514.b:9 "Officialise the Prime Minister's dominance."
 afghanistan_events.514.c:9 "Formalise the balance between the PM and President."
 afghanistan_events.514.e:9 "Allow the Assembly some role in governance."

 afghanistan_events.515.t:0 "La Langue Nationale"
 afghanistan_events.515.d:9 "The [AFG.GetAdjective] nation is home to many languages, with Turkic languages spoking in much of the north, Hindustani dialects spoken in the east, and even some minor Nuristani tongues. The true Afghans however have always spoken one of two languages, Persian and Pashto, with the former being the lingua franca and popular amongst the elites, but Pashto being the native tongue of its peoples.\n\nThe President himself, despite being raised as a Persian speaker, has long pushed for its complete replacement with Pashto, singlehandedly spearheading a national revival for it. Alongside his Pashto Literature Society he has spent almost a decade attempting to reeducate the nation's elites into speaking Pashto instead of Persian, having personally taught large chunks of the language to the former Crown Prince Zahir. If it was up solely to him, there would be only one choice on the national language, however he is not immune to influence by other party members.\n\nAlthough few would openly admit it to his face, Momand's \"revived\" version of Pashto is quite at odds with what the common people actually recognise, and will likely instil great confusion if used as the sole national language. Even those in agreement on the institution of Pashto have pushed the Marshal to consider at least also recognising and using Persian as a second official language, until the people have time to get used to modern Pashto."
 afghanistan_events.515.a:9 "Recognise both Pashto and Persian."
 afghanistan_events.515.b:9 "Solely recognise Pashto."

 afghanistan_events.516.t:9 "Signing of the Constitution"
 afghanistan_events.516.d:9 "The arduous process of drafting the new constitution is finally at an end, with the remaining mundane issues hashed out without requiring much input from the President or Prime Minister. A finished document has been presented to the President to officially institute as the law of the land, and as per the constitution elections are now scheduled to be held in six weeks time, giving the People's Party a more legitimate mandate to rule from.\n\nCelebrations have begun throughout the nation's urban centres, led by party officials, praising the rebirth of the [ROOT.GetAdjective] nation!"
 afghanistan_events.516.a:9 "The Republican State shall last a thousand years!"

 afghanistan_events.517.t:9 "The First National Elections"
 afghanistan_events.517.d:9 "Six weeks have passed since the announcement of elections, and at last the [ROOT.GetAdjective] people can finally decide for themselves which of the chosen candidates shall carry out their will.\n\nThe Marshal and his Prime Minister wait in anticipation to see exactly how the legislature under them will be filled out, and what the Party may have to adjust for it in future."
 afghanistan_events.517.a:9 "The people have chosen their candidates."
 afghanistan_events.517.b:9 "Allow the opposition a few seats."

 afghanistan_events.518.t:9 "Afghanistan Goes to the Polls"
 afghanistan_events.518.d:9 "Four years have passed since the last elections reaffirmed the Marshal as the man most capable of seeing to the future of [ROOT.GetNameDef].\n\nAs election season enters its twilight and voters prepare to undertake their civic duty, the People's Party have taken it upon themselves to oversee the elections so that we may guarantee the smooth execution of democracy furthermore. While undoubtedly the President, and Prime Minister [AFG.GetSecondInCommand], will be respectively re-elected in a landslide, the exact composition of the new legislature is still somewhat in the air."
 afghanistan_events.518.a:9 "The people have chosen their candidates."
 afghanistan_events.518.b:9 "Allow the opposition a few seats."

 afghanistan_events.519.t:9 "When We Forgot Zion"
 afghanistan_events.519.d:9 "All peoples have their origin story, from fantastical tales of mythical kings to more grounded stories of foreign migrations, and surprisingly some of them actually end up being true. For centuries the Pashtun people have been led to believe origin myths involving both of these types of tales. The child of Israel known as Afghan, son of the prophet Irmiya, and descendant of the king Talut, has always been seen as our own mythical founding king. Amongst the tribes of the Frontier especially the second type of myth can be found, where it is said that Afghan was joined by the Tribe of Joseph, to whom the Yusufzai claim to be the continuation of.\n\nFor the past few decades however, this myth has finally begun to collapse, a change the Azadists are proud to have played a part in. Owing to the groundbreaking works of European philologists like Max Müller and Gustaf Kossinn, who inspired the late great Mahmud Tarzi, the Pashtun people finally became aware of the Aryan race and their place within it. Rather than being scions of a foreign land, we at last discovered that the Pashtuns were fathers of the Aryan race, a race proud to have spawned great empires and cultures.\n\nThe idea of ensuring that the nation's peoples finally know this new truth behind their ancestors has been a priority of the most ardent Azadists ever since taking power. With the Marshal's direct approval, it has become official state doctrine, even taught as national history to children of all ages. At the university level new courses studying the great Aryan texts of the Avesta and the Veda through a Pashto lens have similarly been introduced. Some may attempt to falsely dispute the truth of our origins, but the Pashtuns can at last be confident that they are one of the few who truly know where they came from."
 afghanistan_events.519.a:9 "Pashtuns have never been anything but Aryan."

 afghanistan_events.520.t:9 "The Future of Agriculture"
 afghanistan_events.520.d:9 "No matter how rich and powerful a nation gets, ensuring that its people remain fed has to always be the highest of priorities. Although there is little fear of famine in the immediate future, the death and destruction we are beginning to see across the globe has left many concerned that perhaps it would be best if Afghanistan can feed itself fully without having to rely on any imports.\n\nA team directed by the Prime Minister to look into how we can improve the nation's agriculture has identified the valleys around the Helmand and Arghandab rivers as a perfect location for a mass expansion of grain production. Compared to the rest of the nation, this area is much more fertile and workable terrain wise for largescale farms, with the rivers being perfect for use in irrigation. Plans from the Amanullah years drafted by Japanese specialist Mitsuo Ozaki also reached a strikingly similar conclusion, giving the team further confidence in the plan.\n\nIn order to carry out these plans however, significant resources will need to be dedicated to the project. Workers will have to come from somewhere, with local ones almost certainly the cheaper option, but limiting the amount of men we can devote to other industrial projects. Hiring them from abroad is certainly possible, although it will put a notable dent in the funding for other projects. It may simply be worth scrapping the idea like Amanullah did rather than eat this cost, but we may come to regret not investing in the future if we do."
 afghanistan_events.520.a:9 "Approve work in the region."
 afghanistan_events.520.b:9 "This plan must be the government's priority."
 afghanistan_events.520.c:9 "It is a total waste of resources, shut it down."

 afghanistan_events.521.t:9 "Aftermath of the National Agriculture Plan"
 afghanistan_events.521.d:9 "Three years after they were first put to the task, the Helmand Valley Agricultural Department has finally begun to have something to show for their efforts. According to the official report put onto the President's desk, grain production in the region is up 139% already, with cotton up another 77%. Almost all the projects are said to be ahead of schedule in the report, except for the one Momand had already discovered had begun to fall behind. All in all, the report presents a fantastic picture for [AFG.GetAdjective] agriculture and national food security.\n\nTo no one's surprise, the actual results are much more modest in nature, although still decent progress. Men sent by the President to actually present a less official but true report give numbers around a quarter of what the Department claims, and that multiple major projects are still well behind schedule, with some not having even been started. Still, progress is progress, and there is little reason to not celebrate that fact, even if the numbers have been slightly doctored."
 afghanistan_events.521.a:9 "A vital step for the nation's growth."

 afghanistan_events.522.t:9 "A Nation of Literature"
 afghanistan_events.522.d:9 "In addition to being head of the nation's armed forces, President of the Republic, and a family man, Momand has found plenty of time for cultural pursuits. Alongside other major Pashto literaturists like Abdul Rauf Benawa and Sadiqullah Rikhtin he has dedicated much of his time to the Pashto Literature Society, serving for many years as its president and other years as its de facto leader.\n\nFinally having ran out of time to dedicate to everything, Momand has decided to at last step down from all direct positions within the society. Not wishing to fully abandon a role in it however, he has moved to see the society moved officially under government control, acting as a cultural arm of the republic. What this means in practice is the continued control of Momand over the highest levels of the society, but less day to day involvement. The membership will be happy however to note a significant increase in funding, now supported directly by the government rather than generous patrons. Perhaps this spells a bright future for Pashtun culture."
 afghanistan_events.522.a:9 "No culture is superior to that of the Pashtuns."

 afghanistan_events.523.t:9 "Settler Scuffle in Puli Khumri"
 afghanistan_events.523.d:9 "Since the days of Rahman Khan, colonisation of the northernmost regions of Afghanistan has been a major priority, finally allowing the Pashtun people control over this untamed wilderness, and defend the northern border from any Russian aggression. Despite great pushback by the local Turkic people, including by Kalakani and his Saqqawists, efforts have significantly continued to the present day. President Momand, a diehard believer in the colonial cause, has recently been personally involved in the foundation of multiple new Pashtun towns around the settlement of Puli Khumri.\n\nUnfortunately, even with the complete destruction of the Saqqawists and many of their followers, it seems that there is simply a new generation of Tajiks in the region ready to stop our projects. The local population still believes that the land belongs to them, and are willing to fight to take it back from the settlers. No one has yet been killed, but angry mobs of Tajik locals have physically attacked settlers over the past few days, and vandalised recently put up buildings. If this project is to continue, we may need to consider sending in the army to protect our settlers from these attacks."
 afghanistan_events.523.a:9 "Their land is rightfully Pashtun, back the settlers."
 afghanistan_events.523.b:9 "Leave them alone, do we really need another Tajik revolt?"

 afghanistan_events.524.t:9 "Unrest Escalates in Turkestan"
 afghanistan_events.524.d:9 "Despite the deployment of a small number of troops to Turkestan, it seems that the locals have not faltered in their boldness. While troops were patrolling elsewhere, Tajik raiders attacked one of the settlements to the east of Puli Khumri, torching multiple buildings and kidnapping two young Pashtun women. Demands conveyed to the nearby garrison after the raid have at least confirmed that they have not harmed the women, but threatened that they will not be returned unless all Pashtun settlement in the immediate area comes to an end.\n\nAs unfortunate as the news is, this is far from the first time we have heard such a story arise from settlement attempts in Turkestan, and it will certainly not be the last. Historically, the response to such demands has almost always been the same, send in the army to put down these rebels and attempt to bring back who we can. After years of violence however, and the legacy of the Saqqawist uprising still hanging over us, perhaps for once it may be worth standing down."
 afghanistan_events.524.a:9 "Ousting foreign occupiers is what the army is for."
 afghanistan_events.524.b:9 "Tolerate their demands and withdraw."

 afghanistan_events.525.t:9 "The Battle of Puli Khumri"
 afghanistan_events.525.d:9 "As was the expectation ever since we sent the army north, violence has broken out in Puli Khumri. For the past few weeks the much larger garrison has been patrolling every Pashtun settlement in the region, waiting for the opportunity to strike back against the locals.\n\nAn attempted raid by tribesmen, who incorrectly believed one of the settlements to be undefended, left dozens dead, with most of those falling on the Tajik side. Punitive expeditions were then launched against the local villages these men came from, with their defenders now laying in the dirt.\n\nNo sign of any of the captives was found, but it is hard to say if local troops were even looking. Unrest however now swelters through the rest of Turkestan, with the fear we hoped to strike into the local peoples turning instead to anger against the Republican State."
 afghanistan_events.525.a:9 "At least their land is now vacant for the taking..."

 afghanistan_events.526.t:9 "The Girls of [267.Controller.GetVictoryPointName_10737]"
 afghanistan_events.526.d:9 "Rather than simply issue empty proclamations it expects others to follow, the Republican State has made sure its officers and party members lead by example, and nowhere is this more true than that of women's rights. For the past few months an official decree has been issued from the president, informing officers that their wives must be present alongside them at national celebrations, such as those for independence day. So far this appears to have been stuck to, with no real opposition, but the realisation that many of our officers seem to have suddenly married beautiful young Kabuli women has raised a few eyebrows.\n\nAn investigation into this matter has rather shockingly concluded that these women are not actually married to these officers, barring one or two exceptions, but instead they have simply paid girls from [267.Controller.GetVictoryPointName_10737] to appear alongside them in public. One officer who was coaxed into confessing admitted he did so due to not wishing to subject his wife to what he views as un-Islamic practices, and that it was better to hire one of the \"already sinful\" women of [267.Controller.GetVictoryPointName_10737] rather than defy the president.\n\nThese allegations of insubordination have sent shockwaves through high command, who have been outraged over the lengths the men will go to avoid stepping into the 20th century. It has been suggested that those who can be reliably proven to be defying the order be made an example of, with hopes that the rest fall in line and bring their actual wives the next time there is a celebration. On the other hand, some staffers have said that the lack of defiance by the officers is a good thing, and that we should just look the other way rather than risk them actually beginning to defy us. After all, as far as the public is concerned, they are seeing high ranking men standing side by side with women in public, the goal we hoped to achieve."
 afghanistan_events.526.a:9 "As long as they look like they're complying, they're complying."
 afghanistan_events.526.b:9 "Discipline any officer found to have hired these women."

 afghanistan_events.527.t:9 "An Unlikely Endorsement"
 afghanistan_events.527.d:9 "The Azadists may be many things, but never have they been described as friends of the Islamic establishment...until today. Despite Fazl Omar Mojadidi losing the government position he was promised under Nadir after the Republic's declaration, and initially decrying the Azadists as crypto syndicalists in response, he has begun to change his tune. In fact the man has actually gone so far as to backtrack on his previous statements, and has praised the recent move to roll back the Amanite era stances on women's rights.\n\nBehind the scenes however, this endorsement has not exactly been too unexpected, and a more straightforward reason may actually be behind it happening. To further ensure the ulema's loyalty, it is expected that over the next few months a tidy sum will slowly be distributed to major mosques and religious institutions throughout the nation. Mojadidi's headquarters in Shor Bazaar has already received a significant \"donation\", with promises of more over time. As far as the public is concerned though, the President is simply the defender of Islamic values that Mojadidi paints him as, and that is why all Muslims should support the republic."
 afghanistan_events.527.a:9 "It really is fantastic what money can achieve."

 afghanistan_events.528.t:9 "The National Club"
 afghanistan_events.528.d:9 "Daoud's loyalists may now dominate the government, but not every one of his allies is made equal. Within his inner circle, known by some as the National Club, there are two men alongside Daoud at the top of the ladder; those being Foreign Minister Faiz Mohammad Khan Zikeria and Finance Minister Abdul Majid Zabuli. Now that Daoud himself has for all intents and purposes moved himself up another rung alongside the President, he will almost certainly need one of these two men to begin filling in many of his old duties instead.\n\nThe first choice, Zikeria, is one of the many continuity candidates who no matter the government seems to just worm his way into office. He first served as an envoy under Amanullah to the at the time recently restored White government in Russia, slowly being promoted through the Foreign Office until eventually getting a cabinet position as Education Minister. The final years of Amanullah's reign saw him however shuffled back to foreign affairs, meeting frequently with both Russian and German leadership. Even now he serves as the Republican State's Foreign Minister, and is perhaps one of the most capable negotiators in the republic.\n\nZabuli on the other hand almost needs no introduction at this point, being perhaps the single individual most vital to the Afghan economy. His banks and his capital have been vital to the running of the Afghan state for over a decade, yet he has been an important ally for many of those years for both Daoud and the Azadists as a whole. If there is something that can not be accomplished by Zabuli's money or connections, it isn't worth accomplishing, making him perhaps the perfect choice instead for the role."
 afghanistan_events.528.a:9 "Any man who could negotiate with Savinkov and Schleicher has proven himself."
 afghanistan_events.528.b:9 "Zabuli's business connections make him indispensable."

 afghanistan_events.529.t:9 "Rethinking Azadism"
 afghanistan_events.529.d:9 "When one finds a revolutionary movement, one also finds a large number of its adherents who spend more time focused on irrelevant theories and minor issues than practical matters, often times encouraged into further delusion by those around them. Many of the President's now purged allies could be classified as such men, with many spending much of their time bandying about crackpot ideas of how Afghanistan is the homeland of the Aryan race and how that means the Pashtuns are the progenitors of all nearby culture.\n\nFor years the delusions of these men were not only entertained, but even promoted by those who now make up the People's Party, believing somehow that these theories were vital to the Azadist movement. Under the Prime Minister's reign these theories are now rejected, not needing some lofty claims of grand ancestry to justify themselves. The Pashtun people are superior because of who they are, not because of who their forefathers are, and time must be spent ensuring that continues to be the case, not theorising about the past to claim it with words."
 afghanistan_events.529.a:9 "Pashtuns have never been anything but Pashtun."

 afghanistan_events.530.t:9 "Two Sides of the Same Coin"
 afghanistan_events.530.d:9 "Despite many regarding the agreement reached with the AIA as necessary for finally bringing order back to the nation, it has not exactly been popular on either side of the aisle. On the AIA's side there has been much chagrin over alleged \"authoritarianism\" exhibited by the Azadists, with AIA members believing they have no real interest in advancing the cause of the nation, and are instead solely interested in their own advancement. On the government's side, those close to Daoud Khan especially have pushed back against the AIA in private meetings, believing that they are just dead weight, and that continued cooperation will hold back the Azadist cause.\n\nTo the president however, Ghaffar Khan and his men represent a genuine, if flawed, approach to building the Pashtun nation. In order to maintain fair relations, Momand arrived in [442.Controller.GetVictoryPointName_12717] yesterday morning, aiming to meet personally with the great Bacha Khan. Although few know what has been said behind the closed doors, reporting from both sides has painted the interaction as very positive. Rumours are abound of greater AIA involvement in ongoing programs to bolster Pashtun identity and culture, and a guarantee of the continuation of prior agreements."
 afghanistan_events.530.a:9 "We may be at odds on many issues, but the nation comes first."

 afghanistan_events.531.t:9 "The Daoud-Habibi Pact"
 afghanistan_events.531.d:9 "Daoud Khan is a man with friends in many places, including many he perhaps shouldn't, but many above the board individuals as well. One of these allies is Abdul Hai Habibi, leader of the minor Movement of Enlightened Youth, of whom has been connected for many years with the Azadists due to his nationalist views. Rather than joining the People's Party, he opted to band together with his fellow liberal academics to form his current party, yet it appears that he may not exactly be happy being outside the ruling zeitgeist.\n\nAfter a collection of meetings with the Prime Minister, both Habibi and the party's other leading figure Abdul Rauf Benawa have agreed to begin the process of merging the Enlightened Youth fully into the People's Party. Seeing little point in continuing as a distinct party, it appears they would rather prefer to exist as an internal grouping within the Party, potentially giving them an entry into government positions they wouldn't have in the opposition.\n\nThere has been some pushback to this proposed merger however, with anti-Daoud Azadists requesting that the President block it going ahead. Although Benawa is friendly with the President, many of these liberals will likely just find themselves falling into Daoud's camp, further strengthening his position. For those who believe the current power balance is vital, allowing the balance to tip like this is expected to only lead to disaster, even if it does boost the party in the short term."
 afghanistan_events.531.a:9 "Merge them into the People's Party."
 afghanistan_events.531.b:9 "It'd be unwise to pack the party with Daoud's allies."

 afghanistan_events.532.t:9 "The Other Prince"
 afghanistan_events.532.d:9 "With Zahir and his uncles gone, and Daoud Khan's profile so overpowering, one might forget that he is not the only royal still in the country, let alone the government. Mohammad Naim Khan, Daoud's brother, is the only other member of the former dynasty who remained in Afghanistan when the republic was declared. Rather than flee with his father Aziz, he chose to stay alongside Daoud, and was rewarded handsomely through being made Minister of Commerce under Zabuli's Finance department.\n\nUnlike his brother who went into a military role, Naim was educated by his father in the realm of foreign politics, alongside receiving significant tutelage by his uncle Hashim. During the civil war he served Marshal Momand by handling many logistical matters for him, earning the future President's favour. This focus on logistics made him a fitting candidate for Minister of Commerce, with both roles having rather similar skillsets in the grand scheme of things.\n\nEven overshadowed by his brother, the Prince has actually begun to gain a name for himself over recent months, with people finally beginning to wonder if they should have been paying attention to him earlier. Putting the skills from his father to use, Naim's department has recently overseen a deal reached for multiple foreign-owned factories to be established in [AFG.Capital.GetCapitalVictoryPointName], locally producing major pieces of industrial equipment we will need for continued economic growth. Although still early days in a land where one moment could see the downfall of anyone, perhaps it is worth paying attention to Naim, especially if the Prime Minister's star finally one day fades out."
 afghanistan_events.532.a:9 "A protégé of Momand, Zabuli, and Hashim is a powerful combination."

 afghanistan_events.533.t:9 "The Buzz About Buzkashi"
 afghanistan_events.533.d:9 "Buzkashi is a rough and unregulated sport practiced mainly by Uzbek and Tajik communities in northern Afghanistan. With its roots firmly in a long lineage of Central Asian horseback carcass games, Buzkashi events see hundreds of riders compete against one another to determine which man can secure a prepared goat or calf carcass in a massive scrum of horsemen, and then break free of his pursuers. These events were opportunities for local khans and notables to flaunt their wealth, gathering gifts for victors and displaying the quality of their finest horses. Additionally, it was an opportunity for talented riders to show their prowess, and many a fine competitor has made a name for themselves as a minor celebrity on the back of particularly daring feats.\n\nMohammed Daoud Khan has taken a personal interest in these spectacles, and has endeavored to bring this odd northern institution to [267.controller.GetVictoryPointName_10737]. He claims that such a unique, martial, and visually impressive tradition would serve as the perfect foundation for a sport which is solely and uniquely Afghan. Having collected some of the leading riders of the north in [267.controller.GetVictoryPointName_10737], he has devised new rules to transform this festival / mock battle into a proper athletic event, adding such concepts as a bounded arena, teams, a scoring area, a fixed number of competitors, and a referee.\n\nTime will only tell if this new experiment will bear fruit, but regardless one must marvel at the audacity of his attempts. Once a sport designed specifically to display the power of local warlords, Daoud hopes to turn Buzkashi into the first “national” sport of the republic."
 afghanistan_events.533.a:9 "Play...erm...ball?"

 afghanistan_events.550.t:9 "The First National Elections"
 afghanistan_events.550.d:9 "With the government satisfied that Afghanistan is finally ready at a national level to embrace democracy, the nation's first real national elections have at last been held over the past few days.\n\nThe AIA are unsurprisingly the favourite to win, having spearheaded the whole process, yet one cannot rule out a potential unexpected rural turnout giving the Islamic Party the edge they need to win, or even urbanites opposed to certain AIA policies allowing the Enlightened Youth a path to victory."
 afghanistan_events.550.a:9 "The AIA have won over the people."
 afghanistan_events.550.b:9 "The Islamic Party wins the vote."
 afghanistan_events.550.c:9 "The Enlightened Youth secure victory."

 afghanistan_events.551.t:9 "Afghanistan Goes to the Polls"
 afghanistan_events.551.d:9 "Three years have passed, and [AFG.GetLeader]'s current term is coming to an end. Afghanistan must once again go to the polls, a message urged by all three major parties in Afghanistan's political landscape.\n\nWhile the AIA still enjoy broad popularity, the Islamic Party actively cultivate rural voter participation, and the Enlightened Youth grow ever more influential the more Afghanistan's urban centres expand. As the ballots count, many eagerly await to see what the results hold for Afghanistan's future."
 afghanistan_events.551.a:9 "The AIA have won over the people."
 afghanistan_events.551.b:9 "The Islamic Party wins the vote."
 afghanistan_events.551.c:9 "The Enlightened Youth secure victory."

 afghanistan_events.552.t:9 "The Amanite Restoration?"
 afghanistan_events.552.d:9 "Afghanistan may now be a republic, but it is a status forced upon the country by men now halfway across the world. Many within both the opposition and the government iself find themselves tepid on republicanism, seeing it as just a vestige of the Azadist coup. Yet despite there being a nostalgia for a return to the days of the kingdom, they do not desire a return to the days of Nadir or his siblings, but the ousted Amanullah Khan.\n\nFor months now there has been an active debate in government over whether or not attempts should be made to at least contact Amanullah to discuss a constitutional restoration. Those in favour wish for a return to the golden decade, seeing the former King as a vital figurehead for national stability. Those opposed believe that there is no world in which Amanullah does not attempt to bend the nation back into his vision, and will never accept a role with powers no greater than a rubber stamp. To the latter group's dismay however, it appears that the pro-Amanullah side has at last won out, with emissaries sent to discuss the matter with the former King\n\nRather than being a simple return to a rosier age, it appears that perhaps the naysayers were right. Discussions with Amanullah have gone nowhere, as he is steadfast in refusing to accept any offer that does not see a full return of power to him. Even those who attempted to reach out to Amanullah's more constitutionally minded brother have found no success, with Inayatullah refusing to take the throne, and there being little support for any king but Amanullah. With neither side willing to budge, it seems any restoration is dead in the water for now. "
 afghanistan_events.552.a:9 "He is obsessed with modernity yet unfortunately stuck in the past."

 afghanistan_events.553.t:9 "Reorganisation of the Defence Forces"
 afghanistan_events.553.d:9 "Our defence forces are in serious disarray from top to bottom. The aftermath of our race to the capital and the establishment of a republic threw the traditionally oligarchic and nepotistic army into tribalistic fragmentations. Though not all of the old military brass has forsaken us, are we wise to trust them still? These men may still be hung up on the days of the Padishahs and Emirs, who may see our idealistic and pacifist government not as providential, but as potential prey. One of the most pre-eminent military leaders of Pashtunistan, Abdur Rahim Popalzai who almost took up arms during the crisis with Amanullah's government over a year ago, has emerged as a top candidate to oversee a vast reorganisation of the army.\n\nPromoting him to Field Marshal will ensure we have a loyal man commanding our armed forces, one who is very unlikely to engage in underhanded scheming against our government so long as we are faithful to Allah and benevolent to the people. Despite his capability, he is not a formal military leader and has little to no formal training in martial leadership. For this reason, we may still consider retaining the leadership of professional, career-minded army men."
 afghanistan_events.553.a:9 "Popalzai has proved himself capable and loyal, promote him."
 afghanistan_events.553.b:9 "It would be better to defer to the professionals."

 afghanistan_events.554.t:9 "The Khan of the Sikhs"
 afghanistan_events.554.d:9 "When looked at as a whole, many would regard Afghanistan as simply a Muslim nation, with the overwhelming majority of the population being adherents to Sunni doctrine, and Shiites being the next largest group after that. This rather reductionist view eliminates the hundreds of thousands living amongst us, primarily the Ahl al-Kitāb and followers of Dharmic faiths, tracing their ancestry in many cases back thousands of years.\n\nFor quite a large amount of our people however, the idea of Afghanistan being a nation of just Muslims is not an oversimplification, it is an ambition. Men like the Prime Minister Khan Sahib, who has strived all his life for interfaith tolerance, are seen by such people as traitors rather than inspirations. As leader of the Frontier, local Muslims decried him as having betrayed the faith for overseeing legal decisions considered too pro-Sikh, and for allowing his daughter to marry a Sikh man.\n\nWhat was once limited to the Frontier however has begun to spread to the heartlands, amplified significantly by a certain Mullah from Shor Bazaar. With Mojadidi's funding, anti-AIA propaganda has begun to refer to the PM as \"Abdul Kafir\", meaning \"slave of the unbelievers\", as a vicious parody of his name.  Although we know the man cannot be reasoned with, those around Jabbar Khan have encouraged him to perhaps take a step back from interfaith issues, hoping to avoid this idea of him being too pro-Sikh catching on further. They argue that it would be better to have a stronger public image now, and quietly aid other faith adherents, than risk painting the entire government as anti-Islamic in nature."
 afghanistan_events.554.a:9 "Sectarianism is a plague we must cure."
 afghanistan_events.554.b:9 "We can't afford the perception of favouritism."

 afghanistan_events.555.t:9 "The All-Afghan Poetry Summit"
 afghanistan_events.555.d:9 "The goal of the reformation of Afghan society does not simply limit itself to uncorrupting the states politics or combating poor cultural practices, it also necessitates treating its culture as something to be proud of and promote. For years the AIA have spearheaded the promotion of traditional Pashtun culture, elevating it from shared traditions in villages to the grandest of stages in our great cities.\n\nThe latest attempt by the government to promote national culture has come in the form of a grand poetry summit in [AFG.Capital.GetCapitalVictoryPointName], inviting Pashto artists from across the entire nation to show the best the country has to offer, especially to the many foreign guests the government has brought in for it. A wide array of poetry recitals, grand musical numbers, and fantastic plays have truly amazed those lucky enough to visit. The highlight to many has been a rendition of Akbar Khan Akbar's great play \"The Three Orphans\", reimagined away from its Frontier setting to highlight those left behind by the recent civil war. The grand success has already led to plans being created to continue this festival annually, with even some Uzbek and Hindko speakers hoping to host smaller ones of their own in future."
 afghanistan_events.555.a:9 "The joys of Pashtun culture."

 afghanistan_events.556.t:9 "The War of Ghalla Dher"
 afghanistan_events.556.d:9 "To the ears of a suffering person, the only statement worse than \"help will never come\" is perhaps \"help will gradually come\", as at least the first assures them that they are on their own. The government's recent announcement of a slow legal reduction in the powers and excesses of feudal lords has therefore not exactly been received as well by the peasants as many initially hoped. Those who have long suffered under local tyrants have struggled to see future liberation as liberation at all, and have simply been incentivised to take matters into their own hands, and rapidly accelerate the death of feudalism.\n\nIn the town of Ghalla Dher, where the Nawab and his family have long ruled in cruel excess, the peasants have at last had enough. Led by socialist dissidents who remain at odds with the AIA's reformism, these peasants marched upon the Nawab's estate, hoping to inflict harm upon him and his family. Two of the lord's guards were brutally beaten, and the estate torched to the ground, although the man and his family were able to escape unharmed.\n\nViolence like this has long been the anthesis of the AIA's movement, and vigilante violence of any kind is unsuitable for a civilised society. News of what is quickly becoming known as the \"War of Ghalla Dher\" has led to worried calls to crack down on these angry mobs before it further escalates, coming especially from other landlords who fear they are next. Those who sympathise with the plight of the peasants however recommend we simply allow local authorities to handle it, and simply refuse to give any statements on the issue so we do not alienate either side."
 afghanistan_events.556.a:9 "We won't endorse it, but we won't condemn it."
 afghanistan_events.556.b:9 "Violence solves nothing, arrest these vigilantes."

 afghanistan_events.557.t:9 "The Uplifting of the Labourer"
 afghanistan_events.557.d:9 "\"Out of my way, you son of an ass\" is by all accounts a more commonly heard phrase by the poorest of [AFG.Capital.GetCapitalVictoryPointName] than \"Thank you\". Rather than seeing the lowest of us as simply doing what they can to get by, men and women no different than themselves, people regard the lowest workers as parasites who wouldn't be poor if they didn't deserve to be. Street sweepers, water carriers, and weavers especially play a vital role in Pashtun society, yet are looked down upon as failures who view their jobs as suitable only for women, children, and foreigners.\n\nEven before becoming president, Bacha Khan has fought to break this stigma, and show people that there is no job that is beneath even the most powerful of men. His activism in the Frontier has seen the weaving profession go from one of shame to one of national pride, with the creation and donning of traditional garments being used to celebrate being Pashtun. Even the lowest street sweeper, because of the work of the AIA, no longer fears being physically abused in [442.Controller.GetVictoryPointName_12717] by his supposed betters, with them taught now to respect the vital role he plays.\n\nIn the heartlands however, this cultural revolution has yet to penetrate the hearts of its people, with many still stuck in their old ways. Hoping to change that however, Ghaffar Khan has today hosted an event in the capital, where along with prominent AIA members and streetsweepers he has cleaned [AFG.Capital.GetCapitalVictoryPointName]'s roads. Crowds gathered around, marvelled by the most powerful man in the nation seemingly debasing himself so, yet his conviction and inspirational speeches to them quickly won them over to his ideas. Changing this stigma will not happen overnight, yet the President has now done the hard part of getting the first dominos to begin to fall."
 afghanistan_events.557.a:9 "No man should look down on another, no matter his profession."

 afghanistan_events.558.t:9 "Overturning the Fee of Maliks"
 afghanistan_events.558.d:9 "With the events of Ghalla Dher still fresh in everyone's memories, it is apparent more immediate action against feudal excess is required in the short term. To that end a specific highly unpopular practice has been zeroed in on, that being the Da Malak Toray, or the Fee of the Malik. This practice, primarily found in the Frontier but with variants elsewhere in Afghanistan, involves tribal leaders placing a tax on marriage. In the Frontier specifically, this practice had historically become standardised at a fee of sixty rupees to allow any marriage to go ahead, with them charging the equivalent of even more now in Afghanis.\n\nAs of today however, with the signing of a new law by the President, all monetary restrictions upon marriage by third parties have been completely outlawed throughout the entire nation. The bill, spearheaded by Jamna Das Talwar, with input by Khan Sahib, has already begun to win back the government any good will it may have lost from perceived slowness. Although the feudal lords may grumble, having a little less money to wipe away their tears than before, the common people now rejoice about the ban."
 afghanistan_events.558.a:9 "Backwards practices like these just hold the Pashtuns back."

 afghanistan_events.559.t:9 "Heartland Tribes Protest Women's March"
 afghanistan_events.559.d:9 "Like the ousted king Amanullah before them, women's rights have always been fundamental to the AIA's vision for the Afghan nation. To Ghaffar Khan and his followers, the advancement of women is vital to the advancement of society as a whole. Although having broken down most of the resistance to this in the Frontier, excluding amongst certain UMNP voters, the tribes and establishment of the heartlands still view women's rights as antithetical to Islam and Pashtunwali.\n\nHoping to counter that, the party's women's league, led by Qanita Bibi Ziauddin, has been holding marches throughout the heartlands. They have campaigned in countless villages, hoping to promote women's causes to the locals, especially when it comes to education. Many men have also joined them in their efforts, with Communications Minister Mian Jaffar Shah being the most notable amongst them.\n\nUnfortunately much like Amanullah experienced before them, these marches have been highly controversial. Opponents to women's rights have gone so far as to threaten violence against the men in attendance, with Pashtun taboos of violence against women seemingly stopping these threats escalating into reality. The government's response has however been uniform in condemning these threats and backing the marches, with both the President and Prime Minister offering their full support to Ziauddin and Shah, and encouraging further marches to go ahead."
 afghanistan_events.559.a:9 "Your children have no rights over you except education, even your daughters."

 afghanistan_events.560.t:9 "Melmastya Misgivings"
 afghanistan_events.560.d:9 "Although a fundamental part of Pashtun culture and Pashtunwali, the AIA have spent many years dismantling the code of Melmastya. Like the idea of Xenia in Greece or those upheld by the Kanun in Albania, Pashtuns who adhere to Melmastya must show hospitality to all guests, a code firmly followed across Afghan society. Despite this idea being rather noble in nature, the AIA regard the practice to have become corrupted in modern times, focusing more on lavish displays to show off wealth rather than actually caring for guests. Ghaffar Khan's opposition to this wasteful extravagance has led to his personal refusal to accept gifts offered under Melmastya, and the imposition of a code for other party members to bring their own food while travelling instead of relying on meals from strangers.\n\nUnsurprisingly the government's recent move to crack down upon waste and extravagance in Afghan society has led to a coordinated push to limit the excesses of Melmastya and reframe it back to its humble roots. Also rather unsurprisingly, this push has not been welcomed with open arms by those who quite enjoy pomp and lavishness, and those who view these as fundamental to Pashtun culture. Most notably a dispute has arisen in recent days in Sangin, with the local government refusing to allow a planned feast for the wedding of a tribal leader's son, telling the Malik to give it instead to the needy.\n\nThe groom's family have now escalated the issue all the way to [AFG.Capital.GetCapitalVictoryPointName], hoping that the central government overrules the local \"unjust\" decision. The local administration's action is clearly an unpopular one, and we could easily ingrain ourselves with the tribes of the heartlands by reversing it. Allowing one exception however could easily be a slippery slope leading to tribesmen across the country demanding their own, and the risk of eroding cultural reform that would bring may be more harmful in the long term."
 afghanistan_events.560.a:9 "A little restraint won't kill you."
 afghanistan_events.560.b:9 "Perhaps we can overlook a celebration or two..."

 afghanistan_events.561.t:9 "The Ills of Politics"
 afghanistan_events.561.d:9 "Ghaffar Khan may now be the face of Afghan politics, yet there are few men who despise what politics truly means more than himself. Rather than selflessly devoting themselves to the betterment of society, many within the AIA would rather bicker amongst themselves about who is superior, or attempt to tear down their compatriots to rise through the ranks.\n\nWhile the President has so far simply been able to ignore and look above this infighting, leaving Khan Sahib to handle the more rank and file parts of politics, it seems that the current growing rift within the AIA may require more direct intervention. Those on the party's left such as Ajmal Khattak have been openly pushing for the AIA to fully adopt an anti-capitalist agenda, believing socialism to be the only path to a brighter future. Many around Jabbar Khan, although not the man himself, have slowly begun to openly adopt anti-socialist rhetoric in response, and going as far as to express fears of syndicalist infiltration of the party.\n\nAlthough the President does sympathise with the party's socialists, having long worked with open syndicalists, it seems that the party as a whole is beginning to move against them. Failure to crack down upon this factionalism now will almost certainly lead to the growth of this anti-socialist rhetoric, and a few words from Bacha Khan would almost certainly get them to stop to focus on more important issues. Wading into factionalism like this is unlikely to end well, and perhaps it may be easiest to just let Jabbar Khan continue to handle matters."
 afghanistan_events.561.a:9 "Factionalism is for fools, the president is right to stay out of it."
 afghanistan_events.561.b:9 "Perhaps a few words are needed to keep the party on course."

 afghanistan_events.562.t:9 "Expansion of the Youth Council"
 afghanistan_events.562.d:9 "The nation's youth will always be its future, and the Khan brothers make no secret that they aren't getting any younger. The party's Youth Council, the Zalmi Jirga, has been cultivated for years under them in the Frontier, with even their own children being proud members. As the party spread its wings throughout the rest of the heartlands, so too does the Youth Council, however the issue of leadership of the regional branches has quickly become a thorny one.\n\nMian Akbar Shah, as one of the former leaders of the organisation, has naturally been seen as the man to turn to in order to find local leaders. He has presented the Prime Minister with a full list of potential names, almost entirely composed of his close allies. Shah and his friends make no secret of their socialist beliefs, a fact that those on the party's right have become growingly unnerved towards. Fearing the indoctrination of the youth into syndicalist values, party members have pushed for the President's son Abdul Wali Khan and his allies to take over instead, hoping he will be a much more moderate and respected choice."
 afghanistan_events.562.a:9 "Akbar's men are still the most suited to lead it."
 afghanistan_events.562.b:9 "It will be a good opportunity for Wali Khan to prove himself."

 afghanistan_events.563.t:9 "The Shirts of Syndicalism"
 afghanistan_events.563.d:9 "Although we had hoped that Fazl Omar Mojadidi had ran out of steam after his last stunt, when he attempted to slander the good name of Khan Sahib, the man has more longevity than expected. With sectarianism out of the way, he has naturally moved onto attempting to claim the government is secretly syndicalist in nature, continuing his long running red scare rhetoric he has stuck to for over a decade.\n\nIt has quickly become obvious however that he has simply ran out of ideas, as rather than pointing out the role of prominent socialists like Akbar Shah in the administration, he has instead focused on...our shirts. As has been standard for many years now, our men wear red uniforms, with no deeper meaning other than the colour being good to hide the dirt that builds up from constant field work. To men like Mojadidi, this colour is clear proof of our syndicalist nature, openly mocking the Afghan people right under their noses. Few have taken his claims seriously, however his loyalists have eaten up this absurd claim, ready and willing to hear whatever he invents next."
 afghanistan_events.563.a:9 "Let the old man yell at the clouds."

 afghanistan_events.600.t:9 "A Friendly Face"
 afghanistan_events.600.d:9 "Even with the nation exhausted and battered, the idea of extremist militants from the Frontier seizing control of the capital is unlikely to be palatable to large swathes of the population. An immediate propaganda campaign to legitimise the new government has unsurprisingly been made the top priority, and over the past week quite a few efforts have already been made on that front. The biggest has been meetings with the Kabuli intellectual class, hoping to lean on their more milquetoast image and heartlands origin to frame the government as simply an evolution of the reformism of yesteryear.\n\nGhulam Mohammad Ghobar, a leftist moderate from the capital, has especially been a target of negotiations, with many within the Frontier Socialist Party seeing him as the perfect moderate face for the government to utilise. Following meetings with Popalzai, Ghobar has actually agreed to take the position as the Republic's ceremonial president, believing that he must do his duty to bring stability back to the nation.\n\nThese meetings have also led to an agreement to reorganise the Frontier Socialist Party into a new nation wide organisation, using a more patriotic name suggested by Ghobar of the Fatherland Party. Popalzai will unsurprisingly serve as the party's chairman, running the nation from a less public facing position, hopefully creating a much more acceptable image to the masses of the heartlands."
 afghanistan_events.600.a:9 "A good public image is always vital."

 afghanistan_events.601.t:9 "The Son of Swabi"
 afghanistan_events.601.d:9 "For decades the Frontier has given rise to Afghan socialists; Chairman Popalzai is hardly the first, although perhaps there is one man that title can actually be bestowed upon. The failure to secure the Frontier for Afghanistan in 1919 saw a young Pashtun fighter flee his home of Swabi, ending up in the tumultuous quagmire of Central Asia. It was here he found himself drawn to the Bolsheviks, fighting once again for a doomed cause, yet this time he refused to be driven out.\n\nFor more than a decade this man, Nisar Muhammad Yousafzai, has continued the good fight in Central Asia, fighting for both socialism and for the cause of the Tajiks, setting aside any notion of Pashtuns simply being their enemy instead of their brothers. Now however with the birth of a socialist Afghanistan, Yousafzai is at last able to return home. After meeting with the Chairman he has offered his continued military service to the new government, wishing to help ensure that the flame of socialism continues to burn bright from the heartlands to the Frontier."
 afghanistan_events.601.a:9 "Welcome home brother."

 afghanistan_events.602.t:9 "Ghaffar Khan's Resignation"
 afghanistan_events.602.d:9 "The government's hardline stance on ideological purity has sent shockwaves through the AIA, who have now been locked out of government, with the party's leadership being reformist rather than revolutionary. After days of heated debate within the AIA however, combined with mounting internal unrest by the party's socialists, it seems a breaking point has been reached. Both Ghaffar Khan and Jabbar Khan have tendered their resignations, with high ranking party member and committed socialist Mian Akbar Shah selected as the party's new sole leader.\n\nIn contrast to Ghaffar Khan's pacifism, Shah has long refused to turn the other cheek, and has been frequently involved in revolutionary activity as a member of the AIA. With him now as leader the AIA is expected to take a sharp turn towards socialism, taking significant influence from Shah's close Indian ally Subhas Chandra Bose, and as such the AIA's exclusion from governance is likely to be swiftly lifted in the coming days."
 afghanistan_events.602.a:9 "Pacifism gives way to reality."

 afghanistan_events.603.t:9 "[ROOT.overlord.GetNonIdeologyName] Objects to the United Front"
 afghanistan_events.603.d:9 "With the AIA controlling the Frontier and being perceived as significantly more legitimate than the Fatherland Party, it seemed obvious to both the Chairman and the President that they should be included in government in some fashion, despite their non-socialist positions. Our great [ROOT.overlord.GetAdjective] benefactor has strongly disagreed however, believing that ideological purity is needed to avoid liberals and reformists coopting the government and regressing it back towards capitalism.\n\nAlthough they have stopped short of overruling the ongoing negotiations, not wishing to give the perception of being in complete control of our national policy, it would perhaps be wise to listen to their demands."
 afghanistan_events.603.a:9 "We're not going to let someone else tell us how to run our own country."
 afghanistan_events.603.b:9 "We asked for their help, we'd be fools not to listen."

 afghanistan_events.604.t:9 "The First Meeting of the United Front"
 afghanistan_events.604.d:9 "Following the recent agreement with the AIA, an official meeting has been held between their leadership and Fatherland Party representatives today in [AFG.Capital.GetCapitalVictoryPointName]. Although contentious issues such as elections were argued over for hours to little result, quite a few key things have finally been hashed out and agreed to. Central to the ongoing good will between parties, it has been seen fit to allow the continued operations of the regional government in the Frontier, with both sides agreeing however to its legal subordination to the central one. Despite the wishes of many hardliners within the Fatherland Party, the AIA's argument against outlawing all non-governing parties also won out, allowing a hypothetical opposition to form if the people choose to start one.\n\nOn the topic of cabinet positions, the results were unsurprisingly mixed. Although the appointment of Ghaffar Khan as Justice Minister proved uncontroversial, with both sides believing him to be the best man to institute a fair legal system, few other positions went through so smoothly. A lengthy debate over the position of Finance minister ended in socialist AIA member Mian Akbar Shah being selected as a compromise candidate, but the installation of those close to the chairman in many other positions hardly went over well.\n\nWith still a few cabinet positions unfilled after the meeting, president Ghobar has recommended to Popalzai that he consider giving out at least a few more positions out to those not perceived as loyalists. Rather than simply giving them to the AIA, he has proposed the names of a few independent leftist figures who could be chosen, with Abdul Rahman Loudin being most prominent amongst them. Although the call is the Chairman's, Ghobar was installed to help stabilise a controversial government, and accepting his advice is bound to appease at least some of those against it."
 afghanistan_events.604.a:9 "Loyal socialists should always be prioritised in government."
 afghanistan_events.604.b:9 "Too many yesmen will lead to stagnation, a balanced cabinet is a good thing."

 afghanistan_events.605.t:9 "Mojadidi Denounces the Government"
 afghanistan_events.605.d:9 "Ever since the first uprising in Russia, the Islamic establishment in Afghanistan have been in a permanent red scare, believing that any level of reform is a gateway to Bolshevism. Even when Amanullah Khan published his original constitution, Fazl Omar Mojadidi took a copy out to the bazaar and ripped it up, decrying it as a syndicalist document written by French atheists. To say that an actual socialist government taking power is anything but the worst nightmare of men like Mojadidi would be almost as far from the truth as calling Amanullah Khan a syndicalist.\n\nAlthough it seems unlikely that the Sher Agha will be able to instigate any kind of uprising against the government like he did to Amanullah, with the nation very much bled dry by civil war, he has called for all \"true Muslims\" to refuse any level of cooperation with the government. To paint the Chairman, a Maulana in his own right, as some kind of godless atheist would be laughable to any sensible person, and yet there are enough senseless people to make these calls a genuine threat that we must find a way to counter."
 afghanistan_events.605.a:9 "Men like Mojadidi would even decry the Prophet if he got in their way."

 afghanistan_events.606.t:9 "The Maulana and the Mojadidis"
 afghanistan_events.606.d:9 "Forlorn hopes that the Mojadidis wouldn't attract much support and simply give up after a week or two have clearly not come to pass. Rural and religious leaders across the nation have begun to heed the Sher Agha's calls for non-cooperation with the government, deeply limiting our ability to assert control over Afghanistan. It is obvious that something will need to be done about this turbulent mullah, but exactly what is now the question.\n\nIt may be rather tempting to consider just shooting him and being done with it, as surely Amanullah Khan must have frequently fantasised about, yet that would almost certainly provoke further unrest. Openly reaching out to him and his allies to show that the government is fundamentally socialist in nature, and in no way at odds with Islam is certainly an option, if we believe he is actually open to reason. Alternatively going on a grand propaganda offensive to reach the people before Mojadidi does could work well, as long as they believe us over him."
 afghanistan_events.606.a:9 "Try to negotiate with them, maybe they will see reason."
 afghanistan_events.606.b:9 "These men can't be reasoned with, go on the offensive."

 afghanistan_events.607.t:9 "The Olive Branch Snapped"
 afghanistan_events.607.d:9 "Any hopes that perhaps the Hazrat Nur al-Mashayikh was a man who could see reason have been completely dashed at this point. Two weeks of negotiators sent to meet with him, or at least any representative of the family, have been met with complete failure.\n\nThe single time that any government official even managed to see the man in person led to him completely ignoring them, and walking back into the building he just came out of. To make matters even worse, it appears that the Mojadidis have begun to relocate operations out of Shor Bazaar, moving instead to a family owned estate in Ghazni to the south. There is obviously no reasoning with these zealots, and a new strategy will have to be thought up for dealing with them."
 afghanistan_events.607.a:9 "Their lust for power blinds them."

 afghanistan_events.608.t:9 "Servants of the Criterion"
 afghanistan_events.608.d:9 "News from Ghazni has been somewhat sparse since the Mojadidis moved down to it, almost certainly an intentional strategy from them. It is because of this that the government only became fully aware of their latest move a few hours before it went into operation, with the Mojadidis forming a new organisation known as the Khuddamul Furqan, the Servants of the Criterion. Led by the sons of Fazl Omar, this organisation seems to have been created with the express purpose of coordinating anti-socialist resistance throughout Afghanistan, furthering their goal of bringing down the government.\n\nAlthough we do not know yet what the organisation plans to actually do, just the vague goals, there has already been worrying signs. Men tied to the Sher Agha have begun arriving in a number of major urban centres across the nation, and in [267.Controller.GetVictoryPointName_10737] men have been seen coming and going at all hours out of their previous main headquarters in Shor Bazaar. Orders have already been given for the Directorate of Intelligence Records to assemble a team specifically dedicated to monitoring the Servants, hoping to find any justification to openly move against them."
 afghanistan_events.608.a:9 "Monitor them closely, they're up to something."

 afghanistan_events.609.t:9 "The Ghazni Rebellion"
 afghanistan_events.609.d:9 "Good and bad news has come out of Ghazni today, as the campaign of the Sher Agha against us has at last reached its crescendo. An attempted grand uprising coordinated by the Servants across the nation has been dismantled and crushed due to the fantastic work of our intelligence officers, who became aware of the plan a few days before it went into action. The men sent by the Mojadidis to take control of urban centres outside of Ghazni were dealt with swiftly before they could execute their foul treason, although the stranglehold they had over Ghazni meant that the insurrection still went ahead there.\n\nRather than a grand takeover of the city, what ultimately happened was a large crowd of angry men marching upon the city's garrison, armed with whatever equipment they could muster. Expecting the soldiers to simply defect to their \"righteous\" cause, they were seemingly shocked when the men stood their ground instead. Continued failure clearly led to rage, as reports have indicated that one of the Servants eventually instigated an attack of some kind on the troops, prompting a firefight between them. Attacking professional soldiers with rifles from a century ago shockingly went poorly, leading to a mass slaughter of the rebels."
 afghanistan_events.609.a:9 "They have overplayed their hand for the final time."

 afghanistan_events.610.t:9 "The Flight of Fazl"
 afghanistan_events.610.d:9 "Although some members of the Mojadidi family lay amongst the dead in Ghazni, it seems the Sher Agha himself escaped such a fate. It is currently not know if he was personally at the fight with the garrison, or simply heard about the failure, but either way it appears that the man and his immediate family quickly fled not long after it begun.\n\nThose few members of the Mojadidi family who were not smart enough to follow his lead have now been arrested, with their headquarters in Shor Bazaar and Ghazni both raided by the Republican Army. We may have hoped to have Mojadidi's head on a pike as an example, but we can at least rejoice that their rebellion is finally at an end."
 afghanistan_events.610.a:9 "Hopefully that's the last we'll see of them."

 afghanistan_events.611.t:9 "Faith of the Common Man"
 afghanistan_events.611.d:9 "With attempts to negotiate with Fazl Omar Mojadidi being quickly discarded as fundamentally flawed, the propaganda campaign idea quickly became the favoured option of dealing with his petulance. Rather than simply allowing them to control the narrative, the Chairman has moved to paint the Republic as indisputably Islamic in nature. Leaning on his position as a well respected Islamic scholar, and joined by many of his compatriots in the field, he has begun hosting daily speeches in [AFG.Capital.GetCapitalVictoryPointName] to hammer home this argument.\n\nQuoting directly from both the Quran and the sahih hadiths, such as those against riba and in favour of equal distribution, Popalzai repeatedly laid out to the common people of the capital exactly how socialism and Islam are simply one and the same. Going further, and appealing to nationalist sentiment, he made the argument that his ideology is home grown, with great Afghan men like Jamal al-Din al-Afghani advocating for Islamic socialism as far back as the previous century.\n\nThe initial reactions to these speeches, as well as announcements by the government of increased funding for religious institutions and the construction of new mosques has been extremely positive. Even some of the ulema, who once echoed Mojadidi's attacks against the government, have begun to sing a different tune, especially in regards to the increased funding. Only time shall tell however if we have won the propaganda battle, or if Fazl Omar still has tricks up his sleeves."
 afghanistan_events.611.a:9 "Those who reject revolution reject Islam."

 afghanistan_events.612.t:9 "The Holy Light Dims"
 afghanistan_events.612.d:9 "Weeks and weeks have gone by, and one would be forgiven for thinking that the so-called Hazrat Nur al-Mashayikh, the \"Holy Light of the Ulema\", had simply accepted the Chairman's rule without a fight. In reality the man has actually spent much of this time even more voraciously attacking the government, to an audience that dwindles with every passing day. Claims that the government stands against Islam seem hard to make stick when the Quran is pushed as the central guiding text of its rule, and further claims that it plans to destroy the nation's religious community ring hollow when many now worship together in mosques funded directly by the government.\n\nAlthough it seems that until his dying day he will continue to protest against us, hopefully for now we can just keep ignoring him, with the idea he was once considered a threat almost laughable."
 afghanistan_events.612.a:9 "Men who abuse the faith always falter."

 afghanistan_events.613.t:9 "Treason Continues to Fester"
 afghanistan_events.613.d:9 "Hopes that we could simply forget about Fazl Omar Mojadidi and his family of dissidents keep being dashed as the man seems desperate to get the government's attention, going to further and further extreme lengths to attract eyes upon their protests. The latest stunt, involving an attempt to march into the Arg and denounce the Chairman to his face, was quickly halted by security forces in the capital. The idea that even in his diminished position the Sher Agha could still prove to be a threat is one being reconsidered, much as how a dying dog can still lash out and bite those who are not careful.\n\nWith his influence depleted, and his recent stunt being entirely possible to reframe as an act of insurrection with enough of a propaganda push; it has been recommended that we order not only his arrest but that of his entire direct family, women and children included. Such an action would of course be drastic, and unlikely to be popular amongst those who once held him in high regard, but it will at least last rid us of this pest. Continuing to ignore him may simply be easier though, as even if he tries such a stunt again, security forces may simply show him to an early grave for us instead."
 afghanistan_events.613.a:9 "For as long as they're free they're a threat, arrest them all."
 afghanistan_events.613.b:9 "They pose no threat anymore, leave them be."

 afghanistan_events.614.t:9 "The Kisan Conference"
 afghanistan_events.614.d:9 "Afghanistan is far from the industrial titans that Britain and France were when they had their own revolutions, yet it is still a nation home to at least some members of the proletariat class, with said labourers no strangers to capitalist exploitation. In the Frontier a budding trade union movement began as early as the days of British rule, and now with government backing it has grown quite substantially in both membership and influence.\n\nWishing to spread the unionism of the Frontier to the rest of Afghanistan, trade unionist and syndicalist activist Muhammad Younus Qureshi has today held a grand labour conference in [AFG.Capital.GetCapitalVictoryPointName], hoping to build an all-Afghan movement. Rather than simply limiting the conference to the urban worker, all members of the \"kisan\" class were invited to attend, including any man or woman who labours for a living, not just the typical image of the proletariat. While we may still be far from an All-Indian Trade Union Congress like that of our Indian neighbours, and perhaps decades from anything resembling European syndicalism, any movement that advances the cause of the workers is one deserving of the Party's support. "
 afghanistan_events.614.a:9 "Perhaps European Syndicalism is Afghanistan's future?"

 afghanistan_events.615.t:9 "Integration of the Babbar Akali Party"
 afghanistan_events.615.d:9 "The final years of the British Raj saw agitation from all members of society, with the Sikhs experiencing their own political evolution with the Gurdwara Reform Movement, more commonly known simply as the Akali Movement. Although it began with Gurdwara reform, Sikh politics quickly escalated into joining the non-violent resistance against British rule, but many found themselves at odds with turning the other cheek. A splinter group known as the Babbar Akali Movement quickly broke away under the leadership of Kishan Singh Gargajj and Mota Singh, who helped orchestrate a campaign of violence against Britain both in the Frontier and Punjab.\n\nBy the start of the Indian Civil War, the movement was almost entirely crushed, especially with the death of Gargajj at the hands of the British. However after a daring prison break of captured members, most of the remaining revolutionaries fled into the Frontier, which soon fell into Afghan control. Since that day these exiles have been held in high regard by the Frontier's Sikh population, and in the years since have operated a socialist adjacent party known as the Babbar Akali Party under Singh's continued leadership.\n\nAlthough Sikh-Muslim relations have long been strained in the Frontier, Chairman Popalzai has always treated Singh's party as allies, and they have frequently offered their support in return. As a result, negotiations have been ongoing since the foundation of the Hezb-e Watan as to their place within it, and at last an agreement has been reached for their full merger into the party, representing the nation's Sikhs on a national level. It is hoped that in time the wounds of the past can finally be moved past, and all Afghans regardless of religion can unite under the red banner."
 afghanistan_events.615.a:9 "We find unity in socialism."

 afghanistan_events.616.t:9 "Our Brothers Across the Border"
 afghanistan_events.616.d.start:9 "For a region that has suffered so long under foreign oppression, it has hardly been a surprise that both India and Afghanistan have at last freed themselves from not only the imperialist powers but from their lingering capitalist venom. Before the unification of Afghanistan, the Frontier Socialist Party's members fought alongside Indian revolutionaries like the great Bhagat Singh and Chandra Azad, and so even after the Frontier's takeover by the Afghans ties between Indian and Afghan socialists continued to be fostered.\n\nWishing to further cement ties between us, and congratulate Chairman Popalzai on successfully liberating the Afghan people from the tyranny and chaos brought about by the monarchy, [HND.GetAdjective] representatives have arrived in [AFG.Capital.GetCapitalVictoryPointName] to meet with him."
 afghanistan_events.616.d.radsoc:9 "$afghanistan_events.616.d.start$ This delegation has been personally led by Yusuf Meherally Merchant, the recently appointed ambassador to Afghanistan.\n\nMeherally, a fellow socialist and Muslim, has found much in common with the Chairman from discussions together, with both proud of their history standing up for the lowest of the working classes. Through conversations with the Chairman, he has expressed India's full support for our government, and hopes that the friendship between us continues to grow in perpetuity."
 afghanistan_events.616.d.syndicalist:9 "$afghanistan_events.616.d.start$ This delegation has been personally led by V. K. Krishna Menon, India's current Foreign Minister, and a close ally of [HND.GetLeader].\n\nAlthough some members of the delegation came across as rather cold, with one arrogantly describing Afghan music as simply Indian in nature, Menon himself remained completely cordial throughout; notably greatly enjoying the home grown sarda melons offered to him. Through conversations with the Chairman, he has expressed India's full support for our government, and hopes that the friendship between us continues to grow in perpetuity."
 afghanistan_events.616.d.totalist:9 "$afghanistan_events.616.d.start$ Shockingly at the head of this delegation is none other than [HND.GetLeader]'s brother, Sarat Chandra Bose. A close confidant of his brother, both Sarat and Subhas are said to have many allies within both the Fatherland Party and the AIA, Mian Akbar Shah being perhaps the most notable.\n\nIn his meetings with Chairman Popalzai, Sarat wished to convey a direct message from his brother, hoping that Afghanistan will commit itself to the full liberation of the Eastern people from the tyranny of the West. United under the banner of anti imperialism, India's full support for our government was also expressed, hoping to continue to foster unity between our peoples."
 afghanistan_events.616.a:9 "[HND.GetLeader] sets a great example for us all."

 afghanistan_events.617.t:9 "Laxness Leads to Liberalism"
 afghanistan_events.617.d:9 "In an unsurprising turn of events, it has not taken long for dissidents to take advantage of our concession to allow political parties to form. In the past few weeks two new parties have slowly organised to represent both the liberals and conservatives in the country who stand against socialism. The liberals, calling themselves the Tehrik-i-Naujawanan Baidar (Movement of Enlightened Youth), are primarily composed of many Kabuli academics who have read enough capitalist literature to be fully convinced by their claims. The party is led by Abdul Hai Habibi, who although initially supportive of the republic's establishment has come to frequently criticise our government, but not yet enough to justify any crackdown.\n\nOn the other side of the spectrum, many of the anti-socialists from the Amanullah years have found themselves organising around Abdul Hadi Dawi, now leading the Hezb-e Islami Afghanistan (Islamic Party of Afghanistan). Despite being regarded by many as an Amanite, the final years of Amanullah's reign saw a break between the two, with Dawi's stance turning further towards conservatism. Now even the right wing opponents of the former king find themselves behind Dawi, potentially hoping to one day bring down the socialist republic if given the opportunity."
 afghanistan_events.617.a:9 "As long as they know their place, dissent can be tolerated."

 afghanistan_events.618.t:9 "Nationalisation of Foreign Factories"
 afghanistan_events.618.d:9 "Before the civil war, when the nation was still led by Amanullah Khan, foreign corporations were invited to make Afghanistan their second home.\n\nAlthough many have since fled, scared off by both the civil war and socialist takeover, a significant number of factories still remain under effective foreign control. It is time however to at last transfer them over to their true owners, the Afghan people, and expel the last remnants of foreign capital in the nation."
 afghanistan_events.618.a:9 "As long as they know their place, dissent can be tolerated."

 afghanistan_events.1000.t:9 "Future of the Qaumi Militias"
 afghanistan_events.1000.d:9 "For centuries warfare in Afghanistan has involved the reliance upon tribal leaders providing men to fight for the King, known as the qaumi method, with most other countries in the world having similar past experiences. In every other modern nation however, this idea of decentralised levy recruitment has been discarded to the dustbin of history, a relic of a bygone age like knights or chivalry.\n\nRather than living in this enlightened modern age however, the [GetRoyalOrRepublicanCap] Army is still very much reliant on troops gathered through this system, rather than being able to solely conscript new recruits when needed. Even with the introduction of conscription, the role of tribal elders in deciding who actually goes to serve in the army has not been entirely replaced, only minimised.\n\nFor years there has been calls for a move to a nufus method of conscription, where the role of tribal leaders in recruitment is completely eliminated. Likewise for years pushback has seen plans for this shelved over and over, with fears of unrest if the tribal leaders have any more power stripped from them. As per the Wardak Report however, if the [GetRoyalOrRepublicanCap] Army is to truly reform, we must finally bite the bullet and accept any backlash against it."
 afghanistan_events.1000.a:9 "Begin their phasing out, and the move towards a Nufus system."
 afghanistan_events.1000.b:9 "The Quami method must be maintained."

 afghanistan_events.1001.t:9 "The Fundamental Role of Knowledge"
 afghanistan_events.1001.d:9 "While it is difficult to change the minds of those advanced in age, with many arguing it to be an effective impossibility to get an elder to even reconsider firmly held beliefs, the malleability of children has long been recognised. Even those still fresh into their adulthood can easily have their mind warped by a good teacher. For any ruler who wishes to ensure a population aligned with their values, educating the next generation into them is one of the most vital actions they can take.\n\nAlthough education has historically been rather decentralised in Afghanistan, the move towards more state ran schools and the expansion of the Education Ministry has given rise to the concept of there actually being national curriculums for schools to follow. Those amongst us who recognise the power of such uniform teaching have unsurprisingly begun pushing the Ministry to adopt teachings that align with their values.\n\nThose more in favour of a traditionalist viewpoint have demanded that education prioritises the focus on Islamic teachings above all else, with everything ultimately feeding back to the Quran and the hadiths. Others meanwhile speak of the fantastic schools in [TUR.GetNameDef], whose more secular minded education has produced excellent results we should attempt to emulate."
 afghanistan_events.1001.a:9 "Education should always be foremost a tool to understand the Quran."
 afghanistan_events.1001.b:9 "If secular education's good enough for the Caliph, it's good enough for us."

 afghanistan_events.1002.t:9 "The Azadist Incubator"
 afghanistan_events.1002.d:9 "Following Amanullah's and the military's recent investments in the modernisation of the airforce, we have seen a considerable uptick in young and new cadets enlisting for the branch. Unlike the army, the airforce is reputedly much more merit-based; officers and sergeants who owe their rank to their tribal and familial ties are not nearly as present.\n\nIt is, indeed, a fine sight that nepotism seems to have failed to properly infect the airforce, but this comes with its own consequences. Many of these cadets resent the state of affairs in the army, and as such can be counted as reliable supporters of the Azadist Clique. While modern elements of war like bombers and fighter planes are doubtlessly virtuous for both our defensive capabilities and our power projection over regionalist tribes, some of the King's conservative advisors are highly wary of the strength of factionalism within the military."
 afghanistan_events.1002.a:9 "For a modern army, cliqueism is a small price to pay."

 afghanistan_events.2000.t:9 "Return of the Reds"
 afghanistan_events.2000.d:9 "What was initially expected to just be another bout of unrest in Russia has shockingly led to a surprising turn of events; Moscow has fallen once again to the Reds, and it is said that the armed forces are begrudgingly accepting their takeover. The return of Bolshevism, or whatever they are calling themselves now, has quickly incited panic in the capital, with countless believing that we must take a stand immediately to prevent revolution spreading to Afghanistan.\n\nFor those more levelled headed however, the idea of completely cutting Afghanistan off from Russia is seen as absurd, simply harming the nation and actually inciting Russia to take hostile action against us. While Afghanistan is unlikely to find as strong of support from a Red Moscow, perhaps they will still be willing to work with us, standing side by side against the imperialist west."
 afghanistan_events.2000.a:9 "We cannot tolerate these extremists influencing us."
 afghanistan_events.2000.b:9 "Now lets not get hasty, perhaps we can still work with the Reds."

 afghanistan_events.2001.t:9 "The Collapsing Caliphate"
 afghanistan_events.2001.d:9 "Disastrous news has been received from [773.Controller.GetVictoryPointName_9833], as our friends in the Ottoman Empire have officially surrendered to the Cairo Pact upstarts.\n\nAlthough many within Afghanistan hold sympathy for the cause of the Arabs, the Ottoman defeat will no doubt evaporate their presence in Afghanistan, wasting so much of our effort curating it."
 afghanistan_events.2001.a:9 "Can we really be surprised the sick man finally croaked?"

 afghanistan_pashtunistan_events.1.t:9 "Tax Dispute in Timergara"
 afghanistan_pashtunistan_events.1.d:9 "While attempting to collect fiscal levies from a tribe in Timergara, a mob of angry peasants descended upon our officials and began aggressively harassing them. Under the pretenses of having already paid taxes to [442.Controller.GetVictoryPointName_12717], the locals feel that paying additional taxes to [267.Controller.GetVictoryPointName_12769] is tantamount to extortion. Even though taxes should be paid to us, and not the petty regionalists in Pashtunistan, the mob was unconvinced by legality and instead drove our tax collectors out of Timergara.\n\nUpon receiving the news, Amanullah has reportedly become beside himself with fury. His official edict is for the tax collectors to wait out the tensions and then return again, for the King will not tolerate dissent from a handful of upstarts."
 afghanistan_pashtunistan_events.1.a:9 "Send armed guards with them next time, that'll show these uppity peasants."

 afghanistan_pashtunistan_events.2.t:9 "Timergara Tax Collectors Shot Dead"
 afghanistan_pashtunistan_events.2.d:9 "Having at last returned to Timergara for another attempt at taxing the locals-- this time with a cadre of armed guards-- the collectors were met with the very thing they feared and were threatened with when they were driven out the first time. Seeing the armed guards as a provocation by the government, the tribesmen took up arms and after a brief and rapidly escalating standoff, fired upon our officials and slaughtered all but one of the collectors, who managed to escape (but with two newly annointed windows in his abdomen and arm).\n\nThe armed guards were a mercy; now it is time to get mean. Amanullah has formally ordered a detachment of the Royal Army to quash this ungrateful uprising and show them that in return for defying Amanullah, penalties will be exchanged."
 afghanistan_pashtunistan_events.2.a:9 "Show these rebels what happens to those who oppose their king!"

 afghanistan_pashtunistan_events.3.t:9 "Pashtunistan Government Defends the Tribesmen"
 afghanistan_pashtunistan_events.3.d:9 "As our troops descended upon the Frontier, the Pashtunistan Government has simultaneously cobbled together and ordered a detachment of irregulars to occupy a key pass. A messenger from their ranks issued a formal communication to our detachment's commander, Ali Ahmad Khan, which proclaimed [442.Controller.GetVictoryPointName_12717]'s defence of the tribesmen of TImergara and the denunciation of Amanullah's \"unjustifiable and tyrannical\" attempt at punishment.\n\nIn light of the situation, the commander of our forces has withdrawn to a secure vantage point and he has decided to wait for further orders from [267.Controller.GetVictoryPointName_12769].This marks the most brazen defiance against our rule by Pashtunistan to date, and Amanullah has called an emergency meeting with his ministers and the army's high command to discuss the government's next move."
 afghanistan_pashtunistan_events.3.a:9 "Who do the Khans think they are?"

 afghanistan_pashtunistan_events.4.t:9 "Wardak Advocates Seeking a Peaceful Solution"
 afghanistan_pashtunistan_events.4.d:9 "While the emergency meeting may have begun with the King repeatedly demanding the full force of the Royal Army be sent to crush the \"[442.Controller.GetVictoryPointName_12717] Revolt\" and put all survivors in front of a firing squad, both Nadir and Wardak have taken a hard stance against him. Despite both men reaching their positions through entirely different lines of reasoning, they are in agreement that escalation has only made things worse so far. On top of it all, almost every tribe in the region supports [442.Controller.GetVictoryPointName_12717], including what appear to be a number of regicidal Indian-backed revolutionaries, meaning that military action will no doubt result in a bloody civil war.\n\nWardak has instead proposed that a diplomatic solution be attempted, with Wardak himself being sent to negotiate with the local government to find a resolution that benefits both parties. Alternatively if all else fails, he has also offered a fallback approach of at least winning over the local rulers first through an assortment of privileges and bribes so they turn a blind eye when the time comes.\n\nWhile after enough debate the king finally acquiesced to Wardak's proposal, he has warned him that if an agreement isn't reached quickly, he will take matters into his own hands no matter how hard anyone objects, and his head will be joining those that will roll if it comes to that."
 afghanistan_pashtunistan_events.4.a:9 "Open negotiations with the Khans, it's our best option"
 afghanistan_pashtunistan_events.4.b:9 "We won't negotiate with these upstarts, send envoys to the tribal leaders"

 afghanistan_pashtunistan_events.5.t:9 "Wardak Meets with the Khans"
 afghanistan_pashtunistan_events.5.d:9 "Having departed as soon as he could, Wardak has arrived in [442.Controller.GetVictoryPointName_12717] to open negotiations with the local government to resolve the crisis peacefully. Attended by both Khan Sahib and Bacha Khan, alongside other local leaders, the meeting initially began very coldly, with the Khans placing the blame for this incident firmly on [267.Controller.GetVictoryPointName_12769]'s repeated escalation. Quickly however they made note of their appreciation that the King had clearly seen wisdom, having sent his representative to speak rather than fight, and are seemingly open to the idea that the King always had the best intentions in mind.\n\nAfter a lengthy discussion they ultimately agreed to the terms present by Wardak to officialise their position within the state and clearly delineate who has authority over what, but have presented a list of their own demands to be fulfilled before any such agreement can be finalised, so that they can be safe in the knowledge that the King's words do not ring hollow."
 afghanistan_pashtunistan_events.5.a:9 "A lengthy list of demands, but if it'll bring peace..."

 afghanistan_pashtunistan_events.6.t:9 "Wardak Meets with Local Leaders"
 afghanistan_pashtunistan_events.6.d:9 "Travelling throughout the Pashtun borderlands and meeting with everyone from local chiefs all the way up to the Badshah of Swat, Wardak has heard from these local power brokers what they would need to turn a blind eye if Amanullah made a move against the government in [442.Controller.GetVictoryPointName_12717]. While some have made clear that nothing will make them betray the Khans, enough have been willing to negotiate for the right price for this scheme to work.\n\nThe rulers of Swat, Chitral, and Dir have notably been open to the idea, with the three being the strongest rulers in the region, although with such power all three have made no illusions that they will only back the move if the downfall of the [442.Controller.GetVictoryPointName_12717] government sees their own power grow in its place. With enough people willing to be on board, it seems that the palm greasing stage of negotiations is next on the agenda."
 afghanistan_pashtunistan_events.6.a:9 "Just a few handfuls of gold and some titles, and no one should stand against the King."

 afghanistan_pashtunistan_events.7.t:9 "The King Waits For No One"
 afghanistan_pashtunistan_events.7.d:9 "Having grown impatient over Wardak's lack of progress, the King has finally decided to recall him back to [267.Controller.GetVictoryPointName_12769]. Instead the order has been given to Nadir, despite his protests, to crush the government in Pashtunistan by force.\n\nSoldiers are to be sent into [442.Controller.GetVictoryPointName_12717] over the next few days, arresting as many members of the government as possible, and ensuring, once and for all, that the King's authority is cemented and properly understood throughout the region."
 afghanistan_pashtunistan_events.7.a:9 "If you want something done right..."

 afghanistan_pashtunistan_events.8.t:9 "The Death of the Doctor"
 afghanistan_pashtunistan_events.8.d:9 "Meeting little resistance on their way into [442.Controller.GetVictoryPointName_12717], Royal Army soldiers quickly found themselves outside the main building used by the regional government, greeted there by both Bacha Khan and his brother Dr Khan Sahib alongside a crowd of supporters, many of whom were armed. The two men passionately made their case to the soldiers, saying that although they would not violently resist against the King's attempts to dissolve the government, they will refuse to comply with any demands given to them in a peaceful manner.\n\nThis obstinacy would ultimately lead to a fatal mistake by one of the soldiers, who attempted to arrest Khan Sahib, leading to a scuffle breaking out as those in the crowd tried to stop him. No one can truly agree who fired the first shot, but a bloodbath soon followed, with dozens on both sides dead, the good doctor finding himself amongst the casualties.\n\nDespite Ghaffar Khan's immediate calls for peace, it seems that for many this has been the final straw, and there are reports of attacks on soldiers throughout the region, not simply in [442.Controller.GetVictoryPointName_12717]. There is even now talks of an army being assembled, led by the so called \"Marxist Maulana\" Abdur Rahim Popalzai, whose ties to the Indian government in Calcutta make foreign intervention in favour of these rebels a distinct possibility. We can do little now but brace for impact and hope to survive the inevitable chaos."
 afghanistan_pashtunistan_events.8.a:0 "Ça n'est pas bon signe..."

 afghanistan_pashtunistan_events.9.t:9 "Pashtunistan Revolts!"
 afghanistan_pashtunistan_events.9.d:9 "The worst has come to pass, an unfortunate inevitability after such a slaughter. Rebels loyal to Ghaffar Khan and his late brother have risen up all across the frontier, declaring their allegiance to the [442.Controller.GetVictoryPointName_12717] government and calling for full independence from [267.Controller.GetVictoryPointName_12769]. While Ghaffar Khan himself has refrained from endorsing this violent rebellion, even he at this point has not actively attempted to stop them, having seemingly isolated himself in mourning.\n\nPopalzai has instead taken the reins of the rebellion, with those from all walks of life operating under his banner, including a large contingent of men from Waziristan and the soldiers of some of the local princely states. The rebels, now calling themselves the army of \"Pathanistan\", are seemingly unlikely to stop until they have secured both revenge and freedom, or have died trying. We must hope that it is the latter."
 afghanistan_pashtunistan_events.9.a:9 "Men, to Arms!"

 afghanistan_pashtunistan_events.10.t:9 "Failure on the Frontier"
 afghanistan_pashtunistan_events.10.d:9 "Despite our best efforts, our campaign against the rebel Army of Pathanistan has resulted in a stalled frontline, disorganised and gradually mutinous troops, and several attritioning battalions surrounded by those who see them as hostile invaders. Unable to entertain Amanullah's bloody quest for vengeance and control, Nadir Khan, in conjunction with a major portion of the army brass, has requested the withdrawal of all Royal Army forces from the Pashtunistan region and the prompt cessation of hostilities.\n\nDespite Amanullah's insistence that with just a few more weeks the rebels will fall, continued opposition by the army's leadership has ominously revealed that if he does not acquiesce to their \"recommendation on the matter\" it just may be the straw that turns the Royal Army against him. In the end, the crestfallen King sees no choice but to order a ceasefire and what will amount, defacto, to the legal secession of Pathanistan from the Afghan realm."
 afghanistan_pashtunistan_events.10.a:9 "A shattering defeat..."

 afghanistan_pashtunistan_events.11.t:9 "Rebellion Crushed"
 afghanistan_pashtunistan_events.11.d:9 "At long last, the insubordinate revolt of the pathetic \"Army of Pathanistan\" has been crushed under the righteous strength of our great army! Due to the scale of the revolt and the sustained loyalty of our commanders, Amanullah has arranged for a grand reward ceremony to fashion his victorious generals with shiny new medals to commemorate the victory. As [267.controller.GetVictoryPointName_12769] celebrates, the last embers in Peshawar smolder. Renegades still roam the mountain passes, fighting on in the name of a futile cause in their refusal to admit defeat. With reconstruction and the establishment of centralised control over Pashtunistan in the months to come, their stubbornness will only provide them with the reward of a death sentence."
 afghanistan_pashtunistan_events.11.a:9 "They'll fall back in line soon enough."

 afghanistan_pashtunistan_events.12.t:9 "Agreement Reached with the Khans"
 afghanistan_pashtunistan_events.12.d:9 "Weeks and weeks of non-stop negotiations between minister Wardak and the leadership of the AIA has not been for naught. Finally hashing out the last few details, a finalised agreement has been produced that is somehow actually agreeable to Wardak, Ghaffar Khan, and Amanullah Khan. The government in [442.Controller.GetVictoryPointName_12717] is set now to finally be officially recognised, with an exact defined legal status and position within the Afghan state.\n\nAlthough there has been some grumbling about the extent of autonomy the region has been promised, few can deny that it is better than the potential alternatives had an agreement not been reached..."
 afghanistan_pashtunistan_events.12.a:9 "Better than it ending in bloodshed."

 afghanistan_pashtunistan_events.13.t:9 "Dissolving the [442.Controller.GetVictoryPointName_12717] Government"
 afghanistan_pashtunistan_events.13.d:9 "With their powerbase destroyed, and [AFG.Capital.GetCapitalVictoryPointName]'s tendrils slowly beginning to stretch through every town and city of the Frontier, few could deny that the the writing was finally on the wall for the [442.Controller.GetVictoryPointName_12717] Government. An official decree, issued by King Amanullah, has put into place limits about how local regions may choose to govern themselves, worded in such a way to not directly name [442.Controller.GetVictoryPointName_12717] but only outlaw it and any copycats.\n\nRather than attempt to dispute this dissolution, it appears that Ghaffar Khan and Khan Sahib have simply resigned themselves to their fate, accepting the King's undisputed rule over the entirety of Pashtunistan."
 afghanistan_pashtunistan_events.13.a:9 "The King reigns supreme."

 afghanistan_pashtunistan_events.14.t:9 "Pathanistan Goes SocDem"
 afghanistan_pashtunistan_events.14.d:9 "If you see this, please make a bug report."
 afghanistan_pashtunistan_events.14.a:0 "Yay"

 afghanistan_pashtunistan_events.15.t:9 "Mines and Marauders"
 afghanistan_pashtunistan_events.15.d:9 "Now adding fuel to the fire of tensions betwixt [267.Controller.GetVictoryPointName_12769] and [442.Controller.GetVictoryPointName_12717] is a devastating raid coordinated by a large gang of bandits on the precious emerald mines in the Pathan mining town of Swat. Within the timeframe of just an hour, they disarmed the guards of the mines (and executed anyone who objected) and secured a massive booty of gemstones, depriving the mine of serious profits and the miners of their security.\n\n[442.Controller.GetVictoryPointName_12717], thus far, is struggling to bring the bandits to justice. This is ironically a failure of immense self-satisfaction to Amanullah, who pushed for the mines to be directly secured by the army in 1934. His proposal was indignantly refused by local leaders, citing it to be unprecedented oversight and an egregious violation of their expected autonomy. In light of their embarrassment, the King is now tempted to send down a formal commission to catch the bandits ourselves. If successful, it would send a pretty clear message to the frontier that [442.Controller.GetVictoryPointName_12717] is incapable of protecting them like [267.Controller.GetVictoryPointName_12769] is."
 afghanistan_pashtunistan_events.15.a:9 "[267.Controller.GetVictoryPointName_12769] will do what [442.Controller.GetVictoryPointName_12717] can't."
 afghanistan_pashtunistan_events.15.b:9 "They don't deserve our help."

 afghanistan_pashtunistan_events.16.t:0 "Une impasse"
 afghanistan_pashtunistan_events.16.d:9 "With barely any leads to show for their efforts after over a month and a half of investigating, the commission assigned to deliver the bandit conspirators responsible for the recent raid in Swat appears to be capable of uncovering only their own incompetence. Now, the crown jewel of their efforts is to be the murder of one of their investigators in a back alley behind a bazaar in [442.Controller.GetVictoryPointName_12717]. Not a single one of them can explain what lead he was chasing nor did any of them know he was there in the first place, as he evidently failed to communicate his whereabouts to any of them. Rumourmills run abuzz, popularising the theory that the murder is a conspiracy that connects directly to Khan Sahib himself, who was greatly displeased with Amanullah's overreach.\n\nThe investigators that remain make empty promises of resolving the murder and claim they're on the verge of a breakthrough. Despite their vows, both [267.Controller.GetVictoryPointName_12769] and [442.Controller.GetVictoryPointName_12717] know there is but one solvent truth in this case; the dead-end alleyway he died in is a metaphor for the entire commission."
 afghanistan_pashtunistan_events.16.a:9 "I asked you to solve mysteries, not create more!"

 afghanistan_pashtunistan_events.17.t:9 "Beating Back the Bandits"
 afghanistan_pashtunistan_events.17.d:9 "Today is a glorious day for Amanullah, as his investigative commission has successfully sleuthed the identity and whereabouts of most of the bandit conspirators responsible for the recent raid in Swat. Indeed, one of their posse was found ignominiously flaunting his wealth by purchasing fanciful textiles at a market in [442.Controller.GetVictoryPointName_12717] by bartering with his share of the stolen emeralds, shortly thereafter being tracked and interrogated until he gave up his fellow criminals and led the commission to their safehouse. Most of the stolen jewels have been repossessed, and despite their attempts at resisting arrest the bandits were efficiently neutralised.\n\nAmanullah has stridently launched a propaganda campaign, highlighting the government's success at restoring justice and order and subsequently humiliating [442.Controller.GetVictoryPointName_12717]'s lackluster efforts at maintaining the stability of the frontier. As the people celebrate Amanullah as the guardian of order, Bacha Khan loses his room to bargain."
 afghanistan_pashtunistan_events.17.a:9 "Let it be known the King protects all of his subjects."
 afghanistan_pashtunistan_events.17.b:9 "And let it be known [442.Controller.GetVictoryPointName_12717] can't alone."

 afghanistan_pashtunistan_events.18.t:9 "The Voice of Frontier Muslims"
 afghanistan_pashtunistan_events.18.d:9 "Frustrating our efforts to resolve the crisis on the frontier are the incendiary local publications based out of [442.Controller.GetVictoryPointName_12717]. The \"Voice of the Frontier Muslims\", a newspaper owned by leader of the local United Muslims Nationalist Party, Aurangzeb Khan Gandapur, has taken to denouncing Amanullah as an autocratic tyrant whose concerns lie more with the imperialist centralisation of his realm than improving the freedom of Muslims under his reign. A supporter of reformers in the neighbouring [RAJ.GetName], he has so boldly taken to claim that the people of \"Pathanistan\" would likely be better off reincorporated into a federalised India than under the oppressive jackboot of [267.Controller.GetVictoryPointName_12769].\n\nAlthough Gandapur may lead the second largest party in the Frontier, his actual influence is far surpassed by other local leaders. Still, such bold and treasonous statements are completely intolerable, especially as they echo through the mountains of Afghanistan and reach the ears of our other subjects and undermine the King's image as the Liberator of the Muslim People."
 afghanistan_pashtunistan_events.18.a:9 "Stop the presses at once!"
 afghanistan_pashtunistan_events.18.b:9 "He's hardly even relevant in his own city, ignore him."

 afghanistan_pashtunistan_events.19.t:9 "The Faqir of Ipi Rouses Suspicion"
 afghanistan_pashtunistan_events.19.d:9 "Wardak's efforts to achieve an accord with Bacha Khan have, thus far, not yet produced a conclusive result. Making matters worse, our informants have reported that the Faqir of Ipi has ventured out of Waziristan and arrived in [442.Controller.GetVictoryPointName_12717] for a clandestine meeting with Bacha Khan and Khan Sahib. Ever since the conquest of the frontier by Afghanistan, the Faqir has dutifully served the Afghan state, believing fully in the unity of the Pashtun peoples.\n\nIt seems now however that rather than simply serve the King, he is negotiating with other representatives of the Pathan people, seldom an alternative conclusion can be drawn aside from his intention to declare for and support any uprising or armed resistance from the frontier against our rule. This is a seriously crafty man and perhaps the most capable organiser of guerrilla resistance in the entire frontier. However, every man has a price. Perhaps we would be wise to outbid [442.Controller.GetVictoryPointName_12717], even if it risks showing our hand too early."
 afghanistan_pashtunistan_events.19.a:9 "Funnel him some funds, perhaps it'll make him stay out of this."
 afghanistan_pashtunistan_events.19.b:9 "One man is hardly going to change things."

 afghanistan_pashtunistan_events.20.t:9 "The Faqir Agrees"
 afghanistan_pashtunistan_events.20.d:9 "After some hesitation and conferring with close confidantes on his end, the Faqir has accepted our gift of goodwill and has vowed to remain neutral in the event of any escalated conflict on the Frontier, refusing in advance to take up arms against any of his Muslim brothers in the Frontier and planning to use the gold for the betterment of his village.\n\nFurthermore, he revealed the nature and proceedings of his rendezvous in [442.Controller.GetVictoryPointName_12717]. Supposedly, Bacha Khan and Khan Sahib do not desire any sort of armed conflict and are trying with all of their resources to reach an accord \"fair and favourable\" to the Frontier. The Faqir had offered himself and his men to defend, in the event of a violent conflict, the freedom and the integrity of the Frontier's people, asking for no payment upfront, although he claims Bacha Khan refused his request completely."
 afghanistan_pashtunistan_events.20.a:9 "It is hard to find a man who can't be bribed."

 afghanistan_pashtunistan_events.21.t:9 "Outrage in Ipi"
 afghanistan_pashtunistan_events.21.d:9 "Our delegation, furnished with some sacks of gold, have been turned around and driven out of Waziristan by the Faqir. He has denied our insinuation that he was tempted to rise against Afghanistan in the event of a rebellion, but revealingly claimed that it is overtures like these that reveal Barakzai rule to be no less different than that of the British. While no physical harm came to our people, they were threatened with violence in the event that they had not immediately decided to make a hasty getaway from his territory.\n\nRumours are now abound, perhaps no doubt sourced from him and his clan, that Amanullah Khan plans to subjugate the Pathan frontier and sell it back to the British Commonwealth for great riches and an alliance, returning them to harsh tribal policies and rule by an Indian elite, the very same that thousands of tribesmen died fighting against. This propaganda has begun to spread throughout the mountains like a torrential and seditious billow of wind, undermining negotiations as shepherds, farmers, and tribesmen now envisage Amanullah as the incarnation of the devil."
 afghanistan_pashtunistan_events.21.a:9 "Traitors, the whole lot of them!"

 afghanistan_pashtunistan_events.22.t:9 "Alamzeb's Gratitude"
 afghanistan_pashtunistan_events.22.d:9 "Credited to our support in developing Dir's security forces and the special exemption of conscription we have promised them, Alamzeb Khan of Dir has sent a delegation claiming that he has assembled a massive army that is ready to exact vengeance on any and all forces who use the situation as a pretense for rebellion.\n\nWhile it's unlikely that the Dir Militia possesses any considerable strength, it is still comforting to know that we have at least one guaranteed ally in the region."
 afghanistan_pashtunistan_events.22.a:9 "Pashtun pals in Princely places."

 afghanistan_pashtunistan_events.23.t:9 "Dir's Last Stand!"
 afghanistan_pashtunistan_events.23.d:9 "As the Army of Pathanistan rises against the Royal Army, the Princely State of Dir has formally declared war against the rebel forces and has begun incursions into Chitral and Swat, whom it additionally accused of plotting to conquer Dir and divide its realm between the two of them.\n\nPersonally leading his forces, Alamzeb has obviously made the right choice in denouncing Popalzai's band of marauders!"
 afghanistan_pashtunistan_events.23.a:9 "Rise, to Afghanistan's Banner!"

 afghanistan_pashtunistan_events.24.t:9 "Spoils of War Debacle"
 afghanistan_pashtunistan_events.24.d:9 "As fighting between us and the insurgent Pathan rebellion goes on, the soldiers of our army have taken to looting and the effectuation of other atrocities on the villages they have re-occupied. Regarded merely as spoils of war that they earn as a reward for their prowess and victory in battle, it yet still causes tremendous damage to property and quality of life on the local level and is very rapidly establishing the image of the Royal Army, and most importantly the King himself, as barbarians of corruption and thievery.\n\nShould this continue on as it has, once we conclude our pacification of the Frontier we will re-inherit a ravaged land, full of people who carry little more than hate for us in their hearts in the absence of their farmland and precious possessions. Problematically so, Amanullah's military advisors caution that if we forbid such acts as terrorism and treason, many of our soldiers may desert their posts, with some choosing to join the rebels if they choose to offer a better deal."
 afghanistan_pashtunistan_events.24.a:9 "Forbid this chicanery, are they not devastating what are rightfully our own villages!?"
 afghanistan_pashtunistan_events.24.b:9 "We can't risk shaking the loyalty of the army at a time like this..."

 afghanistan_pashtunistan_events.25.t:9 "Desertions, Disruptions, and Traitors!"
 afghanistan_pashtunistan_events.25.d:9 "It would seem that our attempts to inculcate the humane treatment of the Frontier villages has come at the cost of the loyalty of our more morally bankrupt soldiers.\n\nWhile many have simply decided to desert their posts and return home without the prospect of acquiring their ill-gotten gains, some have reportedly taken lucrative offers promulgated by enemy tribal militias to join their ranks with the promise of wealth and opportunities to loot with them instead."
 afghanistan_pashtunistan_events.25.a:9 "We don't want those vagabonds and we don't need them either!"

 afghanistan_pashtunistan_events.26.t:9 "The Devastation of Pashtunistan"
 afghanistan_pashtunistan_events.26.d:9 "Now that the rebellion is finally over and the last pockets of resistance are soon to be stomped out, it has become readily apparent the scale of the destruction that our troops have wrought upon the people of the Frontier. Farms lay devastated, burnt, and trampled, merchants deprived of their earned wealth and utterly bankrupt, villages are devastated and their inhabitants are now absolutely terrified of our army. Many who have been forced to the depths of poverty now turn to banditry, if only to provide and make up for what their tribes and families lost, contributing to and perpetuating a sense of criminal anarchy along the roads connecting the villages and even within many settlements themselves.\n\nThis indeed is the legacy and image of our pacification campaign. The cost of reconstruction notwithstanding, to reintegrate them into the Afghan realm will be more difficult than previously imagined. Oaths of vengeance sworn against our soldiers by tribesmen who were deprived of their loved ones and pride will follow them, even as many return home far away from the sites of their misgivings."
 afghanistan_pashtunistan_events.26.a:9 "Nobody ever told them that war was gonna be fair..."

 afghanistan_pashtunistan_events.27.t:9 "Formation of the Frontier Defence Force"
 afghanistan_pashtunistan_events.27.d:9 "With an agreement now reached and things beginning to calm on the Frontier, the government in [442.GetVictoryPointName_12717] has begun to use its new official responsibilities to reorganise local militias into a proper regional army, with the goal of protecting Pashtunistan in the event of any foreign conflict. Rather controversially the army is set to be led by Abdur Rahim Popalzai, the so called \"Marxist Maulana\", a local leader of socialist militants who is said to be linked to revolutionaries in Calcutta.\n\nDespite the expectation that such links would be immediately disqualifying, Popalzai has apparently been chosen in large part due to them, with AIA deputy Mian Akbar Shah pushing heavily for him. The man, as reports have stated, is apparently very popular with the everyday Pashtun due to his advocacy for the nation's poorest, with the militiamen under his command mostly comprised of streetsweepers and other lowly men who show fervent loyalty to Popalzai in return.\n\nReports have also made clear that the current line from his allies in Calcutta is to fervently support Bacha Khan's government, and therefore by extension the King's as well, believing it to be the most amenable to continued stability in the region. Although they certainly have ulterior motives, as long as this Maulana does the job well, there'll almost certainly be an opportunity to get rid of him for a more tolerable leader down the line if he begins to cause trouble."
 afghanistan_pashtunistan_events.27.a:9 "As long as they stay loyal and useful..."

 afghanistan_pashtunistan_events.28.t:9 "Rebellious Tribes Disrupt Our Backline!"
 afghanistan_pashtunistan_events.28.d:9 "We have been hit by a devastating betrayal! The Mangal Tribe, located around Khost which is very close to our frontline with the Army of Pathanistan has risen up and attacked our troops from behind!\n\nThough they were dispersed and several units have been sent to pacify their territory, serious damage was done to our supply lines and we have been forced to divide our forces between the Mangal portion of the Loya Paktia region and our subjugation efforts in Peshawar."
 afghanistan_pashtunistan_events.28.a:9 "How DARE they!? Bring the hammer down on them all!"

 afghanistan_pashtunistan_events.50.t:9 "Pathanistan Proposes Unification"
 afghanistan_pashtunistan_events.50.d:9 "In the chaos of the first stage of the Indian Civil War the perfidious Afghans used the war as an opportunity to declare one of their own, marching troops in alongside local rebels to seize control of most of the North-West Frontier Province and the local princely states. They claimed that this was done to unite their people, yet while we were busy putting our own nation back together their supposed unified one collapsed into its own civil war.\n\nThe Frontier, now calling itself Pathanistan, ended up fighting for independence after Afghan tyranny, despite few in the fledging state wishing for this outcome. With Afghan reunification seen as untenable, they have instead reached out to our government and have requested reunification with India instead. In exchange for peacefully submitting to our rule, they simply request that their existing government be allowed a continued level of autonomy, hoping to maintain the status quo they previously enjoyed for many years."
 afghanistan_pashtunistan_events.50.a:9 "We agree to their demands, let them rejoin us."
 afghanistan_pashtunistan_events.50.b:9 "We reject their demands for autonomy, bring them back by force!"

 afghanistan_pashtunistan_events.100.t:9 "Revolt in the Afghan Frontier"
 afghanistan_pashtunistan_events.100.d:9 "Since its conquest of the formerly British North-West Frontier Province over a decade ago, Afghanistan's grip over the region has been said to be lacklustre at best, with the Frontier being almost entirely self-governing. Until recent months however, few in the Frontier appear to have opposed this status quo, and common sentiment appeared to be in favour of Afghan unity.\n\nA massacre carried out by Afghan troops following growing disputes between [AFG.Capital.GetCapitalVictoryPointName] and [442.Controller.GetVictoryPointName_12717] has rapidly changed public sentiment towards the Afghan state. Militant supporters of the regional government, led by Indian backed revolutionaries, have responded to the massacre by rising up against [AFG.Capital.GetCapitalVictoryPointName], and have proclaimed the independence of \"Pathanistan\" from it."
 afghanistan_pashtunistan_events.100.a:9 "Serves the buggers right."
 afghanistan_pashtunistan_events.100.b:9 "Stability has never been Afghanistan's greatest trait has it?"

 afghanistan_civil_war_events.1.t:9 "Amanullah Declares Plans for a European Tour"
 afghanistan_civil_war_events.1.d:9 "In a private meeting, Amanullah gathered his advisors and family members and announced to them that he planned on going on a whistle stop tour across Continental Europe, a months long endeavour to meet with monarchs and statesmen. While this plan did resemble a lavish vacation, in truth the purpose of the tour was deeply important to the King's initiatives: Afghanistan's modernisation was well underway, and it was time for the King to show the world the progress he was making with his domain. Starting in Berlin, Amanullah would present himself as a twentieth-century monarch, a modern ruler for a modern nation, deserving of a status equal to European nobility.\n\nTo those present, the rest of the announcement perhaps revealed a secondary motive to the tour, with Amanullah declaring that the Crown Prince would serve as regent in his absence. Although still young, Rahmatullah will hopefully one day succeed his father, and as such spending a few weeks as regent may help prepare him for the realities ahead. Although some present expressed concern, the further declaration that the cabinet would also be allowed to overstep their positions as needed to aid the prince was enough to smooth things over."
 afghanistan_civil_war_events.1.a:9 "I'm sure things will be fine."

 afghanistan_civil_war_events.2.t:9 "King Finalises Plans with Advisors"
 afghanistan_civil_war_events.2.d:9 "After a considerable amount of time planning stops and reassuring advisors, King Amanullah's tour was ready. The news made its way through papers, villagers abuzz with gossip, even climbing the mountains into the ears of isolated tribes: A Christmastime journey across Europe, a decade since their last!\n\nThe King is to begin the trip with a visit to [773.Controller.GetVictoryPointName_9833], before departing via a ship to [137.Controller.GetVictoryPointName_3686], where he will then take a train to the Ukrainian capital of [202.Controller.GetVictoryPointName_525] to meet [UKR.GetLeader]. Then onwards, to [10.Controller.GetVictoryPointName_3544] and [POL.GetLeader]. Amanullah will then head west, to [64.Controller.GetVictoryPointName_6521], where he will have an audience with the Kaiser, the high point of the tour. After a few weeks touring the German states, he plans to end his trip quickly passing through the major European capitals that are not plagued by war or syndicalism, before at last flying back home.\n\nThe travel plans are published as fliers to be distributed amongst the people, showcasing where their glorious King will share with the world his pride for the new Afghanistan."
 afghanistan_civil_war_events.2.a:9 "Don't forget to pack enough hats!"

 afghanistan_civil_war_events.3.t:9 "Amanullah Departs"
 afghanistan_civil_war_events.3.d:9 "In the early hours of the morning, accompanied by his family, a cohort of servants, and the eager press, King Amanullah of Afghanistan began his journey west for Europe. His tour was to begin at once, for the world cannot be made to wait any longer for the new Afghanistan and her modernising monarch.\n\nIn his stead, the King has left his son, Crown Prince Rahmatullah, as the regent of Afghanistan. This choice proved controversial, with arguments persisting up until the King's departure about Rahmatullah's leadership capabilities. The King was more than reassuring of his son's potential to rule, presenting the regency as an opportunity for the Crown Prince to obtain experience in governance prior to his ascendance to the throne.\n\nNevertheless, advisors worried that such an inexperienced regent would be the perfect opportunity for forces outside of [267.Controller.GetVictoryPointName_12769] to take advantage of and undo Amanullah's hard work. Many in fact have attempted to push for the King's brother, Inayatullah Khan, to rule as regent instead, although he has personally denied their requests.\n\nRegardless, the die had been cast and Afghanistan has Rahmatullah to lead them while the King was away representing the Afghan people in Europe. Hopefully, Rahmatullah will have calm skies ahead, and the King will not need to prematurely return."
 afghanistan_civil_war_events.3.a:9 "The Crown Prince will safeguard the realm."

 afghanistan_civil_war_events.4.t:9 "Unrest in the North"
 afghanistan_civil_war_events.4.d:9 "The King has only been gone for a few days, and already the Crown Prince's authority is being tested. Reports are coming from [1118.Controller.GetVictoryPointName_12314] of bandits moving about in the hills and mountains and attacking passers-by. Normally, this means very little: banditry is commonplace in the more rural parts of the country. The problem with these raids is that they seem much more coordinated around the schedules of our military patrols. The bandits are making concentrated efforts in stealing equipment and cutting off the logistics of our northern garrisons.\n\nThe most troubling news comes from a returning patrol, stating that these were no ordinary bandits: they carried stolen Russian equipment. This report coincides with sightings of campfires near our border with Central Asia. There can be no mistake: someone is planning something big."
 afghanistan_civil_war_events.4.a:9 "Vermin always acts brave when you have your back turned."

 afghanistan_civil_war_events.5.t:9 "A Warm Welcome in [64.Controller.GetVictoryPointName_6521]"
 afghanistan_civil_war_events.5.d:9 "Wonderful news from Europe: the King has arrived in [64.Controller.GetVictoryPointName_6521] to an incredibly warm welcome. The King was greeted at the train station by a mixture of curious ongoers, minor nobility, and the ever-eager press, wanting to capture the arrival of the foreign king from the East. King Amanullah made his way to the Royal Palace of [64.Controller.GetVictoryPointName_6521], where he was formally reintroduced to Kaiser Willhelm II, and his Reichskanzler. The men were reported to be in good spirits when in each other's company, especially as King Amanullah is a notable Germanophile. Discussions on art, modernity, and cultural practices were earnestly recorded by reporters, complimenting the visit with an endless stream of photos.\n\nAfter meeting with the Kaiser, King Amanullah was escorted around [64.Controller.GetVictoryPointName_6521] on a tour of the vast city. Amanullah was very impressed with the city, remarking how much of the inspiration for [267.Controller.GetVictoryPointName_12769] came directly from [64.Controller.GetVictoryPointName_6521]. The King was particularly a fan of many of the newer buildings on display, taking particular interest in the Pergamon Museum and the White City, stating how different they were from the more Neoclassical buildings of his capital. After a day of building tours, meetings with statesmen and a delicious meal, the King retired to his hotel room, ready to continue his tour the next day."
 afghanistan_civil_war_events.5.a:9 "Those new buildings give wonderous inspiration for Herat..."

 afghanistan_civil_war_events.6.t:9 "Bandits Muster in the North"
 afghanistan_civil_war_events.6.d:9 "Reports from near the border confirm our worries have come true: the bandits are much more organised than initially thought, and they have begun a mobilisation effort towards the heartlands of Afghanistan. Many more are coming in to support this new army, either from local Tajik tribes and villages, or from the Turkic peoples on the other side of the border. Judging from the new recruits and local religious developments, this bandit army is likely made up of religious fanatics.\n\nWhat's more concerning is the uncertainty of the information coming in about this army: numbers range from a couple thousand to tens of thousands, with the reports differing wildly in detail, and growing increasingly rare. The last report we received seemed to have been penned in a hurry: it says that the patrols had been made by the bandits, and a small force had been dispatched towards their direction. This was included with a description of the bandits' banner: red, black and white, the Saqqawist standard. There was even talk that at the head of this new army was Purdil Khan, the uncle and successor of the late Saqqawist emir, Habibullah Kalakani. Regardless, it has been confirmed: they are coming."
 afghanistan_civil_war_events.6.a:9 "This is starting to get serious."

 afghanistan_civil_war_events.7.t:9 "[1118.Controller.GetVictoryPointName_12314] Taken by Saqqawists"
 afghanistan_civil_war_events.7.d:9 "It has been several days since we have heard from our northern border. After frantic requests for status, followed by silent prayers, we finally have an update to our bandit problem.\n\n[1118.Controller.GetVictoryPointName_12314] has fallen.\n\nSupposedly, the bandits marched directly towards the city, supported by stolen Russian artillery pieces. The city garrison tried to fight back, but the shelling and the lack of moral resulted in the city's quick capitulation. Even more humiliating is the number of deserters and turncoats from our army units: it seems that not a single soldier in [1118.Controller.GetVictoryPointName_12314] has a backbone.\n\nUpon hearing the news, the Crown Prince gave the order to mobilise the army, deciding to personally lead his troops to victory. This decision was immediately opposed by his advisors, recommending that Nadir be recalled from [415.Controller.GetVictoryPointName_4893] to lead the army instead. Wanting to prove his leadership, the Crown Prince refused, and has set out to meet the Saqqawists and end them once and for all."
 afghanistan_civil_war_events.7.a:9 "The Warrior Prince shall save the nation!"

 afghanistan_civil_war_events.8.t:9 "Disaster in Baghlan"
 afghanistan_civil_war_events.8.d:9 "A report from our forces near Baghlan: the Crown Prince is dead.\n\nReports claimed that the Saqqawist forces were located in Baghlan, and were immeasurably outnumbered and disorganised compared to the Crown Prince's army. The highly confident Crown Prince set motion his plans: they were to smash apart the small bandit army and rout them all the way to the border to be slaughtered, and bring home the tattered Saqqawist banner in time for a celebration. It would be easy. The Royal Army quickly made their way to Baghlan, where they encountered a small force of Saqqawists, who were promptly approached in an offensive. They were easily overwhelmed, and quickly retreated away from Baghlan, pursued by our determined but exhausted soldiers, directly led by the Crown Prince.\n\nThe reports received were immediately proved false when the Crown Prince and his army ran right into the rest of Purdil Khan's forces, surrounding the Royal Army. The exhausted and demoralised Afghan soldiers were quickly beset upon by the Saqqawists, many being captured, running away, or being slaughtered. As for the Crown Prince, he was immediately blown to bits by an artillery shell before he was able to give any orders. At this point, the Saqqawists are on their way to [267.Controller.GetVictoryPointName_12769], surely to burn the city to the ground."
 afghanistan_civil_war_events.8.a:9 "Someone save us from these savages!"

 afghanistan_civil_war_events.9.t:9 "The Sack of [267.Controller.GetVictoryPointName_12769]"
 afghanistan_civil_war_events.9.d:9 "The more religious parts of Afghan society had always loathed [267.Controller.GetVictoryPointName_12769]: It represented Western degeneracy and disgusting excess, a monument to sin itself, and was begging to be wiped off the map. For the Saqqawists, this was their opportunity to do so, as their offensive took them right to the capital. The earlier attempt to stop the rebels drained [267.Controller.GetVictoryPointName_12769]'s local garrisons, leaving the city practically unguarded. What little resistance the Saqqawists did encounter was easily defeated, and before long, the city was theirs.\n\nWhat the Saqqawists did next could only be described as apocalyptic, the complete desolation of [267.Controller.GetVictoryPointName_12769] at their fanatic hands. After capturing the city, the rebels began a campaign of looting and rampage, stealing valuables and demolishing buildings. Revenue offices, the National Museum, even the Royal Palace itself: precious items that could be ransomed or auctioned were ripped from their rightful place. If it couldn't be stolen, it was destroyed, brought down with ropes and blasted with artillery, a show of righteous force against the sickening vanity of the King.\n\nThe people of [267.Controller.GetVictoryPointName_12769] quickly found themselves at the mercy of a violent band of barbarians, subject to enslavement and gruesome end. The rebels paid considerable attention to slaughtering any foreigners they could find: after all, it was the foreigners that plunged Afghanistan into ruin in the first place. One such unlucky soul was the Chief Architect of [267.Controller.GetVictoryPointName_12769], Albert Speer, who was found crushed underneath the ruins of the National Assembly after the rebel forces used the building for target practice.\n\nBy the time they had marched on, not a single square foot of [267.Controller.GetVictoryPointName_12769] was left untouched by the fanatics. Amidst the smouldering ruins of the once proud capital city flew the Saqqawist banner of red, black, and white, a symbol of what was to come for any who dared to stand against the righteous forces of Purdil Khan, and any who sought to defile Afghanistan with modern decadence."
 afghanistan_civil_war_events.9.a:9 "Years of effort, burnt away in one night..."

 afghanistan_civil_war_events.10.t:9 "Nadir Reorganises in the West"
 afghanistan_civil_war_events.10.d:9 "After the death of the Crown Prince and the destruction of the capital, the future of King Amanullah's Afghanistan was uncertain. Who knew what the next moves of Purdil Khan would be? Morale was at an all time low. Now, we have been given good news: Nadir is planning a counterattack.\n\nMarshal Mohammad Nadir Khan was spared the carnage of [267.Controller.GetVictoryPointName_12769], having been sent to [415.Controller.GetVictoryPointName_4893] on official Army business. Now, with the chain of command falling to him, he has begun to mobilise forces to meet the Saqqawists. Nadir is a much more thoughtful tactician, and will likely wait for confirmation of reports before making any decisions. For now, he is calling for conscripted men, recruiting tribal forces, and drilling the garrison at [415.Controller.GetVictoryPointName_4893] to prepare for an attack."
 afghanistan_civil_war_events.10.a:9 "Nadir is our last hope."

 afghanistan_civil_war_events.11.t:9 "News Reaches Amanullah"
 afghanistan_civil_war_events.11.d:9 "Thanks to the distance between Europe and Afghanistan, King Amanullah has been blissfully unaware of the catastrophe back home, until now. A telegram made its way to the King's hotel room in Frankfurt, informing the King of the situation.\n\nHotel staff reported the sounds of smashing furniture and wailing coming from the room, followed by the King and his entourage checking out the same day. What was left behind was a suite that was utterly destroyed, seemingly in a fit of rage. The King is on his way back to Afghanistan, determined to prevent his country from spiralling further into chaos."
 afghanistan_civil_war_events.11.a:9 "They did what to my city? And to my son?!"

 afghanistan_civil_war_events.12.t:9 "The March to [267.Controller.GetVictoryPointName_10737]"
 afghanistan_civil_war_events.12.d:9 "Nadir has completed preparations for his army, and has set off to [267.Controller.GetVictoryPointName_10737], in a gamble to turn the tides against the Saqqawists. The urgency of this battle is understood by all. Reports from across the countryside have been out of a nightmare: Saqqawists burning fields, sacking villages, and destroying newly constructed roads, train stations and factories. It is clear that Purdil Khan's fate for Afghanistan will be a return to a state of living centuries old, where his bandits are the only source of power in the country.\n\nNadir is totally aware of what needs to be done to save the country. The only fate these marauders deserve is at the end of a bayonet, and every soldier knows this. Our forces also have begun developing a sense of pride, eager to stand by Nadir and save the country. They understand the truth: only Mohammad Nadir Khan can save the country from certain doom. Let us pray that they make it in time."
 afghanistan_civil_war_events.12.a:9 "The occupying scum will be given no quarter."

 afghanistan_civil_war_events.13.t:9 "The Nation Reclaimed"
 afghanistan_civil_war_events.13.d:9 "Victory! With the Saqqawists dead or routed, [267.Controller.GetVictoryPointName_10737] has been secured, and the bandit occupation has at last ended.\n\nNadir and his forces arrived at the city to find that the Saqqawists had taken up defensive positions, but were prepared for a much smaller attacking force. Nadir ordered an artillery barrage on the city, leading to immense casualties for the defenders. The Saqqawists, far too accustomed to guerilla attacks to defend the city properly, quickly abandoned their defences. The city was open. The resulting conflict was a bloodbath for Purdil Khan and his bandits. Many found themselves overwhelmed by the better trained and equipped forces of Nadir, and were gunned down attempting to flee. Purdil Khan himself tried to escape in a Rolls Royce that was part of the King's car collection, only to be riddled with bullet holes by a machine gun.\n\nThough the city is secure, there is still much work to be done. Several towns and cities, including [1118.Controller.GetVictoryPointName_12314], are still under Saqqawist control. However, with Purdil Khan's death and the shattering of his main force, we can expect little resistance from these bandits, and can safely say this conflict will be over in a matter of days."
 afghanistan_civil_war_events.13.a:9 "I want their \"Emir's\" head on a pike by morning."

 afghanistan_civil_war_events.14.t:9 "Nadir Takes the Crown"
 afghanistan_civil_war_events.14.d:9 "A power void has formed in Afghanistan. The King's absence and the death of his son has left the throne of the nation absent: no one leads the nation, now that the Saqqawists have been defeated.\n\nNo one, officially, that is.\n\nTo many within the nation, it is clear that the leader they need has been here all along. A man who stood against the fanatics, when the King was dining luxuriously in Europe. A man who has the strategic mind and experience to lead the military, unlike the headstrong Crown Prince. A man whose family was once exiled from Afghanistan for fear of their claim to the throne. Mohammad Nadir Khan must lead the nation as its King.\n\nNadir himself was unconvinced. How could he betray Amanullah after defeating his enemies? Besides, he had no experience ruling a country. Luckily, Fazl Omar Mojadidi, in his wisdom, put forth several points: it was Nadir who saved and protected the nation, not Amanullah. In fact, Amanullah's reckless modernisation was what prompted the rebels in the first place. Afghanistan needed a sensible ruler to guide the nation without eschewing stability. Convinced by Mojadidi's reasoning, Nadir was promptly crowned as king of Afghanistan, and set out to prepare his forces for yet another civil war."
 afghanistan_civil_war_events.14.a:9 "Amanullah won't be happy to hear this..."

 afghanistan_civil_war_events.15.t:9 "A Carriage of Curses"
 afghanistan_civil_war_events.15.d:9 "The train ride back to Afghanistan was already tense, thanks to King Amanullah's disposition. Losing the nation and his son had taken a toll on the King, and he was found to be more irritable than ever, desperate to be home as soon as possible. Unfortunately for him, a telegraph was delivered to his carriage. News from home: his Minister of War, Mohammad Nadir Khan, had taken it upon himself to be crowned as King in Amanullah's absence.\n\nThe King's outburst could be heard from the adjacent train carriages, and it was not a pleasant ordeal. The smashing of fine china, furious stomping, and the raving of an indignant madman made its way across the train. Amanullah's rage was indecipherable to the average ear, as not many on the train could speak Persian. For the King's entourage, his words were clear: a cacophony of profane words, strings of vicious insults mounted upon the name of Nadir, and threats of death and suffering in the most barbaric of ways.\n\nTo say Amanullah took the news poorly would be an understatement."
 afghanistan_civil_war_events.15.a:9 "I doubt this will end with calm discussion."

 afghanistan_civil_war_events.16.t:9 "The Afghan Civil War"
 afghanistan_civil_war_events.16.d:9 "After an exhausting journey from Europe, King Amanullah has finally arrived in his homeland, although one in which many now refuse to recognise that title in. Nadir was far too popular for his own good, a characteristic Amanullah mistakenly overlooked in hindsight. However, not all was lost: many within the nation see his vision of a modern Afghanistan, with others outraged at the audacity of Nadir to shirk the authority of the Royal Family, meaning Amanullah has plenty of support to take back his throne.\n\nWith neither man seemingly willing to stand down the nation is stuck at a crossroad: shall the nation move forward into the twentieth century with Amanullah, or will it rest its laurels on the popular and competent Mohammad Nadir Khan? Regardless of who sits upon the throne, one thing is certain: more blood must be spilled, before Afghanistan can truly be at peace."
 afghanistan_civil_war_events.16.a:9 "Amanullah is the true king."
 afghanistan_civil_war_events.16.b:9 "Nadir is the only man who can save Afghanistan."

 afghanistan_civil_war_events.20.t:9 "Intervention in the Afghan Civil War"
 afghanistan_civil_war_events.20.d.amanullah:9 "Of all the places in the world we expected to hear from, Afghanistan was the last. Tucked away in the mountains of South Asia, the little nation has recently been a subject of our investments. Thanks to the modernisation efforts of the King, our companies have expanded into a new market, with growing demands for more modern goods. However, as nice as it is to benefit from new opportunities, Afghanistan has its drawbacks: civil unrest, religious fanaticism, and a geography far too ripe for long term insurgencies. Such drawbacks have finally borne fruit: the Kingdom finds itself in the midst of a civil war.\n\nThe message in question comes from King Amanullah who, while touring Europe, was whisked away by this war. He says that in his absence forces opposing his westernisation efforts have installed a rival on the throne, and he'd appreciate any help he receives. Rather than simply expecting us to help out of the goodness of our hearts, Amanullah's message mentions how his efforts to modernise Afghanistan have resulted in us receiving high valued investment opportunities, and that support would mean even more benefits and privileges within the Afghan economy.\n\nHis continued rule of Afghanistan is likely to be to our benefit, with more room for profit that would help our domestic economy, particularly after the last few turbulent years. Having the nation's king in our pocket is also bound to be useful, and may perhaps see Afghanistan fully drawn into our sphere of influence. At the same time however, world tensions are on the rise, and perhaps the resources we'd gamble away giving them to the Afghans would be better served elsewhere."
 afghanistan_civil_war_events.20.d.nadir:9 "Of all the places in the world we expected to hear from, Afghanistan was the last. Tucked away in the mountains of South Asia, the little nation has recently been a subject of our investments. Thanks to the modernisation efforts of the King, our companies have expanded into a new market, with growing demands for more modern goods. However, as nice as it is to benefit from new opportunities, Afghanistan has its drawbacks: civil unrest, religious fanaticism, and a geography far too ripe for long term insurgencies. Such drawbacks have finally borne fruit: the Kingdom finds itself in the midst of a civil war.\n\nInterestingly, the message from Afghanistan comes not from the nation's widely recognised king, but instead Mohammad Nadir Khan, who our files currently record as simply the Minister of War. Mohammad Nadir, now taking the surname Shah, claims to have been crowned by the people while Amanullah Khan was away in Europe, following Nadir's recapture of the capital from rebel forces. With Amanullah back in Afghanistan and waging war to reclaim his throne, Nadir has humbly requested our support against him, a request interwoven with obvious undertones of expected quid pro quo.\n\nFor the past few years, [?AFG.AFG_amanullah_backer.GetNameDef] has had the previous king's ear, and Nadir winning this war will if nothing else deprive them of a potential ally, and perhaps gain us control of Afghanistan instead. At the same time however, world tensions are on the rise, and perhaps the resources we'd gamble away giving them to the Afghans would be better served elsewhere."
 afghanistan_civil_war_events.20.a:9 "Send them military aid."
 afghanistan_civil_war_events.20.b:9 "Spare some financial support."
 afghanistan_civil_war_events.20.c:0 "Qui se soucie de l'Afghanistan ?"

 afghanistan_civil_war_events.21.t:9 "[FROM.GetNameDefCap] Sends us Support"
 afghanistan_civil_war_events.21.d:9 "Great news! Our friends in [FROM.GetNameDef] have convinced their government to send aid to our efforts in the civil war.\n\nWhile this may mean them cashing in a favour down the line, for now we can rest easy knowing we have extra resources to fight our enemies."
 afghanistan_civil_war_events.21.a:0 "Nous n'oublierons pas cela."

 afghanistan_civil_war_events.22.t:9 "[FROM.GetNameDefCap] Refuses to Aid Us"
 afghanistan_civil_war_events.22.d:9 "We just received a letter from [FROM.GetNameDef]: while they personally support our cause, geopolitical factors prevent them from sending actual resources.\n\nIt is likely that [FROM.GetNameDef] has determined this conflict to be inconsequential to them, despite their business interests in our country. A shame."
 afghanistan_civil_war_events.22.a:9 "Damn them, we can do this without their help!"

 afghanistan_civil_war_events.24.t:9 "[FROM.GetNameDefCap] Supports Our Enemy"
 afghanistan_civil_war_events.24.d:9 "We have received intel that [FROM.GetNameDef] has chosen to aid our rivals in this conflict, clearly hoping to secure an ally in the event that they win.\n\nIt is obvious they think our opponents will be much more susceptible to their economic strength than we are. We will not forget this insult against us."
 afghanistan_civil_war_events.24.a:9 "We certainly won't forget this..."

 afghanistan_civil_war_events.25.t:9 "The Afghans Request Further Aid"
 afghanistan_civil_war_events.25.d:9 "A new missive has been received from Afghanistan, with our loyal allies requesting even more aid, declaring a little bit more help is all they need to at last quash their enemies.\n\nAlthough Afghanistan is quickly becoming quite a bottomless pit, it may be prudent to still hear out their request, in hopes that their claims of being near victory actually hold some weight."
 afghanistan_civil_war_events.25.a:9 "We can spare a little more military aid."
 afghanistan_civil_war_events.25.b:9 "Send some more financial aid."
 afghanistan_civil_war_events.25.c:9 "Do they think we're just made of money?"

 afghanistan_civil_war_events.26.t:9 "[FROM.GetNameDefCap] Sends Further Support"
 afghanistan_civil_war_events.26.d:9 "It seems that luck is on our side, as [FROM.GetNameDef] has agreed to our request for further assistance.\n\nWhile these concessions may return to haunt us in the future, we cannot worry about that while this war continues. For now, we are grateful for their help."
 afghanistan_civil_war_events.26.a:9 "Just a little more and we'll win this war."

 afghanistan_civil_war_events.27.t:9 "[FROM.GetNameDefCap] Refuses to Send Further Support"
 afghanistan_civil_war_events.27.d:9 "It seems that [FROM.GetNameDef]'s generosity has its limits, as they have rejected our request for further resources.\n\nWhile this is certainly a disappointing development, we shall see what we can do with what we already have, though this puts us in a more difficult position in the war."
 afghanistan_civil_war_events.27.a:9 "They can't just spare a little more?"

 afghanistan_civil_war_events.30.t:9 "[afghanistan_civil_war_events_30_title]"
 afghanistan_civil_war_events.30.t.bost:9 "The Battle for Bost"
 afghanistan_civil_war_events.30.t.kajran:9 "Nadir's Forces Attack in Kajran"
 afghanistan_civil_war_events.30.t.gizab:9 "Skirmishes in Gizab"
 afghanistan_civil_war_events.30.t.chisht:9 "Contesting Chisht"
 afghanistan_civil_war_events.30.t.maiwand:9 "The Road to [1117.Controller.GetVictoryPointName_5064]"
 afghanistan_civil_war_events.30.t.sharak:9 "The Crossroads of Sharak"
 afghanistan_civil_war_events.30.t.khost:9 "The Siege of Khost"
 afghanistan_civil_war_events.30.d.bost:9 "The City of Bost has seen exceptionally brutal fighting over the last week, as both our forces and Nadir's are hungry and desperate to establish full control over the three thousand year old fortress and the Ghaznavid-era Lashkari Bazar. We have successfully managed to thunder Nadir with an entourage of heavy artillery, but this has come at the cost of a dire munition shortage that has not gone unnoticed by our battered adversaries.\n\nAs the supply line struggles to deliver more shells, Nadir's troops have reinforced and are capitalising on our lack of heavy cover fire by aggressively pushing our lines. Half of Bost has now fallen to Nadir's forces, but so long as we can hold out, our artillery should very well be capable of devastating these units for good."
 afghanistan_civil_war_events.30.d.kajran:9 "Though Kajran itself is held by Nadir, we've secured a highly advantageous position in the region by capturing several villages and outposts surrounding the settlement. As we prepare to storm Kajran and eliminate Nadir's presence here once and for all, a counterattack has caught us by surprise and our forward outposts were overrun embarrassingly swiftly.\n\nThankfully, our other positions have caught wind of the counterattack and are now preparing to meet the enemy on the battlefield, but the losses we've sustained cast a long shadow over this endeavour."
 afghanistan_civil_war_events.30.d.gizab:9 "In the valleys around Gizab in Central Afghanistan, warfare has perpetuated itself between troops of both sides. One of many key positions in the effort to secure the heart of the Kingdom, we have exchanged several losses and victories alike with Nadir's forces. This has been great for preventing Nadir from properly entrenching, but not optimal as it simultaneously means we are barely able to maintain our footing in the region as well. The mountains and passes provide for ample retreats and devastating artillery positions, and unfortunately Nadir has made much more lucrative use than us.\n\nIf we commit more troops to the area, we may stand a chance at finally capturing the region, elsewise our local commanders feel that we're just throwing lives away to become fertilizer for the soil and some recommend giving the area up in favour of more hopeful gains."
 afghanistan_civil_war_events.30.d.chisht:9 "Along the northern bank of the Hari River, east of [415.Controller.GetVictoryPointName_4893], lies the town of Chisht. As part of our campaign to achieve full superiority in Western Afghanistan, we are aggressively contesting Nadir's control over the area.\n\nArtillery fire has damaged one of the historic Gumbads of the Ghurid Dynasty, and several caravans previously going in and out of the city have been hurriedly abandoned, providing ample yet flimsy cover for our men. Nadirite resilience tests our resolve, but should we break his back before he breaks ours, the conquest of Chisht will be a major victory for our war effort!"
 afghanistan_civil_war_events.30.d.maiwand:9 "\"History does not repeat, but it does rhyme\". Such a saying rings true today, because just as Mohammad Ayub Khan came to blows with the British at Maiwand in 1880 during his campaign to retake [1117.Controller.GetVictoryPointName_5064], Nadir follows in his footsteps in pursuit of the same mission.\n\nDisregarding the fact that we'd be the dastardly British in this analogy, it is imperative that we do not capitulate our grip on the south, and so we have met the Nadirites at Maiwand. Facing numerical superiority, we are struggling to contest the city and sustaining serious losses. Nadir's forces do appear to be buckling, but locking horns in our state may still not guarantee our victory..."
 afghanistan_civil_war_events.30.d.sharak:9 "Located between two major road arteries, Sharak has witnessed almost constant skirmishing over the past week. Though we have had the upper hand in the area for some time, which has allowed us to pounce on any and all opportunities to rout Nadir's snakes out of Western-Central Afghanistan, a massive Nadirite contingent from the capital has taken us by surprise and forced a strategic retreat.\n\nWith our effective control over local highways severely diminished, a final assault on Sharak appears imminent. Though our forces have little time and little resources with which to lick their wounds, Sharak's relative infrastructural isolation and poor road connections might just salvage our defence."
 afghanistan_civil_war_events.30.d.khost:9 "In an effort to dislodge our control of the Khyber Pass, Nadir's forces have launched a massive siege on Khost! One of our most resilient strongholds, Nadir's traitorous generals have compensated with numbers and firepower, brutally shelling the interior of the city and dealing heavy damage to civilian housing.\n\nAs a calamitous sense of panic swells in the hearts of Khost's Loyalist subjects, we are hard-pressed to put an end to the siege and sustain our control. If we can't rebuke their siege, it will surely come at quite a \"Khost\"..."
 afghanistan_civil_war_events.30.a:9 "Fight to the last."
 afghanistan_civil_war_events.30.b:9 "We must retreat for now."
 afghanistan_civil_war_events.30.c:9 "Send reinforcements to hold them back!"

 afghanistan_civil_war_events.31.t:9 "[415.Controller.GetVictoryPointName_4893] Falls to Amanullah's Forces"
 afghanistan_civil_war_events.31.d:9 "Despite holding to the last man, our forces in [415.Controller.GetVictoryPointName_4893] have been forced to surrender to Amanite forces. For days, artillery and mortar fire pounded the city and distressed our military organisation, weakening the garrison enough for the enemy to execute a pincer that captured the city with minimal losses for them, and devastating casualties for us.\n\nWith this loss, Amanullah has now asserted himself in Western Afghanistan and evicted us away from the border with [PER.GetNameDef]."
 afghanistan_civil_war_events.31.a:9 "This is just a temporary setback."

 afghanistan_civil_war_events.32.t:9 "[afghanistan_civil_war_events_32_title]"
 afghanistan_civil_war_events.32.t.waras:9 "Fighting Outside Waras"
 afghanistan_civil_war_events.32.t.ghazni:9 "Loyalists Attack in Ghazni"
 afghanistan_civil_war_events.32.t.basawul:9 "Battle for the Pass"
 afghanistan_civil_war_events.32.t.kajran:9 "Amanullah's Forces Attack in Kajran"
 afghanistan_civil_war_events.32.t.bamyan:9 "The Battle For Bamyan"
 afghanistan_civil_war_events.32.t.baghlan:9 "Skirmishes Around Baghlan"
 afghanistan_civil_war_events.32.t.zaranj:9 "Amanites Advance on Zaranj"
 afghanistan_civil_war_events.32.d.waras:9 "Violence has broken out near Waras on the road to [267.Controller.GetVictoryPointName_10737], threatening our supremacy in the region.\n\nThough the enemy battalions are almost disproportionately numerous compared to ours, ceding the road and by extension Waras would seriously impact our power projection and likely delay us from supplying a number of our garrisons, not to mention giving the enemy a path straight to the heart of [267.Controller.GetVictoryPointName_10737] would prove to be an existential risk for us."
 afghanistan_civil_war_events.32.d.ghazni:9 "It would appear the latest grisly scene to come of the civil war has commenced in Ghazni, as Loyalist Amanites have risen up and are attempting to assert complete control over the city! The former seat of the Ghaznavid Empire, retaining control is not only symbolically important but also crucial as it lies just south of [267.Controller.GetVictoryPointName_10737] and will surely enable Amanullah to greatly threaten our position there.\n\nUnfortunately, as urban warfare sporadically broke out across the city, we were forced to hole up in the Ghazni Citadel. Encircled and already suffering attrition, forces were sent to relieve them and dislodge Loyalist control over the city from the north, but the enemy has already entrenched and is giving us hell in return..."
 afghanistan_civil_war_events.32.d.basawul:9 "Amanite forces have struck the town of Basawul! A vital chokepoint near the Khyber Pass, Basawul is key to preventing Amanullah from asserting control in Eastern Afghanistan and connecting his forces with Pashtunistan.\n\nOur defence was rigorous, and we managed to inflict enough losses to force a retreat, but it would appear that they have obtained swift reinforcements. Indeed, the battle weakened us too, and it seems the enemy banks on our weakness being enough to break us..."
 afghanistan_civil_war_events.32.d.kajran:9 "Kajran, in Central Afghanistan, has been a strategic location crucial to sustaining Nadir's capability of holding [267.controller.GetVictoryPointName_10737] and Darulamann. Of course, Loyalist forces treasure the thought of taking it from our hands for that precise reason, and an army of them are marching toward the settlement.\n\nMany outposts were toppled, and though our men are prepared to repel the Amanite Loyalists to their dying breath, one wonders if they have enough men to resist the invasion."
 afghanistan_civil_war_events.32.d.bamyan:9 "Little else can be heard from the \"Valley of Gods\" aside from the percussion of gunpowder, thunder, and bodies falling limp upon the earth. Amanullah has launched a massive assault on the settlement of Bamyan in an effort to expand his grip in central Afghanistan. Our valiant forces have met them as they've come upon us, and the extent and scale of fighting has outmatched the expectations of both sides in the conflict.\n\nDespite efforts to avoid the site, an artillery shell struck the ground infront of the \"Buddhas of Bamyan\" and damaged the knee of the ancient Western Buddha, causing a major upset among the area's small Buddhist community. Before we destroy our great landmarks further, we must make every effort to end the fighting once and for all!"
 afghanistan_civil_war_events.32.d.baghlan:9 "The city of Baghlan in the north of Afghanistan has been a hotspot over the last week, with skirmishing only becoming more and more frequent. Amanite troops have taken to storming through the area's sugar beet fields to launch assaults on our outer city garrisons, and have even taken to halting and turning around any caravan attempting to enter or leave the city.\n\nReinforcements from around Qataghan have attempted to disrupt Amanullah's forces, but so far they've proven too quick and too fierce. The few carriers who've managed to slip in and out of Baghlan tell us that if Amanullah's forces aren't repelled soon, the city will capitulate and the garrison forced into a dangerous escape..."
 afghanistan_civil_war_events.32.d.zaranj:9 "Our southwestern flank has been threatened, as Amanite forces are launching an assault on the town of Zaranj next to the Iranian border! Marching up along the primary southern road, they launched a surprise attack on a makeshift outpost, preventing our scouts from quickly fleeing back to the main town to warn the garrison.\n\nNow, with ill time to prepare, our men are scrambling to prepare our mortar defenses, but it's unlikely they'll mount a defense for too long before their troops enter the town and all-out urban warfare commences..."
 afghanistan_civil_war_events.32.a:9 "Fight to the last."
 afghanistan_civil_war_events.32.b:9 "We must retreat for now."
 afghanistan_civil_war_events.32.c:9 "Send reinforcements to hold them back!"

 afghanistan_civil_war_events.35.t:9 "Pashtunistan Declares Its Neutrality"
 afghanistan_civil_war_events.35.d:9 "Though the rest of Afghanistan is embroiled in a chaos of side-picking and declarations of fealty, the autonomous region of Pashtunistan has decided to remain impartial. Local powerbrokers have come together to issue a proclamation to both sides, stating that they will only take arms to defend Pashtunistan and warning against any military incursion in the region.\n\nPeshawar has, consequentially, seen an influx of draft-dodgers who cower away from the battlefield. Though it would be better if they cast their dice with us (as they should), both us and our adversary are happy to leave them be in order to better concentrate our forces across a smaller chessboard."
 afghanistan_civil_war_events.35.a:9 "Better neutral than against us I suppose."

 afghanistan_civil_war_events.36.t:9 "Pashtunistan Declares For Amanullah"
 afghanistan_civil_war_events.36.d:9 "Local tribal leaders and princes in the Pashtunistan autonomous region have formally declared their fealty to Amanullah Khan, and have begun mobilising their forces toward Nadir's strongholds to give Amanite forces a boost to their efforts. The Faqir of Ipi himself could be seen riding out on horseback and personally leading his troops, while the princely state of Swat has begun to finance local mercenaries to assemble a fighting force capable of repelling Nadir's forces from Pashtunistan and cutting him off from the entire frontier."
 afghanistan_civil_war_events.36.a:9 "Just more bodies to the slaughter..."
 afghanistan_civil_war_events.36.b:9 "They recognise the true king!"

 afghanistan_civil_war_events.40.t:9 "The Amanite Restoration"
 afghanistan_civil_war_events.40.d:9 "After weeks of further and further gains by Amanite forces, Nadir and his men were finally driven back to [267.Controller.GetVictoryPointName_10737], cut off entirely from forces led by his many brothers across the rest of the nation. Despite attempts to save their brother from the siege, nothing could stop the Amanite soldiers, and after a few hours of fighting the city was retaken by Amanullah Khan. Nadir's fate was unknown at first, although after enough searching his body was identified amongst the fallen, an undignified end for a supposed king.\n\nAlthough Amanullah has defeated his rival and reclaimed the throne, he has yet to truly retake Afghanistan. Many still oppose his rule, and will never accept the king back unless he tosses Westernisation aside, and punishes those who clearly misled Amanullah into taking part in it. The King must now decide if appeasement of the nation's traditionalists is the best path to restoring power, or whether eliminating them entirely now that he has the upper hand is the better call."
 afghanistan_civil_war_events.40.a:9 "No one shall stop Amanullah's vision now!"
 afghanistan_civil_war_events.40.b:9 "It is clear that the reformers must go."

 afghanistan_civil_war_events.41.t:9 "Amanullah Driven From Afghanistan"
 afghanistan_civil_war_events.41.d:9 "It appears that the civil war will at last end the way it begun: With Amanullah Khan rapidly leaving Afghanistan. Suffering repeated defeats and quickly running out of steam, the former king has allegedly fled across the border, with many of his forces shattered by this news.\n\nThe last stand of his primary forces, in his temporary capital of [117.Controller.GetVictoryPointName_2017], has been completely crushed, with his brother-in-law Ali Ahmad Khan killed as he led the troops. Nadir stands now as the undisputed king, although it is too early for him to rest as his enemies still lurk in the shadows."
 afghanistan_civil_war_events.41.a:9 "The nation stands behind its new king."

 afghanistan_civil_war_events.45.t:9 "Unrest Continues to Stir"
 afghanistan_civil_war_events.45.d:9 "It appears that news of the death of the false king Nadir and the reclamation of the capital must have not yet begun to spread, or that Afghanistan is filled with the perpetually stupid. Rather than throw down their arms in recognition of the true king's might, rebel forces still continue to fester throughout the nation, both Saqqawist and Musahiban remnants alike.\n\nAlthough it is likely that they will be easily defeated by the Royal Army, perhaps Amanullah's rule may not yet be as secured as he believes..."
 afghanistan_civil_war_events.45.a:9 "They'll remember their place soon enough."

 afghanistan_civil_war_events.46.t:9 "The Anti-Amanullah Alliance"
 afghanistan_civil_war_events.46.d:9 "War makes for strange bedfellows, and there is only so far that the phase \"The enemy of my enemy is my friend\" can be applied before it begins to get absurd. Remnants of Nadir's army, led now by his brother Mohammad Hashim Khan, have agreed now to a formal alliance with what is left of the Saqqawist army, despite being enemies mere months ago. Joining this unholy alliance are many members of the Mojadidi family, including Fazl Omar Mojadidi himself, seemingly driven into their arms by the death warrant signed for him by King Amanullah.\n\nAlthough battered, the uniting of the rebel forces into one unified front against the King has certainly amplified the threat they pose, but they will simply be crushed just like the rest."
 afghanistan_civil_war_events.46.a:9 "We'll make sure they share a grave."

 afghanistan_civil_war_events.47.t:9 "Assembling the King's Party"
 afghanistan_civil_war_events.47.d:9 "Even with his enemies continuing to fester, the King has seen little reason to be deterred from continuing his grand ambitions now that he has returned to the throne. Despite returning to less than favourable circumstances compared to what he expected, Amanullah has seen fit to continue full steam ahead with his previously finalised plans for a national parliament. In preparation, he has finally also revived plans from just before the first Saqqawist rebellion to institute his own personal political party, who are expected to be the only legally recognised entity in the legislature.\n\nOperating under the name of the Ferqa-i-Esteqlal wa Tajaddod, the Party of Independence and Reform, the party has technically existed on paper for a decade now, but quickly forgotten about by most as the golden decade came to an end. Simply continuing where he left off, Amanullah has chosen Abdul Tawab Khan Tarzi, the King's brother-in-law who fought for him during the civil war, to serve as the party's leader. With his role as Prime Minister already effectively confirmed, Amanullah has simply elected to appoint him to the role early, replacing many of the duties previously carried out by Wardak, who is instead set to be appointed head of the Senate upon its inauguration."
 afghanistan_civil_war_events.47.a:9 "At last, the King is free to rule."

 afghanistan_civil_war_events.48.t:9 "Continued Fighting in Surobi"
 afghanistan_civil_war_events.48.d:9 "News from the town of Surobi to the east of [AFG.Capital.GetCapitalVictoryPointName] has been rather concerning, even amongst those still confident in the King's victory against the rebels. A recent battle outside the town, expected to be a simple slaughter for the Royal Army, quickly devolved into quite an equal bloodbath as a large number of local peasants rallied for the rebel cause.\n\nApparently motivated by continued opposition to the King's reforms, and viewing Hashim Khan as a more fair and legitimate King, these peasants are not alone, with similar incidents slowly becoming more and more common. Even in [AFG.Capital.GetCapitalVictoryPointName], the peasants have begun to whisper their displeasure against Amanullah, and their hopes that his restoration will be short lived."
 afghanistan_civil_war_events.48.a:9 "They'll give up soon enough..."

 afghanistan_civil_war_events.49.t:9 "Storming of the Palace"
 afghanistan_civil_war_events.49.d:9 "For the fourth time since Purdil Khan marched south, [267.Controller.GetVictoryPointName_10737] has fallen, yet for once not to an army, but to its own people. The continued attempts by Amanullah to enforce his unpopular reformist schemes upon them from a weaker and weaker position has finally proven to be his terminal undoing. What started as protests escalated into anger, and from there into full blown riots, lashing out at any symbols of the regime. The order for troops to fire upon the protestors, an order disobeyed by almost all of those it was given to, proved to be the last straw.\n\nRoyal guards stood by and watched as peasants descended upon [267.Controller.GetVictoryPointName_12769], where the King has been staying in spite of the significant damage inflicted upon it by the Saqqawists. As the angry mob rushed through the hallways, they came upon Amanullah Khan's failed escape attempt, quickly tearing the man limb from limb in a rather literal fashion according to some retellings.\n\nNews of Amanullah's lynching by his now former subjects spread quick and far, with both Fazl Omar Mojadidi and Hashim Khan arriving on the scene within hours. Supported both by the mob, and by the Sher Agha, Hashim Khan was proclaimed the nation's true king, heir to his brother's short lived legacy. Whether or not he actually will be King, or if a powerful man like Mojadidi will rule from behind the throne, is something only time can tell."
 afghanistan_civil_war_events.49.a:9 "Doom was always his destiny."

 afghanistan_civil_war_events.50.t:9 "A Meeting with Hazrat Nur al-Mashayikh"
 afghanistan_civil_war_events.50.d:9 "There was a time where not a day went by without the King wondering how better his reign would be if he simply had Fazl Omar Mojadidi executed and weathered the subsequent storm. Even now meeting the man face to face has simply reinforced these fantasies, however Amanullah has long recognised how important the man's sway is. Deferringly referring to him as his honorific name of Hazrat Nur al-Mashayikh, a title he only has thanks to Amanullah, the King directly requested Mojadidi's endorsement for his restored reign.\n\nOffering to begin rolling back the most unpopular of his reforms, and being willing to recognise the vital role of the ulema, Amanullah was finally able to convince the Sher Agha to back his rule. Both men are clearly under no illusion about how the other feels about them, yet they are forced to recognise that working together is simply the only path forward to the benefit of both parties. Mojadidi, fulfilling his side of the bargain, has called for remaining rebels to stand down and back the King, finally bringing the civil war to an end."
 afghanistan_civil_war_events.50.a:9 "No one has done more for the ulema than Amanullah!"

 afghanistan_civil_war_events.51.t:9 "Reformers Denounce the New Direction"
 afghanistan_civil_war_events.51.d:9 "To say that the news of the Mojadidi deal was not well received by Amanullah's former allies is certainly an understatement, especially after they began to learn what the King was willing to concede to achieve it. The countless reformers who once backed the King's rule can only regard his commitment to begin uprooting the progress they made as open and foul betrayal.\n\nMajor figures including Abdul Hadi Dawi and Ghulam Mohiuddin Arti have not minced their words in their condemnation of the King's actions, with hopes that he may finally see reason when not surrounded by yesmen."
 afghanistan_civil_war_events.51.a:9 "Who asked?"

 afghanistan_civil_war_events.52.t:9 "Wardak's Resignation"
 afghanistan_civil_war_events.52.d:9 "In order to truly convince the people of Amanullah's commitment to being a traditional king, it is blatantly obvious that the reformers must go, and an explanation for the King's previous reforms must be invented. Killing two birds with one stone, it has become simply government policy to blame any unpopular policies of the past decade on those around the King, who simply corrupted his divine and perfect vision into bastardised ideas that harmed the nation.\n\nWardak, who has become the face of Amanullah's reforms for many people, has not been blind to what that will mean for him. He has tendered his resignation as Interior Minister, believing his position to be no longer tenable. With rumours abound that things are to soon escalate into arresting and scapegoating reformers for previous government policy,  many expect Wardak to leave the country before any such purge against him can take place. In his stead as interior minister, general Habibullah Khan Abawi has been given the position, who is expected to simply carry out Amanullah's will without question."
 afghanistan_civil_war_events.52.a:9 "He has served his purpose."

 afghanistan_civil_war_events.53.t:9 "The Backrooms of [267.Controller.GetVictoryPointName_10737]"
 afghanistan_civil_war_events.53.d:9 "Rather than simply accepting their fate, rumours are abound that the nation's reformers are beginning to conspire against the King, hoping to save their own necks from being purged. Whispers in the capital talk about shadowy meetings in chillim bars in [267.Controller.GetVictoryPointName_10737], allegedly involving many of the King's former reformist allies that fear they are next on the chopping block. The figure most associated with these meetings however appears to be a relative outsider to the King's former circle, with that figure being the young Shahzada Rehmatullah Khan Durrani.\n\nDurrani, hailing originally from [445.Controller.GetVictoryPointName_5105], was driven from the city alongside his family during the Fourth Anglo-Afghan War, with his family reestablishing themselves in [267.Controller.GetVictoryPointName_10737]. Despite his youth, his position as head of his family combined with his outsider status has ironically granted him a large degree of political power and trust in the current climate. While Amanullah's former allies cannot be certain that another will not sell them out to the king, Durrani being outside the court's politics has soothed these fears.\n\nWhat is claimed about these meetings, gathered through a mixture of overheard conversations and loose lipped participants, is that a plot is brewing to assassinate Amanullah and bring about a constitutional monarchy under his brother Inayatullah. While few actually believe these rumours to be anything more than paranoia, Inayatullah being spotted coming out of one of these bars certainly has raised a few eyebrows."
 afghanistan_civil_war_events.53.a:9 "I'm sure it is little more than gossip."

 afghanistan_civil_war_events.54.t:9 "A Constitutional Conspiracy"
 afghanistan_civil_war_events.54.d:9 "Last night many throughout the palace were shocked to hear the sounds of gunshots echo throughout the halls. The guards, rushing to the scene, quickly found the King lying dead on the floor. Despite a search of the immediate area, there was no assassin in sight, nor a trail to follow to find one. The guards, one of whom who has coincidentally said to have \"inherited a large sum from a deceased family member\", may or may not have taken their time to arrive at the scene, and may have also overlooked a shadowy figure leaving in the distance.\n\nAwoken by soldiers, Inayatullah Khan was informed of his brother's death, and rushed to the palace as Amanullah's heir apparent. Although formal recognition of his succession will take time, the king to be quickly began fitting into his new role, ordering the army to immediately ensure order throughout the capital and the wider nation. It is expected that the new king will grant amnesty to those jailed by Amanullah, and attempt to restore the nation's faith in the crown, although only time will tell."
 afghanistan_civil_war_events.54.a:9 "Let us hope the truth stays buried, just like Amanullah..."

 afghanistan_civil_war_events.55.t:0 "Les Affaires de Famille"
 afghanistan_civil_war_events.55.d:9 "At long last, the Dastard of [267.controller.GetVictoryPointName_12769] has been wrested far, far away from Afghanistan. Now that the King of the past is gone, it's time to look forward to the King of the future. Putting the pieces back together is set to be a severe undertaking, and one that Nadir will need plenty of support to accomplish. To this end, he has appointed his brothers to several cabinet positions as an \"interim\" measure.\n\nMohammad Hashim Khan shall fill the post of Prime Minister, with Fazl Omar Mojadidi serving as Justice Minister in an attempt to appease the conservatives and Ulema and assure their support. Lastly, to replace Nadir as the Chief of Army, Mohammad Gul Khan Momand shall fill the post. A man greatly respected by Nadir's family and considered to be their sixth brother, even if not by blood, the weight of his promotion exemplifies the trust we have in him to maintain order."
 afghanistan_civil_war_events.55.a:9 "One man cannot rule alone, and Nadir is fortunate not to have to."

 afghanistan_civil_war_events.56.t:9 "Amanite Holdouts in Ghorband"
 afghanistan_civil_war_events.56.d:9 "Though the coward fled back to Germany with his tail between his legs, not all Amanites have lost hope. A number of loyalists who can't seem to comprehend their idol is a goat-hearted candy-ass still operate out of Ghorband, which is roughly two hours north of [267.controller.GetVictoryPointName_10737] if you're especially quick.\n\nMembers of the army doing a routine patrol were ambushed, and although the Amanite ruffians were outnumbered and beaten back, the continued challenge to our authority and prolonged bloodshed does us no favours. Momand has arranged for a heightened military presence in the region and has directed the airforce to assist in these efforts to nip this problem in the bud as soon as possible."
 afghanistan_civil_war_events.56.a:9 "Ironic, a man so hated by the faithful still has his zealots."

 afghanistan_civil_war_events.57.t:9 "Debate Amongst the Brothers"
 afghanistan_civil_war_events.57.d:9 "Nadir's family is united in their unconditional support for him, but sometimes they are not so united in their opinions. With the advent of a new King entirely dissociated from the previous thronebearer comes the expectation of a new constitution. Foreign diplomats, Afghan citizens, and the urban intelligentsia all await the restoration of constitutional order with bated breath. The problem is that everybody has varying opinions on what we keep from the Amanite Constitution and what we choose to toss into the bonfire. Keenly eyeing us are the Mojadidis, who expect a wholehearted repeal of several of Amanullah's \"Syndicalist machinations\" including the abolition of Purdah and the increased rights granted to women in general. Of course, progress is progress. What message does it send to our foreign backers if we wipe years of Westernisation clean?\n\nHashim Khan is firmly in support of appeasing the conservatives as much as possible and turning the clock back on Amanullah's reforms. The opinions of European heretics don't matter if it means we're rejecting the religious and cultural reality of Afghanistan, especially if it pits the Mullahs against us! But on the other hand, Shah Mahmud Khan insists that taking the safe way out by throwing most of it away would be terrible for the nation. It's too late to change what's been done, and while we can get rid of some of Amanullah's most eccentric reforms, we must appraise everything by its individual merits even if the Mojadidis might loathe swallowing such a pill."
 afghanistan_civil_war_events.57.a:9 "Hashim is right, best not to rock the boat."
 afghanistan_civil_war_events.57.b:9 "It is too late to put the genie fully back into the bottle."

 afghanistan_civil_war_events.58.t:9 "Purging the Realm"
 afghanistan_civil_war_events.58.d:9 "Not all of Amanullah's allies took to arms for him. Many Liberals, modernisers, and wealthy administrators ducked for cover and simply waited for the dust to settle just in case their preferred victor didn't pull through. Even then, there's still a vast assortment of tribes, the Hazara most of all, who didn't just vanish with the dissipation of his forces. We can no longer afford to overlook their continued coexistence with our regime when so many of them are inherently and diametrically opposed to our reign and our values.\n\nA vast purge has commenced across Afghanistan, targeting Amanullah's most powerful allies and several tribal chieftains who are still capable of causing trouble for our reign of peace. Such measures have not been easy, and the Hazara have proven especially troublesome, but nonetheless we've rounded up most potential fifth-columnists with only a few stragglers still hiding out in various villages and mountains."
 afghanistan_civil_war_events.58.a:9 "An unpopular but needed action."

 afghanistan_civil_war_events.59.t:9 "The Nadir of Nadir"
 afghanistan_civil_war_events.59.d:9 "Words can not describe the depth of the tragedy that has just taken place. After a successful inspection of the Army at the barracks in [267.controller.GetVictoryPointName_10737], King Nadir in a motorcade was travelling back across the city, when just seven minutes into the trip an explosion thundered from beneath his vehicle and promptly eviscerated the car.\n\nThere was no chance of survival. Nadir was blown to pieces on impact and his remains charred once the subsequent fire that enveloped his vehicle dispersed (His driver was similarly not so fortunate but still in one piece). As news spreads like wildfire and chaos seems poised to retake Afghanistan into her clutches, the Chief of Army Mohammad Gul Khan Momand has hurried to restore order by marching the army into the palace and installing himself as regent until the dust has settled. May Allah have mercy on his soul."
 afghanistan_civil_war_events.59.a:0 "Comment cela a-t-il pu arriver ?"

 afghanistan_civil_war_events.60.t:9 "Momand's Dilemma"
 afghanistan_civil_war_events.60.d:9 "Naturally, Nadir's successor should be his son, Prince Mohammad Zahir Khan, and it is expected by most (especially Nadir's brothers) that Momand make arrangements for his formal accession to the throne as soon as possible. What most people do not seem to understand is that this is not such a cut and dry matter. Momand is the respected and informal leader of the Azadist Clique, being the highest ranking member of the group and even prior to his promotion to Chief of Army the most influential. Though they've been loyal to the throne, most of the Azadists have a poor view of the throne as an institution and their modernist philosophies have led them to wonder if Republicanism would be a healthier fit for Afghanistan's future. Daoud Khan, a nephew of Nadir's and perhaps the second most notable Azadist behind Momand, shares these views, and has spent considerable efforts behind closed doors trying to convince Momand to make a break with the throne and declare a republic. Hashim Khan and Shah Wali Khan have additionally been urging him to set up a formal crowning ceremony as soon as possible, growing more impatient by the day.\n\nHe has only held executive power for three days, and already the stress feels like its taken years off of his life. No matter what Momand chooses to do, he will ultimately betray one of his two families. Hours of contemplation of the direction of the nation up to this point have ultimately led him to make a conclusion, if at least to put an end to the limbo before predatory forces from without decide to prey upon it. The choice that he makes is for the good of Afghanistan, his own hesitation notwithstanding."
 afghanistan_civil_war_events.60.a:9 "The crown has only brought chaos, it is time to abolish it."
 afghanistan_civil_war_events.60.b:9 "Zahir's uncles will ensure the son shines where the father faltered!"

 afghanistan_civil_war_events.61.t:9 "Unrest Peters Out"
 afghanistan_civil_war_events.61.d:9 "TThe eventual defeat of the remaining rebels was to Amanullah a question of when, not if. An answer to that question has finally been received now, with Mohammad Hashim Khan said to have fled across the border and given up on his failed crusade against the King.\n\nWith none left to stand in his way, Amanullah Khan will reshape the nation in his image, and shall strive to bring about a second golden decade even greater than his first!"
 afghanistan_civil_war_events.61.a:9 "Amanullah reigns supreme!"

 afghanistan_civil_war_events.62.t:9 "Conspiracy Rumours Begin to End"
 afghanistan_civil_war_events.62.d:9 "Rumour are a funny thing, as they seem to be more often completely baseless than actually true. The alleged whispers of some grand conspiracy against Amanullah have clearly proven to be unfounded, as nothing further has developed on this front. Even those who bandied around the rumours, believing in their heart of hearts the truthfulness of the claims, have simply moved on.\n\nIt seems ultimately that even if they were true, no one still stands in a position to oppose Amanullah, who now indisputably rules Afghanistan again, this time with a fist of iron."
 afghanistan_civil_war_events.62.a:9 "Amanullah reigns supreme!"

 afghanistan_civil_war_events.63.t:9 "Amanullah Loyalism Dies Down"
 afghanistan_civil_war_events.63.d:9 "After months of lingering unrest and stubborn pockets of Amanite resistance, the last of the rebels seem to have laid down their arms. Though we can undoubtedly expect more isolated incidents as the years go by, at this point we have so firmly entrenched that anything dislodging us seems far outside the realm of possibility.\n\nLife among the tribes has gone back to normal, buildings are rebuilt in [267.controller.GetVictoryPointName_10737] and the other cities, the markets are full of wares and Amanullah is but a memory. At long last, all of Afghanistan recognises the true King!"
 afghanistan_civil_war_events.63.a:9 "Nadir reigns supreme!"

 afghanistan_civil_war_events.64.t:9 "Wardak's Return"
 afghanistan_civil_war_events.64.d:9 "Following his resignation, Wardak seemingly completely disappeared, chalked up by many to fears that his neck would be next on the block once Amanullah would begin to scapegoat him. Over the past few days however, the man has suddenly reappeared in the capital, having clearly heard the news of Amanullah's passing and the new king's opposition to continuing his purges. Arranging a meeting with Inayatullah, Wardak has offered to temporarily return to his old position, hoping to help put the nation back together in the wake of the recent chaos. Although he clearly does not intend to remain in government long term, stating directly to the King his desire to leave politics entirely, he is expected to be appointed back as Interior Minister until a new government can be assembled."
 afghanistan_civil_war_events.64.a:9 "One last act of patriotism before a deserved retirement."

 afghanistan_civil_war_events.65.t:9 "Rumble with the Ghilzai"
 afghanistan_civil_war_events.65.d:9 "Since the recent civil war, [267.controller.GetVictoryPointName_10737] has been struggling to get back on its feet. Her hardy, enterprising inhabitants and diligent efforts by the government have assisted greatly in this endeavour. What most certainly did not provide any assistance was a raid by some 100-300 Ghilzai warriors spearheaded by Said al-Kailani, a relative of Amanullah's. Those who did not profess their enduring loyalty to the former king were subsequently robbed if they were lucky, and killed if they were the other 80%. Our forces repelled them, but a decisive victory was simply not in the cards and their forces dispersed southward into the mountains.\n\nThose familiar with al-Kailani believe he can be bought; others believe he's already bought himself a ticket straight to a shallow grave. Our precise approach is left up to our leader, [ROOT.GetLeader]."
 afghanistan_civil_war_events.65.a:9 "Let's talk bags of gold."
 afghanistan_civil_war_events.65.b:9 "Kill the bastards."

 afghanistan_civil_war_events.66.t:9 "Battle of the Tomb"
 afghanistan_civil_war_events.66.d:9 "The brothers Charkhi had known this would come sooner or later. Ghulam Nabi Khan and Ghulam Jailani Khan had holed up in their eponymous stronghold, the village of Charkh, hoping that the local protection they enjoyed would buy enough time for Nabi Khan to contact Nadir and negotiate peace, or even an amnesty for Amanullah himself. Their fear that Nadir had made up his mind was validated upon receipt of a 100 soldier-strong Lashkar marching into the village to shockingly minimal defence. Their loyal tribesmen had been unceremoniously bought off and evacuated themselves elsewhere an hour prior to their executors' arrival.\n\nWith what few loyalists they had, they holed up at the tomb of their great ancestor, the Maulana Yaqoub Charkhi, and put up a valiant resistance. Hundreds of bullets flew at the tombs that day, and over the course of a long, futile hour, they finally ran out of ammunition and were forced to surrender, where they were summarily executed under the pretext of having reached for a pistol upon being apprehended. Whether or not their final moments transpired just as the Lashkar's commander reported, the men who participated in the Battle of the Tomb received a generous spoil straight from the abandoned coffers of Amanullah Khan."
 afghanistan_civil_war_events.66.a:9 "So ends the tale of Amanullah's closest eunuchs."

 afghanistan_civil_war_events.67.t:9 "Replacing the Musahiban"
 afghanistan_civil_war_events.67.d:9 "Although the Musahiban family and their lapdogs may be nothing more now than traitors or corpses, we cannot overlook how understaffed our officer corp is now with them gone. Nadir's betrayal and death especially has even left our army without an official leader, although multiple men have been unofficially fulfilling Nadir's old duties since the early days of the civil war.\n\nIn an effort to begin fully rebuilding the armed forces, it has been suggested that we choose one of these men to officially take over and begin restoring order."
 afghanistan_civil_war_events.67.a:9 "Darwazi is the best man for the job."
 afghanistan_civil_war_events.67.b:9 "Charkhi's experience will be vital in rebuilding the forces."
 afghanistan_civil_war_events.67.c:9 "Defer the decision for now."

 afghanistan_civil_war_events.100.t:9 "Afghanistan Collapses into Civil War"
 afghanistan_civil_war_events.100.d:9 "In recent weeks reports coming out of the Kingdom of Afghanistan have talked of largescale revolt against the reforms of their King Amanullah Khan, while the King was away visiting nations in the German sphere. These rumours have now been confirmed, with news that the rebellion has been put down by Minister of War Mohammad Nadir Khan, alongside further reports that the man has seized the throne for himself in the aftermath.\n\nThe past few days have seen Amanullah Khan's return to his now disputed realm, raising an army in an attempt to retake the throne from his former minister, who now styles himself Nadir Shah. Mass fighting in the mountain nation seems inevitable, as these two men and their loyalists vie for the kingdom's crown."
 afghanistan_civil_war_events.100.a:9 "It was bound to happen eventually."

 afghanistan_civil_war_events.101.t:9 "Amanullah Khan Restores Order in Afghanistan."
 afghanistan_civil_war_events.101.body:9 "After months of brutal civil war in Afghanistan, originating from Nadir Shah's attempted seizure of the throne, King Amanullah Khan has seemingly restored his grip over the nation. The failed usurper was killed during the capital's reclamation by Amanite forces, and continued insurrection by remaining rebels has at last come to an end."
 afghanistan_civil_war_events.101.d:9 "$afghanistan_civil_war_events.101.body$\n\nWith his grip on the nation restored, Amanullah Khan has elected to go even further with the reforms that led to his initial ousting, confident that no one stands left to stop him. Policies already announced by the government include a mass expansion of women's rights, further economic self sufficiency, and even national elections of royal approved candidates."
 afghanistan_civil_war_events.101.a:9 "The Afghans should be proud to have him\nas king."
 afghanistan_civil_war_events.101.b:9 "Lets hope he's wrong about having no more enemies..."
 afghanistan_civil_war_events.101.c:9 "An enlightened despot is still a despot."

 afghanistan_civil_war_events.102.t:9 "Amanullah Khan Restores Order in Afghanistan."
 afghanistan_civil_war_events.102.d:9 "$afghanistan_civil_war_events.101.body$\n\nAs part of efforts to restore his grip over the nation, Amanullah Khan has elected to reverse course on the reforms that led to his initial ousting. Significant rollbacks have been announced and already carried out regarding women's rights, government centralisation, and secularisation. Many of the King's former allies now find themselves sidelined or imprisoned, taking the fall for these former policies."
 afghanistan_civil_war_events.102.a:9 "Perhaps tradition is for the best."
 afghanistan_civil_war_events.102.b:9 "The worthless opportunist will get what's coming to him one day."
 afghanistan_civil_war_events.102.c:9 "Autocrats will always abandon their principles before they abandon their power."

 afghanistan_civil_war_events.103.t:9 "Amanullah Khan Killed in Peasant Uprising"
 afghanistan_civil_war_events.103.d:9 "After months of brutal civil war in Afghanistan, the nation's King Amanullah Khan managed to return to power after defeating the usurper Nadir Shah. Despite continued largescale opposition to his reforms, the restored Amanullah chose to press on with them after his restoration, which has proven now to be a fatal mistake.\n\nThe past few weeks have seen greater and greater unrest mounting throughout Afghanistan against his return, including in the capital. Orders to the army to disperse the angry mob were ignored, culminating in them descending upon the royal palace, killing the king as he attempted to escape. It is said that Nadir's brother Hashim arrived in [AFG.Capital.GetCapitalVictoryPointName] not long after, and was proclaimed their new king by those present."
 afghanistan_civil_war_events.103.a:9 "For their sake lets hope the new king can reign in the mob."
 afghanistan_civil_war_events.103.b:9 "A good step to return to Islamic values."

 afghanistan_civil_war_events.104.t:9 "Amanullah Khan Assassinated"
 afghanistan_civil_war_events.104.d:9 "After months of brutal civil war in Afghanistan, the nation's King Amanullah Khan managed to return to power after defeating the usurper Nadir Shah. Rather than continuing on with his unpopular reforms, the restored King elected instead to begin rolling them back, and blaming his former allies for their implementation.\n\nIt seems though that this reversal may now be at an end, with Amanullah having been assassinated by unknown assailants, and his brother Inayatullah succeeding him as king. Some have connected this killing to rumours of a conspiracy by Amanullah's former sidelined allies, yet no concrete evidence of this has so far emerged. Whatever the case, the outcome appears to favour the reformists, with the King already announcing the resumption of past reforms."
 afghanistan_civil_war_events.104.a:9 "Who could possibly be behind this I wonder?"

 afghanistan_civil_war_events.105.t:9 "Nadir Shah Consolidates Power in Afghanistan"
 afghanistan_civil_war_events.105.d:9 "After months of brutal civil war Mohammad Nadir Shah, whose usurpation of the throne instigated the war, has at last consolidated his grip on power. While the former king Amanullah Khan fled the country weeks ago following the defeat of his direct forces, his loyalists continued the fight without him, although they seem to have at last been crushed by the new king.\n\nWith his enemies defeated, Nadir Shah has already begun reshaping Afghanistan towards his vision, and eliminating many of the remnants of the Amanite years. Unlike the former King, many expect this transformation to occur at a very gradual pace, with restraint said to have been Nadir's guiding motto even as Minister of War."
 afghanistan_civil_war_events.105.a:9 "A strong leader is what their nation needs right now."
 afghanistan_civil_war_events.105.b:9 "I hope the worthless upstart gets what's coming to him."
 afghanistan_civil_war_events.105.c:9 "Afghanistan is like watching musical chairs\nfor tyrants."

 afghanistan_civil_war_events.106.t:9 "Nadir Shah Assassinated"
 afghanistan_civil_war_events.106.body:9 "King Mohammad Nadir Shah, who usurpation of the throne led to months of brutal civil war in Afghanistan, has been assassinated by assailants unknown. According to reports, while travelling in a car through the nation's capital an explosion suddenly rang out, killing the king and others alongside him in an instant."
 afghanistan_civil_war_events.106.d:9 "$afghanistan_civil_war_events.106.body$\n\nIn the aftermath Minister of War Mohammad Gul Khan Momand quickly moved to restore order in the capital, and has helped facilitate a swift installation of Nadir's son Zahir Shah as the new king. Although still fearing unrest, it appears as though Momand and the new king's uncles are expected to be able to maintain order together in spite of the sudden chaos that has arisen."
 afghanistan_civil_war_events.106.a:9 "At some point they're going to run out of new kings..."

 afghanistan_civil_war_events.107.t:9 "Republic Declared in Afghanistan by Army Officers"
 afghanistan_civil_war_events.107.d:9 "$afghanistan_civil_war_events.106.body$\n\nIn the aftermath Minister of War Mohammad Gul Khan Momand quickly moved to restore order in the capital, taking control alongside his so-called \"Azadist\" office clique. Rather than hand the crown to Nadir's son Zahir, a republic has been declared, with Momand as its president. These officers are expected now to lead a nationalist-minded republic, and accelerate national reforms further than even those carried out by former king Amanullah Khan."
 afghanistan_civil_war_events.107.a:9 "We wish the new president luck in his endeavours."
 afghanistan_civil_war_events.107.b:9 "Is the lack of a crown on their despot really progress?"

 afghanistan_civil_war_events.108.t:9 "Regional Government Restores Order in Afghanistan"
 afghanistan_civil_war_events.108.d:9 "$afghanistan_civil_war_events.106.body$\n\nA failed attempt to seize power by army officers who declared a republic quickly gave way to chaos as an order to forcefully take over the regional government in [442.Controller.GetVictoryPointName_12717] led to mass mutinies. The officers responsible for the coup reportedly soon fled, leaving the regional government as the last legitimate authority in Afghanistan. Ghaffar Khan, one of the government's leaders, has now been sworn in as president, with the nation turning to him to restore order."
 afghanistan_civil_war_events.108.a:9 "Our support of Ghaffar Khan has at last\npaid off."
 afghanistan_civil_war_events.108.b:9 "Perhaps democracy may finally come\nto the Afghans."
 afghanistan_civil_war_events.108.c:9 "I give them five minutes before they\ncollapse again."
 afghanistan_civil_war_events.108.e:9 "It hopefully won't be long until the socialists around him take over."

 afghanistan_civil_war_events.109.t:9 "[AFG.overlord.GetAdjective] Intervention in Afghanistan"
 afghanistan_civil_war_events.109.d:9 "$afghanistan_civil_war_events.106.body$\n\nA failed attempt to seize power by army officers who declared a republic quickly gave way to chaos as an order to forcefully take over the regional government in [442.Controller.GetVictoryPointName_12717] led to mass mutinies. With help from [AFG.overlord.GetAdjective] troops, militants loyal to Frontier Socialist Party leader Abdur Rahim Popalzai have taken control of the nation. A new socialist government is now being established, securing [AFG.overlord.GetNameDef]'s influence in the region."
 afghanistan_civil_war_events.109.a:9 "Proof socialism can flourish no matter the nation."
 afghanistan_civil_war_events.109.b:9 "Lets hope this intervention ends up being\ntheir grave."

 afghanistan_foreign_policy_events.1.t:9 "Afghanistan Requests Recognition of Imperial Ambitions"
 afghanistan_foreign_policy_events.1.d:9 "Amidst the flurry of telegraphs and letters regarding crucial issues both national and international, occasionally there is one that stands out amongst the rest. We have just received a letter from the government in Afghanistan: they are requesting that we formally recognise them as an empire.\n\nOur relationship with Afghanistan has always been friendly, even amidst the civil wars, changes in leadership, and the potential for our business ventures to be disrupted. Apparently, the recently elected Afghan government has chosen to initiate modernisation programmes even more ambitious than prior ones, and part of their process is international recognition of their status as an empire, hoping to be seen as an equal to the other great modern empires of the world.\n\nDoing so would cost us nothing, aside from potential mockery by those who still see Afghanistan as an irrelevant backwater. What should our course of action be?"
 afghanistan_foreign_policy_events.1.a:9 "We see no issue recognising their claim."
 afghanistan_foreign_policy_events.1.b:9 "Afghanistan? An empire? Really?"

 afghanistan_foreign_policy_events.2.t:9 "[FROM.GetNameDefCap] Agrees to Recognise Us"
 afghanistan_foreign_policy_events.2.d:9 "Great news: [FROM.GetNameDef] has agreed to recognise our claim to be an empire. We have sent them a letter expressing our sincere gratitude for their support, and look forward to continued positive relations.\n\nRecognition of our status as an empire from [FROM.GetNameDef] puts us one step closer to full international acknowledgement of our imperial status!"
 afghanistan_foreign_policy_events.2.a:0 "Fantastique !"

 afghanistan_foreign_policy_events.3.t:9 "[FROM.GetNameDefCap] Refuses to Recognise Us"
 afghanistan_foreign_policy_events.3.d:9 "Unfortunately, [FROM.GetNameDef] has refused to recognise our claim to be an empire. We are unsure of their reasoning: perhaps it is our size, or perhaps it is bias against our nation.\n\nRegardless, this setback will not deter us from achieving the status that we deserve. Maybe another country will see that our request is reasonable, maybe even one of more prestige than [FROM.GetNameDef]."
 afghanistan_foreign_policy_events.3.a:0 "Maudits soient-ils !"

 afghanistan_foreign_policy_events.5.t:9 "Reaching Out to India"
 afghanistan_foreign_policy_events.5.d:9 "The Fourth Anglo-Afghan War reunited us with our Pashtun kinsmen in India, but it was never officially resolved with a treaty. This is due in part to the civil war that was raging in India at the time of the conflict. Now, India has been reunited, and has a singular, recognised government. We have an opportunity here to finally settle the war and officially propose an armistice and treaty. Our diplomats have suggested a number of options for what to offer India in exchange for their formal recognition of our borders.\n\nThe most prominent suggestion is the offering of a formal alliance between Afghanistan and India, perhaps simply defensive in native. Both of our countries are somewhat isolated on the world stage due to our locations in Asia, and our country's stability and experienced military would be a lucrative offer for the fledgling Indian government, looking for both friends and benefactors in diplomacy.\n\nA second alternative would be to put together an economic agreement, ceding India significant economic control over formerly Indian businesses in the Frontier. Although hardly beneficial to us, it will almost certainly invalidate any potential revanchism towards us by them, as they would have little reason to blow up their own investments while allowing us to maintain our neutrality."
 afghanistan_foreign_policy_events.5.a:9 "Prepare to offer them an alliance."
 afghanistan_foreign_policy_events.5.b:9 "Offer an economic agreement in exchange for border recognition."
 afghanistan_foreign_policy_events.5.c:9 "Approach them about a defensive cooperation agreement."

 afghanistan_foreign_policy_events.6.t:9 "The Afghan Offer"
 afghanistan_foreign_policy_events.6.d.body:9 "The Fourth Anglo-Afghan War is regarded by many as a stain on the nation, when the perfidious Afghans attacked India at its weakest and clawed territory away from it. Although we have long mused the day that we could return the favour and march past the Khyber, the recent appointment of an Indophilic government has led to questions of whether or not the hatchet should at last be buried. Clearly having the same idea, a telegram has been received today from [AFG.Capital.GetCapitalVictoryPointName] hoping to formally end hostilities, and recognise the existing de facto border as the legal boundary between us.\n\n"
 afghanistan_foreign_policy_events.6.d.alliance:9 "$afghanistan_foreign_policy_events.6.d.body$Not simply demanding it of us, the Afghans have declared their willingness to enter into a military alliance with our nation, arguing it is only fair that they compensate us by aiding in maintaining Indian order at home and abroad. Their offer is rather tempting, and perhaps their past transgressions can be forgiven in exchange for it."
 afghanistan_foreign_policy_events.6.d.eco:9 "$afghanistan_foreign_policy_events.6.d.body$Not simply demanding it of us, the Afghans have declared their willingness to enter into a mutual defensive alliance with our nation, arguing it is only fair that they compensate us by aiding in maintaining order in the face of aggression towards either party, from both internal and external threats. Their offer is rather tempting, and perhaps their past transgressions can be forgiven in exchange for it"
 afghanistan_foreign_policy_events.6.d.defensive:9 "$afghanistan_foreign_policy_events.6.d.body$Their offer is rather tempting, and perhaps their past transgressions can be forgiven in exchange for it."
 afghanistan_foreign_policy_events.6.a:9 "Agree to their alliance offer."
 afghanistan_foreign_policy_events.6.b:9 "Accept their offer, our claim isn't worth pursuing."
 afghanistan_foreign_policy_events.6.c:9 "Pressure them into an alliance."
 afghanistan_foreign_policy_events.6.e:9 "They have no right to make any demands to us."

 afghanistan_foreign_policy_events.7.t:0 "[FROM.GetNameDefCap] accepte"
 afghanistan_foreign_policy_events.7.d:9 "Great news! [FROM.GetNameDef] has agreed to our offer, and has dropped their claim in exchange for us fulfilling our end of the bargain.\n\nThis is truly a joyful day for our nation. We look forward to a long and prosperous friendship, and can continue the Loy Afghanistan project in peace!"
 afghanistan_foreign_policy_events.7.a:9 "Let us put the past behind us."

 afghanistan_foreign_policy_events.8.t:9 "India Refuses to Negotiate"
 afghanistan_foreign_policy_events.8.d:9 "Despite our very reasonable offer, [FROM.GetNameDef] has turned us down, and have refused to agree to any further negotiations.\n\nThis is a disappointing development indeed: we will continue to pursue a beneficial relationship in the future, but this setback disappoints us greatly."
 afghanistan_foreign_policy_events.8.a:9 "Ah, a shame."

 afghanistan_foreign_policy_events.9.t:9 "India Demands an Alliance"
 afghanistan_foreign_policy_events.9.d:9 "Interestingly, [FROM.GetNameDef] has rejected our offer, and instead has issued a counteroffer: they want a fully operational and equitable alliance between our two countries.\n\nWhile this was not what we set forth in our offer, they still wish to forgo any claims to our frontier, so long as our two countries formally work together militarily and diplomatically. Should we accept?"
 afghanistan_foreign_policy_events.9.a:9 "Fine..."
 afghanistan_foreign_policy_events.9.b:9 "We cannot agree, let them know."

 afghanistan_foreign_policy_events.10.t:9 "Afghanistan Agrees"
 afghanistan_foreign_policy_events.10.d:9 "Great news! Afghanistan has agreed to our counter offer, and is now formalising their alliance with us.\n\nLet our two countries stand strong against any who wish to threaten our sovereignty."
 afghanistan_foreign_policy_events.10.a:0 "Excellent"

 afghanistan_foreign_policy_events.11.t:9 "Afghanistan Refuses"
 afghanistan_foreign_policy_events.11.d:9 "Unfortunately, Afghanistan has turned down our counter offer of an alliance, bringing an end to our negotiations. It is a shame, as it was they who took our territory and then approached us to settle the matter.\n\nNonetheless, it is their loss, and we will continue to pursue alliances elsewhere."
 afghanistan_foreign_policy_events.11.a:9 "These talks are over."

 afghanistan_foreign_policy_events.12.t:9 "Afghanistan Requests Transfer of [410.GetName]"
 afghanistan_foreign_policy_events.12.d:9 "Following our defeat of the perfidious [PER.GetAdjective]s our authority has extended across their entire land, including to the border region of [410.GetName], homeland of many of the Balochs.\n\nOur allies in Afghanistan, seeing the Balochs as their kinsmen, have issued a request that we punish the [PER.GetAdjective] further by transferring the region to them, \"reunifying\" their people together."
 afghanistan_foreign_policy_events.12.a:9 "We won't turn down a chance to further punish the [PER.GetAdjective]."
 afghanistan_foreign_policy_events.12.b:9 "It would be better if it remains with [PER.GetName]."

 afghanistan_foreign_policy_events.13.t:9 "[FROM.GetNameDefCap] Agrees to Transfer [410.GetName]"
 afghanistan_foreign_policy_events.13.d:9 "Seeing our request as reasonable, the [FROM.GetAdjective] government has agreed to transfer [410.GetName] to us.\n\nThe [PER.GetAdjective] regime is unlikely to be happy, but as the saying goes, \"Vae Victis\"."
 afghanistan_foreign_policy_events.13.a:0 "Fantastique."

 afghanistan_foreign_policy_events.14.t:9 "[FROM.GetNameDefCap] Refuses to Transfer [410.GetName]"
 afghanistan_foreign_policy_events.14.d:9 "Seemingly on the grounds of not wishing to upset their loyalists in [PER.GetNameDef], the [FROM.GetAdjective] government has refused our reasonable request for [410.GetName]."
 afghanistan_foreign_policy_events.14.a:0 "Comment osent-ils !"

 afghanistan_foreign_policy_events.15.t:9 "Our Baloch Brothers"
 afghanistan_foreign_policy_events.15.d:9 "It has long been disputed where the Balochs truly belong, with many of them being quick to tell you that they are a distinct people with their own culture and language, but many Pashtuns quick to describe them as simply a large variant of Pashtun instead, while others would describe Pashtuns and Balochs as closely interlinked brothers. Regardless of where they stand, members of all three groups cannot deny that there is a grand desire by both Pashtuns and Balochs to live together in one united homeland, a desire we have at last fulfilled with our liberation of the region.\n\nOne such man from the land of the Balochs who has long desired this unity is Abdul Samad Khan Achakzai, a local activist in [445.controller.GetVictoryPointName_5105]. Since our acquisition of the city his promotion of our nationalist cause has been vital for ensuring the integration of the local people, with his activism proving both popular and effective. Recognised for his talents, there are those in government who believe the man should be further promoted, further aiding us in integrating all of our Baloch territories into the nation."
 afghanistan_foreign_policy_events.15.a:9 "Bring him to [267.controller.GetVictoryPointName_10737], he'll be useful."
 afghanistan_foreign_policy_events.15.b:9 "Give the man a role in managing the region instead."

 afghanistan_foreign_policy_events.16.t:9 "The Struggle in Sind"
 afghanistan_foreign_policy_events.16.d:9 "Rather than justifying our conquest of Sind with grand claims of a united nation, or its liberation from oppressive overlords, we have not been shy that we simply desire the region as a vital sea link to the outside world. The primarily Sindhi population of the region, massively discontent about their occupation by a foreign power, have not taken this annexation laying down. Major protests have already erupted in the city of [443.controller.GetVictoryPointName_3456], hoping to disrupt shipping access and get us to abandon the region.\n\nMany of those protesting have particularly highlighted the idea that their annexation could mean their conscription to fight for the state, vowing to oppose any draft attempts with force. Proposals have therefore been crafted up to exempt the region from any and all forms of conscription, limiting recruitment to being solely voluntary. Although the region's large population could benefit our army greatly, perhaps it is worth the cost of not having to worry about suddenly losing access to our newly acquired ports."
 afghanistan_foreign_policy_events.16.a:9 "Exempt the region from conscription."
 afghanistan_foreign_policy_events.16.b:9 "They're our subjects now, and they have to get used to it."

 afghanistan_foreign_policy_events.17.t:9 "New Land, New Khans"
 afghanistan_foreign_policy_events.17.d:9 "In contrast to the more urban and supposedly \"civilised\" parts of Baluchistan in the north, where the British ruled directly for decades, the south and west of Baluchistan still finds itself under the authority of local princely states. These rulers, having agreed to both British rule and accession to their failed Dominion, are hardly popular amongst the anti-colonialist minded in Afghanistan. Many regard them as little more than British lapdogs, who should have their lands confiscated and redistributed to those who don't collaborate with their slavemasters.\n\nLocally however, these rulers still hold significant sway, with the Khan of Kalat especially having many die hard loyalists who are likely to cause headaches in the event of his deposition. Allowing them to continue in their roles, as was done with the Frontier's princely states, could be vital in ensuring a smooth integration into the nation, if we can stomach working with them any further."
 afghanistan_foreign_policy_events.17.a:9 "Go cry to your British masters, the land is ours."
 afghanistan_foreign_policy_events.17.b:9 "Tolerate their authority, as long as it does not clash with our own."

 afghanistan_foreign_policy_events.18.t:9 "Honouring the Shah of Baluchistan"
 afghanistan_foreign_policy_events.18.d:9 "For decades prior to our annexation of the [410.GetName] region, it could hardly be said to be part of the [PER.GetAdjective] state, being more a self-governing region they falsely claimed to project authority over. Unlike most lands where its people pay tribute or taxes to their owner, the local Balochs were instead paid by the [PER.GetAdjective] state to remain loyal to them, a pathetic position for a supposedly great state to be in. Failure to maintain this payment saw the region simply refuse to recognise their continued authority over it, instead treating their ruler Dost Mohammad Khan Baloch as the Shah of Baluchistan.\n\nUnfortunately for this Shah, it was not long until the [PER.GetAdjective] finally began to restore order, and subsequently began to treat Baluchistan not as the independent state it was but as a rebelling province. They conquered and subjugated the land by force, killing the Shah in the process. For local nationalists Dost Mohammad is a hero to be emulated, who stood up against [PER.GetAdjective] rule for his people's freedom. Coopting his legacy, as the liberators of the Balochs, could certainly ingratiate us with the local population. With our recent history however, perhaps it may be best instead not to promote tribal insurgents as heroes to follow, as we certainly don't need any more of those..."
 afghanistan_foreign_policy_events.18.a:9 "We honour all those who fight for freedom."
 afghanistan_foreign_policy_events.18.b:9 "It'd be unwise to promote tribal insurgents like him."

