 AFG_interim_leadership_mon_sic_desc:9 "§YFondation :§! §Là Kaboul, vilayet de Kaboul, Royaume d'Afghanistan§!"
 AFG_interim_leadership_rep_sic_desc:9 "§YFondation :§! §Là Kaboul, vilayet de Kaboul, République d'Afghanistan§!"
