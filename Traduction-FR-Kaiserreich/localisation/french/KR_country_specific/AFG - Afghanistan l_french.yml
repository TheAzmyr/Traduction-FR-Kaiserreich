 AFG_balance_of_power_category:9 "$AFG_power_balance$"
 AFG_change_decision_currency:9 "Changer la Devise des Décisions"
 AFG_change_decision_currency_desc:9 "Même si le capital politique classique reste toujours un bon moyen de faire avancer les choses, le capital au sens strict utilisé pour nos efforts de réforme pourrait toujours être réquisitionné à la place comme "encouragement" pour réaliser nos ambitions politiques."
 AFG_bribe_tribal_leaders:9 "Soudoyer les Chefs Tribaux"
 AFG_bribe_tribal_leaders_desc:9 "Si les nombreuses réformes du roi trouvent un écho favorable dans les centres urbains du pays, c'est au sein des tribus rurales que se trouvent leurs plus farouches opposants. Même s'il est peu probable que nous parvenions un jour à les rallier véritablement à la cause des réformes, il ne fait aucun doute que quelques fonds détournés du Trésor public et versés dans les coffres des chefs de tribu suffiront à apaiser leur colère."
 AFG_rein_in_the_reformers:9 "Soumettre les Réformateurs"
 AFG_rein_in_the_reformers_desc:9 "Même s'ils bénéficient du soutien du roi, les réformateurs zélés du pays dépassent souvent les bornes, ce qui leur vaut de se mettre beaucoup de monde à dos, ainsi que le roi par association. Il vaudrait mieux, pour l'instant, les freiner, afin qu'ils n'entraînent pas le roi dans leur chute."
 AFG_fund_westernisation_efforts:9 "Financer les Efforts d'Occidentalisation"
 AFG_fund_westernisation_efforts_desc:9 "L'occidentalisation est essentielle pour que l'Afghanistan puisse se hisser au rang des autres grandes nations du monde, malgré les discours alarmistes des détracteurs. Nous devrions affecter davantage de fonctionnaires à la poursuite de ces efforts et faire venir des experts de nos alliés les plus avancés pour nous y aider."

 AFG_state_building_decisions:0 "Construction de l'État"
 AFG_state_building_decisions_desc:9 "Moderniser l'État [ROOT.GetAdjective] suffisamment pour survivre au monde moderne n'est pas chose aisée, surtout sans un mécène étranger fiable. En amassant des §CPoints de Réforme§!, les décisions débloquées par les priorités économiques pourront être complétées, augmentant peu à peu notre niveau d'§YIntégration nationale§! et diminuant les pénalités associées.\n\n§CNiveau national d'Intégration :§! [AFG_GetDecentralisationCurrent][AFG_GetAnger]\n£GFX_production_texticon §CPoints de Réforme :§! [?AFG_reform_points|Y0]"
 AFG_state_building_anger_level:9 "\n§CColère :§! [?AFG_anger_level|Y0%]"

 AFG_monthly_reform_progress_mission:9 "Progrès Mensuel"
 AFG_monthly_reform_progress_mission_desc:9 "L'Afghanistan retrouvera sa grandeur !"

 AFG_improving_the_darulaman_tramway:9 "Améliorer le Tramway de [267.Controller.GetVictoryPointName_12769]"
 AFG_improving_the_darulaman_tramway_desc:9 "Le tramway qui relie [267.Controller.GetVictoryPointName_10737] à [267.Controller.GetVictoryPointName_12769] a été mis en service en 1923. Depuis lors, les deux villes se sont agrandies, ce qui a entraîné une augmentation de la demande en matière de transport entre les deux. Nous allons acquérir de nouvelles locomotives, plus rapides et capables de tracter davantage de voitures de voyageurs, afin d'améliorer les conditions de déplacement."
 AFG_home_building_in_farah:9 "Construction de Logements à [1117.Controller.GetVictoryPointName_2017]"
 AFG_home_building_in_farah_desc:9 "Avec l'urbanisation croissante de la population afghane, des villes telles que [1117.Controller.GetVictoryPointName_2017] auront besoin de davantage de logements. Or, les habitations existantes sont loin d'offrir la sécurité et le confort requis par les normes de construction actuelles. Nous construirons davantage de logements pour les nouveaux arrivants et rénoverons les habitations existantes afin de les adapter au mode de vie moderne."
 AFG_supporting_kunduz_cotton:9 "Soutenir le Coton de [1118.Controller.GetVictoryPointName_12314]"
 AFG_supporting_kunduz_cotton_desc:9 "[1118.Controller.GetVictoryPointName_12314] est l'une de nos provinces les plus prospères, grâce à son industrie cotonnière très rentable. Nous devrions investir dans la culture et la transformation du coton et développer ces activités afin de créer des emplois et de générer davantage de richesse."
 AFG_distributing_paper_afghanis:9 "Distribuer des Afghanis-Papier"
 AFG_distributing_paper_afghanis_desc:9 "Les Afghans comptent souvent sur le troc de marchandises pour acquérir richesse et biens. Cela signifie que, pour beaucoup, leur richesse est liée au bétail, à la terre et à d’autres biens de valeur, ce qui rend les transactions peu faciles. L’introduction de notre monnaie fiduciaire par le biais des banques et l’échange de biens contre de la monnaie simplifieront et accéléreront les transactions, renforçant ainsi notre puissance économique."
 AFG_founding_the_baghlan_sugar_factory:9 "Fondation de la sucrerie de Baghlân"
 AFG_founding_the_baghlan_sugar_factory_desc:9 "Baghlân est la plus grande source afghane de betterave sucrière mais ne dispose d'aucun processus industriel. Nous allons y construire une sucrerie afin de transformer nos récoltes, créer de nouveaux emplois et augmenter l'efficacité de la production sucrière locale."
 AFG_mining_efforts_in_qaramqol:9 "Opérations Minières à Qaramqol"
 AFG_mining_efforts_in_qaramqol_desc:9 "Des études récentes indiquent la présence de gisements de fer dans la province de Qaramqol. Nous devrions développer et exploiter ces gisements afin que l'Afghanistan dispose de l'acier nécessaire à sa modernisation."
 AFG_develop_nangarhar_sugar_plantations:9 "Développer les Plantations Sucrières à Nangarhar"
 AFG_develop_nangarhar_sugar_plantations_desc:9 "Parmi les nombreuses cultures pratiquées à Nangarhar, c'est la canne à sucre qui présente le plus grand potentiel. Délimitons davantage de parcelles dans la région pour les consacrer à la culture de la canne à sucre et alimenter ainsi notre industrie sucrière en pleine expansion."
 AFG_replacing_camels_with_automotives:9 "Remplacer les Chameaux par des Automobiles"
 AFG_replacing_camels_with_automotives_desc:9 "Beaucoup de nos concitoyens utilisent encore le bétail comme moyen de transport, en particulier les chameaux. Pourquoi ? Nous pourrions commencer à vendre des voitures à des prix abordables à nos concitoyens, ce qui favoriserait le développement de notre industrie automobile naissante et moderniserait les transports."
 AFG_growth_of_karakul_herding:9 "Croissance de l'Élevage de Karakul"
 AFG_growth_of_karakul_herding_desc:9 "Les réfugiés d'Asie centrale ont amené avec eux des moutons Karakul, dont les peaux sont très recherchées pour la confection de vêtements traditionnels musulmans, notamment ici en Asie. Nous devrions encourager l'élevage de Karakuls au sein de notre communauté, afin de répondre à la demande croissante en peaux."
 AFG_encourage_mining_along_the_logar:9 "Encourager le Minage sur la Logar"
 AFG_encourage_mining_along_the_logar_desc:9 "Le long de la rivière Logar se trouvent des gisements de cuivre, prêts à être exploités. Il conviendrait de mettre en place des activités minières dans la province, car la rivière constitue un excellent moyen de transport des marchandises jusqu’à [267.Controller.GetVictoryPointName_10737]."
 AFG_improve_connections_to_iran:9 "Améliorer les Connexions avec [PER.GetNameDef]"
 AFG_improve_connections_to_iran_desc:9 "La [PER.GetName] est l'un des plus grands pays de notre région, et il progresse dans la voie de la modernisation, tout comme nous. Nous devrions améliorer les infrastructures reliant nos deux pays, afin que les villes situées à nos frontières puissent se développer."
 AFG_develop_border_towns:9 "Développer les Villes Frontalières"
 AFG_develop_border_towns_desc:9 "Puisque nous sommes enclavés, nos voisins sont notre seul lien avec le reste du monde, en particulier au niveau commercial. Nous devrions développer les villes et villages à nos frontières afin d'encourager les activités commerciales et de fournir en recrues les garnisons"
 AFG_tapping_the_sabzak_pass:9 "Forer le Col de Sabzak"
 AFG_tapping_the_sabzak_pass_desc:9 "Le col de Sabzak serpente à travers le Selseleh-ye Safid Kuh, nom local donné aux montagnes du Paropamisus. Nous pouvons lancer des opérations minières le long du col et traiter le minerai à [415.Controller.GetVictoryPointName_4893]."
 AFG_bridging_the_kunduz:9 "Le Pont sur la [1118.Controller.GetVictoryPointName_12314]"
 AFG_bridging_the_kunduz_desc:9 "La [1118.Controller.GetVictoryPointName_12314] est un fleuve relativement important, et la ville de [1118.Controller.GetVictoryPointName_12314] ne cesse de s'étendre. Si nous construisions un pont sur la rivière [1118.Controller.GetVictoryPointName_12314], nous pourrions étendre la ville de l'autre côté et construire des centrales hydroélectriques entre les deux rives."
 AFG_expand_pashtun_colonisation_efforts:9 "Étendre les Efforts Coloniaux Pachtounes"
 AFG_expand_pashtun_colonisation_efforts_desc:9 "Les régions du nord de l'Afghanistan ont toujours été peuplées par des colons pachtounes. L'extension de ces implantations permettrait à notre peuple d'accéder à des terres arables, tout en réprimant toute agitation de la part des sujets turcophones."
 AFG_welcoming_american_refugees:9 "Accueillir des Réfugiés Américains"
 AFG_welcoming_american_refugees_desc:9 "La guerre civile aux États-Unis a poussé des milliers de personnes à fuir pour échapper à la violence, en particulier celles qui disposent de moyens financiers et de compétences. Pourquoi ne pas recruter certains de ces professionnels et chefs d'entreprise, d'autant plus qu'ils se retrouvent sans domicile ? L'Afghanistan ouvrira volontiers ses portes à ces réfugiés qualifiés, en échange de leur aide à la modernisation du pays."
 AFG_the_kandahar_development_plan:9 "Le Plan de Développement de [1117.Controller.GetVictoryPointName_5064]"
 AFG_the_kandahar_development_plan_desc:9 "[1117.Controller.GetVictoryPointName_5064] est actuellement une ville ancienne qui présente un fort potentiel de modernisation. La transformation de [1117.Controller.GetVictoryPointName_5064] en une ville industrielle modèle devrait être une priorité absolue, notamment pour attirer une main-d'œuvre occidentale."
 AFG_the_grand_mazar_i_sharif_bazaar:9 "Le Grand Bazar de [1118.Controller.GetVictoryPointName_7584]"
 AFG_the_grand_mazar_i_sharif_bazaar_desc:9 "Dans la ville de [1118.Controller.GetVictoryPointName_7584] se trouve la Mosquée Bleue, lieu de repos du calife Ali et lieu de pèlerinage pour les musulmans chiites. Le trafic qui traverse la ville représente des milliers de consommateurs potentiels pour les produits de l'économie locale. Nous devrions construire un Grand Bazar au sein de la ville, afin que les pèlerins puissent acheter des marchandises auprès de nos concitoyens et apporter leur richesse à la ville."
 AFG_carrying_out_a_geological_survey:9 "Mener une Étude Géologique"
 AFG_carrying_out_a_geological_survey_desc:9 "Une grande partie du territoire afghan est constituée de terres dont les caractéristiques sont incertaines. Sont-elles peut-être fertiles pour les cultures ? Renferment-elles peut-être des minerais précieux ou du pétrole ? Nous allons faire réaliser des études sur notre domaine afin d'en évaluer le potentiel de développement."
 AFG_irrigation_renovation_in_wardak:9 "Rénovation de l'Irrigation à Wardak"
 AFG_irrigation_renovation_in_wardak_desc:9 "L'économie locale de la province de Wardak repose sur l'agriculture, mais les méthodes agricoles y sont archaïques. Nous devons moderniser les infrastructures d'irrigation afin d'apporter davantage d'eau dans la région et d'augmenter ainsi les rendements agricoles."
 AFG_bringing_drinking_water_to_nimruz:9 "Amener l'Eau Potable à Nimruz"
 AFG_bringing_drinking_water_to_nimruz_desc:9 "La province de Numruz a toujours été extrêmement isolée du reste du pays, notamment en ce qui concerne l'accès à l'eau. Le forage moderne de puits devrait améliorer l'accès de la population à l'eau, ce qui contribuera à son bien-être et à sa santé."
 AFG_electrification_campaign_in_state:9 "Campagne d'Électrification à [FROM.GetName]"
 AFG_electrification_campaign_in_state_desc:9 "Une grande partie de l'Afghanistan est encore éclairée à la lampe, à une époque où l'électricité ne manque pas. Nous devons électrifier nos communautés, afin que les montagnes afghanes resplendissent de mille feux !"
 AFG_building_shirkat_monopolies:9 "Construire des Monopoles Shirkat"
 AFG_building_shirkat_monopolies_desc:9 "Une Shirkat est une société par actions qui détient le monopole d'un secteur d'activité en Afghanistan. Pour garantir la rentabilité et l'efficacité de nos industries, nous devons contribuer à la création de nouveaux monopoles par le biais de nouvelles Shirkats."
 AFG_branching_out_the_bank:9 "Développer la Banque"
 AFG_branching_out_the_bank_desc:9 "La Da Afghanistan Bank a su, avec succès, favoriser la création d'entreprises et assurer la distribution de monnaie. Il est temps que cette banque dispose de succursales dans tout le pays, afin que chacun puisse profiter des retombées de ces nouveaux capitaux."
 AFG_generalised_investment_schemes:9 "Plans Généraux d'Investissement"
 AFG_generalised_investment_schemes_desc:9 "Beaucoup de nos concitoyens ne disposent pas d'un patrimoine suffisant au-delà de ce que possède leur foyer. En créant les conditions permettant à nos concitoyens de devenir actionnaires, nous pouvons apporter de la richesse à de nombreux foyers et lever des fonds pour poursuivre l'expansion économique."

 AFG_crossroads_of_civilisation_decisions:9 "Carrefour des Civilisations"
 AFG_crossroads_of_civilisation_decisions_desc:9 "Même dans la situation économique précaire que le Lundi Noir a abattu sur le monde, il devrait être possible de soutirer un peu plus de financement de nos alliés autour du globe. Qu'ils soient allemands, russes, japonais ou turcs, leur argent est le bienvenu à [AFG.Capital.GetCapitalVictoryPointName], tout comme les autres genres d'accords qu'ils pourraient nous offrir.\n[GER.AFG_GetForeignInfluenceCountries][RUS.AFG_GetForeignInfluenceCountries][TUR.AFG_GetForeignInfluenceCountries][JAP.AFG_GetForeignInfluenceCountries]"
 AFG_crossroads_of_civilisation_country_influence_desc:9 "\n[THIS.GetFlag] [THIS.GetName] :\nPoints d'influence étrangère : [?AFG.AFG_foreign_influence_@THIS|Y0] |  Part d'influence étrangère : [?AFG.AFG_foreign_influence_share_@THIS|Y0%]"

 AFG_entice_companies:9 "Attirer des Entreprises [FROM.GetAdjective]"
 AFG_entice_companies_desc:9 "Malgré nos avancées militaires, l'Afghanistan souffre d'un manque criant de personnes capables de produire pour l'armée autre chose que des copies bon marché des Martini-Henry. Si nous disposons d’une influence suffisante, nous pourrions peut-être convaincre des entreprises [FROM.GetAdjective] de s’implanter à [267.Controller.GetVictoryPointName_10737], [415.Controller.GetVictoryPointName_4893] et dans d’autres grandes villes, ce qui, espérons-le, nous permettra de répondre aux besoins d’une armée moderne."

 AFG_the_hajigak_mine_concession:9 "La Concession Minière de Hajigak"
 AFG_the_hajigak_mine_concession_desc:9 "Une étude géologique conjointe afghano-allemande a permis de localiser un gisement d'oxyde de fer particulièrement important près du col de Hajigak. Plusieurs entreprises allemandes, dont Krupp et Thyssen, nous ont contactés au sujet de l'octroi d'une concession, comprenant la construction et l'implantation d'aciéries à proximité du gisement. Cette concession permettrait d'alimenter notre économie en acier, dont nous avons grandement besoin, et de créer un nombre considérable d'emplois dans la région."
 AFG_combat_exercises_with_the_russians:9 "Exercices de Combat avec les Russes"
 AFG_combat_exercises_with_the_russians_desc:9 "La Russie ne dispose plus de la même armée qu’autrefois. Grâce aux réformes, celle-ci est désormais bien plus moderne et mieux préparée aux formes innovantes de guerre. Sa proximité avec nous et l’état d’avancement de son armée en feraient des partenaires idéaux pour des exercices de combat, ce qui nous aiderait tous les deux à nous préparer à d’éventuels conflits futurs."
 AFG_inviting_turkish_military_experts:9 "Inviter des Conseillers Militaires Turcs"
 AFG_inviting_turkish_military_experts_desc:9 "Bien que nos forces armées soient en train de réformer leur haut commandement, il nous reste encore du chemin à parcourir. Heureusement, l'amélioration de nos relations avec l'Empire ottoman a porté ses fruits : celui-ci a proposé de nous envoyer des officiers expérimentés en matière de réformes militaires. Nous devrions saisir cette occasion pour contribuer à rendre la structure de nos forces armées plus efficace."
 AFG_commit_to_the_eurasian_rail_scheme:9 "S'engager dans le Projet Ferroviaire Eurasien"
 AFG_commit_to_the_eurasian_rail_scheme_desc:9 "Le Japon nous a contactés au sujet d'une opportunité qui serait bénéfique pour nos deux pays : le Japon souhaite relier physiquement ses territoires d'Asie continentale à l'Europe, afin d'améliorer les échanges commerciaux et les possibilités logistiques. En raison des tensions entre la Russie et le Japon, ce dernier a choisi de contourner complètement la Sibérie, et c'est là que nous entrons en jeu. Contribuer à la construction d'une ligne ferroviaire entre l'Europe et l'Asie améliorerait considérablement nos perspectives commerciales entre les deux continents, sans compter que cela constituerait une source de fierté et d'emplois pour notre population."

 AFG_attract_foreign_investment:9 "Attirer l'Investissement [FROM.GetAdjective]"
 AFG_attract_foreign_investment_desc:9 "L'un des moyens les plus simples de doter notre pays d'infrastructures modernes, d'emplois et d'usines consiste à donner à d'autres pays la possibilité de le faire à notre place. Par exemple, en sollicitant des investisseurs [FROM.GetAdjective], notre gouvernement est rémunéré pour leur permettre de construire des usines, de vendre des marchandises et de former nos troupes. L'inconvénient est que l'Afghanistan deviendra progressivement de plus en plus dépendant du soutien [FROM.GetAdjective], mais si nous mettons en place des mesures visant à limiter leur influence sans les effrayer, tout devrait bien se passer."
 AFG_attract_foreign_investment_GER_desc:9 "$AFG_attract_foreign_investment_desc$"
 AFG_attract_foreign_investment_RUS_desc:9 "$AFG_attract_foreign_investment_desc$"
 AFG_attract_foreign_investment_TUR_desc:9 "$AFG_attract_foreign_investment_desc$"
 AFG_attract_foreign_investment_JAP_desc:9 "$AFG_attract_foreign_investment_desc$"

 AFG_pashtunistan_crisis_decisions:9 "Une Crise au Pachtounistan"
 AFG_pashtunistan_crisis_decisions_desc:9 "S'il y a bien une chose que la situation à Timergara a mise en évidence, c'est que la tolérance officieuse dont bénéficie le gouvernement du Pachtounistan ne peut plus durer. D'une manière ou d'une autre, il faut les intégrer à l'État afghan ; et si Wardak tient à garder la vie sauve, cela doit se faire rapidement, avant que le roi ne décide de commettre une imprudence…\n\nNombre de demandes satisfaites : [?AFG_pashtunistan_points|Y0]"

 AFG_pashtunistan_crisis_reformist_mission:9 "Compromis avec les Khans"
 AFG_pashtunistan_crisis_reformist_mission_desc:9 "Bien que le gouvernement de [442.Controller.GetVictoryPointName_12717] se soit montré disposé à écouter les arguments de Wardak, il a clairement indiqué qu'il ne céderait pas sans condition aux exigences d'Amanullah sans obtenir de concessions et de garanties substantielles. Toutefois, si la région bénéficie d'un soutien suffisant, il pourrait être prêt à faire des concessions, au cas où les exigences initiales de Wardak s'avéreraient trop difficiles à accepter."
 AFG_pashtunistan_crisis_traditional_mission:9 "Négocier avec les Puissants"
 AFG_pashtunistan_crisis_traditional_mission_desc:9 "Le gouvernement local de [442.Controller.GetVictoryPointName_12717] est populaire et puissant, mais il n'est pas le seul acteur de cette crise. Partout dans la Frontière, les tribus locales et les aristocrates détiennent encore un pouvoir considérable. En concentrant nos efforts sur ces hommes, nous pouvons directement saper l'autorité du gouvernement organisé et résoudre rapidement ce conflit."
 AFG_retake_the_frontier_mission:9 "Reprendre la Frontière"
 AFG_retake_the_frontier_mission_desc:9 "Le temps des négociations est révolu depuis longtemps : la seule chose que ces parvenus comprendront vraiment, c'est la pointe d'une baïonnette. Le roi Amanullah a donné l'ordre de prendre le contrôle de [442.Controller.GetVictoryPointName_12717] par la force et de mettre fin à cette mascarade d'autonomie."

 AFG_transfer_control_of_local_transportation_responsibilities:9 "Transférer le Contrôle des Transports Locaux"
 AFG_transfer_control_of_local_transportation_responsibilities_desc:9 "Actuellement, les voies ferrées et les routes reliant [442.Controller.GetVictoryPointName_12717] au reste de l'Afghanistan sont exploitées et gérées par le gouvernement central, y compris en matière de péages. En autorisant [442.Controller.GetVictoryPointName_12717] à percevoir ses propres péages et à réglementer les transports à destination et en provenance de l'État, nous lui accorderons une autonomie considérable en échange de sa loyauté."
 AFG_devolved_taxation:9 "Taxation Dévolue"
 AFG_devolved_taxation_desc:9 "Depuis notre acquisition de la Frontière, notre gouvernement central a imposé [442.Controller.GetVictoryPointName_12717] de manière disproportionnée par rapport au reste du pays, la composition plus urbanisée de cet État étant davantage ciblée par la fiscalité que les tribus et les villages. Accorder au gouvernement de [442.Controller.GetVictoryPointName_12717] la possibilité de percevoir des impôts réduirait nos budgets, mais apaiserait en grande partie le mécontentement de [442.Controller.GetVictoryPointName_12717]."
 AFG_let_peshawar_handle_local_conscription:9 "Laisser [442.Controller.GetVictoryPointName_12717] S'occuper de la Conscription Locale"
 AFG_let_peshawar_handle_local_conscription_desc:9 "Bien que de nombreux habitants de la Frontière s'engagent volontairement dans l'Armée royale, cette région est soumise à la conscription au même titre que le reste du pays. Cela a été source de vives controverses, car les habitants de la Frontière estiment que les habitants des régions centrales négligent leurs propres compatriotes pour privilégier la conscription des habitants de la Frontière ; une perception qui, espérons-le, disparaîtra si la question est traitée au niveau local."
 AFG_tolerate_a_devolved_legal_system:9 "Tolérer un Système Légal Décentralisé"
 AFG_tolerate_a_devolved_legal_system_desc:9 "L'histoire de [442.Controller.GetVictoryPointName_12717], qui a fait partie de l'Inde britannique, explique que son système juridique, marqué à la fois par les influences britanniques et indiennes, risque de s'opposer à l'imposition de notre système judiciaire. Leur accorder l'autonomie nécessaire pour gérer leur propre système juridique compliquerait l'intégration de la province en Afghanistan, mais cela pourrait suffire à éviter une guerre civile à grande échelle."
 AFG_limit_royal_powers_over_appointments:9 "Limiter les Pouvoirs Royaux de Nomination"
 AFG_limit_royal_powers_over_appointments_desc:9 "[442.Controller.GetVictoryPointName_12717] a toujours été dirigé par des responsables issus d'élections locales, et c'est pourquoi le fait que le roi ait imposé ses propres hommes au sein de leur gouvernement a suscité de nombreuses protestations. Peut-être que si l'on limite le choix des personnes que le roi peut nommer à [442.Controller.GetVictoryPointName_12717], cela permettra d'apaiser l'opposition à notre règne."

 AFG_tolerate_expansion_of_the_chitral_bodyguard:9 "Tolérer l'Expansion de la Garde de Chitral"
 AFG_tolerate_expansion_of_the_chitral_bodyguard_desc:9 "L'actuel Mehtar de la province de Chitar est déterminé à renforcer ses effectifs de gardes du corps : en temps normal, cela serait considéré comme une tentative de saper le moral de nos soldats. Heureusement pour le Mehtar, lui et ses gardes du corps constituent un contrepoids parfait à la puissance et à la force des forces [442.Controller.GetVictoryPointName_12717]i. Autoriser cet élargissement permettra de mettre en place une force capable de contrer toute insurrection, même si nous devrons surveiller le Mehtar au cas où il aurait d'autres projets pour son domaine."
 AFG_guarantee_protection_of_hazarewal_land_rights:9 "Garantir la Protection des Droits Fonciers de Hazarewal"
 AFG_guarantee_protection_of_hazarewal_land_rights_desc:9 "La région de Hazarewal abrite une vingtaine de tribus et de communautés composées de divers groupes ethniques, dont plusieurs tribus pachtounes. Il serait possible de convaincre leurs dirigeants de nous soutenir dans notre lutte contre le cosmopolitisme de [442.Controller.GetVictoryPointName_12717], en échange de la reconnaissance de leur droit à posséder les terres sur lesquelles ils résident."
 AFG_grant_conscription_exemptions_for_dir:9 "Accorder des Exemptions de la Conscription aux Dir"
 AFG_grant_conscription_exemptions_for_dir_desc:9 "Le Khan de Dir nous a contactés pour nous faire part d'un dilemme : la population de son royaume est peu nombreuse, et la conscription affecterait donc son peuple de manière disproportionnée par rapport aux autres tribus et dirigeants. Lui accorder une exemption de notre système de conscription le rallierait fermement à notre camp et compromettrait [442.Controller.GetVictoryPointName_12717]."
 AFG_fund_swat_architectural_projects:9 "Financer les Projets Architecturaux de Swat"
 AFG_fund_swat_architectural_projects_desc:9 "Bacha Sahib est le souverain particulièrement compétent de Swat, et il a toujours nourri l'ambition d'étendre son influence. À l'heure actuelle, Swat est largement ignoré par [442.Controller.GetVictoryPointName_12717], qui le considère comme une région arriérée et insignifiante. Aider Sahib à construire de nouvelles infrastructures et de nouvelles colonies pour ses sujets nous permettrait de gagner un allié capable de rallier d'autres chefs tribaux contre le pouvoir central de [442.Controller.GetVictoryPointName_12717]."
 AFG_strengthen_the_nawab_of_ambs_legitimacy:9 "Renforcer la Légitimité du Nabab d'Amb"
 AFG_strengthen_the_nawab_of_ambs_legitimacy_desc:9 "Muhammad Farid Khan Tanoli, le nabab d'Amb, a dû faire face à d'importants troubles suite à son récent accession au trône. L'aider à consolider son pouvoir nous donnerait un avantage sur le [442.Controller.GetVictoryPointName_12717], sans que nous ayons à céder le moindre pouvoir local."
 AFG_funnel_bribes_to_tribal_leaders:9 "Soudoyer les Chefs Tribaux"
 AFG_funnel_bribes_to_tribal_leaders_desc:9 "De nombreux chefs de tribus de la Frontière ont adopté une position neutre dans notre conflit avec [442.Controller.GetVictoryPointName_12717], soit par manque d’intérêt, soit par crainte de compromettre leur propre pouvoir. Heureusement pour nous, bon nombre d’entre eux sont dirigés par des opportunistes, qui ne manqueraient pas de nous soutenir sans hésiter s’ils avaient quelque chose à y gagner. Nous devrions veiller à ce que ces tribus soient dûment récompensées si elles décident de nous soutenir dans cette impasse."

 AFG_afghan_civil_war_decisions:9 "Guerre Civile Afghane"
 AFG_afghan_civil_war_decisions_desc:9 "Le sac de [267.Controller.GetVictoryPointName_12769] et la mort du Prince héritier lors de la visite européenne du Roi a laissé la nation en plein chaos. L'ordre a peut-être été brièvement restauré par §zNadir Khan§!, que beaucoup reconnaissent désormais comme roi, mais le pire des troubles est à venir. §fAmanullah§! est revenu, prêt à se battre pour le trône, commandant ses loyalistes depuis une capitale temporaire à [1117.Controller.GetVictoryPointName_2017].\n\n§CPuissance d'Amanullah :§! [?AFG_strength_level|Y0%]\n$AFG_amanullah_victory_conditions$\n$AFG_nadir_victory_conditions$\n\nLa trésorerie royale possède actuellement £GFX_production_texticon §CPoints de Réforme :§! [?AFG_reform_points|Y0] pour acquérir plus d'aide."

 AFG_civil_war_duration_mission:9 "La Guerre fait Rage"
 AFG_civil_war_duration_mission_desc:9 "Les prétendants ravagent et pillent nos campagnes, et nos forces leur courent après, ayant hâte de finir la guerre. Pourtant, elle continue, dans un équilibre épuisant entre la dévotion des ressources à la victoire ou à la gouvernance. Nous devons agir rapidement pour mettre fin à cette guerre avant que notre nation entière s'effondre."

 AFG_amanullah_makes_his_move:9 "Amanullah Agit"
 AFG_amanullah_makes_his_move_desc:9 "Les informations sont inquiétantes : des réunions au cœur de la nuit, des mouvements de troupes auxquels nous ne nous attendions pas ; Amanullah prépare quelque chose. Si nous n'agissons pas maintenant, nous risquons de voir une nouvelle partie de notre territoire tomber aux mains de ses forces."

 AFG_nadir_makes_his_move:9 "Nadir Agit"
 AFG_nadir_makes_his_move_desc:9 "Nadir, qui a toujours fait l'objet d'une adoration populaire, affiche ostensiblement son pouvoir : serments d'allégeance tribaux, défilés dans les rues de villages reculés et critiques incessantes de la part de nos propres oulémas. Nadir passe à l'action, et si nous ne l'arrêtons pas, nous nous rapprocherons de manière inacceptable de la défaite."

 AFG_launch_an_assault_against_herat:9 "Lancer un Assaut sur [415.Controller.GetVictoryPointName_4893]"
 AFG_launch_an_assault_against_herat_desc:9 "La richesse de [415.Controller.GetVictoryPointName_4893] et sa proximité avec notre frontière signifient que les forces ennemies disposent à la fois des ressources et d'un réseau d'approvisionnement leur permettant de poursuivre leur insurrection. La reconquête de [415.Controller.GetVictoryPointName_4893] affaiblira immédiatement les rebelles."
 AFG_move_towards_mazar-i-sharif:9 "Se Rapprocher de [1118.Controller.GetVictoryPointName_7584]"
 AFG_move_towards_mazar-i-sharif_desc:9 "Il est important de s'emparer de [1118.Controller.GetVictoryPointName_7584], compte tenu de la taille et de l'importance historique de la ville. Si quelqu'un d'autre que nous contrôle [1118.Controller.GetVictoryPointName_7584], cela compromettra notre légitimité auprès des oulémas."
 AFG_take_kunduz:9 "Prendre [1118.Controller.GetVictoryPointName_12314]"
 AFG_take_kunduz_desc:9 "[1118.Controller.GetVictoryPointName_12314] n'est plus défendue que par une force symbolique. Si nous agissons rapidement, nous pourrons facilement reprendre la ville sans rencontrer beaucoup de résistance."
 AFG_storm_kabul:9 "Attaquer [267.Controller.GetVictoryPointName_10737]"
 AFG_storm_kabul_desc:9 "La ville la plus importante de notre pays, [267.Controller.GetVictoryPointName_10737], est enfin à notre portée. Si nous agissons maintenant, nous pourrons porter un coup dur aux rebelles."
 AFG_securing_the_path_to_kabul:9 "Sécuriser le Passage vers [267.Controller.GetVictoryPointName_10737]"
 AFG_securing_the_path_to_kabul_desc:9 "[267.Controller.GetVictoryPointName_10737] est le cœur de notre pays, et c'est donc là que convergent une grande partie de nos infrastructures. Malheureusement, les rebelles en sont conscients, ce qui signifie que nous devons sécuriser les routes menant à [267.Controller.GetVictoryPointName_10737], afin de les empêcher de se diriger tout droit vers la ville."
 AFG_rally_the_amanites:9 "Rallier les Amanites"
 AFG_rally_the_amanites_desc:9 "Partout en Afghanistan, nos alliés attendent leur heure : des officiers de l'armée, des intellectuels visionnaires et des hommes d'affaires, qui reconnaissent tous les bienfaits du règne d'Amanullah. Solliciter leur soutien pourrait nous permettre d'obtenir des fonds supplémentaires, des armes, voire des soldats, afin de mettre fin au règne de cet arriviste de Nadir."
 AFG_promise_payments_to_the_fighters:9 "Promettre de Payer les Soldats"
 AFG_promise_payments_to_the_fighters_desc:9 "Si beaucoup soutiennent notre cause par conviction idéologique, bon nombre de nos combattants ne sont là que pour l'argent. La vie en Afghanistan est rude, et un peu d'argent peut faire toute la différence. Nous promettons une rémunération supplémentaire afin d'attirer davantage de soldats et de renforcer notre moral."

 AFG_drive_loyalists_from_jalalabad:9 "Chasser les Loyalistes de [267.Controller.GetVictoryPointName_12831]"
 AFG_drive_loyalists_from_jalalabad_desc:9 "[267.Controller.GetVictoryPointName_12831] est une cible unique, car il s'agit du lieu de résidence d'Amanullah. La prise de [267.Controller.GetVictoryPointName_12831] mettrait Amanullah en fuite, l'empêchant ainsi de disposer d'une base d'opérations stable."
 AFG_prevent_amanite_attacks_in_the_north:9 "Empêcher les Attaques Amanites au Nord"
 AFG_prevent_amanite_attacks_in_the_north_desc:9 "On signale que les Amanites progressent vers le nord de notre pays. Heureusement, nous disposons encore de garnisons stationnées dans cette région depuis le fiasco avec les Saqqawistes. Nous devrions venir rapidement à bout de tout attaquant qui s'y présenterait."
 AFG_retaking_herat:9 "Reprendre [415.Controller.GetVictoryPointName_4893]"
 AFG_retaking_herat_desc:9 "La chute de [415.Controller.GetVictoryPointName_4893] nous a laissé vulnérables et a donné à Amanullah un nœud où importer des armes. Reprendre la ville devrait être notre priorité absolue."
 AFG_assault_farah:9 "Attaquer [1117.Controller.GetVictoryPointName_2017]"
 AFG_assault_farah_desc:9 "En ce moment, [1117.Controller.GetVictoryPointName_2017] reste largement peu défendue. Si nous agissons rapidement, nous pourrons nous assurer une victoire facile contre les Amanites."
 AFG_crush_scattered_loyalists:9 "Écraser les Loyalistes Dispersés"
 AFG_crush_scattered_loyalists_desc:9 "Nous sommes plus près que jamais de remporter la victoire contre les Amanites ; leurs dirigeants sont désormais à la dérive et ils se dispersent comme des rats. Il est temps pour nous d'éliminer les poches de résistance qui subsistent et de mettre fin à cette folie."
 AFG_reassert_state_control:9 "Reprendre le Contrôle de l'État"
 AFG_reassert_state_control_desc:9 "Maintenant que nous avons renversé Amanullah, il reste beaucoup à faire. Il faut notamment rétablir le recouvrement des impôts et reconstituer l'administration avant de pouvoir proclamer la victoire."
 AFG_keeping_the_army_loyal:9 "Conserver la Loyauté de l'Armée"
 AFG_keeping_the_army_loyal_desc:9 "Une partie de notre succès est attribuée à la loyauté de l'armée envers Nadir. Bien que nous en soyons reconnaissants, la réalité veut qu'elle finira par se retourner contre nous si elle se sent méprisée. Traitons bien nos bienfaiteurs, sous peine de voir notre propre destitution."

 AFG_reach_out_to_backer:9 "Contacter [FROM.GetNameDef]"
 AFG_reach_out_to_backer_desc:9 "Malheureusement, nous ne pouvons pas tracer seuls la voie qui nous mènera à la victoire. Nous devons nous tourner vers [FROM.GetNameDef] pour lui demander des ressources supplémentaires, sinon nous risquons d'affronter les Amanites, qui pourraient bien avoir eux aussi un bienfaiteur."

 AFG_seek_imperial_recognition:9 "Chercher la Reconnaissance Impériale de [FROM.GetNameDef]"
 AFG_seek_imperial_recognition_desc:9 "Même si, au fond de nous, nous savons que l’Afghanistan est devenu un État capable de rivaliser avec des puissances impériales modernes telles que l’Empire ottoman et l’Empire japonais, rares sont ceux, hors de nos frontières, qui ont reconnu notre proclamation selon laquelle le monarque doit être considéré comme un empereur plutôt que comme un simple roi de second rang. Si toutefois nous parvenons à obtenir la reconnaissance de notre revendication par les grandes nations du monde, toutes les autres s’aligneront rapidement sur leur exemple et reconnaîtront le statut qui nous revient de droit."
 AFG_declare_the_second_afghan_empire:9 "Déclarer le Second Empire Afghan"
 AFG_declare_the_second_afghan_empire_desc:9 "Ayant obtenu le soutien des grandes nations du monde, personne ne peut plus sérieusement contester notre statut d’empire moderne. Nous allons désormais occuper la place qui nous revient parmi les grands empires constitutionnels qui ont marqué le XXe siècle, balayant ainsi l’idée dépassée selon laquelle l’Afghanistan ne serait qu’un petit royaume arriéré."

 AFG_acquire_allied_rifles:9 "Acquérir des Fusils [FROM.GetAdjective]"
 AFG_acquire_allied_rifles_desc:9 "Nos amis [FROM.GetAdjective] nous ont apporté un soutien incroyable, en proposant de nous vendre des armes pour nous permettre de poursuivre notre combat. Quelques mots et un échange d'argent devraient nous permettre d'obtenir un nombre considérable de fusils."
 AFG_acquire_allied_support_equipment:9 "Acquérir du Matériel de Soutien [FROM.GetAdjective]"
 AFG_acquire_allied_support_equipment_desc:9 "Notre armée a besoin de matériel médical, de jumelles, de matériel de fortification et bien plus encore. En faisant appel à nos bienfaiteurs [FROM.GetAdjective], nous devrions pouvoir obtenir suffisamment de matériel pour nos forces."
 AFG_acquire_allied_aircraft:9 "Acquérir des Avions [FROM.GetAdjective]"
 AFG_acquire_allied_aircraft_desc:9 "De nos jours, les applications des avions sont infinies. Reconnaissance, transport, bombardement de cibles ennemies… Cela nous donnerait un avantage considérable. Achetons quelques avions auprès des entreprises [FROM.GetAdjective]."
 AFG_acquire_allied_armour:9 "Acquérir des Blindés [FROM.GetAdjective]"
 AFG_acquire_allied_armour_desc:9 "Une pièce d'artillerie motorisée dotée d'un blindage suffisamment résistant pour arrêter les balles, c'est exactement ce dont nous avons besoin. Finis les gaspillages de soldats face aux tirs de mitrailleuses et aux charges massives d'infanterie. Nous devons contacter les entreprises de blindage [FROM.GetAdjective] dès que possible."

 AFG_consolidation_of_the_realm_decisions:9 "Consolidation du Royaume"
 AFG_consolidation_of_the_realm_decisions_desc:9 "Il y a beaucoup à reconstruire et à réaffirmer. Bon nombre de nos fonctionnaires, officiers et responsables administratifs pourraient nourrir des sympathies envers l'ennemi. Nous devons passer au peigne fin l'appareil d'État, tout en renforçant notre propre légitimité auprès de notre peuple."

 AFG_reasserting_amanullahs_authority_mission:9 "Réaffirmer l'Autorité d'Amanullah"
 AFG_reasserting_amanullahs_authority_mission_desc:9 "Depuis la tentative de coup d'État de Nadir, nous devons rappeler à la population qu'Amanullah est bel et bien le roi légitime de l'Afghanistan. Nous devons commencer par nous assurer que l'appareil d'État lui est entièrement fidèle et que personne ne puisse remettre en cause notre autorité."
 AFG_drive_saqqawists_from_the_north:9 "Chasser les Saqqawistes du Nord"
 AFG_drive_saqqawists_from_the_north_desc:9 "Même après la défaite des Saqqawistes, de nombreux membres du mouvement se sont enfuis vers le nord, où les sympathies envers ces bandits restent très vives. Nous devons passer le nord au peigne fin et neutraliser ces chiens enragés avant qu’ils ne puissent reprendre des forces."
 AFG_destroy_saqqawist_holdouts_in_the_south:9 "Détruire les Bastions Saqqawistes du Sud"
 AFG_destroy_saqqawist_holdouts_in_the_south_desc:9 "Il existe encore dans notre pays des villages et des régions occupés par des vestiges du mouvement saqqawiste. L'élimination de ces occupants fera comprendre à notre peuple que nous tenons les rênes du pouvoir et que nous ne tolérerons aucune rébellion."
 AFG_purge_the_palace:9 "Purger le Palais"
 AFG_purge_the_palace_desc:9 "Les ambitions d'occidentalisation d'Amanullah ne lui étaient pas propres, mais résultaient de l'influence de perfides partisans de l'occidentalisation qui résidaient dans son propre palais. Pour remettre le pays sur la bonne voie, nous devons d'abord montrer au peuple que ces flagorneurs occidentaux sacrilèges ont été mis hors d'état de nuire."
 AFG_repeal_the_tazkera:9 "Abolir la Tazkera"
 AFG_repeal_the_tazkera_desc:9 ""S'inscrire à la Tazkera, c'est signer son arrêt de mort" : voilà un dicton courant à propos de notre système d'identification occidentalisé. Maintenant que notre victoire est acquise, nous devons trouver un moyen de montrer au peuple que nous revenons à un mode de gouvernement plus traditionnel : l'abrogation de la Tazkera est un bon début."

 AFG_stabilise_the_realm_mission:9 "Stabiliser le Royaume"
 AFG_stabilise_the_realm_mission_desc:9 "Notre ascension sur le trône a été impromptue, et à cause de la guerre civile, la plupart du pays est abîmée et sans autorité. Nous devons immédiatement commencer à construire notre légitimité et réaffirmer notre règne."
 AFG_hunt_down_dissident_amanites:9 "Chasser les Amanites Dissidents"
 AFG_hunt_down_dissident_amanites_desc:9 "Nous avons beau avoir vaincu Amanullah, nombreux sont les citoyens qui lui sont favorables et qui souhaitent poursuivre ses programmes d'occidentalisation. Pour empêcher tout nouveau sabotage de notre règne, nous devons éliminer tous les partisans d'Amanullah qui se cachent encore parmi nos sujets loyaux."
 AFG_establish_the_society_of_the_ulema:9 "Établir la Société des Oulémas"
 AFG_establish_the_society_of_the_ulema_desc:9 "Au cours de la guerre civile, la plupart des oulémas d'Afghanistan ont soutenu notre lutte. Maintenant que nous sommes victorieux, il est temps de leur rendre la pareille et d'établir un organe pour que les oulémas les plus érudits nous conseillent."

 AFG_restore_the_nations_unity:9 "Restaurer l'Unité Nationale"
 AFG_restore_the_nations_unity_desc:9 "La défaite de [442.Controller.GetVictoryPointName_12717] dans sa guerre d'indépendance a fait naître chez ses habitants un sentiment de rancœur envers notre pays. Si nous voulons un jour concrétiser nos rêves d'un Afghanistan loyal, nous devons tout mettre en œuvre pour réintégrer cette région frontalière rebelle au sein de la nation et aller de l'avant, unis."
 AFG_bring_state_into_the_fold:9 "Amener [FROM.GetName] dans le Giron"
 AFG_bring_state_into_the_fold_desc:9 "Notre récente acquisition de [FROM.GetName] est compliquée par l'incertitude qui règne parmi ses effectifs quant à leur place en Afghanistan. Nous devons donner la priorité à l'intégration de leur administration et de leurs cultures, afin d'éviter de devoir faire face à des tentatives d'indépendance à l'avenir."

 PTH_negotiate_with_india_decision:9 "Négocier avec l'Inde"

### Ideas & Modifiers ###

 AFG_lands_of_villages_tribes_and_faiths:9 "Terre de Villages, de Tribus et de Foi"
 AFG_lands_of_villages_tribes_and_faiths_desc:9 "L'Afghanistan est un pays caractérisé par une importante population tribale, dont une grande partie s'autogouverne de fait, sans que la capitale n'intervienne guère. L'Afghanistan est toutefois également un pays marqué par d'importantes divisions ethniques et un traditionalisme religieux, où les conflits intertribaux et le chauvinisme pachtoune sont monnaie courante. Ces divisions ont longtemps entravé les tentatives de modernisation d'Amanullah, même si cette autonomie tribale a eu pour effet positif que beaucoup ne se souciaient tout simplement pas de ce qui se passait à [267.Controller.GetVictoryPointName_12769], ce qui a grandement profité au roi."
 AFG_spectre_of_rebellion:9 "Spectre de la Rébellion"
 AFG_spectre_of_rebellion_desc:9 "Au cours des premiers mois de 1929, les troupes fidèles au roi Amanullah ont réprimé la plus grande rébellion contre son règne à ce jour, menée par le roi des bandits Habibullāh Kalakāni et sa bande de Saqqawistes. Soutenus par une grande partie de l’ouléma traditionaliste et par les compatriotes tadjiks de Kalakāni, ils avaient pour objectif de renverser Amanullah et de mettre fin à ses années de modernisation. Si Kalakāni a beau avoir péri, la fuite de nombre de ses fidèles vers Boukhara, sous la conduite de son oncle Purdil Khan, est depuis longtemps l’une des épines les plus acérées dans le pied du régime. Même après leur défaite, les craintes liées à la montée en puissance de ce mouvement en exil de l’autre côté de la frontière ont convaincu beaucoup de monde qu’une deuxième rébellion est inévitable."
 AFG_national_integration_modifier:9 "Intégration Nationale"
 AFG_national_integration_modifier_desc:9 "Même après des années de réformes et d'efforts de modernisation, l'Afghanistan reste une région reculée et fortement décentralisée. Si les tentatives visant à renforcer la centralisation et à développer le pays mèneront inévitablement à des conflits, les réformateurs afghans estiment que ces difficultés de croissance doivent être tolérées pour que l'Afghanistan puisse redevenir la grande puissance qu'il mérite d'être."
 AFG_loy_afghanistan:9 "Loy Afghanistan"
 AFG_loy_afghanistan_desc:9 "La Quatrième Guerre anglo-afghane de 1926, ou, pour les Indiens, "l'Occupation afghane de la Frontière", a longtemps été une source de fierté pour la nation afghane. Alors que l'Afghanistan avait conquis sa liberté lors de la troisième guerre, quelques années auparavant seulement, l'incapacité à sécuriser la région aujourd'hui communément appelée Pachtounistan pesait lourdement sur son peuple. Sa conquête, à la suite des rébellions qui ont accompagné l'effondrement du Raj, a effacé cette honte, et même lorsque les gens commencent à remettre en question le gouvernement, ils se souviennent de ce qui a été gagné pour eux.\n\nPour les habitants du Pachtounistan cependant, leur intégration à l'Afghanistan a été douce-amère, la frontière fonctionnant davantage comme une nation indépendante à part entière plutôt que comme une partie d’un tout. Beaucoup de ceux qui acclamaient autrefois les troupes afghanes franchissant la frontière ne voient désormais leurs liens avec [267.Controller.GetVictoryPointName_12769] que comme un fardeau qui les retient, convaincus qu’ils seraient mieux lotis s’ils étaient pleinement indépendants ou intégrés à [HND.GetNameDef]."
 AFG_loy_afghanistan_2:9 "Loy Afghanistan"
 AFG_loy_afghanistan_2_desc:9 "La Quatrième Guerre anglo-afghane de 1926, ou, pour les Indiens, "l'Occupation afghane de la Frontière", a longtemps été une source de fierté pour la nation [AFG.GetAdjective]. Alors que [AFG.GetName] avait conquis sa liberté lors de la troisième guerre, quelques années auparavant seulement, l’incapacité à sécuriser la région aujourd’hui communément appelée Pachtounistan pesait lourdement sur son peuple. Sa conquête, à la suite des rébellions qui ont suivi l’effondrement du Raj, a effacé cette honte, et même lorsque les gens commencent à remettre en question le gouvernement, ils se souviennent de ce qui a été gagné pour eux."
 AFG_stagnant_army:9 "Armée en Stagnation"
 AFG_stagnant_army_desc:9 "Malgré des avancées significatives vers la fin de la dernière décennie, notamment en réponse à la Quatrième Guerre anglo-afghane et aux grandes rébellions contre la couronne qui ont marqué ces années, l’Armée royale afghane a peu à peu commencé à stagner. Ces dernières années, les fonds destinés aux forces armées ont été détournés au profit des projets favoris d’Amanullah, qui occupent désormais une place prépondérante dans les priorités du roi, ce qui a suscité une vive colère parmi les hauts responsables de l’armée. La lueur d’espoir pour eux réside toutefois dans le fait que, ces derniers mois, le roi semble peu à peu se montrer de plus en plus réceptif à leurs demandes de réforme de l’armée, et ils s’attendent à ce que celle-ci démarre à grande échelle dès le début de la nouvelle année."

 AFG_afghan_army_republican:9 "Armée Républicaine Afghane"
 AFG_afghan_army_royal:9 "Armée Royale Afghane"
 AFG_afghan_army:9 "[AFG_GetArmyTitle]"
 AFG_afghan_army_desc:9 "L'[AFG_GetArmyTitle] trouve son origine dans la Troisième Guerre anglo-afghane, en réponse à l'appel au djihad lancé par le roi Amanullah contre les Britanniques. À l'heure actuelle, l'armée accuse un certain retard en matière de capacités militaires, une grande partie de ses responsabilités étant déléguée à diverses milices tribales et forces irrégulières. L'orientation et les priorités de l'armée sont divisées, avec d'un côté les modernistes d'inspiration iranienne et kémaliste, et de l'autre les traditionalistes ayant des liens tribaux. Tant que les conflits internes qui ravagent l'Afghanistan ne seront pas résolus, l'armée ne pourra guère faire mieux que de jouer les seconds rôles face aux milices."
 AFG_modern_logistics_networks:9 "Réseaux Logistiques Modernes"
 AFG_modern_logistics_networks_desc:9 "En raison de l'insuffisance des infrastructures en Afghanistan, l'armée a toujours connu des problèmes d'approvisionnement : de nombreuses garnisons sont sous-équipées et se déplacent lentement, tandis que les forces tribales comptent sur la récupération et le pillage pour s'équiper. Tout cela a changé grâce à de nouveaux investissements dans les infrastructures et à des réformes des réseaux logistiques : désormais, les approvisionnements sont gérés efficacement et empruntent des routes et des voies ferrées modernes pour atteindre leur destination."
 AFG_above_the_land_of_mountains:9 "Par-dessus le Pays des Montagnes"
 AFG_above_the_land_of_mountains_desc:9 "Créée dans le sillage des opérations aériennes britanniques menées pendant la troisième guerre anglo-afghane, l’armée de l’air est la branche la plus avancée des forces armées nationales. Sa mission principale consiste à défendre l’espace aérien afghan, bien qu’elle se révèle particulièrement efficace dans la reconnaissance et la neutralisation de tout bandit ou rebelle potentiel. Pourtant, l’armée de l’air reste à la traîne par rapport aux évolutions mondiales en matière de guerre aérienne. De ce fait, de nombreux officiers au sein de l’armée de l’air souhaitent transformer cette collection d’avions russes et britanniques en une véritable flotte aérienne ; mieux encore, cette armée de l’air tournée vers l’Occident a été un bastion du réformisme pour le pays et continuera probablement à faire pression en faveur de la modernisation."

 AFG_renovated_defence_ministry:9 "Ministère de la Défense Renouvelé"
 AFG_renovated_defence_ministry_desc:9 "Ce qui était autrefois un repaire d'opportunistes et de conscrits tribaux indésirables est devenu un bastion de la guerre. L'augmentation du budget et les réformes militaires ont permis d'offrir de meilleurs salaires aux soldats et de disposer d'officiers plus compétents pour les diriger. Bientôt, l'Afghanistan n'aura plus besoin de compter sur de modestes forces tribales pour se défendre et pourra compter sur sa capacité à répondre sans difficulté à toute menace."
 AFG_directorate_of_intelligence_records_idea:9 "Direction des Dossiers du Renseignement"
 AFG_directorate_of_intelligence_records_idea_desc:9 "La Direction des dossiers du renseignement fait office d'agence de renseignement de [ROOT.GetNameDef], veillant à ce que les dissidents et les indésirables ne menacent pas le régime... à condition qu'elle fasse correctement son travail."

 AFG_replacing_camels_with_automotives_idea:9 "Remplacer les Chameaux par des Automobiles"
 AFG_replacing_camels_with_automotives_idea_desc:9 "De nombreux habitants de [ROOT.GetNameDef] continuent de recourir au bétail pour se déplacer, en particulier aux chameaux. Dans le cadre d'efforts de modernisation à grande échelle, l'État [ROOT.GetAdjective] a commencé à vendre des voitures à des prix abordables à ses sujets, favorisant ainsi le développement de son industrie automobile naissante et la modernisation des transports."
 AFG_electrification_campaign_modifier:9 "Campagne d'Électrification"
 AFG_electrification_campaign_modifier_desc:9 "L'État [AFG.GetAdjective] a lancé une initiative d'envergure dans cette région afin d'assurer à ses citoyens, et surtout à ses infrastructures, un accès adéquat à l'électricité. À terme, on espère que cela favorisera une plus forte croissance industrielle au niveau local."
 AFG_industrial_revolution:9 "Vers une Ère de Prospérité"
 AFG_industrial_revolution_desc:9 "L’Afghanistan était autrefois un pays ravagé par la guerre et appauvri, que les grandes puissances et les pays voisins pouvaient exploiter. Cependant, les récents progrès économiques rapides ont permis à l’Afghanistan de rattraper son retard par rapport à ses homologues occidentaux. Bien qu’il reste encore beaucoup à faire, le pays connaît actuellement un essor économique sans précédent. Des changements socio-économiques majeurs devraient se produire dans les années à venir. Reste à voir si [ROOT.GetLeader] et le gouvernement seront en mesure de pérenniser cette croissance."

 AFG_growth_of_the_economic_ministry:9 "Croissance du Ministère de l'Économie"
 AFG_growth_of_the_economic_ministry_desc:9 "Ce qui n’était au départ qu’une expérience d’interventionnisme économique s’est transformé en une série d’investissements fructueux dans notre propre population. Nos injections de capitaux dans notre économie ont déjà porté leurs fruits : de nouvelles entreprises florissantes, un afflux accru de capitaux étrangers et l’émergence d’une génération d’entrepreneurs, d’industriels et de citoyens issus de la classe moyenne. En conséquence, notre ministère de l’Économie est submergé de retours sur investissement et de candidatures à des emplois, de nombreux Afghans souhaitant contribuer à la croissance de notre économie et se constituer leur propre patrimoine."

 AFG_direction_of_the_education_ministry_idea:9 "Direction du Ministère de l’Éducation"
 AFG_direction_of_the_education_ministry_traditional_desc:9 "Conformément à un décret royal, le ministère de l'Éducation afghan a reçu pour instruction de mettre en place un programme scolaire national qui privilégie avant tout une véritable compréhension de l'islam, le gouvernement se réservant le droit d'en définir le sens. Cette mesure a été saluée par les autorités religieuses du pays, qui y voient la vocation première de l'éducation, malgré l'opposition des réformateurs qui craignent que cela ne fasse prendre du retard à la nation par rapport à ses pairs."
 AFG_direction_of_the_education_ministry_reformist_desc:9 "Conformément à un décret royal, le ministère afghan de l'Éducation a reçu pour instruction de mettre en place un programme scolaire national qui enseigne les concepts laïques au même titre que les concepts religieux, plutôt que de donner la priorité à ces derniers. Si cette mesure a été saluée par les réformistes du pays, qui y voient simplement l'adoption de la norme en vigueur dans le reste du monde islamique moderne, les autorités religieuses l'ont qualifiée de nouvelle étape vers la destruction de l'islam par le socialisme athée."

 AFG_army_desertions:9 "Désertions dans l'Armée"
 AFG_army_desertions_desc:9 "Les mesures prises pour lutter contre le pillage par les troupes afghanes semblent avoir eu l'effet inverse de celui escompté, certains soldats au moral douteux ayant préféré déserter plutôt que de se plier à cette restriction. Certains seraient même allés jusqu'à passer dans le camp adverse, dans l'espoir d'y trouver une situation financière plus lucrative."

 AFG_pashtunistan_autonomous_province_modifier:9 "Province Autonome du Pachtounistan"
 AFG_pashtunistan_autonomous_province_modifier_desc:9 "Depuis son annexion en 1926, la province du Pachtounistan a davantage fonctionné comme un pays au sein d’un pays, ce qui a entraîné des conflits croissants entre [442.Controller.GetVictoryPointName_12717] et [267.Controller.GetVictoryPointName_12769]. Une série de négociations tendues a abouti à la création de la province autonome du Pachtounistan. Une grande partie des responsabilités du gouvernement national a été déléguée directement au Pachtounistan, en échange de la reconnaissance de la souveraineté de l'Afghanistan sur la province. Pour l'instant, seul le temps dira si cette nouvelle union tiendra."
 AFG_pashtunistan_autonomous_province_india_modifier:9 "$AFG_pashtunistan_autonomous_province_modifier$"
 AFG_pashtunistan_autonomous_province_india_modifier_desc:9 "À la suite de la révolte qui a conduit à son indépendance vis-à-vis de [AFG.GetNameDef] et de la victoire de [442.owner.GetNameDef] lors de la Guerre civile indienne, la région du Pathanistan a choisi de se réunifier avec l'Inde plutôt que de conserver son indépendance. Dans le cadre de cet accord, elle continue de bénéficier d'un degré d'autonomie important, le gouvernement local fonctionnant de manière très similaire à ce qu'il faisait auparavant."
 AFG_chitral_treaties_modifier:9 "Traités de Chitral"
 AFG_chitral_treaties_modifier_desc:9 "Face au refus de [442.Controller.GetVictoryPointName_12717] de se plier raisonnablement à cette exigence, le gouvernement national a choisi de négocier à la place avec les tribus locales du Pachtounistan. Les traités de Chitral qui en ont résulté constituent une série d'accords et de privilèges conclus entre les chefs de tribus locaux et [267.Controller.GetVictoryPointName_12769], en échange de leur loyauté et de leur allégeance déclarées envers l'Afghanistan. Espérons que cet arrangement permettra de contrer tout mouvement indépendantiste à notre frontière."

 AFG_king_of_the_army:9 "Roi de l'Armée"
 AFG_king_of_the_army_desc:9 "Le roi Amanullah était peut-être roi d’Afghanistan, mais l’armée obéit à un autre chef. Il a défendu l’armée et ses besoins auprès de cet Amanullah imprudent, a partagé le pain avec ses camarades soldats et les a menés à la gloire au combat. L’armée ne reconnaît que l’autorité de Mohammad Nadir Shah, le véritable roi d’Afghanistan, et se battra volontiers pour s’assurer qu’il conserve son trône."
 AFG_backed_by_the_tribes:9 "Soutenu par les Tribus"
 AFG_backed_by_the_tribes_desc:9 "Les tribus ont été largement ignorées tout au long de la guerre civile et sont donc restées neutres. Nous les avons convaincues de soutenir notre cause et pouvons désormais compter sur leurs effectifs pour mettre définitivement fin à ce conflit."

 AFG_modernising_the_monarchy:9 "Modernisation de la Monarchie"
 AFG_modernising_the_monarchy_desc:9 "Les hésitations d'Amanullah à se défaire des traditions et des idées dépassées sur la manière de régner en tant que monarque se sont avérées désastreuses pour le pays. Il est temps de rectifier le cap et de nous atteler à la construction d'une monarchie fondée sur une gouvernance moderne, une philosophie et l'efficacité, plutôt que de nous complaire dans la peur traditionaliste."
 AFG_the_entrepot_of_the_east:9 "L'Entrepôt de l'Orient"
 AFG_the_entrepot_of_the_east_desc:9 "Les villes afghanes ont toujours été des carrefours pour les voyageurs traversant le continent. Cependant, malgré notre situation géographique privilégiée, nos échanges commerciaux restent très limités par rapport à ceux d’autres pays. Nous devons faire de notre nation une étape prospère pour le commerce international et profiter de la richesse que devrait connaître un pays situé entre la Perse et l’Inde."
 AFG_backroom_funding:9 "Financement Occulte"
 AFG_backroom_funding_desc:9 "Depuis peu, le [AFG.GetRulingParty] reçoit d'importants dons de la part du président de banque Abdul Majid Zabuli, qui semble soutenir les politiques du gouvernement. Bien que cela n'ait été confirmé par personne, nombreux sont ceux qui ont remarqué que, depuis le début de ces dons, le gouvernement a commencé à mettre en œuvre de nombreuses mesures qui, comme par hasard, vont dans le sens des intérêts de Zabuli."

 AFG_the_realm_of_amanullah:9 "Le Royaume d'Amanullah"
 AFG_the_realm_of_amanullah_desc:9 "Les ennemis d'Amanullah ont été dispersés aux quatre vents ou contraints de se soumettre. N'ayant plus aucun obstacle sur son chemin, Amanullah peut désormais remodeler l'Afghanistan comme bon lui semble, pour en faire un pays occidentalisé."
 AFG_healing_the_scars_idea:0 "Guérir les Plaies"
 AFG_healing_the_scars_idea_desc:9 "Le roi Amanullah s'efforce de combler le fossé qui sépare son peuple et de pardonner à ceux qui lui ont fait du tort. Avec le temps, l'Afghanistan pourra peut-être se remémorer ce conflit en sachant que la paix et l'unité sont à portée de main."
 AFG_the_economic_independence_plan_idea:9 "Le Plan d'Indépendance Économique"
 AFG_the_economic_independence_plan_idea_desc:9 "Une dépendance excessive vis-à-vis de la richesse et de la puissance étrangères a conduit l'Afghanistan au bord de l'asservissement. Nos politiques commerciales, nos investissements et notre fiscalité seront repensés afin de contrer la puissance économique de nos créanciers et investisseurs, et de permettre à l'Afghanistan de prendre pleinement le contrôle de sa propre économie."
 AFG_returning_to_tradition:9 "Retour à la Tradition"
 AFG_returning_to_tradition_desc:9 "La folie de l'occidentalisation a failli détruire la nation. Le roi en est conscient et a entrepris de ramener le pays à ses racines culturelles et religieuses. Il n'y a pas lieu de se moderniser inutilement : si la tradition perdure, c'est pour une bonne raison."

 AFG_the_end_of_westernism:9 "La Fin de l'Occidentalisme"
 AFG_the_end_of_westernism_desc:9 "À bas le sacrilège et l'infidélité ! Rejetons le laïcisme et le progressisme ! L'Afghanistan est une nation de l'Oumma, où la charia est la loi du pays, tout comme à l'époque où nos ancêtres se sont installés dans ces montagnes. Nous effacerons cette tache occidentale avec un préjugé vertueux."
 AFG_an_economy_for_the_people:9 "Une Économie pour le Peuple"
 AFG_an_economy_for_the_people_desc:9 "Qui compose la nation afghane ? Ce ne sont ni les entreprises étrangères ni les apostats cupides : ce sont les gens ordinaires, les fidèles parmi nous, ceux qui sillonnent les montagnes et travaillent avec diligence dans nos villages. Notre économie devrait s'articuler autour d'eux, et non autour de ces marchands décadents de la dégénérescence."

 AFG_the_peoples_revolution:9 "La Révolution Populaire"
 AFG_the_peoples_revolution_desc:9 "Notre nation n'est plus entre les mains d'un aristocrate ou d'un monarque. Cette révolution a enfin permis au peuple afghan de prendre le pouvoir. Notre nation sera reconstruite autour du peuple, car c'est lui qui constitue la nation dans son ensemble."
 AFG_the_economic_revitalisation_plan:9 "Le Plan de Revitalisation Économique"
 AFG_the_economic_revitalisation_plan_desc:9 "Notre économie est en recul et en stagnation, et ses seuls bénéficiaires sont des ploutocrates corrompus. Il faut s'engager dans une nouvelle voie de réformes publiques, de réglementations et d'investissements afin d'apporter la prospérité à l'ensemble de notre population, et pas seulement à ceux qui en bénéficient déjà."
 AFG_army_purges:0 "Purges de l'Armée"
 AFG_army_purges_desc:9 "A la suite de l'implication d'officiers militaires dans l'assassinat de Nadir Khan, une purge a été ordonnée par le Premier ministre, remplaçant de nombreux officiers impliqués par ses loyalistes."

 AFG_national_agricultural_plan:9 "Plan Agricole National"
 AFG_national_agricultural_plan_desc:9 "Le gouvernement [ROOT.GetAdjective] a lancé un vaste programme agricole dans la région du Helmand, dans l'espoir d'améliorer l'autosuffisance alimentaire à long terme. Malgré les ressources considérables qui y sont consacrées, ce programme devrait, à terme, s'avérer payant."

 AFG_a_gradual_approach:9 "Une Approche Progressive"
 AFG_a_gradual_approach_desc:9 "Alors qu'Amanullah a mené une politique de modernisation sans se soucier de la stabilité nationale, Nadir reconnaît la valeur de certaines de ses initiatives. Une série de réformes sera mise en place, mais non sans nuance : ces réformes veilleront à ne pas perturber notre société ni notre nation."
 AFG_sensible_economic_reforms:9 "Réformes Économiques Sensées"
 AFG_sensible_economic_reforms_desc:9 "Il est vrai que l'Afghanistan a besoin de s'industrialiser. Cependant, cela ne peut se faire sans tenir compte de la population. Nadir mettra en œuvre des réformes et des investissements économiques qui prendront en considération les citoyens de son royaume, plutôt que de se contenter de créer de la richesse."
 AFG_a_steady_hand:0 "Une Main Ferme"
 AFG_a_steady_hand_desc:9 "La mission d’un roi est de guider son royaume dans la bonne direction. Cela exclut toute réforme inconsidérée, tout programme progressiste ou toute occidentalisation sans fin. Nadir régnera avec sagesse, conseillé par les bonnes personnes, et contribuera à débarrasser la société afghane de tous les maux décadents importés par l’Occident."
 AFG_the_brotherly_camarilla:9 "La Camarilla Fraternelle"
 AFG_the_brotherly_camarilla_desc:9 "Suite au décès de Nadir, notre pays a besoin de sagesse et d'une régence efficace. Heureusement, les oncles du nouveau roi ont formé une camarilla chargée de gouverner tant que le roi est encore jeune. Ce sont eux qui guideront la nation à travers ces temps sombres et mettront en œuvre les changements nécessaires pour le pays."

 AFG_reformation_of_the_afghans:9 "Réforme des Afghans"
 AFG_reformation_of_the_afghans_desc:9 "L'Anjuman-e-Islah-e Afghania, inspiré par un modèle de gouvernance et de politique à la [442.Controller.GetVictoryPointName_12717], dirige désormais le pays. Contrairement à [442.Controller.GetVictoryPointName_12717], une grande partie de l'Afghanistan est conditionnée à fonctionner sous un régime monarchique absolutiste. Si nous voulons être libres, nous devons transformer notre nation en une nation démocratique et libre."
 AFG_reformation_of_the_afghans_6_soccon_desc:9 "Le [AFG.GetRulingParty], inspiré par un modèle de gouvernance et de politique à la [442.Controller.GetVictoryPointName_12717], dirige désormais le pays. Contrairement à [442.Controller.GetVictoryPointName_12717], une grande partie de l'Afghanistan est conditionnée à fonctionner sous un régime monarchique absolutiste. Si nous voulons être libres, nous devons transformer notre nation en une nation démocratique et libre."
 AFG_reformation_of_the_afghans_6_marlib_desc:9 "$AFG_reformation_of_the_afghans_6_soccon_desc$"
 AFG_afghan_swadeshi:9 "Swadeshi Afghan"
 AFG_afghan_swadeshi_desc:9 "Sous la domination britannique, nos voisins indiens ont lancé le mouvement Swadeshi, axé sur l'autosuffisance économique et centré sur les communautés rurales. Appliquer les principes fondamentaux de ce mouvement à notre propre nation contribuera à accroître la richesse de notre peuple sans dépendre des capitaux étrangers."

 AFG_the_unity_of_red_and_green:9 "L'Unité du Rouge et du Vert"
 AFG_the_unity_of_red_and_green_desc:9 "Notre gouvernement est guidé par le socialisme, mais notre peuple est profondément attaché à l'islam. Si certains y voient une crise, nous y voyons la preuve que notre révolution est légitime : quoi de plus divin que de laisser les travailleurs se gouverner eux-mêmes en toute liberté ?"
 AFG_sweepers_led_by_muftis:9 "Des Balayeurs Menés par des Muftis"
 AFG_sweepers_led_by_muftis_desc:9 "Une grande partie de la population afghane est composée de paysans et de travailleurs non industriels, ce qui signifie qu’il n’y a pas suffisamment de classe ouvrière instruite pour diriger le mouvement. Nous nous tournerons donc vers nos pieux frères du Mufti, qui sont sages et connaissent bien le sort des travailleurs, pour qu’ils mènent ce mouvement."
 AFG_traditionalist_resistance:0 "Résistance Traditionaliste"
 AFG_traditionalist_resistance_desc:9 "La mise en place d'un gouvernement socialiste n'a pas été bien accueillie par de nombreux chefs religieux et tribaux afghans, qui ont passé des années à condamner les gouvernements précédents pour ce qu'ils considéraient comme des politiques socialistes. Le refus de coopérer avec le gouvernement est désormais généralisé dans les zones rurales et dans certaines villes, même si l'on ne constate pour l'instant que peu d'enthousiasme pour de nouvelles violences."

 AFG_the_arg_scheme:9 "Le Plan de l'Arg"
 AFG_the_arg_scheme_desc:9 "L'Afghanistan a désespérément besoin de se défendre contre ses ennemis. Même si les montagnes constituent un obstacle redoutable à toute invasion, nous devons réorienter notre économie afin de rendre nos frontières imprenables au-delà de toute imagination, en construisant des fortifications et des ouvrages défensifs."

 AFG_pacifying_the_frontier_idea:9 "Pacification de la Frontière"
 AFG_pacifying_the_frontier_idea_desc:9 "À la suite de la guerre civile, le gouvernement afghan a pris des mesures pour prendre le contrôle total de la Frontière, en recourant à ses forces armées pour atteindre cet objectif."

 AFG_integrating_the_frontier_idea:9 "Intégration de la Frontière"
 AFG_integrating_the_frontier_idea_desc:9 "À la suite de la guerre civile, le gouvernement afghan a pris des mesures pour prendre le contrôle total de la Frontière, en l'intégrant pleinement, sur le plan politique, au cœur du pays."

 AFG_fallout_of_the_mangal_rebellion_idea:9 "Conséquences de la Rébellion de Mangal"
 AFG_fallout_of_the_mangal_rebellion_idea_desc:9 "Dans le but de déclencher une deuxième rébellion de Khost à grande échelle, la tribu des Mangal a profité de la situation au Pachtounistan pour attaquer nos troupes par l'arrière ! Bien que la plupart d'entre eux aient été dispersés, l'ensemble du territoire doit être placé sous bouclage militaire afin d'empêcher un nouveau soulèvement, qui risquerait de disperser excessivement nos forces dans la région de Loya Paktia."

 AFG_conscription_exemptions_granted:0 "Exemption de la Conscription Accordées"
 AFG_conscription_exemptions_granted_desc:9 "La prise de contrôle de la région de [443.Getname] par [AFG.GetNameDef] était principalement motivée par la volonté d'accéder au littoral, sans se soucier guère des habitants de la région. En réponse aux protestations des habitants locaux, l'État [AFG.GetAdjective] a décidé d'exempter cette région de la conscription, ce qui reflète les priorités du gouvernement pour cette zone."

 AFG_remove_pashtunistan_reformist_modifier_decision:9 "[AFG_remove_pashtunistan_reformist_decision_text]"
 AFG_remove_pashtunistan_traditionalist_modifier_decision:9 "[AFG_remove_pashtunistan_traditionalist_decision_text]"
 AFG_remove_pashtunistan_reformist_modifier_decision_desc:9 "[AFG_remove_pashtunistan_reformist_decision_desc_text]"
 AFG_remove_pashtunistan_traditionalist_modifier_decision_desc:9 "[AFG_remove_pashtunistan_traditionalist_decision_desc_text]"

 AFG_remove_pashtunistan_reformist_decision_military:9 "Réaffirmer l'Autorité sur la Frontière"
 AFG_remove_pashtunistan_reformist_decision_democratic:9 "Intégrer l'Administration de la Frontière"
 AFG_remove_pashtunistan_traditionalist_decision_telai:9 "Chasser les Loyalistes Amanites de la Frontière"
 AFG_remove_pashtunistan_traditionalist_decision_seraj:9 "Begin Rolling Back Frontier Privileges"

 AFG_remove_pashtunistan_reformist_decision_military_desc:9 "Le gouvernement de la Frontière a trop longtemps profité de la faiblesse du gouvernement central, et maintenant qu'il ne reste plus aucun ennemi, il est temps d'envoyer les troupes pour le remettre au pas."
 AFG_remove_pashtunistan_reformist_decision_democratic_desc:9 "Si l'autonomie du Pachtounistan a été jugée acceptable jusqu'à présent, maintenant que le gouvernement central a réaffirmé son autorité et entamé un processus de démocratisation progressive, il serait prudent de commencer progressivement à intégrer la Frontière dans ce processus, afin de rendre superflue la poursuite de cette autonomie."
 AFG_remove_pashtunistan_traditionalist_decision_telai_desc:9 "Les accords qu'Amanullah a conclus avec les tribus de la Frontière n'ont été qu'une source de problèmes, les chefs locaux continuant à comploter contre nous dès qu'ils en ont l'occasion. Il faudrait déployer des troupes dès que possible pour chasser ceux qui restent fidèles au roi kafir."
 AFG_remove_pashtunistan_traditionalist_decision_seraj_desc:9 "La nation étant désormais en sécurité et prête à sortir de la stagnation des années passées, il serait prudent de commencer à réaffirmer notre autorité directe sur la Frontière et de réduire les privilèges accordés à ses dirigeants ; car ceux-ci ont pleinement rempli leur rôle."

