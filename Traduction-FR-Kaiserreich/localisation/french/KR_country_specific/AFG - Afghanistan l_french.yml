 AFG_fazl_omar_mojadidi:9 "Fazl Omar Mojadidi"
 AFG_fazl_omar_mojadidi_sic_desc:9 "§YNaissance :§! §Là Kaboul, vilayet de Kaboul, Émirat d'Afghanistan§!\n§YCarrière :§! §LConnu sous un grand nombre de titres : Sher Agha (Seigneur Lion), Hazrat Nur al-Mashayik (Lumière Sainte des Oulémas) ou Mollah du Bazar de Shor (le quartier général de son organisation), Fazl Omar Mojadidi est peut-être l'un des plus puissants non-royaux d'Afghanistan. En tant que chef de l'Ordre Naqshbandi d'Afghanistan, et largement reconnu comme chef de facto de l'establishment islamique, il s'est fréquemment impliqué en politique, même avant son ascension à son poste actuel. Alors que son frère était encore dirigeant, il fit fièrement campagne avec Amanullah Khan pour déclarer la guerre à la Grande-Bretagne, mais se retourna contre le Roi lorsque son programme réformiste s'attaqua au pouvoir des oulémas.\n\nAprès la mort de son frère en 1926, qui propulsa Fazl Omar au rang de chef de sa famille, il n'attendit pas longtemps avant de comploter. Même si rien n'a jamais été prouvé, beaucoup pensent que Mojadidi a eu un rôle dans l'incitation de la rébellion de Khost, mais contrairement aux autres chefs religieux, il échappa à la répression. Finalement obligé, face à la pression du Roi, de quitter Kaboul en 1928, le soulèvement saqqawiste lui permit de retrouver plutôt rapidement son autorité. Une fois encore, même si des rumeurs persistent sur son rôle dans le soulèvement, le Roi manqua de preuves pour agir contre Mojadidi.\n\nDepuis ce jour, il a été une épine dans le pied d'Amanullah et du mouvement réformiste dans son ensemble. Toutes les propositions qui s'approchent ne serait-ce qu'un peu du libéralisme sont condamnées par Mojadidi comme une perversion syndicaliste, et de nombreux fidèles s'en font l'écho. Même si sa position reste pour l'instant inattaquable, Amanullah Khan attend patiemment que Mojadidi fasse une erreur suffisamment importante pour le faire taire pour de bon.§!"

 AFG_abdul_rahman_mahmoodi: "Abdul Rahman Mahmoodi"
 AFG_abdul_rahman_mahmoodi_advisor_desc:9 "§YNaissance :§! §L1909, à Kaboul, vilayet de Kaboul, Émirat d'Afghanistan§!\n§YCarrière :§! §LLa vie d’Abdul Rahman Mahmoodi a été marquée par les épreuves. Né dans un bidonville de Kaboul, il est issu d’une famille d’anciens propriétaires terriens qui avaient perdu leurs terres lorsqu’ils avaient été exilés au Cachemire par Abdur Rahman Khan. Mahmoodi réussit à intégrer une école de médecine, mais la fermeture de celle-ci le contraignit à poursuivre ses études à l’école Rushdia, alors même que sa mère venait de décéder et que son père luttait pour conserver son emploi, confronté à la pauvreté et à une maladie chronique. Pour aider à payer les frais liés à la prise en charge de ses plus jeunes enfants, son père maria Mahmoodi afin d’imposer à la famille de sa femme une obligation financière pour assurer leur bien-être.\n\nAlors qu’il étudiait à l’université de Kaboul en vue d’obtenir un diplôme de médecine, il s’engagea timidement en politique. Finissant par rejoindre les organisations socialistes fortement marginalisées présentes en Afghanistan, il devint notamment un partisan de l’organisation des travailleurs des shirkats textiles de Kandahar et de Qataghan.§!"
 AFG_berthold_albert_speer:9 "Berthold Albert Speer"
 AFG_berthold_albert_speer_advisor_desc:9 "§YNaissance :§! §L19 mars 1905, à Mannheim, district de Mannheim, Grand-Duché de Bade, Empire allemand§!\n§YCarrière :§! §LDiplômé en architecture du Collège technique de Munich cherchant un travail digne d'un tel statut, Berthold Albert Speer est exactement le genre d'homme qu'Amanullah Khan cherchait pour travailler sur Darulaman. Arrivé à Kaboul quelques années après que l'équipe de Walter Harten ait commencé les travaux, ce jeune ambitieux semblait savoir exactement quoi dire pour gagner la faveur du Roi.\n\nImpressionnant constamment Amanullah avec ses idées nouvelles et dessinant ses bâtiments exactement selon la vision du Roi, il est peu surprenant que Speer soit devenu le remplaçant de Harten après le retour de ce dernier en Allemagne. Depuis, il est l'architecte en chef du Roi, et se concentre principalement sur la capitale. Même s'il commence à regretter son foyer, ayant passé tant d'années loin de l'Allemagne, Speer ne peut pas imaginer laisser Darumalan derrière lui, et considère la ville comme son magnum opus.§!"
