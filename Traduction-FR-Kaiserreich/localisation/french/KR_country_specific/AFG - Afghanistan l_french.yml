l_french:

 afghanistan_focus:9 "Arbre de Priorités de l'Afghanistan"

### Parties ###
 AFG_totalist_party:9 "TIP"
 AFG_totalist_party_long:9 "Turkestan Ishchilar Partiyasi (Parti ouvrier du Turkestan)\n§LNe représentant que les vestiges des années de bolchevisme au nord de la frontière, le Parti ouvrier (de Boukhara ou du Turkestan, selon à qui il s'adresse) n'est pas présent physiquement en Afghanistan. Le peu d'influence qu'il possède est principalement dû à ceux qui demeurent sympathiques envers la cause perdue bolchevique au nord, et les quelques impressionnés par l'histoire singulière du communiste pachtoune Nisar Muhammad Yousafzai, qui continue de se battre pour le socialisme des années après la défaite des Rouges.§!"

 AFG_syndicalist_party:9 "PSF"
 AFG_syndicalist_party_long:9 "Parti socialiste de la Frontière\n§LCréé par une scission des révolutionnaires pendjabis de Bhagat Singh, le Parti socialiste de la Frontière continue d'opérer même des années après la révolution indienne et la séparation entre la Frontière et l'Inde. Sous la direction d'Abdur Rahim Popalzai, le soi-disant "Maulana marxiste", le PSF a réussi à grandir ces dernières années. La sorte de socialisme islamique particulière de Popalzai s'est révélée très populaire, en particulier parmi les pauvres de Peshawar, des hommes de la classe inférieure tels que les balayeurs de rue.\n\nMalgré la nature révolutionnaire du parti, il pousse assez peu à la révolution en Afghanistan, le PSF préférant soutenir l'Anjuman-e-Islah-e Afghania modérée, étant donné le nombre d'adhérents aux deux partis et sur les conseils d'alliés indiens. Il conserve cependant un large groupe paramilitaire, composé de Pachtounes locaux et d'exilés indiens. Cette milice prétend défendre la Frontière contre toutes les menaces extérieures, et peut-être même contre le gouvernement afghan si l'occasion devait se présenter.§!"

 AFG_radical_socialist_party:9 "Front National"
 AFG_radical_socialist_party_long:9 "Jabha-ye Melli (Front National)"

 AFG_social_democrat_party:9 "AIA"
 AFG_social_democrat_party_long:9 "Anjuman-e-Islah-e Afghania (Société pour la Réforme des Afghans)$AFG_social_democrat_party_aia_description$"
 AFG_social_democrat_party_aia_description:9 "§L\nL'Anjuman-e-Islah-e Afghania, ou Société pour la Réforme des Afghans, est la plus grande organisation politique de la Frontière afghane. Fondé par Abdul Ghaffar Khan en 1921, lorsque la région était encore indienne, le parti a pris de l'importance après la Quatrième Guerre anglo-afghane. L'incapacité du gouvernement central à gérer correctement la Frontière a permis à Ghaffar Khan de combler le vide, et finalement un gouvernement régional a été formé par Khan et son frère Abdul Jabbar Khan.\n\nDepuis la formation de ce gouvernement, l'AIA a été transformée en un véritable parti politique, attirant du soutien de tous les éléments de la société. Comme son nom le suggère, le but de l'AIA a longtemps été la réforme de la société afghane. Elle pense que la peuple pachtoune doit développer une véritable identité nationale, en abandonnant les pratiques arriérées de violence culturelle, d'extravagance massive et les formes de discrimination de genre.§!"

 AFG_social_liberal_party:9 "Bārakzai-Seraj (Réforme)"
 AFG_social_liberal_party_long:9 "Bārakzai-Seraj (Réforme)\n§LDepuis l'ascension de Dost Mohammad Khan Barakzai en 1826, sa dynastie éponyme a dirigé l'Afghanistan, la branche Seraj étant ses descendants directs. Les soutiens du monarque et de sa dynastie sont divisés entre plusieurs factions, la faction de la Réforme représentant ceux qui plaident pour la modernisation, l'occidentalisation et la démocratisation.\n\nContrairement à la faction Amanite, ces réformateurs ne sont pas des loyalistes inébranlables envers le Roi, et sont principalement concentrés sur la mise en œuvre de véritables réformes, même si le monarque s'y oppose. Les principaux membres de cette faction incluent Abdul Hai Habibi et Abdul Hadi Dawi, ainsi que des membres de la famille royale, comme la princesse Sahira Begum.§!"
 AFG_telai_social_liberal_party:9 "Bārakzai-Telai (Radicaux)"
 AFG_telai_social_liberal_party_long:9 "Bārakzai-Telai (Radicaux)\n§LContrairement à leurs homologues de Seraj, qui soutiennent Dost Mohammad Khan Barakzai, la branche cadette de Telai de la dynastie Barakzai remonte à son frère, le sultan Mohammad Telai Barakzai. Plus connu sous le nom de Musahiban, l'ascension de Nadir sur le trône a enfin donné à Telai l'opportunité de gouverner en son nom.\n\nLa faction dite radicale de la dynastie s'est retrouvée bien plus marginalisée que les réformateurs qui avaient dominé le règne d'Amanullah, mais elle n'est pas complètement absente de la politique. Quelques réformateurs de cette faction ont toujours de la loyauté pour l'ancien Roi, mais beaucoup ont continué de plaider pour une libéralisation agnostique dans la dispute monarchique, espérant mener des réformes peu importe qui possède le trône.§!"
 AFG_amanullah_social_liberal_party:9 "FET (Démocratique)"
 AFG_amanullah_social_liberal_party_tt:9 "Ferqa-i-Esteqlal wa Tajaddod (Parti de l'Indépendance et de la Réforme - Démocratique)"
 AFG_amanullah_social_liberal_party_long:9 "$AFG_amanullah_social_liberal_party_tt$\n§LLe Parti de l'Indépendance et de la Réforme, parfois appelé Parti de la Modernité, est le parti politique principal de l'État afghan, dirigé par le Roi lui-même. Les politiques du parti sont décidées d'en haut par Amanullah, et représentent le point culminant de ses efforts de modernisation et de réforme, même s'il est désormais légitimé par un parlement à l'occidentale plutôt que par des Jirgas traditionnels.\n\nContrairement à la faction Amanite, ces réformateurs ne sont pas des loyalistes inébranlables du Roi, et sont principalement concentrés sur la mise en place de véritables réformes même lorsque le monarque s'y oppose. Les membres importants de cette faction incluent Abdul Hai Habibi et Abdul Hadi Dawi, ainsi que des membres de la famille royale, comme la princesse Sahira Begum.§!"
 AFG_inayatullah_social_liberal_party:9 "Hezb-e Demokratik"
 AFG_inayatullah_social_liberal_party_tt:9 "Hezb-e Demokratik Poshton (Parti démocratique pachtoune)"
 AFG_inayatullah_social_liberal_party_long:9 "$AFG_inayatullah_social_liberal_party_tt$\n§LLe Parti démocratique pachtoune est l'un des deux principaux partis politiques qui ont émergé après la guerre civile et l'introduction du constitutionnalisme. Le parti s'inspire grandement de la tradition des réformes de la décennie dorée, et représente principalement les intellectuels libéraux et la classe moyenne urbaine. La formation du parti ayant débuté à la toute fin du règne d'Amanullah, quand de nombreux anciens alliés du Roi avaient été purgés, la direction du parti est composée de ceux qui étaient trop jeunes ou trop insignifiants pour connaître le même sort ; un problème dont de nombreux réformateurs plus âgés prennent ombrage, alors qu'ils réintègrent la politique afghane.§!"

 AFG_market_liberal_party:9 "Sodāgaro Ittihadie"
 AFG_market_liberal_party_long:9 "Sodāgaro Ittihadie (Union des Marchands)\n§LPlutôt qu'une organisation politique classique, l'union des marchands représente les nombreux intérêts commerciaux de l'Afghanistan, au niveau national comme international. En Afghanistan même, cela inclut des hommes comme Sher Khan Nashir, chef de la Compagnie du Nord, et Abdul Majid Zabuli, chef de la Banque nationale. De nombreuses entreprises étrangères font également commerce en Afghanistan, notamment Siemens-Halske et Krupp, et le rôle vital que ces deux groupes jouent dans l'économie afghane leur a donné un poids politique très important sur les questions de gouvernance nationale.§!"

 AFG_social_conservative_party:9 "Oulémas"
 AFG_social_conservative_party_long:9 "Oulémas\n§LDans la plupart des nations musulmanes, les oulémas ont un poids important à un niveau culturel et politique, même dans les pays où ils ne sont pas directement impliqués dans l'administration. En Afghanistan, même après des années de laïcisation sous Amanullah Khan, on ne peut nier le poids et le pouvoir que les membres du clergé conservent.\n\nLes oulémas afghans dans leur ensemble sont en général opposés à la vague de réformisme qui balaye le pays depuis les années 20, la considérant comme une attaque contre leur pouvoir et un affront envers l'Islam, et ils trouvent donc des alliés chez des hommes plus traditionalistes qui agissent en leur nom. Même s'ils manquent d'un chef officiel, beaucoup considèrent Fazl Omar Mojadidi comme le chef de facto de la religion en Afghanistan, sa famille ayant la mainmise sur la politique religieuse dans la majorité du pays.§!"
 AFG_inayatullah_social_conservative_party:9 "$AFG_republic_social_conservative_party$"
 AFG_inayatullah_social_conservative_party_tt:9 "$AFG_republic_social_conservative_party_tt$"
 AFG_inayatullah_social_conservative_party_long:9 "$AFG_republic_social_conservative_party_long$\n§LLe Parti islamique est l'un des deux principaux partis politiques qui ont émergé après la guerre civile et l'introduction du constitutionnalisme. Bien que réformiste par nature, le parti est défini par sa position de retenue, croyant que les excès du mouvement réformiste ont été la cause fondamentale de la guerre civile, et que la société afghane n'est simplement pas prête pour des positions radicales telles que le dévoilement des femmes ou l'obligation des vêtements occidentaux. Même si la plupart de son soutien reste urbain, et est solidaire d'autres réformistes désabusés, son opposition à ces idées lui ont également attiré un soutien important des traditionalistes ruraux.§!"

 AFG_authoritarian_democrat_party:9 "Bārakzai-Seraj (Amanite)"
 AFG_authoritarian_democrat_party_long:9 "Bārakzai-Seraj (Réforme)\n§LDepuis l'ascension de Dost Mohammad Khan Barakzai en 1826, sa dynastie éponyme a dirigé l'Afghanistan, la branche Seraj étant ses descendants directs. Les soutiens du monarque et de sa dynastie sont divisés entre plusieurs factions, la faction Amanite représentant les soutiens loyalistes d'Amanullah Khan.\n\nBien qu'elle et la faction de la Réforme cherchent la modernisation de l'Afghanistan, les Amanites sont ceux qui désirent qu'elle s'accomplisse selon la volonté du Roi. Parmi les membres les plus importants de cette faction se trouvent les frères Charkhi, plusieurs membres de la famille Tarzi et le ministre Abdul Ahad Wardak.§!"
 AFG_telai_authoritarian_democrat_party:9 "Bārakzai-Telai (Réforme)"
 AFG_telai_authoritarian_democrat_party_long:9 "Bārakzai-Telai (Réforme)\n§LContrairement à leurs homologues de Seraj, qui soutiennent Dost Mohammad Khan Barakzai, la branche cadette de Telai de la dynastie Barakzai remonte à son frère, le sultan Mohammad Telai Barakzai. Plus connu sous le nom de Musahiban, l'ascension de Nadir sur le trône a enfin donné à Telai l'opportunité de gouverner en son nom.\n\nEn contraste par rapport aux autres réformateurs de la faction radicale, la faction réformiste de la dynastie est principalement liée à la clique Azadiste et aux autres loyalistes pro-Telai qui mettent la dynastie d'abord et la réforme ensuite. Même si beaucoup veulent réellement voir l'Afghanistan continuer sur le chemin de la réforme, la plupart sont prêts à mettre leurs désirs de côté pour le bien de la stabilité nationale.§!"
 AFG_inayatullah_authoritarian_democrat_party:9 "Bārakzai-Seraj (Constitutionnaliste)"
 AFG_inayatullah_authoritarian_democrat_party_long:9 "Bārakzai-Seraj (Constitutionnaliste)\n§LDepuis l'ascension de Dost Mohammad Khan Barakzai en 1826, sa dynastie éponyme a dirigé l'Afghanistan, la branche Seraj étant ses descendants directs. Les soutiens du monarque et de sa dynastie sont divisés entre plusieurs factions, la faction Amanite représentant les soutiens loyalistes d'Amanullah Khan.\n\nLa faction constitutionnaliste représente les proches d'Inayatullah Khan qui considèrent que le temps des despotes éclairés touche à sa fin, et que le pouvoir devrait être transféré du monarque à un gouvernement civil.§!"
 AFG_amanullah_authoritarian_democrat_party:9 "FET (Amanite)"
 AFG_amanullah_authoritarian_democrat_party_tt:9 "Ferqa-i-Esteqlal wa Tajaddod (Parti de l'Indépendance et de la Réforme - Amanite)"
 AFG_amanullah_authoritarian_democrat_party_long:9 "$AFG_amanullah_authoritarian_democrat_party_tt$\n§LLe Parti de l'Indépendance et de la Réforme, parfois appelé Parti de la Modernité, est le parti politique principal de l'État afghan, dirigé par le Roi lui-même. Les politiques du parti sont décidées d'en haut par Amanullah, et représentent le point culminant de ses efforts de modernisation et de réforme, même s'il est désormais légitimé par un parlement à l'occidentale plutôt que par des Jirgas traditionnels.\n\nMême si eux et la faction de la Réforme cherchent la modernisation de l'Afghanistan, les Amanites sont ceux qui cherchent à la mettre en œuvre selon la volonté du Roi. Parmi les membres les plus importants de cette faction se trouvent les frères Charkhi, plusieurs membres de la famille Tarzi, ainsi que l'ancien ministre Abdul Ahad Wardak.§!"

 AFG_paternal_autocrat_party:9 "Bārakzai-Seraj (Palais)"
 AFG_paternal_autocrat_party_long:9 "Bārakzai-Seraj (Palais)\n§LDepuis l'ascension de Dost Mohammad Khan Barakzai en 1826, sa dynastie éponyme a dirigé l'Afghanistan, la branche Seraj étant ses descendants directs. Les soutiens du monarque et de sa dynastie sont divisés entre plusieurs factions, la faction du Palais représentant principalement la base de soutien directe du monarque. Cela inclut des membres de la famille royale, ses plus proches ministres et les forces armées, utilisées pour assurer que sa volonté soit faite.§!"
 AFG_telai_paternal_autocrat_party:9 "Bārakzai-Telai (Palais)"
 AFG_telai_paternal_autocrat_party_long:9 "Bārakzai-Telai (Palais)\n§LContrairement à leurs homologues de Seraj, qui soutiennent Dost Mohammad Khan Barakzai, la branche cadette de Telai de la dynastie Barakzai remonte à son frère, le sultan Mohammad Telai Barakzai. Plus connu sous le nom de Musahiban, l'ascension de Nadir sur le trône a enfin donné à Telai l'opportunité de gouverner en son nom.\n\nLa faction du palais de Telai représente la base principale de la dynastie, préférant diriger avec le consentement des élites comme de nombreux dirigeants l'ont fait avant eux. Même si le Roi est l'autorité suprême, les autres membres de la famille royale ont un poids suffisant pour s'assurer que l'ordre se maintienne.§!"

 AFG_national_populist_party:9 "Saqqawistes"
 AFG_national_populist_party_long:9 "Saqqawistes\n§LEn 1929, l'Afghanistan a été secoué par une révolte de grande ampleur contre les réformes d'Amanullah Khan, une armée principalement tadjike étant descendue sur la capitale sous le commandement de Habibullah Kalakani. Ces Saqqawistes, dont le nom provient de son surnom Bacha-e Saqâo, ont bien failli renverser le Roi, mais ont échoué après qu'une contre-attaque ait provoqué sa mort. Ceux qui sont restés loyaux envers la cause ont fui vers l'Asie centrale et suivent désormais l'oncle de Kalakani, Purdil Khan.\n\nMalgré leur échec, les Saqqawistes existent toujours, survivant grâce au mécontentement persistant envers les réformes d'Amanullah et à l'instabilité en Asie centrale ayant suivi le retrait des Russes. Autoproclamé Émir d'Afghanistan, Purdil Khan désire toujours clairement le trône afghan, et peut-être qu'un jour il aura l'occasion de réussir là où Kalakani à échoué.§!"
 AFG_telai_national_populist_party:9 "Bārakzai-Telai (Réactionnaire)"
 AFG_telai_national_populist_party_long:9 "Bārakzai-Telai (Réactionnaire)\n§LContrairement à leurs homologues de Seraj, qui soutiennent Dost Mohammad Khan Barakzai, la branche cadette de Telai de la dynastie Barakzai remonte à son frère, le sultan Mohammad Telai Barakzai. Plus connu sous le nom de Musahiban, l'ascension de Nadir sur le trône a enfin donné à Telai l'opportunité de gouverner en son nom.\n\nLa faction réactionnaire de la dynastie représente le soutien de la base, particulièrement au sein des réactionnaires anti-modernisation qui ont vu la chute d'Amanullah face au Musahiban comme le triomphe de leur cause. Les Telai eux-mêmes ont peu de considération pour ces hommes, les voyant comme de la racaille à dominer plutôt que de leur laisser le contrôle de la politique.§!"
 AFG_seraj_national_populist_party:9 "Bārakzai-Seraj (Réactionnaire)"
 AFG_seraj_national_populist_party_long:9 "Bārakzai-Seraj (Réactionnaire)"

 AFG_inayatullah_national_populist_party:9 "Mellat Gund"
 AFG_inayatullah_national_populist_party_tt:9 "Afghan-e Tevalnupal-e Valsuakaiz-e Gund (Parti social-démocrate afghan)"
 AFG_inayatullah_national_populist_party_long:9 "$AFG_inayatullah_national_populist_party_tt$\n§LLe Parti social-démocrate afghan, plus connu sous le nom de Parti de la Nation, est un groupe mineur composé d'anciens soutiens civils de la dite Clique Azadiste. Comme son prédécesseur, les idéaux principaux du Parti de la Nation sont la modernisation et le nationalisme pachtoune, mais avec un fort courant rhétorique de gauche injecté dans ses politiques. Même s'il s'agit d'un groupe de niche, on dit qu'il cherche le soutien d'Abdul Majid Zabuli, sans succès jusqu'à présent.§!"

 AFG_republic_AIA_totalist_party:9 "AIA (Révolutionnaire)"
 AFG_republic_AIA_totalist_party_tt:9 "Anjuman-e-Islah-e Afghania (Société pour la Réforme des Afghans - Révolutionnaire)"
 AFG_republic_AIA_totalist_party_long:9 "$AFG_republic_AIA_totalist_party_tt$\n§LL'Anjuman-e-Islah-e Afghania, ou Société pour la Réforme des Afghans, est la plus grande organisation politique de la Frontière afghane. Fondé par Abdul Ghaffar Khan en 1921, lorsque la région était encore indienne, le parti a gagné en importance après la Quatrième Guerre anglo-afghane. L'incapacité du gouvernement central à gérer correctement la Frontière a permis à Ghaffar Khan de combler le vide, et un gouvernement régional a été finalement formé par Khan et son frère Abdul Jabbar Khan.\n\nL'établissement d'un gouvernement socialiste en Afghanistan a cependant provoqué des changements drastiques au sein du parti, les frères Khan étant chassés de la direction au profit de Mian Akbar Shah. Contrairement à ses prédécesseurs, Shah voit peu d'intérêt à la non-violence, s'étant engagé pleinement dans l'activité révolutionnaire violente même sous l'autorité de Ghaffar Khan. De même, il a détourné le parti de ses anciens idéaux démocratiques en faveur d'une forme plus autoritaire de socialisme, s'inspirant de l'indien Subhas Chandra Bose, duquel il est proche.§!"

 AFG_republic_syndicalist_party:9 "Hezb-e Watan"
 AFG_republic_syndicalist_party_tt:9 "Hezb-e Watan (Parti de la Patrie)"
 AFG_republic_syndicalist_party_long:9 "Hezb-e Watan (Parti de la Patrie)\n§LÀ la suite de la prise de pouvoir du Parti socialiste de la Frontière, le parti a été réorganisé en une nouvelle entité pan-afghane dans une tentative de se légitimer aux yeux de la population. Le nom patriotique du Parti de la Patrie a été choisi pour résonner auprès des plus nationalistes, et le réformateur modéré Ghulam Mohammad Ghobar a été invité à devenir un président fantoche, le véritable pouvoir demeurant entre les mains du président Popalzai.\n\nL'idéologie du parti a peu changé en comparaison de son incarnation précédente, son idéal premier étant toujours la branche particulière de socialisme islamique de Popalzai. Même s'il est prêt à accomplir ses objectifs à un rythme plus lent, reconnaissant sa position précaire, il ne voudra jamais complètement les abandonner, ce qui l'oppose aux éléments traditionalistes, qui ont passé plus d'une décennie à attiser les craintes autour du syndicalisme.§!"

 AFG_republic_radical_socialist_party:9 "$AFG_republic_syndicalist_party$"
 AFG_republic_radical_socialist_party_long:9 "$AFG_republic_syndicalist_party_long$"

 AFG_republic_social_democrat_party:9 "AIA (G)"
 AFG_republic_social_democrat_party_long:9 "Anjuman-e-Islah-e Afghania (Société pour la Réforme des Afghans - Gauche)$AFG_social_democrat_party_aia_description$"

 AFG_republic_social_liberal_party:9 "AIA (D)"
 AFG_republic_social_liberal_party_long:9 "Anjuman-e-Islah-e Afghania (Société pour la Réforme des Afghans - Droite)$AFG_social_democrat_party_aia_description$"

 AFG_republic_market_liberal_party:9 "Naujawanan Baidar"
 AFG_republic_market_liberal_party_tt:9 "Tehrik-i-Naujawanan Baidar (Mouvement de la Jeunesse éclairée)"
 AFG_republic_market_liberal_party_long:9 "$AFG_republic_market_liberal_party_tt$\n§LLe Mouvement de la Jeunesse éclairée est l'un des principaux partis politiques qui ont émergé à la suite de la formation de la république. Contrairement aux réformateurs de jadis, dont beaucoup se sont retrouvés marginalisés au cours du bref règne de Nadir, la Jeunesse éclairée, comme son nom l'indique, est principalement une nouvelle génération d'hommes politiques. De nombreux diplômés d'Edwardes, d'Islamia et d'institutions étrangères se sont rassemblés sous l'égide du parti, et ses membres ont une grande diversité d'opinions politiques.\n\nL'idéologie principale du parti vient cependant de son chef, Abdul Hai Habibi, qui soutient un programme libéral mais fortement lié au nationalisme pachtoune plutôt qu'aux formes plus pluralistes de libéralisme que l'on retrouve ailleurs dans la sphère politique républicaine.§!"

 AFG_republic_social_conservative_party:9 "Hezb-e Islami"
 AFG_republic_social_conservative_party_tt:9 "Hezb-e Islami Afghanistan (Parti islamique d'Afghanistan)"
 AFG_republic_social_conservative_party_long:9 "$AFG_republic_social_conservative_party_tt$\n§LLe Parti islamique est l'un des principaux partis politiques qui ont émergé après la formation de la république. Bien que réformiste par nature, le parti est défini par sa position de retenue, croyant que les excès du mouvement réformiste ont été la cause fondamentale de la guerre civile, et que la société afghane n'est simplement pas prête pour des positions radicales telles que le dévoilement des femmes ou l'obligation des vêtements occidentaux. Même si la plupart de son soutien reste urbain, et est solidaire d'autres réformistes désabusés, son opposition à ces idées lui ont également attiré un soutien important des traditionalistes ruraux.§!"

 AFG_republic_authoritarian_democrat_party:9 "Hezb-e Khalq (Réformiste)"
 AFG_republic_authoritarian_democrat_party_tt:9 "Hezb-e Khalq-e Afghanistan (Parti populaire d'Afghanistan - Réformiste)"
 AFG_republic_authoritarian_democrat_party_body:9 "\nA la suite du coup d'État de Gul Khan Momand, la clique Azadiste officieuse a été réorganisée en une entité plus légitime, c'est-à-dire le Parti populaire d'Afghanistan. Même si la vision principale du parti reste les idéaux promus par la clique Azadiste : nationalisme pachtoune extrême, modernisation et opposition à la démocratie libérale, le factionalisme a déjà émergé au sein du parti."
 AFG_republic_authoritarian_democrat_party_long:9 "$AFG_republic_authoritarian_democrat_party_tt$§L$AFG_republic_authoritarian_democrat_party_body$\n\nL'aile réformiste du parti est principalement composée des membres les plus modérés, et agit comme un contrepoids face aux loyalistes de Momand et Daoud. Ceux qui vont des nationalistes libéraux comme Sayed Qassem Reshita aux anciens amanites comme Abdul Tawab Khan Tarzi se retrouvent associés à ce groupe d'une manière ou d'une autre, et espèrent voir la nation progresser plutôt que de retomber dans le despotisme arriéré.§!"
 AFG_republic_army_authoritarian_democrat_party:0 "Armée Afghane"
 AFG_republic_army_authoritarian_democrat_party_long:9 "Armée républicaine afghane"

 AFG_republic_paternal_autocrat_party:9 "Hezb-e Khalq (Loyaliste)"
 AFG_republic_paternal_autocrat_party_tt:9 "Hezb-e Khalq-e Afghanistan (Parti populaire d'Afghanistan - Loyaliste)"
 AFG_republic_paternal_autocrat_party_long:9 "$AFG_republic_paternal_autocrat_party_tt$§L$AFG_republic_authoritarian_democrat_party_body$\n\nLa faction loyaliste du parti est le cercle proche de Daoud Khan, parfois désigné sous le nom de Club national. Au cours des années, Daoud a construit une base de fidèles partout dans le pays, y compris des hommes importants comme Abdul Majid Zabuli et Faiz Mohammad Khan Zikeria, et les membres des Loyalistes espèrent diriger la nation sous une forme ou une autre.§!"
 AFG_republic_army_paternal_autocrat_party:0 "Armée Afghane"
 AFG_republic_army_paternal_autocrat_party_long:9 "Armée républicaine afghane"

 AFG_republic_national_populist_party:9 "Hezb-e Khalq (Azadiste)"
