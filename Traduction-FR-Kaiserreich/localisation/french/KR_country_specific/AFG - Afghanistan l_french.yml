 AFG_shah_mahmud_khan:9 "Shah Mahmud Khan"
 AFG_shah_mahmud_khan_sic_desc:9 "§YNaissance :§! §L1890, à Dehra, provinces du Nord-Ouest et d'Oudh, Inde britannique§!\n§YAllégeance :§! §zBranche Telai§!\n§YCarrière :§! §LBien qu'il soit le plus jeune des frères Musahiban, Shah Mahmud Khan n'a pas vécu dans l'ombre de ses aînés. Né à leurs côtés en Inde lors de l'exil de la branche Telai, il passa la plus grande partie de sa jeunesse loin d'Afghanistan, ce qui provoqua un choc culturel lorsque sa famille eut l'autorisation de revenir.\n\nComme ses frères, il choisit rapidement une carrière militaire, mais plutôt que de servir directement dans l'armée il se retrouva vite commandant de la garde royale. Après l'assassinat de l'émir Habibullah et l'ascension d'Amanullah sur le trône, il fut réassigné à des positions de gouverneur dans tout l'Afghanistan, où il apprit bientôt à quel point un esprit ouvert peut être utile s'il est utilisé correctement.\n\nContrairement aux autres frères Musahiban, il a montré assez peu de dédain envers Amanullah et les autres membres de la branche Seraj, peut-être parce qu'il a vécu des années relativement calmes sous son règne. Shah Mahmud n'a jamais eu peur de s'opposer aux opinions parfois hégémoniques de ses frères, et il est assez expressif quant à ses opinions libérales lorsqu'il s'agit des efforts d'occidentalisation d'Amanullah. Cependant, ce serait une erreur fatale de confondre sa nature conciliante avec de la faiblesse, Mahmud pouvant rapidement adopter l'approche de ses frères si la situation l'exige.§!"
 AFG_abdul_ahad_wardak: "Abdul Ahad Wardak"
 AFG_abdul_ahad_wardak_sic_desc:9 "§YNaissance :§! §L1880, à Wardak, vilayet de Kaboul, Émirat d'Afghanistan§!\n§YCarrière :§! §LMembre de la tribu pachtoune Mayar Wardak, issue de la région du même nom, Abdul Ahad Wardak est l'un des hommes les plus puissants d'Afghanistan à ne pas être membre de la dynastie Barakzai. Comme beaucoup des alliés d'Amanullah, son ascension a débuté par son arrestation après avoir été impliqué dans la mort du père d'Amanullah. Ceux qui étaient loyaux envers le nouvel Émir furent rapidement relâchés, et furent assignés à des rôles important convenant à des loyalistes. Après quelques années à divers postes de gouverneur et d'émissaire, le nouveau Roi nomma Wardak ministre de l'Intérieur, lui donnant un rôle vital dans les nombreuses réformes du Roi.\n\nGrâce aux connexions établies dans ses précédents rôles et à des années de travail efficace, Wardak a peu à peu reçu plus de responsabilités de la part du Roi, étant la première personne à laquelle Amanullah s'adresse, quel que soit le sujet. Que ce soit la gestion des affaires intérieures, les relations avec la Frontière, la récolte de fonds pour les réformes ou même la coordination des nouvelles lignes télégraphiques, tout passe par Wardak avant d'être dévolu aux échelons inférieurs. Une telle importance l'a fait connaître par tout le monde dans la nation, même si la renommée est une lame à double tranchant dans un gouvernement qui a autant d'ennemis.§!"
