### Characters ###
 AFG_amanullah_khan: "Amanullah Khan"
 AFG_amanullah_khan_leader_desc:9 "§YNaissance :§! §L1er juin 1892, à Paghman, vilayet de Kaboul, Émirat d'Afghanistan§!\n§YCarrière :§! §LExcepté Babur, qui a jamais apporté plus de changement et de prestige à l'Afghanistan qu'Amanullah Khan ? Monté sur le trône au cœur de la Weltkrieg, Amanullah consolida rapidement son contrôle et lança une attaque contre les Britanniques en soutien aux Puissances centrales. La défaite de l'Entente sécurisa l'indépendance afghane et posa les bases d'une décennie de réforme et de modernisation.\n\nAu cours des années 20, l'Afghanistan devint presque méconnaissable en comparaison de son état précédent, les technologies modernes comme la radio et les automobiles devenant lentement courantes dans les grandes villes. Avec l'aide étrangère, ses forces armées passèrent de milices tribales désaccordées à une force professionnelle, soutenue par une force aérienne nationale. Même face à une opposition farouche, la société afghane fut radicalement réformée, voyant des propositions féministes majeures être mises en place, des mandats légaux envers les coutumes étrangères et le renforcement de l'autorité centrale.\n\nMais aller trop rapidement allait forcément avoir des conséquences, et l'année 1929 vit finalement la décennie dorée toucher à sa fin. La grande révolte Saqqawiste, combinée au chaos que connut en même temps son allié russe, faillit presque mettre fin au règne du Roi. Plutôt que de poursuivre ses grandes ambitions à un rythme effréné, Amanullah fut forcé de se tourner vers l'intérieur et de se concentrer sur la reconsolidation de son pouvoir, sans s'appuyer en permanence sur l'aide étrangère. Même s'il est plus stable, le Roi n'a jamais été satisfait de cet arrangement. La combinaison de la résurgence russe sous Boris Savinkov et de l'augmentation du soutien allemand ont au moins permis au Roi de continuer ses réformes, et il débute 1936 déterminé à ne rien laisser l'arrêter.§!"
 AFG_mohammad_nadir_khan: "Mohammad Nadir Khan"
 AFG_mohammad_nadir_khan_monarch:9 "Mohammad Nadir Shah"
 AFG_mohammad_nadir_khan_leader_desc:9 "§YNaissance :§! §L9 avril 1883, à Dehra, province du Nord-Ouest et de l'Oudh, Inde britannique§!\n§YCarrière :§! §LCouronné dans les flammes de la guerre civile, l'ascension politique de Mohammad Nadir Shah n'a pas été sans heurts. Né de parents exilés et ne pouvant revenir en Inde que sur la volonté de l'Émir, il s'est rapidement retrouvé marginalisé et arrêté à un instant, pour devenir l'instrument le plus vital du Roi l'instant d'après, puis enfin l'instrument de la chute de la branche de Seraj.\n\nA la suite du sac de Darulaman lors de l'absence d'Amanullah, et de la recapture de la ville par Nadir, beaucoup l'ont poussé à s'emparer du trône à la place d'Amanullah. Qu'il désire réellement le trône ou bien qu'il ait simplement cédé à la pression populaire, c'est difficile à dire. Mais peu de gens peuvent nier son désir de conserver ce qui est maintenant sien.\n\nLes mois suivants ont connu des combats renouvelés, Amanullah finissant par échouer à reconquérir son trône et fuyant l'Afghanistan après la défaite de ses loyalistes. Nadir est désormais roi, mais il est assis sur un trône précaire, des ennemis innombrables rôdant toujours dans l'ombre en attendant leur heure. Sera-t-il l'homme qui restaurera enfin la paix et l'ordre en Afghanistan, ou bien simplement le prochain roi à connaître une fin précoce ? Seul le temps le dira.§!"
 AFG_mohammad_nadir_khan_army_chief_desc:9 "§YNaissance :§! §L9 avril 1883, à Dehra, provinces du Nord-Ouest et d'Oudh, Inde britannique§!\n§YAllégeance :§! §zBranche de Telai§!"
 AFG_mohammad_zahir_khan:9 "Mohammad Zahir Khan"
 AFG_mohammad_zahir_khan_monarch:9 "Mohammad Zahir Shah"
 AFG_mohammad_zahir_khan_leader_desc:9 "§YNaissance :§! §L15 octobre 1914, à Kaboul, vilayet de Kaboul, Émirat d'Afghanistan§!\n§YCarrière :§! §LMohammad Zahir Shah n'a pas commencé la guerre civile qui a porté son père sur le trône, mais c'est lui qui a hérité du désordre qu'elle a provoqué. Enfant, il fut éduqué dans des écoles primaires et secondaires à la fois en français et en anglais, avant d'être envoyé dans une académie militaire en Allemagne pour y être formé. Zahir servit comme ministre adjoint à la Guerre et ministre adjoint à l'Éducation sous le règne d'Amanullah, en grande partie à cause de l'insistance de son père, feu Mohammad Nadir Shah.\n\nAprès le Sac de Darumalan, son père s'est autoproclamé Roi, et l'Afghanistan s'est retrouvé entraîné dans une guerre civile tandis qu'Amanullah se battait bec et ongles pour reprendre son trône. Zahir a vaillamment commandé l'infanterie pendant le conflit et a (peut-être par népotisme) reçu de généreuses récompenses après la conclusion de la guerre. Même s'il était officiellement terminé, le conflit avec les Amanites a continué, et Mohammad Nadir Shah a péri dans un bombardement apparemment organisé par leurs vestiges.\n\nBien que Zahir ait été couronné peu après, ce n'est pas lui qui détient le plus de pouvoir. Ses oncles sont tous des hommes ambitieux, à fort caractère, et Zahir, relativement inexpérimenté, s'appuie sur leurs conseils pour gouverner. En effet, il devrait s'écouler du temps avant qu'il ne s'affirme comme un souverain puissant et respecté.§!"
 AFG_mohammad_zahir_khan_commander_desc:9 "§YNaissance :§! §L15 octobre 1914, à Kaboul, vilayet de Kaboul, Émirat d'Afghanistan§!\n§YAllégeance :§! §zBranche de Telai§!"
 AFG_mohammad_hashim_khan: "Mohammad Hashim Khan"
 AFG_mohammad_hashim_khan_monarch:9 "Mohammad Hashim Shah"
 AFG_mohammad_hashim_khan_sic_desc:9 "§YBorn:§! §L1884, in Dehra, North-Western Provinces and Oudh, British India§!\n§YAllegiance:§! §zTelai Branch§!\n§YBackground:§! §LBorn in exile with much of the rest of his brothers after the Second Anglo-Afghan War, Hashim has spent a considerable amount of his life in the shadow of his contemporaries. During the reign of Amanullah Khan, he served in various diplomatic posts, including as Ambassador to Russia in Moscow where he was charged with the objective of maintaining Russian support for Afghan development and protecting the interests of expatriate Afghans educating themselves abroad.\n\nDespite serving Amanullah Khan, he has long harboured hatred for the Seraj branch, originating from the reign of Amanullah's father Habibullah, regarded by Hashim and his family as a brutal tyrant. One such anecdote that bred this resentment was when a trivial issue set the Emir off, leading to him repeatedly and violently slapping Hashim's face until it would swell. His own father and uncle, to avoid offending the King, would join in by beating Hashim to the ground whilst apologising to Habibullah for the pain that his face had caused to his hands. Having to suffer under such rule for so long, Hashim's long-held desire for the ousting of the Seraj branch and the installation of a Musahiban king is hardly a surprise.§!"
 AFG_mohammad_hashim_khan_leader_desc:9 "§YBorn:§! §L1884, in Dehra, North-Western Provinces and Oudh, British India§!\n§YBackground:§! §LBorn in exile with much of the rest of his brothers after the Second Anglo-Afghan War, Hashim has spent a considerable amount of his life in the shadow of his contemporaries. During the reign of Amanullah Khan, he served in various diplomatic posts, including as Ambassador to Russia in Moscow where he was charged with the objective of maintaining Russian support for Afghan development and protecting the interests of expatriate Afghans educating themselves abroad.\n\nDespite serving the former King, he has long harboured hatred for the Seraj branch, originating from the reign of Amanullah's father Habibullah, regarded by Hashim and his family as a brutal tyrant. One such anecdote that bred this resentment was when a trivial issue set the Emir off, leading to him repeatedly and violently slapping Hashim's face until it would swell. His own father and uncle, to avoid offending the King, would join in by beating Hashim to the ground whilst apologising to Habibullah for the pain that his face had caused to his hands.\n\nWith this hatred in his heart, it is to little surprise that Hashim was one of the principal advocates for Mohammad Nadir Shah to proclaim himself King in opposition to Amanullah Khan in the aftermath of Darulaman's devastation. Although Nadir may have been slain soon after, Hashim continued the fight against Amanullah. In coordination with Nadir's remaining forces and the arch-reactionary Mojadidi family, he continued to plot Amanullah's downfall. Organising the peasantry in opposition to Amanullah's modernist policies and forming a united front with the last of the Saqqawists, Darulaman was violently retaken and Amanullah executed. Shortly thereafter, it would be Hashim who would take power.\n\nNow ruling as Mohammad Hashim Shah, Hashim owes his power to the Ulema and the nation's myriad of conservative forces. A man sick of his subordination to another's whims, it is likely that he will chafe against the Mojadidis' hunger for extraordinary influence in time.§!"
 AFG_inayatullah_khan: "Inayatullah Khan"
 AFG_inayatullah_khan_leader_desc:9 "§YBorn:§! §LOctober 1888, in Kabul, Kabul Vilayet, Emirate of Afghanistan§!\n§YBackground:§! §LThe brother of the late Amanullah Khan now sits upon a throne he never wanted. When his father Habibullah Khan was assassinated in 1919 whilst on a hunting trip, Inayatullah had foregone his claim to the throne in favour of his uncle, Nasrullah Khan, who would only hold power for a week before abdicating in favour of Habibullah's third son Amanullah Khan after it became clear that the ambitious conspirator was preparing to take the throne anyway. All the same as Nasrullah's takeover, Inayatullah had no intention to contest Amanullah's coronation either, appraising the throne as an inevitable death sentence he did not want to subject himself to.\n\nAvoidance of the throne aside, Inayatullah remained involved in politics during the reigns of his father and younger brother, and would enjoy dressing in extravagant Western-style suits as he lived a comfortable life under the auspices of Amanullah. He would not imagine the carnage that would ensue after Amanullah's 1938 tour in Europe and the subsequent burning of Darulaman and death of the Crown Prince. Laying low as Mohammad Nadir Shah proclaimed himself King of Afghanistan in an effort to usurp the throne, Inayatullah would see his brother retake the country and at that point had believed the troubles were over.\n\nAmanullah's tactical pivot to the right in an effort to rebuild his image with conservatives would lead to much trifling among the Reformist establishment that he had cultivated up to that point. The impending showdown would not come to pass quite as anyone had expected, as Amanullah was shot dead by an unknown assailant within the palace. Awoken from his slumber to learn of his brother's death, Inayatullah was rushed to his coronation despite rumours that he had been involved in a conspiracy by the Reformists to take the throne from his brother. Now, as he grants amnesty to the modernisers that Amanullah had already begun to scapegoat, he intends to take a backseat for the remainder of his time as King, reforming Afghanistan into a true constitutional monarchy where the running of the nation is relegated to people who have the ambition to lead.§!"
 AFG_inayatullah_khan_advisor_desc:9 "§YBorn:§! §LOctober 1888, in Kabul, Kabul Vilayet, Emirate of Afghanistan§!\n§YBackground:§! §LFor many years Inayatullah Khan has been in the shadow of his brother Amanullah, yet it is a position in which he is comfortable. When his father Habibullah Khan was assassinated in 1919 whilst on a hunting trip, Inayatullah was expected by many to take the throne. Instead he surrendered his claim to the throne in favour of his uncle, Nasrullah Khan, who however would only hold power for a week before abdicating after a coup by Habibullah's third son Amanullah Khan. All the same as Nasrullah's takeover, Inayatullah had no intention to contest Amanullah's coronation either, appraising the throne as an inevitable death sentence he did not want to subject himself to.\n\nAvoidance of the throne aside, Inayatullah has not shied away from politics, and has become quite a part of the nation's liberal elite. He has also similarly not shied away from having a strong public image, enjoying to dress in extravagant Western-style suits, and promoting their adoption alongside his brother. Although such excess has its detractors, prince Inayatullah's level headed nature and idealism has left many to wonder how Afghanistan may have looked if he hadn't declined the crown.§!"
 AFG_mohammad_ghobar: "Ghulam Mohammad Ghobar"
 AFG_mohammad_ghobar_leader_desc:9 "§YBorn:§! §L1897, in Kabul, Kabul Vilayet, Emirate of Afghanistan§!\n§YBackground:§! §LA young Ghulam Mohammad Ghobar spent much of his time not in his birthplace of Kabul, but in the southern regions of Kandahar and Herat where his native language of Persian was spoken. Growing up with a fiercely intellectually curious mind, with the support of his family Ghobar entered the literary field and soon became an accomplished poet and writer. An initial support of Amanullah's fervent modernism, Ghobar served as chief of police in Kabul from 1920-1921 and as editor of the Afghan Star newspaper at the same time. A few years later, he entered the diplomatic service, all the while promoting translinguistic and transethnic Afghan unity.\n\nThe period of enlightenment that sustained Ghobar's good graces with the government ended towards the end of the decade, as Amanullah Khan began to further involve business magnates and monopolies in his government. His dissidence against this course of action earned him the enmity of the King and enduring a subsequent stint in prison, after which he was subject to continual persecution. Despite this, he would remain involved in several literary societies and through his political journalism espouse social-democratic views.\n\nHaving witnessed his homeland tear itself apart, from Purdil Khan to Nadir Shah and Amanullah Khan to Mohammad Gul Khan Momand; his distress would see relief when Abdur Rahim Popalzai would personally contact him to serve as President of a socialist republic, aiming to moderate its public image. Dutifully accepting the obligation to restore stability to Afghanistan under the auspices of progress, he has been more than willing to accept Popalzai's radical agenda, wishing to put the nation and its people first despite ideological disagreements.§!"
 AFG_abdul_hai_habibi:9 "Abdul Hai Habibi"
 AFG_abdul_hai_habibi_leader_desc:9 "§YBorn:§! §L1910, in Kandahar, Kandahar Vilayet, Emirate of Afghanistan§!\n§YBackground:§! §LBorn to an enslaved Hazara mother and a Kakar Pashtun father, Habibi's early life was fraught with troubles. Despite the early death of his father during his childhood, Habibi diligently studied at the mosques of Kandahar and attended schooling at the Shalamar Primary School at age 11. Four years later, he graduated and became a teacher in the same school at the young age of 15. Continuing his studies, he spent much of the 20s learning Mathematics, Islamic Philosophy, Journalism and the discipline of History. In 1927 he became deputy editor of the Toloo-e Afghan newspaper and later the chief editor in 1931.\n\nHis political thought would evolve into a blend of Western-style Liberalism and Pashtun Nationalism, becoming one of the primary intellectual figures associated with Amanullah Khan's Reformist allies. With the political landscape in Afghanistan entering flux as the 1930s progressed, Habibi formed the Tehrik-i-Naujawanan Baidar (Movement of Enlightened Youth), a political party which shall serve as the vehicle of Habibi's political thought. Now that he has found himself in a position of political power, it is expected that he will feverishly pursue his agenda in an effort to pull Afghanistan into the modern age alongside other contemporary nation-states.§!"
 AFG_abdul_hai_habibi_advisor_desc:9 "§YBorn:§! §L1910, in Kandahar, Kandahar Vilayet, Emirate of Afghanistan§!\n§YBackground:§! §LBorn to an enslaved Hazara mother and a Kakar Pashtun father, Habibi's early life was fraught with troubles. Despite the early death of his father during his childhood, Habibi diligently studied at the mosques of Kandahar and attended schooling at the Shalamar Primary School at age 11. Four years later, he graduated and became a teacher in the same school at the young age of 15. Continuing his studies, he spent much of the 20s learning Mathematics, Islamic Philosophy, Journalism and the discipline of History. In 1927 he became deputy editor of the Toloo-e Afghan newspaper and later the chief editor in 1931.\n\nHis political thought would evolve into a blend of Western-style Liberalism and Pashtun Nationalism, becoming one of the primary intellectual figures associated with Amanullah Khan's Reformist allies. Aiming to find himself in government, he hopes to fervently push his agenda in an effort to pull Afghanistan into the modern age alongside other contemporary nation-states.§!"
 AFG_abdul_hadi_dawi: "Abdul Hadi Dawi"
 AFG_abdul_hadi_dawi_leader_desc:9 "§YBorn:§! §L1894, in Kabul, Kabul Vilayet, Emirate of Afghanistan§!\n§YBackground:§! §LFor a very long time, Abdul Hadi Dawi's presence in Afghanistan has placed him at the enmity of both extremes of the Afghan political spectrum. Born to a Daavi Afghan family in Kabul, Dawi graduated from the Habibia High School in 1912, and became a member of Reformist anti-Habibullah Khan groups, facing a stint in prison for his troubles. Seven years after the accession of Amanullah Khan, Mahmud Tarzi would turn over editorship of the newspaper Siraj al-Akhbar to him. Dawi would later change the name to Aman-i-Afghan (Afghan Peace) and wrote his editorials under the pen name \"Pareshan\" (Worried).\n\nInitially a staunch supporter of Amanullah Khan during his reign, even serving as the Minister of Commerce for some time, Dawi's rift began during the King's feminist and anti-veil campaign, seeing such reforms as being far too extreme for the Muslim society of Afghanistan. His intransigence caused him to resign in protest, and later led to his political exile when Amanullah assigned him to a far-off diplomatic post to keep him from posing any threat in opposition.\n\nHaving witnessed the ruination of the Afghan nation to civil war and revolt, Dawi still remains committed to a conciliatory and democratic Afghanistan. albeit one guided by and in service to Islamic principles. To Dawi, radical Reformism need not be a core aspect of democracy, instead seeing the virtues of free political representation as a way to safeguard the conservatism of the average Afghan.§!"
 AFG_abdul_hadi_dawi_sic_desc:9 "§YNaissance :§! §L1894, à Kaboul, vilayet de Kaboul, Émirat d'Afghanistan§!\n§YCarrière :§! §LPendant très longtemps, la présence d'Abdul Hadi Dawi en Afghanistan lui a attiré l'inimitié des deux extrêmes du spectre politique afghan. Né dans une famille afghane Daavi à Kaboul, Dawi sortit diplômé du collège Habibia en 1912 et devint membre des groupes réformistes anti-Habibullah Khan, allant en prison pour avoir causé des troubles. Sept ans après l'accession au trône d'Amanullah Khan, Mahmud Tarzi lui confia la rédaction du journal Siraj al-Akhbar. Dawi changea plus tard le nom pour Aman-i-Afghan (Paix afghane) et écrivait ses éditoriaux sous le nom de "Pareshan" (Inquiet).\n\nInitialement un fervent défenseur d'Amanullah Khan pendant son règne, servant même comme ministre du Commerce, la séparation de Dawi commença lors de la campagne féministe et anti-voile du Khan, considérant ces réformes comme trop extrêmes pour la société musulmane d'Afghanistan. Son intransigeance le poussa à démissionner en signe de protestation, puis mena à son exil politique lorsque Amanullah l'assigna à un poste diplomatique lointain pour l'empêcher d'être une menace. Au cours des années suivantes, il a continué de protester contre le réformisme d'Amanullah, devenant lentement l'une des voix principales d'une sorte de modernisation plus conservatrice, restant en poste à contrecœur pour promouvoir cette vision.§!"
 AFG_mohammad_gul_khan_momand: "Mohammad Gul Khan Momand"
 AFG_mohammad_gul_khan_momand_leader_desc:9 "§YNaissance :§! §L17 janvier 1885, à Andrabayo, vilayet de Kaboul, Émirat d'Afghanistan§!\n§YCarrière :§! §LMohammad Gul Khan Momand a peut-être la carrière politique la plus chanceuse de tous les politiciens afghans jusqu'ici. Momand est né dans une lignée d'hommes qui ont tous joué des rôles clés dans l'administration et l'armée de dirigeants comme Amir Dost Mohammad Khan ou Abdur Rahman Khan. Momand s'enrôla à l'école militaire en 1909 et, des années plus tard, devint commandant d'unité dans la Garde royale, puis Directeur de son école militaire, et enfin commandant en chef de la Garde royale. Momand devint administrateur militaire et civil sous le régime d'Amanullah Khan, et devint finalement si proche de la branche Barakzai-Telai que ses membres le considèrent presque comme un frère adoptif.\n\nEn plus de s'intégrer dans la sphère des Telai, il devint le chef non-officiel de la "Clique azadiste", un groupe moderniste et nationaliste de l'Armée royale d'Afghanistan influencé par les ultranationalistes iraniens et plaidant pour la modernisation totale de l'armée et de la nation afghanes. Cette association le conduisit à devenir un fervent nationaliste pachtoune et à soutenir certaines des publications les plus extrêmes sur l'identité pachtoune. Sa relation personnelle avec les Telai a conduit la Clique azadiste à s'aligner sur Mohammad Nadir Shah, après que celui-ci se soit déclaré Roi d'Afghanistan à la suite du Second Soulèvement Saqqawiste.\n\nDes circonstances extraordinaires ont désormais donné à Momand le pouvoir suprême. Son cœur étant déchiré entre la famille Telai et l'ambitieuse Clique azadiste, Momand marche néanmoins pour le salut de sa patrie. Pour un militaire comme Momand, issu d'une famille prestigieuse, son devoir envers l'Afghanistan et le peuple pachtoune passe avant tout.§!"
 AFG_mohammad_gul_khan_momand_army_chief_desc:9 "§YNaissance :§! §L17 janvier 1885, à Andrabayo, vilayet de Kaboul, Émirat d'Afghanistan§!\n§YAllégeance :§! §PAzadiste§!\n§YCarrière :§! §LMohammad Gul Khan Momand a peut-être la carrière politique la plus chanceuse de tous les politiciens afghans jusqu'ici. Momand est né dans une lignée d'hommes qui ont tous joué des rôles clés dans l'administration et l'armée de dirigeants comme Amir Dost Mohammad Khan ou Abdur Rahman Khan. Momand s'enrôla à l'école militaire en 1909 et, des années plus tard, devint commandant d'unité dans la Garde royale, puis Directeur de son école militaire, et enfin commandant en chef de la Garde royale. Momand devint administrateur militaire et civil sous le régime d'Amanullah Khan, et devint finalement si proche de la branche Barakzai-Telai que ses membres le considèrent presque comme un frère adoptif.\n\nEn plus de s'intégrer dans la sphère des Telai, il devint le chef non-officiel de la "Clique azadiste", un groupe moderniste et nationaliste de l'Armée royale d'Afghanistan influencé par les ultranationalistes iraniens et plaidant pour la modernisation totale de l'armée et de la nation afghanes. Cette association le conduisit à devenir un fervent nationaliste pachtoune et à soutenir certaines des publications les plus extrêmes sur l'identité pachtoune.§!"
