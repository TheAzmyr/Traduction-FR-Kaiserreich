### Characters ###

 PTH_abdur_rahim_popalzai:9 "Abdur Rahim Popalzai"
 PTH_abdur_rahim_popalzai_desc_body:9 "Peut-être l’une des figures les plus chimériques de la communauté socialiste internationale, Popalzai est sans doute l’homme le mieux placé pour instaurer le socialisme dans les montagnes du peuple pachtoune. Fils d’un imam, Popalzai est devenu un fervent anti-impérialiste sous le Raj britannique dans la Province frontalière du Nord-Ouest, émettant plusieurs fatwas en soutien aux mouvements paysans contre le colonialisme britannique.\n\nIl prononça plus tard des fatwas en faveur de ses camarades socialistes indiens à Calcutta pendant la Guerre civile indienne, un engagement qui faillit lui valoir d’être arrêté jusqu’à l’intervention et l’occupation par l’Afghanistan de la Province frontalière du Nord-Ouest, qui allait bientôt être connue sous le nom de "Pachtounistan". Malgré ses convictions marxistes, Popalzai était un fervent partisan du programme réformiste d’Amanullah et allait devenir l’un des principaux organisateurs du soutien au roi au Pachtounistan dans les années 1920.\n\nDans les années 30, il réorienta son programme en menant une campagne contre les États princiers du Pachtounistan. À cette époque, il publia de nombreuses fatwas en faveur des mineurs de Swat et les appela à s’organiser pour lutter contre les conditions de vie misérables que leur imposaient les patrons des mines. À la mort de son père, il hérita de son poste d’imam de la mosquée Qasim Ali Khan à Peshawar, malgré une forte opposition conservatrice. Bien qu’il ait suscité la controverse en menant de front une double vie entre son engagement politique de gauche et ses fonctions d’imam, Popalzai fonda le Parti socialiste des Frontières, publia un journal intitulé Naujawan Sarfarosh et devint sans doute le socialiste le plus influent non seulement du Pachtounistan, mais aussi de tout l’Afghanistan.\n\nConvaincu que les enseignements de l’islam prêtaient naturellement à des activités politiques d’émancipation socialiste, sa conception du socialisme est profondément enracinée dans l’islam. Condamnant l’instrumentalisation impérialiste de l’islam, Popalzai ne sert aucun roi, mais uniquement les enseignements d’Allah et sa mission visant à mettre fin à la colonisation des peuples musulmans."
 PTH_abdur_rahim_popalzai_leader_desc:9 "§YNaissance :§! §L1890, à Peshawar, province du Pendjab, Inde britannique§!\n§YCarrière :§! §L$PTH_abdur_rahim_popalzai_desc_body$§!"
 PTH_abdur_rahim_popalzai_army_chief_desc:9 "§YNaissance :§! §L1890, à Peshawar, province du Pendjab, Inde britannique§!\n§YAllégeance :§! §SPachtounistan§!\n§YCarrière :§! §L$PTH_abdur_rahim_popalzai_desc_body$§!"
 PTH_abdul_ghaffar_khan:9 "Abdul Ghaffar Khan"
 PTH_abdul_ghaffar_khan_leader_desc:9 "§YNaissance :§! §L6 février 1890, à Ultmazai, province du Pendjab, Inde britannique§!\n§YCarrière :§! §LÉgalement connu sous le nom de "Bacha Khan", le Roi des Khans, Ghaffar Khan jouit d’une renommée qui s’étend non seulement aux environs de Peshawar, mais aussi en Afghanistan et même sur le sous-continent indien. Issu d’une famille d’aristocrates musulmans, il fut éduqué par des missionnaires britanniques et se vit proposer un poste militaire bien rémunéré lors de sa dernière année de lycée, mais il le refusa par principe, ne souhaitant en aucun cas servir le Raj britannique. À l’instar de Mohandas Gandhi, devenu un proche allié de Bacha Khan, il en est rapidement venu à croire que seule la non-violence permettrait d’accéder à la liberté. Au cours de cette période, il consacra toute son énergie à l’ouverture d’écoles pour les enfants pachtounes pauvres et analphabètes, fondant l’Anjuman-e-Islah-e Afghania afin de mieux coordonner son engagement.\n\nComme beaucoup d’autres, sa vie allait bientôt être bouleversée par la Guerre civile indienne. Condamnant la violence et l’effusion de sang entre frères, et restant fidèle à sa voie non violente vers la liberté, Ghaffar Khan vit néanmoins l’armée afghane entrer dans Peshawar, puis annexer l’ensemble de la Frontière aux Britanniques. Lorsqu’il devint évident que l’Afghanistan aurait du mal à gouverner seul ce qui allait devenir le "Pachtounistan", Ghaffar Khan passa à l’action en tant que l’un des hommes politiques les plus influents de la région, mettant en place un gouvernement local efficace aux côtés de son frère Abdul Jabbar Khan. Son leadership à Peshawar et, de facto, sur la majeure partie du Pachtounistan, fit de lui l’homme le plus influent de la région.\n\nLoin de l'avenir radieux que beaucoup espéraient voir advenir après l'indépendance vis-à-vis de la Grande-Bretagne, ces dernières années n'ont été qu'un véritable chaos, et Ghaffar Khan est désormais à la tête d'une nation qui a désespérément besoin de paix et d'harmonie. Attaché aux principes de la démocratie et à l'amélioration des conditions de vie de la paysannerie pachtoune, son pacifisme fervent laisse entrevoir un avenir des plus sereins pour ceux qui vivent à l'intérieur des frontières dont il a la charge.§!"
 PTH_aurangzeb_khan_gandapur:9 "Aurangzeb Khan Gandapur"
 PTH_aurangzeb_khan_gandapur_leader_desc:9 "§YNaissance :§! §L1899, à Kulachi, province du Pendjab, Inde britannique§!\n§YCarrière :§! §LProfondément influencé par Sir Abdul Qayyam Khan Lodi, défenseur de l’éducation et homme politique, Aurangzeb réussit à poursuivre ses études et à intégrer l’université musulmane d’Aligarh, où il obtint un diplôme de droit avant de retourner à Peshawar. Sa carrière d’avocat fut interrompue très peu de temps après ses débuts, à la suite de la prise de pouvoir par l’Armée afghane pendant la Guerre civile indienne. Éloigné de la politique pendant un certain temps, il rejoignit plus tard le Parti nationaliste des musulmans unis de Lodi, en opposition à la Société pour la réforme des Afghans de Ghaffar Khan. Après le départ à la retraite puis le décès de Lodi, Aurangzeb fut considéré comme son successeur naturel et dirige le parti depuis lors.\n\nDésormais à la tête d’un Pathanistan indépendant, Aurangzeb doit venir à bout des forces progressistes bien implantées qui dominaient les systèmes démocratiques de Peshawar et tracer la voie à suivre pour lui-même, son parti et son pays. La classe marchande a déjà commencé à se montrer plus favorable à son égard, et ses avancées auprès des tribus et des États princiers ont porté leurs fruits pour ce politicien en pleine ascension.§!"
 PTH_aurangzeb_khan_gandapur_sic_desc:9 "§YNaissance :§! §L1899, à Kulachi, province du Pendjab, Inde britannique§!\n§YCarrière :§! §LProfondément influencé par Sir Abdul Qayyam Khan Lodi, défenseur de l’éducation et homme politique, Aurangzeb réussit à poursuivre ses études et à intégrer l’université musulmane d’Aligarh, où il obtint un diplôme de droit avant de retourner à Peshawar. Sa carrière d’avocat fut interrompue très peu de temps après ses débuts, à la suite de la prise de pouvoir par l’Armée afghane pendant la Guerre civile indienne. Éloigné de la politique pendant un certain temps, il rejoignit plus tard le Parti nationaliste des musulmans unis de Lodi, en opposition à la Société pour la réforme des Afghans de Ghaffar Khan. Après le départ à la retraite de Lodi, Aurangzeb fut considéré comme son successeur naturel et dirige le parti depuis lors.§!"
 PTH_mirzali_khan_wazir:9 "Mirzali Khan Wazir"
 PTH_mirzali_khan_wazir_desc_body:9 "Plus connu sous le nom de "Fakir d'Ipi", Mirzali Khan Wazir a mené une vie marquée par son dévouement non seulement envers le Prophète, mais aussi envers sa terre natale, le Waziristan. Issu d’une sous-tribu des Utmanzai Wazir connue sous le nom de Madikhel Torikhel, il a été élevé dans une famille profondément pieuse et a passé son enfance à étudier le Coran, avant de devenir imam dans sa ville natale.\n\nLors de l’invasion menée par l'Armée afghane pendant la Guerre civile indienne, Mirzali a pris la tête d'un groupe de guerriers pour combattre les garnisons britanniques locales en Inde et a joué un rôle déterminant dans le succès de l'expulsion des Britanniques par Amanullah. Ses efforts et le soutien indéfectible qu’il a apporté par la suite lui ont valu les éloges du Roi d'Afghanistan, et il est devenu le représentant militaire en chef d'Amanullah au Pachtounistan, un homme distant et indépendant (mais toujours loyal)."
 PTH_mirzali_khan_wazir_leader_desc:9 "§YNaissance :§! §L1897, à Kirta Khajuri, province du Pendjab, Inde britannique§!\n§YCarrière :§! §L$PTH_mirzali_khan_wazir_desc_body$\n\nMais le destin est une chose étrange. La course au pouvoir ambitieuse et efficace menée par Mirzali a fortement influencé la décision de son bienfaiteur de le placer à la tête d’un Pathanistan indépendant. Pieux, rebelle, conservateur et rusé, le Pathanistan, sous la houlette du Fakir d'Ipi, s'annonce comme un État profondément réactionnaire et très militariste.§!"
 PTH_mirzali_khan_wazir_high_command_desc:9 "§YNaissance :§! §L1897, à Kirta Khajuri, province du Pendjab, Inde britannique§!\n§YAllégeance :§! §fAmanite§!\n§YCarrière :§! §L$PTH_mirzali_khan_wazir_desc_body$§!"

 PTH_abdul_jabbar_khan:9 "Abdul Jabbar Khan"
 PTH_abdul_jabbar_khan_sic_desc:9 "§YNaissance :§! §L1883, à Ultmazai, province du Pendjab, Inde britannique§!"

