### Ideas ###

 PTH_development_of_islamic_socialism:9 "Socialisme Islamique en Développement"
 PTH_development_of_islamic_socialism_desc:9 "Popalzai a commencé à mettre en œuvre toute une série de réformes socialistes visant à moderniser la république naissante et à instaurer un gouvernement socialiste islamique efficace. Ce processus s'annonce difficile, et il faudra donc peut-être un certain temps avant que ses politiques ne portent leurs fruits."
 PTH_model_of_islamic_socialism_idea:9 "Modèle de Socialisme Islamique"
 PTH_model_of_islamic_socialism_idea_desc:9 "Les politiques de Popalzai ont propulsé le Pathanistan, autrefois une région féodale isolée, au rang de modèle pour les socialistes islamiques du monde entier !"
 PTH_state_controlled_media:9 "Médias Contrôlés par l'État"
 PTH_state_controlled_media_desc:9 "Naujawan Sarfarosh, la publication personnelle d’Abdur Rahim Popalzai, est devenue la seule source d’information légale sur l’ensemble du Pathanistan. Cela a rendu extrêmement difficile pour les personnes ayant des opinions politiques divergentes de faire connaître leurs convictions, conférant ainsi au gouvernement le monopole de la vérité."
 PTH_building_the_islamic_progressive_ideal:9 "Bâtir l'Idéal Progressiste Islamique"
 PTH_building_the_islamic_progressive_ideal_desc:9 "La vision d'Abdul Ghaffar Khan d'un État-nation progressiste fondé sur les idéaux islamiques n'est pas une entreprise aisée. Malgré les défis à relever, des efforts sont déployés pour concrétiser cette vision."
 PTH_beacon_of_islamic_progressivism:9 "Phare du Progressisme Islamique"
 PTH_beacon_of_islamic_progressivism_desc:9 "La réussite du Pathanistan trouve un écho de l'Asie centrale au Sahara, inspirant aussi bien les philosophes islamiques progressistes que les hommes politiques !"
 PTH_surge_of_pathan_nationalism:9 "Poussée du Nationalisme Pathan"
 PTH_surge_of_pathan_nationalism_desc:9 "Malgré les défis existentiels auxquels elle est confrontée, l'action de [FROM.GetLeader] a marqué le début d'une nouvelle ère de nationalisme pour la République naissante du Pathanistan."
 PTH_a_new_national_party_1:9 "Un Nouveau Parti National"
 PTH_a_new_national_party_1_desc:9 "Bien qu'il ait longtemps joué les seconds rôles face aux machines politiques du Maulana marxiste et de Bacha Khan, le Parti nationaliste des musulmans unis s'est enfin retrouvé à la tête du mouvement. [FROM.GetLeader] progresse à grands pas dans le développement du parti et dans la conquête de la confiance et de la loyauté d'une grande partie de la population du Pathanistan."
 PTH_a_new_national_party_2:0 "Naissance de l'État-Parti"
 PTH_a_new_national_party_2_desc:9 "Le projet ambitieux d'expansion de la bureaucratie du parti mené par [FROM.GetLeader] a porté ses fruits. Le Parti nationaliste des musulmans unis est devenu la force politique dominante au Pathanistan, avec très peu de rivaux capables de lui faire concurrence."
 PTH_tribal_autonomy:9 "Autonomies Tribales"
 PTH_tribal_autonomy_desc:9 "Le Pathanistan abrite un mélange hétéroclite de tribus et même quelques princes qui ont conservé leurs royaumes depuis l'époque du Raj britannique. Afin de préserver la stabilité du royaume, le gouvernement leur a accordé une autonomie dans la gestion de leurs affaires intérieures."
 PTH_loy_waziristan_idea:9 "Loy Waziristan"
 PTH_loy_waziristan_idea_desc:9 "Le Pathanistan se trouve sous l'autorité du Faqir d'Ipi, chef tribal issu de la branche Torikhel de la tribu des Utmanzai Wazir. Bien qu'il prétende représenter l'ensemble du peuple pathan, nombreux sont ceux qui estiment que son accession au pouvoir n'est pas tant une victoire pour le peuple pathan que pour le Waziristan lui-même."
 PTH_puppet_pathan_jirga:9 "Jirga Pathan Fantoche"
 PTH_puppet_pathan_jirga_desc:9 "Le système législatif officiel du Pathanistan est entièrement contrôlé par la Jirga pathane, un conseil tribal qui, dans les faits, est entièrement fidèle au Faqir d'Ipi."
 PTH_self_sufficiency:9 "Autosuffisance"
 PTH_self_sufficiency_desc:9 "Disposant de peu de ressources propres et ayant peu de moyens d'en obtenir auprès du monde extérieur, les habitants du Pathanistan ont commencé à faire preuve d'une grande créativité dans l'utilisation des ressources, ce qui a considérablement renforcé leur sentiment d'autosuffisance."
 PTH_swat_gemstone_trade:9 "Commerce de Gemmes de Swat"
 PTH_swat_gemstone_trade_desc:9 "La région nord de Swat abrite une importante industrie minière de pierres précieuses, qui représente la majeure partie des exportations et des recettes extérieures du Pathanistan."
 PTH_pathan_army_1:9 "L'Armée du Pathanistan"
 PTH_pathan_army_1_desc:9 "L'armée du Pathanistan, bien que peut-être moins importante en effectifs que celles de ses voisins, n'en reste pas moins redoutable et extrêmement disciplinée. Ceux qui tenteraient de porter atteinte à la souveraineté du Pathanistan se retrouveraient confrontés à une force déterminée à défendre son droit d'exister !"
 PTH_insurrectionary_movement:9 "Mouvement Insurrectionnel"
 PTH_insurrectionary_movement_desc:9 "Les habitants de la Frontière pensaient que se libérer de la Grande-Bretagne et s'unir à l'Afghanistan les affranchirait de l'oppression exercée par des gouvernements lointains, mais il semble qu'ils se soient trompés. Des membres de tribus en colère, des militants soutenus par l'Inde et des déserteurs de l'armée se rassemblent désormais tous sous la bannière rouge, noire et blanche de l'État pathan. Ils sont désormais prêts à se battre pour la liberté de leur patrie, mais refusent de verser le sang de leurs frères pachtounes pour y parvenir."
 PTH_afghan_deserters:9 "Déserteurs Afghans"
 PTH_afghan_deserters_desc:9 "En raison du mécontentement qui règne au sein de l'armée afghane, plusieurs soldats afghans ont déserté et combattent désormais sous notre bannière, où ils seront soumis à une discipline moins stricte (et, dans certains cas, mieux rémunérés)."
 PTH_neither_afghan_nor_indian:9 "Ni Afghan ni Indien"
 PTH_neither_afghan_nor_indian_desc:9 "Faute de reconnaissance internationale, et considéré simplement comme une province occupée par des rebelles par ses deux voisins, le Pathanistan n'a pratiquement aucune possibilité de commercer avec le monde extérieur. Bien qu'ils soient en désaccord avec ceux qui revendiquent leurs territoires, il faudra peut-être, avec le temps, trouver un compromis avec au moins l'un d'entre eux afin de garantir que la souveraineté des Pathan sur leur patrie soit préservée sous une forme ou une autre."
 PTH_confused_national_ambitions:9 "Ambitions Nationales Confuses"
 PTH_confused_national_ambitions_desc:9 "L'idée d'un État pathan indépendant est considérée par ceux qui se battent pour elle comme une question qui leur a été imposée, plutôt que comme un projet qu'ils auraient activement souhaité. La plupart se considèrent comme intrinsèquement liés à leurs frères pachtounes de l'autre côté du col de Khyber, mais la tyrannie du gouvernement les a une nouvelle fois séparés de force. D’autres estiment que l’intégration au sein d’une Inde multiconfessionnelle garantirait la sécurité régionale, bien que beaucoup parmi eux aient du mal à imaginer un gouvernement indien acceptant et respectant réellement un accord allant dans ce sens. Peut-être qu’avec le temps, une position commune finira par être trouvée, ou peut-être qu’une main de fer viendra forcer la main à leur place..."

 PTH_blockade_tt:9 "§tTant que notre seule voie de commerce fiable sera terrestre, nous serons sans défense face à un blocus par l'Inde et l'Afghanistan !§!"

 PTH_haji_sahab:9 "Haji Sahab"

