### Characters ###

 PTH_abdur_rahim_popalzai:9 "Abdur Rahim Popalzai"
 PTH_abdur_rahim_popalzai_desc_body:9 "Perhaps one of the most quixotic figures across the international Socialist community, Popalzai may be the best man suited to bring Socialism to the mountain ranges of the Pashtun people. Born to an imam, Popalzai became a fervent anti-imperialist during the British Raj over the North-West Frontier Province, issuing several fatwas in support of peasant agitation against British colonialism.\n\nHe would later give fatwas in support of his fellow Indian socialists in Calcutta during the Indian Civil War, advocacy that nearly got him arrested until Afghanistan's intervention and occupation of the NWFP, which would soon be known as the region of \"Pashtunistan\". Despite his Marxist beliefs, Popalzai was a strong supporter of Amanullah's reformist agenda, and would become one of the biggest organisers of support in Pashtunistan for the King in the 20s.\n\nCome the 30s he would refocus his agenda, agitating against the Princely States of Pashtunistan. During this time he issued many fatwas in support of miners in Swat and called for them to organise against the miserable conditions they faced under the mine bosses. Upon the death of his father, he would inherit his position as Imam of the Qasim Ali Khan Mosque in Peshawar, even amid strong conservative opposition. Despite ruffling feathers over his continued dual association with leftist politics and his duty as an Imam, Popalzai founded the Frontier Socialist Party, published a newspaper called Naujawan Sarfarosh, and became perhaps the most powerful socialist not only in Pashtunistan, but the entirety of Afghanistan, too. \n\nA man firm in his belief that Islam's teachings were predisposed to the political activities of socialist emancipation, his take on socialism is firmly rooted in Islam. Condemning the imperialist weaponisation of Islam, Popalzai serves no King, but only the teachings of Allah and his mission to end the colonisation of the Muslim people."
 PTH_abdur_rahim_popalzai_leader_desc:9 "§YNaissance :§! §L1890, à Peshawar, province du Pendjab, Inde britannique§!\n§YCarrière :§! §L$PTH_abdur_rahim_popalzai_desc_body$§!"
 PTH_abdur_rahim_popalzai_army_chief_desc:9 "§YNaissance :§! §L1890, à Peshawar, province du Pendjab, Inde britannique§!\n§YAllégeance :§! §SPachtounistan§!\n§YCarrière :§! §L$PTH_abdur_rahim_popalzai_desc_body$§!"
 PTH_abdul_ghaffar_khan:9 "Abdul Ghaffar Khan"
 PTH_abdul_ghaffar_khan_leader_desc:9 "§YBorn:§! §LFebruary 6th, 1890, in Ultmazai, Province of the Punjab, British India§!\n§YBackground:§! §LAlso known as \"Bacha Khan\", the King of Khans, Ghaffar Khan's renown is felt not only in the surrounding area of Peshawar, but also in Afghanistan and even the Indian subcontinent too. Born to a family of Muslim aristocrats, he was educated by British missionaries and offered a well-to-do military position in his final year of high school, but refused it out of principle as he did not want anything to do with serving the British Raj. Like Mohandas Gandhi, a later close ally of Bacha Khan, he soon came to hold the belief that only through non-violence would freedom be achieved. During this period, he put his all toward the opening of schools for impoverished and illiterate Pashtun children, founding the Anjuman-e-Islah-e Afghania to further coordinate this activism.\n\nLike many others, his life would soon be dramatically reshaped by the Indian Civil War. Condemning the violence and fraternal bloodshed, and still holding to his non-violent path to freedom, Ghaffar Khan nonetheless witnessed the Afghan Army march into Peshawar and subsequently annex the entire Frontier from the British. As it became clear that Afghanistan would struggle to rule what would become \"Pashtunistan\" on its own, Ghaffar Khan sprung into action as one of the region's most influential politicians, building up an effective local government alongside his brother Abdul Jabbar Khan. His leadership of Peshawar and de facto most of Pashtunistan as a result made him the region's most important powerbroker.\n\nRather than the rosy times many hoped freedom from Britain would bring, the past few years have been nothing but chaos, and Ghaffar Khan is now the leader of a nation in desperate need of peace and harmony. Committed to the principles of democracy and the upliftment of the Pashtun peasantry, his ardent pacifism signals a future most serene for those within the borders he commands.§!"
 PTH_aurangzeb_khan_gandapur:9 "Aurangzeb Khan Gandapur"
 PTH_aurangzeb_khan_gandapur_leader_desc:9 "§YBorn:§! §L1899, in Kulachi, Province of the Punjab, British India§!\n§YBackground:§! §LDeeply influenced by the education advocate and politician Sir Abdul Qayyam Khan Lodi, Aurangzeb pulled himself through his schooling and into the Aligarh Muslim University, where he would graduate with a law degree and return to Peshawar. His practice in the courts would be interrupted very shortly after it began, following the takeover of the Afghan Army during the Indian Civil War. Estranged from politics for some time, he would later join Lodi's United Muslims Nationalist Party as an alternative to Ghaffar Khan's Society for the Reformation of the Afghans. After Lodi's retirement and passing, Aurangzeb was regarded as his natural successor, and has led the party ever since.\n\nNow the leader of an independent Pathanistan, Aurangzeb must overcome the entrenched progressive forces that dominated the democratic systems in Peshawar and carve out a path forward for himself, his party, and his country. Already, the merchant class has begun to warm up to him and his inroads with the tribes and Princely States have borne promising fruit for the upstart politician.§!"
 PTH_aurangzeb_khan_gandapur_sic_desc:9 "§YBorn:§! §L1899, in Kulachi, Province of the Punjab, British India§!\n§YBackground:§! §LDeeply influenced by the education advocate and politician Sir Abdul Qayyam Khan Lodi, Aurangzeb pulled himself through his schooling and into the Aligarh Muslim University, where he would graduate with a law degree and return to Peshawar. His practice in the courts would be interrupted very shortly after it began, following the takeover of the Afghan Army during the Indian Civil War. Estranged from politics for some time, he would later join Lodi's United Muslims Nationalist Party as an alternative to Ghaffar Khan's Society for the Reformation of the Afghans. After Lodi's retirement, Aurangzeb was regarded as his natural successor, and has led the party ever since.§!"
 PTH_mirzali_khan_wazir:9 "Mirzali Khan Wazir"
 PTH_mirzali_khan_wazir_desc_body:9 "Plus connu sous le nom de "Fakir d'Ipi", Mirzali Khan Wazir a mené une vie marquée par son dévouement non seulement envers le Prophète, mais aussi envers sa terre natale, le Waziristan. Issu d’une sous-tribu des Utmanzai Wazir connue sous le nom de Madikhel Torikhel, il a été élevé dans une famille profondément pieuse et a passé son enfance à étudier le Coran, avant de devenir imam dans sa ville natale.\n\nLors de l’invasion menée par l'Armée afghane pendant la Guerre civile indienne, Mirzali a pris la tête d'un groupe de guerriers pour combattre les garnisons britanniques locales en Inde et a joué un rôle déterminant dans le succès de l'expulsion des Britanniques par Amanullah. Ses efforts et le soutien indéfectible qu’il a apporté par la suite lui ont valu les éloges du Roi d'Afghanistan, et il est devenu le représentant militaire en chef d'Amanullah au Pachtounistan, un homme distant et indépendant (mais toujours loyal)."
 PTH_mirzali_khan_wazir_leader_desc:9 "§YNaissance :§! §L1897, à Kirta Khajuri, province du Pendjab, Inde britannique§!\n§YCarrière :§! §L$PTH_mirzali_khan_wazir_desc_body$\n\nMais le destin est une chose étrange. La course au pouvoir ambitieuse et efficace menée par Mirzali a fortement influencé la décision de son bienfaiteur de le placer à la tête d’un Pathanistan indépendant. Pieux, rebelle, conservateur et rusé, le Pathanistan, sous la houlette du Fakir d'Ipi, s'annonce comme un État profondément réactionnaire et très militariste.§!"
 PTH_mirzali_khan_wazir_high_command_desc:9 "§YNaissance :§! §L1897, à Kirta Khajuri, province du Pendjab, Inde britannique§!\n§YAllégeance :§! §fAmanite§!\n§YCarrière :§! §L$PTH_mirzali_khan_wazir_desc_body$§!"

 PTH_abdul_jabbar_khan:9 "Abdul Jabbar Khan"
 PTH_abdul_jabbar_khan_sic_desc:9 "§YNaissance :§! §L1883, à Ultmazai, province du Pendjab, Inde britannique§!"

 PTH_nasir_ul_mulk:9 "Nasir ul-Mulk"
 PTH_nasir_ul_mulk_high_command_desc:9 "§YNaissance :§! §L1er juin 1892, à Chitral, état de Chitral, Inde§!\n§YAllégeance :§! §gAnti-Socialiste§!"
 PTH_sukhdev_thapar:9 "Sukhdev Thapar"
 PTH_sukhdev_thapar_high_command_desc:9 "§YNaissance :§! §L15 mai 1907, à Ludhiana, province du Pendjab, Inde britannique§!\n§YAllégeance :§! §rSocialiste§!"

