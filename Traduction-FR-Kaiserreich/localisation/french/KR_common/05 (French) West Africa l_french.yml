 MRT_national_populist:9 "Imamate of Bilad Chinqit"
 MRT_national_populist_ADJ:9 "Chinguetti"
 MRT_national_populist_DEF:9 "the Imamate of Bilad Chinqit"

 ### Characters ###
 MRT_horma_ould_babana: "Horma Ould Babana"
 MRT_horma_ould_babana_leader_desc:9 "§YBorn:§! §LMarch 1st, 1912, in Mederdra, Colony of Mauritania§!\n§YBackground:§! §LBorn in Mederdra, within Trarza's domain, Horma Ould Babana received a classical religious education ofs the Qur'an. However, with ambition under his belt, he sought a French education under the colonial schools of the Colony of Mauritania, entering the School for Sons of Notables in Boutilimit. Once he had completed his studies in 1934, he became a teacher at his alma mater, teaching the sons of nobles within the colony—including the sons of the Emir of Tagant and the Emir of Trarza.\n\nHowever, his career fell through for a myriad of reasons, leading him to change careers to that of an interpreter, thanks in large part to his knowledge of both Arabic and French. However, he very quickly gained the ire of French colonial officials, as he was willing to clash with them to protect his fellow men against French harassment. He was soon fired, though with an almost heroic reputation across the western parts of the colony. All of this would gain the attention of the Communards, who, seeking to weaken the government of Algiers, supported his local heroism and expanded his education with more socialist literature.\n\nWith the collapse of French authority and the Colony of Mauritania, Horma Ould Babana has garnered enough popular support to secure his rule over the former colony. Gone are the days of a disunited \"Bilad Chinqit\"—the land of Chinguetti. Today, Mauritania rises for a red dawn.§!"
 MRT_sidi_el_mokhtar_n_diaye:9 "Sidi el-Mokhtar N'Diaye"
 MRT_sidi_el_mokhtar_n_diaye_leader_desc:9 "§YBorn:§! §LSeptember 13th, 1916, in Atar, Colony of Mauritania§!\n§YBackground:§! §LBorn into the Oulad Bousbaa tribe, Sidi el Moktar Ould Yahya N'Diaye grew up in the market towns of Tidjikja and Kiffa, acquainting him with the Amazigh, Arab, and Black cultures of the land. While growing up in these melting pots, his father, Yahya N'Diaye, worked as a chief interpreter within the French Colony of Mauritania. Moreover, he was the nephew of late Queen Ndieumbeut of the defunct Kingdom of Waalo, on the lower Senegal River.\n\nWith access to both local and colonial society, Sidi el-Mokhtar N'Diaye received a classical religious education of the Qur'an, and later attended the School for Sons of Chiefs in Saint-Louis, Senegal. With an exceptional education, he followed in the footsteps of his father and became an interpreter—later chief interpreter—for the French, working across the western villages of the colony. With French authority constantly hanging in the balance, he understood his importance within the polity and the ever-growing national consciousness among other Amazigh, Arab, and Black \"Mauritanians\"—even if it was just to resist the French.\n\nWith the collapse of French authority and the Colony of Mauritania, Sidi el-Mokhtar N'Diaye has emerged as one of the foremost figures in the struggle to unite \"Bilad Chinqit\"—the land of Chinguetti—as Mauritania. He stands to bring the institution of democracy to his people, to usher in what the French had once espoused for so long.§!"
 MRT_ahmed_ould_deid:9 "Ahmed Ould Deïd"
 MRT_ahmed_ould_deid_leader_desc:9 "§YNaissance :§! §Là Trarza, Colonie de Mauritanie§!\n§YCarrière :§! §LDevenir émir de Trarza n'a pas été une mince affaire pour Ahmed Ould Deïd. Tout au long de sa vie, il a côtoyé l'oppression impérialiste et les violents conflits entre tribus. La résistance et la guerre font pratiquement partie de sa famille, son frère ayant fui au Maroc après des décennies de combats pour éviter les autorités françaises - pour rejoindre les rangs innombrables des résistants marocains dans le sud.\n\nC'est en 1910 que la réalité rattrapa finalement Ahmed Ould Deïd, qui accepta de faire la paix avec les Français en échange de l'autonomie au sein de la Colonie de Mauritanie. Il fut convenu que le pouvoir au sein de l'Émirat serait partagé entre lui-même et Ahmed Salem ould Brahim Salem. A la mort de ce dernier en 1930, selon les accords de paix, Ahmed Ould Deïd devint l'unique Émir de Trarza.\n\nDésormais, avec l'effondrement de l'autorité française et de la Colonie de Mauritanie, Ahmed Ould Deïd est devenu le principal dirigeant de "Bilad Chinqit", la terre de Chinguetti.§!"
 MRT_mrabih_rabou:9 "Mrabih Rabou"
 MRT_mrabih_rabou_leader_desc:9 "§YBorn:§! §LFebruary 13th, 1881, in Tiris, Rio do Ouro§!\n§YBackground:§! §LBorn in the anarchic lands of the Western Sahara in the years leading up to Spanish colonization, Mohamed Mustafa Mrabih Rabou was raised by the prominent sheikh Ma al-'Aynayn—a man who fiercely resisted French and Spanish colonial influence while building Islamic institutions with the support of Morocco. After his father's death in 1910, Mrabih Rabou established his first zawiya in Aït Baamrane, serving as a spiritual base for mujahideen and a bastion of resistance for him and his brother, Ahmed al-Hiba—the so-called \"Blue Sultan\" of Morocco.\n\nAfter al-Hiba's death in 1919, his followers pledged their allegiance to Mrabih Rabou, ordaining him as emir, imam, and leader of his late brother's mujahideen. Often leading them to battle, he continued his resistance against the Germans until 1934. Defeat came unto him, as it did to many before, and he attempted to seek refuge in Tarfaya. However, with Spanish authorities weary of mujahideen in Morocco, he was ousted from his homeland in the Western Sahara, and forced to seek refuge further south, in the French Colony of Mauritania. He established a new zawiya and continued his Islamic studies—leaning into exotic, nigh esoteric readings—while avoiding the ire of the French.\n\nThe Spaniards had conquered his homeland and thrown him out. Morocco, that horrid country, had abandoned him for the Germans. And the French, godless or not, had begun this ruination.\n\nNo more.\n\nWith the collapse of French authority and the Colony of Mauritania, Imam Mrabih Rabou shall rule this land—\"Bilad Chinqit,\" the land of Chinguetti—as its true protector.§!"

